name: Iris Bug Report
description: File a bug report for Iris
labels: [ bug ]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to fill this out!
        If this does not work for you, feel free to use the [blank](https://github.com/VolmitSoftware/Iris/issues/new) format.
  - type: textarea
    id: how
    attributes:
      label: Problem
      description: Please give a text description of how you reached the problem
      value: |
        1. Install Iris...
        2. Do this...
        3. Do that...
        4. Observe the error...
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Solution
      description: Explain where you think the problem comes from (optional)
      placeholder: The code to place a is missing b and c...
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which server platform is Iris running on? Pick the loader or server software, not the launcher.
      options:
        - Paper
        - Purpur
        - Leaf
        - Canvas
        - Folia
        - Spigot / CraftBukkit
        - Fabric
        - Forge
        - NeoForge
        - Other (describe under Problem)
    validations:
      required: true
  - type: dropdown
    id: mcversion
    attributes:
      label: Minecraft Version
      description: What version of Minecraft is the server on? Iris 4.x supports 26.1.2 to 26.3 on Bukkit-family servers and 26.3 on Fabric, Forge and NeoForge; older versions are not supported.
      options:
        - '26.3'
        - '26.2'
        - '26.1.2'
        - Other (unsupported)
    validations:
      required: true
  - type: input
    id: loaderversion
    attributes:
      label: Platform / Loader Version
      description: Exact server or loader build (see console). For example "Paper 26.3-133", "Fabric Loader 0.19.5", "NeoForge 26.3.0.33-beta".
      placeholder: DO NOT SAY "LATEST"
    validations:
      required: true
  - type: input
    id: irisversion
    attributes:
      label: Iris Version
      description: What version of Iris are you running? (see console)
      placeholder: DO NOT SAY "LATEST"
    validations:
      required: true
  - type: input
    id: logs
    attributes:
      label: Log
      description: Paste a full log. Always use [mclogs](https://mclo.gs) Or [Pastebin](https://pastebin.com/). Must not be a crash report. Must be a full log. Must not be a screenshot of a log.
      placeholder: https://mslog.gs/...
    validations:
      required: true
  - type: markdown
    id: thanks
    attributes:
      value: "Thank you for filling out the form! We will be with you soon. Please do not ask support to review your report."
