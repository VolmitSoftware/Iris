name: Bug report
description: Something in Iris isn't working.
labels: [bug]
type: Bug
assignees: [SwiftSwamp]
body:
  - type: markdown
    attributes:
      value: |
        Make sure you're on the [latest release](https://github.com/VolmitSoftware/Iris/releases/latest) and that it hasn't [already been reported](https://github.com/VolmitSoftware/Iris/issues?q=is%3Aissue).

        The Iris plugin supports Minecraft 26.1.2 through 26.3 on Paper, Purpur, Leaf, Canvas, Folia, and Spigot. The Fabric, Forge, and NeoForge builds support 26.3. Both need Java 25.
  - type: textarea
    id: issue
    attributes:
      label: What issue are you having?
      description: Include any error message you saw.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a server with Iris installed
        2. Change ... in the config
        3. Run /iris ...
        4. ... happens instead of ...
    validations:
      required: true
  - type: input
    id: diagnostics
    attributes:
      label: Debug dump or latest log file
      description: Run `/iris debug dump upload=true` and paste the link. If Iris won't start, upload `logs/latest.log` to [mclo.gs](https://mclo.gs) and paste that link instead.
      placeholder: https://mclo.gs/...
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: "Iris version"
      description: Run `/iris debug version` (`/iris version` on Fabric, Forge, and NeoForge).
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Server software
      options:
        - "Paper"
        - "Purpur"
        - "Leaf"
        - "Canvas"
        - "Folia"
        - "Spigot"
        - "Fabric"
        - "Forge"
        - "NeoForge"
        - Other (unsupported)
    validations:
      required: true
  - type: dropdown
    id: minecraft
    attributes:
      label: Minecraft version
      options:
        - "26.3"
        - "26.2"
        - "26.1.2"
        - Other (unsupported)
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Other plugins involved, screenshots, or videos.
