import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import org.gradle.api.file.DeleteSpec
import org.gradle.api.file.FileSystemOperations
import org.gradle.api.file.FileTree
import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.jvm.toolchain.JavaLanguageVersion

import javax.inject.Inject

buildscript {
    repositories {
        mavenCentral()
        maven { url = uri('https://jitpack.io') }
    }
    dependencies {
        classpath('com.github.VolmitSoftware.VolmLib:packaging:master-SNAPSHOT')
    }
}

plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
    alias(libs.plugins.shadow)
}

apply plugin: 'art.arcane.volmit-packaging'

interface IrisFileOperations {
    @Inject
    FileSystemOperations getFileSystemOperations()
}

IrisFileOperations irisFileOperations = objects.newInstance(IrisFileOperations)

apply from: file('../../gradle/modded-generation-build-revision.gradle')

Properties rootProperties = new Properties()
file('../../gradle.properties').withInputStream { InputStream stream -> rootProperties.load(stream) }
String irisVersion = providers.gradleProperty('irisVersion').getOrElse(rootProperties.getProperty('irisVersion', '4.1.0-26.2'))
String minecraftVersion = providers.gradleProperty('minecraftVersion').getOrElse(rootProperties.getProperty('minecraftVersion', '26.2'))
String neoForgeVersion = providers.gradleProperty('neoForgeVersion').getOrElse(rootProperties.getProperty('neoForgeVersion', '26.2.0.59'))
String volmLibCoordinate = providers.gradleProperty('volmLibCoordinate').getOrElse(rootProperties.getProperty('volmLibCoordinate', 'com.github.VolmitSoftware:VolmLib:master-SNAPSHOT'))
Closure<String> irisArtifactName = { String platform, String targetVersion ->
    return "Iris v${project.version} [${platform}] ${targetVersion}.jar"
}

group = 'art.arcane'
version = irisVersion

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets {
    main {
        java {
            srcDir '../modded-common/src/main/java'
            srcDir '../minecraft-common/src/main/java'
            srcDir '../client-common/src/main/java'
        }
        resources {
            srcDir '../modded-common/src/main/resources'
        }
    }
    test {
        java {
            srcDir '../modded-common/src/test/java'
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = uri('https://maven.neoforged.net/releases/')
    }
    maven { url = uri('https://repo.codemc.org/repository/maven-public/') }
    maven { url = uri('https://jitpack.io') }
    maven { url = uri('https://hub.spigotmc.org/nexus/content/repositories/snapshots/') }
}

configurations {
    bundle {
        canBeConsumed = false
        canBeResolved = true
    }
    devBundle {
        canBeConsumed = false
        canBeResolved = true
    }
}

configurations.named('bundle').configure {
    exclude(group: 'com.google.code.gson')
    exclude(group: 'com.google.guava')
    exclude(group: 'commons-io')
    exclude(group: 'org.apache.commons', module: 'commons-lang3')
    exclude(group: 'it.unimi.dsi', module: 'fastutil')
    exclude(group: 'org.slf4j')
    exclude(group: 'org.apache.logging.log4j')
    exclude(group: 'de.crazydev22.slimjar.helper')
    exclude(group: 'de.crazydev22.slimjar')
    exclude(group: 'io.github.slimjar')
}

configurations.compileClasspath.extendsFrom(configurations.devBundle)
configurations.runtimeClasspath.extendsFrom(configurations.devBundle)
configurations.testCompileClasspath.extendsFrom(configurations.compileClasspath, configurations.devBundle)
configurations.testRuntimeClasspath.extendsFrom(configurations.runtimeClasspath, configurations.devBundle)

dependencies {
    testImplementation('junit:junit:4.13.2')
    testImplementation('org.mockito:mockito-core:5.23.0')
    testImplementation(testFixtures('art.arcane:core'))
    testImplementation(libs.spigot) {
        transitive = false
    }
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:6.1.2')
    testRuntimeOnly('org.junit.vintage:junit-vintage-engine:6.1.2')
    compileOnly('org.slf4j:slf4j-api:2.0.17')
    compileOnly(libs.spigot) {
        transitive = false
    }
    add('bundle', volmLibCoordinate) {
        transitive = false
    }
    add('devBundle', volmLibCoordinate) {
        transitive = false
    }
    add('bundle', libs.zip) {
        transitive = false
    }
    add('devBundle', libs.zip) {
        transitive = false
    }

    List<Object> shared = [
        "art.arcane:core:${irisVersion}".toString(),
        "art.arcane:spi:${irisVersion}".toString(),
        libs.paralithic,
        libs.asm,
        libs.lru,
        libs.caffeine,
        libs.dom4j,
        libs.jaxen
    ]
    shared.each { Object notation ->
        add('bundle', notation)
        add('devBundle', notation)
    }
}

neoForge {
    version = neoForgeVersion

    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            jvmArgument('-Xmx8G')
        }
        server {
            server()
            String parity = providers.gradleProperty('irisParity').getOrNull()
            if (parity != null) {
                systemProperty('iris.parity', parity)
            }
            String parityGolden = providers.gradleProperty('irisParityGolden').getOrNull()
            if (parityGolden != null) {
                systemProperty('iris.parity.golden', parityGolden)
            }
            String parityDeep = providers.gradleProperty('irisParityDeep').getOrNull()
            if (parityDeep != null) {
                systemProperty('iris.parity.deep', parityDeep)
            }
            String worldCheck = providers.gradleProperty('irisWorldCheck').getOrNull()
            if (worldCheck != null) {
                systemProperty('iris.worldcheck', worldCheck)
            }
            jvmArgument('-Xmx8G')
            programArgument('nogui')
        }
    }

    mods {
        irisworldgen {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods.irisworldgen
    }
}

tasks.named('compileJava', JavaCompile).configure {
    options.encoding = 'UTF-8'
    options.release.set(25)
}

tasks.named('test').configure {
    useJUnitPlatform()
}

processResources {
    inputs.property('version', irisVersion)
    inputs.property('minecraftVersion', minecraftVersion)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand('version': irisVersion, 'minecraftVersion': minecraftVersion)
    }
}

FileTree staleLoaderJars = fileTree(layout.buildDirectory.dir('libs')) {
    include('Iris v* [NeoForge] *.jar')
    include('iris-neoforge-*.jar')
}
File legacyLoaderJar = layout.buildDirectory.file("libs/Iris-${project.version}+mc${minecraftVersion}-neoforge.jar").get().asFile

tasks.named('shadowJar', ShadowJar).configure {
    doFirst {
        irisFileOperations.fileSystemOperations.delete { DeleteSpec spec ->
            spec.delete(staleLoaderJars, legacyLoaderJar)
        }
    }
    archiveFileName.set(irisArtifactName('NeoForge', "${minecraftVersion}+${neoForgeVersion}"))
    configurations = [project.configurations.named('bundle').get()]
    from(sourceSets.main.output)
    mergeServiceFiles()
    exclude('META-INF/maven/**')
    exclude('META-INF/proguard/**')
    exclude('META-INF/*.SF')
    exclude('META-INF/*.DSA')
    exclude('META-INF/*.RSA')
    // The only multi-release entry any bundled dependency contributes is an OSGi manifest. Keeping
    // it forces `Multi-Release: true` onto the mod jar, which makes the loaders treat the whole
    // archive as versioned and re-scan it per release directory for nothing.
    exclude('META-INF/versions/**')
    addMultiReleaseAttribute.set(false)
    exclude('art/arcane/volmlib/util/localization/BukkitLanguageSwitcher*.class')
    exclude('art/arcane/volmlib/util/localization/BukkitLanguageEditor*.class')
    exclude('art/arcane/volmlib/util/localization/BukkitVolmitCommand*.class')
    // Invalid package name on Java 9+ ('enum' is a keyword); a module-path scan chokes on it.
    exclude('org/apache/commons/lang/enum/**')
    // Compile-only annotation carriers. Shipping them duplicates packages other mods also ship.
    exclude('org/jspecify/**')
    exclude('com/google/errorprone/**')
    exclude('com/google/j2objc/**')
    exclude('org/checkerframework/**')
    exclude('org/jetbrains/annotations/**')
    exclude('org/intellij/lang/**')
    // The Bukkit platform binding cannot load without org.bukkit on the classpath, which no mod
    // loader has. Shipping it only adds dead classes that reference a missing package.
    exclude('art/arcane/iris/platform/bukkit/**')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    relocate('org.objectweb.asm', 'art.arcane.iris.shadow.asm')
    // Split-package guard. A co-installed mod that ships any of these at their original coordinates
    // puts two copies of the same package on one module layer, which the loaders reject at boot
    // (Terra ships paralithic; caffeine and dom4j are common in mod dependency trees). First-party
    // art.arcane.volmlib is deliberately NOT relocated.
    relocate('com.github.benmanes.caffeine', 'art.arcane.iris.shadow.caffeine')
    relocate('com.googlecode.concurrentlinkedhashmap', 'art.arcane.iris.shadow.clhm')
    relocate('com.dfsek.paralithic', 'art.arcane.iris.shadow.paralithic')
    relocate('org.dom4j', 'art.arcane.iris.shadow.dom4j')
    relocate('org.jaxen', 'art.arcane.iris.shadow.jaxen')
    relocate('org.zeroturnaround.zip', 'art.arcane.iris.shadow.ztzip')
}

// The thin `jar` output carries valid neoforge.mods.toml metadata but bundles zero dependencies.
// Installing it is an instant NoClassDefFoundError, and it sits in build/libs right next to the real
// artifact. shadowJar is the only shippable NeoForge jar.
tasks.named('jar').configure {
    enabled = false
}

tasks.named('assemble').configure {
    dependsOn(tasks.named('shadowJar'))
}

pluginPackaging {
    artifacts {
        create('distribution') {
            taskName = 'shadowJar'
            policyName = 'Iris NeoForge'
            prunePrefixes = ['art/arcane/volmlib/']
            keepPrefixes = ['art/arcane/volmlib/util/matter/slices/']
        }
    }
}
