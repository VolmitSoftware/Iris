pluginManagement {
    repositories {
        maven {
            name = 'NeoForged'
            url = uri('https://maven.neoforged.net/releases/')
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'iris-neoforge'

apply from: new File(settingsDir, '../../gradle/runtime-cache.settings.gradle').canonicalFile

dependencyResolutionManagement {
    versionCatalogs {
        libs {
            from(files('../../gradle/libs.versions.toml'))
        }
    }
}

// Shared VolmLib source resolution; see gradle/volmlib-resolution.settings.gradle.
apply from: new File(settingsDir, '../../gradle/volmlib-resolution.settings.gradle').canonicalFile

includeBuild('../..') {
    dependencySubstitution {
        substitute(module('art.arcane:core')).using(project(':core'))
        substitute(module('art.arcane:spi')).using(project(':spi'))
    }
}
