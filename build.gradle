// adapters/modded-common has no build of its own: its sources are compiled by each loader wrapper, so
// its tests only run when one of those wrappers is asked for `test`. The Fabric wrapper is the one
// that runs them as plain JUnit - NeoForge's moddev unit-test harness boots the mod through FML's
// transforming class loader and dies on a split-package ServiceConfigurationError before any test
// starts. One loader is enough: the sources are identical across all three.
tasks.register('moddedTest', Exec) {
    group = 'verification'
    description = 'Runs the adapters/modded-common test suite through the Fabric adapter build.'
    workingDir = layout.projectDirectory.dir('adapters/fabric').asFile
    String wrapperScript = System.getProperty('os.name').toLowerCase().contains('windows') ? 'gradlew.bat' : 'gradlew'
    List<String> command = [
        layout.projectDirectory.file(wrapperScript).asFile.absolutePath,
        'test',
        '--console=plain',
        "-PirisVersion=${project.version}",
        "-PminecraftVersion=${minecraftVersion}",
        "-PfabricLoaderVersion=${fabricLoaderVersion}",
        "-PuseLocalVolmLib=${useLocalVolmLib}",
        "-PvolmLibCoordinate=${volmLibCoordinate}"
    ]
    if (localVolmLibDirectory != null && !localVolmLibDirectory.isBlank()) {
        command.add("-PlocalVolmLibDirectory=${localVolmLibDirectory}")
    }
    commandLine(command)
    inputs.files(moddedSharedInputs).withPropertyName('moddedSharedSources')
    inputs.files(
        layout.projectDirectory.file('adapters/fabric/src').asFile,
        layout.projectDirectory.file('adapters/fabric/build.gradle').asFile,
        layout.projectDirectory.file('adapters/fabric/settings.gradle').asFile
    ).withPropertyName('adapterSources')
    inputs.property('irisVersion', project.version.toString())
    inputs.property('minecraftVersion', minecraftVersion)
    inputs.property('fabricLoaderVersion', fabricLoaderVersion)
    inputs.property('useLocalVolmLib', useLocalVolmLib)
    inputs.property('volmLibCoordinate', volmLibCoordinate)
    inputs.property('localVolmLibCheckout', localVolmLibCheckout == null ? '' : localVolmLibCheckout.absolutePath)
    outputs.dir(layout.projectDirectory.dir('adapters/fabric/build/test-results/test'))
    mustRunAfter(tasks.named('jar'))
    mustRunAfter(project(':core').tasks.named('check'))
    mustRunAfter(project(':spi').tasks.named('jar'))
}

tasks.named('fabricJar').configure {
    mustRunAfter(tasks.named('moddedTest'))
}

tasks.named('check').configure {
    dependsOn('moddedTest')
}

List<String> commonModdedArtifactEntries = [
    'META-INF/iris/generation-kernels/catalog.tsv',
    'META-INF/iris/generation-kernels/abi-1.revision',
    'META-INF/services/art.arcane.iris.localization.IrisMessageContributor',
    'art/arcane/iris/generation/runtime/IrisEngine.class',
    'art/arcane/iris/spi/IrisPlatform.class',
    'art/arcane/volmlib/util/mantle/io/Lz4IOWorkerCodecSupport.class',
    'art/arcane/iris/platform/bootstrap/getHardware.class',
    // Both shared mixin configs plus the lang file and mod icon every loader's metadata points at.
    // A shadowJar exclude or a renamed resource that drops any of these is silent at build time and
    // shows up as a non-applied mixin or a missing-translation report from a user.
    'irisworldgen.entity.mixins.json',
    'irisworldgen.client.mixins.json',
    'assets/irisworldgen/lang/en_us.json',
    'assets/irisworldgen/icon.png'
]

// The modded jars ship the Bukkit-only code paths inert - excluding them means chasing the whole core
// reference graph. What must not slip in is new Bukkit coupling in core, which core already declares
// in purity-allowlist.txt, so the baseline is read from there instead of frozen by hand.
File bukkitPurityAllowlist = layout.projectDirectory.file('core/purity-allowlist.txt').asFile
Set<String> bukkitCoupledCoreClasses = bukkitPurityAllowlist.readLines()
    .findAll { String line -> !line.isBlank() }
    .collect { String line -> line.trim() - ~/\.java$/ }
    .toSet()

tasks.register('verifyFabricArtifact') {
    group = 'verification'
    dependsOn('fabricJar')
    File artifact = fabricArtifact
    inputs.file(artifact)
    inputs.file(bukkitPurityAllowlist)
    doLast {
        List<String> requiredEntries = commonModdedArtifactEntries + [
            'fabric.mod.json',
            'irisworldgen.mixins.json',
            'irisworldgen.accesswidener',
            'art/arcane/iris/fabric/IrisFabricBootstrap.class'
        ]
        ModdedArtifactVerifier.verify(artifact, requiredEntries, bukkitCoupledCoreClasses)
        logger.lifecycle("Verified ${artifact.name} packaging, mixin compat, and nested jars")
    }
}

tasks.register('verifyForgeArtifact') {
    group = 'verification'
