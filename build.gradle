// adapters/modded-common has no build of its own: its sources are compiled by each loader wrapper, so
// its tests only run when one of those wrappers is asked for `test`. The Fabric wrapper is the one
// that runs them as plain JUnit - NeoForge's moddev unit-test harness boots the mod through FML's
// transforming class loader and dies on a split-package ServiceConfigurationError before any test
// starts. One loader is enough: the sources are identical across all three.
tasks.register('moddedTest', Exec) {
    group = 'verification'
    description = 'Runs the adapters/modded-common test suite through the Fabric adapter build.'
    workingDir = layout.projectDirectory.dir('adapters/fabric').asFile
    String wrapperScript = System.getProperty('os.name').toLowerCase().contains('windows') ? 'gradlew.bat' : 'gradlew'
    List<String> command = [
        layout.projectDirectory.file(wrapperScript).asFile.absolutePath,
        'test',
        '--console=plain',
        "-PirisVersion=${project.version}",
        "-PminecraftVersion=${minecraftVersion}",
        "-PfabricLoaderVersion=${fabricLoaderVersion}",
        "-PuseLocalVolmLib=${useLocalVolmLib}",
        "-PvolmLibCoordinate=${volmLibCoordinate}"
    ]
    if (localVolmLibCheckout != null) {
        environment('ORG_GRADLE_PROJECT_localVolmLibDirectory', localVolmLibCheckout.absolutePath)
    }
    commandLine(command)
    inputs.files(moddedSharedInputs).withPropertyName('moddedSharedSources')
        .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(
        layout.projectDirectory.file('adapters/fabric/src').asFile,
        layout.projectDirectory.file('adapters/fabric/build.gradle').asFile,
        layout.projectDirectory.file('adapters/fabric/settings.gradle').asFile
    ).withPropertyName('adapterSources')
    inputs.property('irisVersion', project.version.toString())
    inputs.property('minecraftVersion', minecraftVersion)
    inputs.property('fabricLoaderVersion', fabricLoaderVersion)
    inputs.property('useLocalVolmLib', useLocalVolmLib)
    inputs.property('volmLibCoordinate', volmLibCoordinate)
    outputs.dir(layout.projectDirectory.dir('adapters/fabric/build/test-results/test'))
    mustRunAfter(tasks.named('jar'))
    mustRunAfter(project(':core').tasks.named('check'))
    mustRunAfter(project(':spi').tasks.named('jar'))
}

tasks.named('fabricJar').configure {
    mustRunAfter(tasks.named('moddedTest'))
}

gradle.projectsEvaluated {
    List<Task> sharedOutputTasks = allprojects.collectMany { Project candidate ->
        candidate.tasks.findAll { Task task ->
            task instanceof JavaCompile || task instanceof Jar || task instanceof Test
        }
