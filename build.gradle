Closure<Void> declareModdedJarIo = { Exec task, String adapter, String artifactName, Map<String, String> versions ->
    task.inputs.files(moddedSharedInputs).withPropertyName('moddedSharedSources')
    task.inputs.files(
        layout.projectDirectory.file("adapters/${adapter}/src").asFile,
        layout.projectDirectory.file("adapters/${adapter}/build.gradle").asFile,
        layout.projectDirectory.file("adapters/${adapter}/settings.gradle").asFile
    ).withPropertyName('adapterSources')
    versions.each { String key, String value -> task.inputs.property(key, value) }
    task.inputs.property('useLocalVolmLib', useLocalVolmLib)
    task.inputs.property('volmLibCoordinate', volmLibCoordinate)
    task.inputs.property('localVolmLibCheckout', localVolmLibCheckout == null ? '' : localVolmLibCheckout.absolutePath)
    task.outputs.file(layout.projectDirectory.file("adapters/${adapter}/build/libs/${artifactName}"))
    return null
}

