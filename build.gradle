// The three loader jars come out of nested standalone Gradle builds driven through Exec. Their own
// Gradle builds own the complete incremental model, so always launch them instead of allowing an
// incomplete outer input inventory to publish stale jars.
Closure<File> resolveLocalVolmLibDirectory = { ->
    String configured = localVolmLibDirectory != null && !localVolmLibDirectory.isBlank()
        ? localVolmLibDirectory
        : System.getenv('VOLMLIB_DIR')
    if (configured != null && !configured.isBlank()) {
        File configuredDirectory = new File(configured)
        if (!configuredDirectory.isAbsolute()) {
            configuredDirectory = new File(rootDir, configured)
        }
        return configuredDirectory.isDirectory() ? configuredDirectory : null
    }

    File current = rootDir
    while (current != null) {
        File candidate = new File(current, 'VolmLib')
        if (new File(candidate, 'settings.gradle').isFile() || new File(candidate, 'settings.gradle.kts').isFile()) {
            return candidate
        }

        current = current.parentFile
    }

    return null
}

List<Object> moddedSharedInputs = []
[
    'adapters/modded-common/src',
    'adapters/minecraft-common/src',
    'adapters/client-common/src',
    'core/src/main',
    'core/build.gradle',
    'spi/src/main',
    'spi/build.gradle',
    'build.gradle',
    'settings.gradle',
    'gradle.properties',
    'gradle/libs.versions.toml',
    'gradle/volmlib-resolution.settings.gradle'
].each { String path -> moddedSharedInputs.add(layout.projectDirectory.file(path).asFile) }
File localVolmLibCheckout = useLocalVolmLib.equalsIgnoreCase('true') ? resolveLocalVolmLibDirectory() : null
if (localVolmLibCheckout != null) {
    moddedSharedInputs.add(new File(localVolmLibCheckout, 'shared/src/main'))
}

Closure<Void> declareModdedJarIo = { Exec task, String adapter, String artifactName, Map<String, String> versions ->
    task.inputs.files(moddedSharedInputs).withPropertyName('moddedSharedSources')
    task.inputs.files(
        layout.projectDirectory.file("adapters/${adapter}/src").asFile,
        layout.projectDirectory.file("adapters/${adapter}/build.gradle").asFile,
        layout.projectDirectory.file("adapters/${adapter}/settings.gradle").asFile
    ).withPropertyName('adapterSources')
    versions.each { String key, String value -> task.inputs.property(key, value) }
    task.inputs.property('useLocalVolmLib', useLocalVolmLib)
    task.inputs.property('volmLibCoordinate', volmLibCoordinate)
    task.inputs.property('localVolmLibCheckout', localVolmLibCheckout == null ? '' : localVolmLibCheckout.absolutePath)
    task.outputs.file(layout.projectDirectory.file("adapters/${adapter}/build/libs/${artifactName}"))
    task.outputs.upToDateWhen { false }
    task.outputs.cacheIf { false }
    return null
}

