def generateNativeRuntime = tasks.register('generateNativeRuntime') {
    inputs.files(publishedNativeRuntime)
    inputs.property('version', volmLibCoordinate.tokenize(':').last())
    inputs.property('adapters', nmsBindings)
    outputs.dir(nativeRuntimeOutput)
    outputs.file(nativeRuntimeRules)
    doLast {
        Map<ComponentIdentifier, File> resolved = new LinkedHashMap<>()
        publishedNativeRuntime.incoming.artifacts.artifacts.each { artifact ->
            resolved.put(artifact.id.componentIdentifier, artifact.file)
        }
        Map<String, File> artifacts = NativeRuntimeArtifacts.publishedArtifacts(resolved,
            nativeRuntimeModules, volmLibCoordinate.tokenize(':').last())
        NativeRuntimeArtifacts.generate(artifacts, volmLibCoordinate.tokenize(':').last(),
            nativeRuntimeOutput.get().asFile, nativeRuntimeRules.get().asFile)
    }
}
