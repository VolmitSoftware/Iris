    'art/arcane/volmlib/nativelib/minecraft26_2/client/mixin/NativeWorldTypeEntryMixin.class',
    'assets/irisworldgen/lang/en_us.json',
    'assets/irisworldgen/icon.png'
]

// The modded jars ship the Bukkit-only code paths inert - excluding them means chasing the whole core
// reference graph. What must not slip in is new Bukkit coupling in core, which core already declares
// in purity-allowlist.txt, so the baseline is read from there instead of frozen by hand.
File bukkitPurityAllowlist = layout.projectDirectory.file('core/purity-allowlist.txt').asFile
Set<String> bukkitCoupledCoreClasses = bukkitPurityAllowlist.readLines()
    .findAll { String line -> !line.isBlank() }
    .collect { String line -> line.trim() - ~/\.java$/ }
    .toSet()

tasks.register('verifyFabricArtifact') {
    group = 'verification'
    dependsOn('fabricJar')
    File artifact = fabricArtifact
    inputs.file(artifact)
    inputs.file(bukkitPurityAllowlist)
    doLast {
        List<String> requiredEntries = commonModdedArtifactEntries + [
            'fabric.mod.json',
            'volmlib.fabric.mixins.json',
            'volmlib.accesswidener',
            'art/arcane/iris/fabric/IrisFabricBootstrap.class'
        ]
        ModdedArtifactVerifier.verify(artifact, requiredEntries, bukkitCoupledCoreClasses)
        logger.lifecycle("Verified ${artifact.name} packaging, mixin compat, and nested jars")
    }
}

tasks.register('verifyForgeArtifact') {
    group = 'verification'
    dependsOn('forgeJar')
    File artifact = forgeArtifact
    inputs.file(artifact)
    inputs.file(bukkitPurityAllowlist)
    doLast {
        List<String> requiredEntries = commonModdedArtifactEntries + [
            'META-INF/mods.toml',
            'META-INF/accesstransformer.cfg',
            'art/arcane/iris/forge/IrisForgeBootstrap.class'
        ]
        ModdedArtifactVerifier.verify(artifact, requiredEntries, bukkitCoupledCoreClasses)
        logger.lifecycle("Verified ${artifact.name} packaging, mixin compat, and nested jars")
    }
}

tasks.register('verifyNeoforgeArtifact') {
    group = 'verification'
