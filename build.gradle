List<String> commonModdedArtifactEntries = [
    'META-INF/iris/generation-kernels/catalog.tsv',
    'META-INF/iris/generation-kernels/abi-1.revision',
    'art/arcane/iris/engine/IrisEngine.class',
    'art/arcane/iris/spi/IrisPlatform.class',
    'art/arcane/volmlib/util/mantle/io/Lz4IOWorkerCodecSupport.class',
    'art/arcane/iris/util/common/misc/getHardware.class',
    // Both shared mixin configs plus the lang file and mod icon every loader's metadata points at.
    // A shadowJar exclude or a renamed resource that drops any of these is silent at build time and
    // shows up as a non-applied mixin or a missing-translation report from a user.
    'irisworldgen.entity.mixins.json',
    'irisworldgen.client.mixins.json',
    'assets/irisworldgen/lang/en_us.json',
    'assets/irisworldgen/icon.png'
]

// Frozen inventory of shipped classes that extend or implement an org.bukkit type. They come from
// core and VolmLib, sit on Bukkit-only code paths the mod loaders never resolve, and are inert dead
// weight rather than a boot hazard - excluding them means chasing the whole core reference graph.
// The verifier fails on anything NEW outside this set, which is the part that would be a regression.
// Shrinking the set (WP4 deletions, retypes) needs no edit here; growing it does.
Set<String> knownBukkitSupertypeClasses = [
    'art/arcane/iris/core/events/IrisEngineEvent.class',
    'art/arcane/iris/core/events/IrisLootEvent.class',
    'art/arcane/iris/core/events/IrisLootEvent$1.class',
    'art/arcane/iris/core/events/IrisLootEvent$2.class',
    'art/arcane/iris/core/link/data/ItemAdderDataProvider.class',
    'art/arcane/iris/core/link/data/MythicMobsDataProvider.class',
    'art/arcane/iris/core/link/MultiverseGuardListener.class',
    'art/arcane/iris/engine/framework/EngineAssignedWorldManager.class',
    'art/arcane/iris/engine/object/IrisEntity$BukkitOps$1.class',
    'art/arcane/iris/engine/object/LegacyTileData$SignTags$1.class',
    'art/arcane/iris/engine/platform/BukkitChunkGenerator.class',
    'art/arcane/iris/engine/platform/DummyBiomeProvider.class',
    'art/arcane/iris/engine/platform/DummyChunkGenerator.class',
    'art/arcane/iris/util/common/data/IrisCustomData.class',
    'art/arcane/iris/util/common/plugin/IrisService.class',
    'art/arcane/iris/util/common/plugin/VolmitPlugin.class',
    'art/arcane/iris/util/common/plugin/VolmitSender.class',
    'art/arcane/iris/util/common/plugin/chunk/ChunkTickets.class',
    'art/arcane/volmlib/util/board/BoardUpdateTask.class',
    'art/arcane/volmlib/util/bukkit/Events.class',
    'art/arcane/volmlib/util/data/Cuboid.class',
    'art/arcane/volmlib/util/data/InvertedBiomeGrid.class',
    'art/arcane/volmlib/util/data/IrisBiomeStorage.class',
    'art/arcane/volmlib/util/inventorygui/UIWindow.class'
] as Set

tasks.register('verifyFabricArtifact') {
    group = 'verification'
    dependsOn('fabricJar')
    File artifact = layout.projectDirectory.file("adapters/fabric/build/libs/${fabricArtifactName}").asFile
    inputs.file(artifact)
    doLast {
        List<String> requiredEntries = commonModdedArtifactEntries + [
            'fabric.mod.json',
            'irisworldgen.mixins.json',
            'irisworldgen.accesswidener',
            'art/arcane/iris/fabric/IrisFabricBootstrap.class'
        ]
        ModdedArtifactVerifier.verify(artifact, requiredEntries, knownBukkitSupertypeClasses)
        logger.lifecycle("Verified ${artifact.name} packaging, mixin compat, and nested jars")
    }
}

tasks.register('verifyForgeArtifact') {
    group = 'verification'
    dependsOn('forgeJar')
    File artifact = layout.projectDirectory.file("adapters/forge/build/libs/${forgeArtifactName}").asFile
    inputs.file(artifact)
    doLast {
        List<String> requiredEntries = commonModdedArtifactEntries + [
            'META-INF/mods.toml',
            'META-INF/accesstransformer.cfg',
            'art/arcane/iris/forge/IrisForgeBootstrap.class'
        ]
        ModdedArtifactVerifier.verify(artifact, requiredEntries, knownBukkitSupertypeClasses)
        logger.lifecycle("Verified ${artifact.name} packaging, mixin compat, and nested jars")
    }
}

tasks.register('verifyNeoforgeArtifact') {
