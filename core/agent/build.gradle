import org.gradle.jvm.tasks.Jar

plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation('junit:junit:4.13.2')
}

tasks.named('jar', Jar).configure {
    manifest.attributes(
        'Agent-Class': 'art.arcane.iris.platform.agent.Installer',
        'Premain-Class': 'art.arcane.iris.platform.agent.Installer',
        'Can-Redefine-Classes': true,
        'Can-Retransform-Classes': true
    )
}
