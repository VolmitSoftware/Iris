def embeddedAgentJar = project(':core:agent').tasks.named('jar', Jar)
def templateSource = file('src/main/templates')
def templateDest = layout.buildDirectory.dir('generated/sources/templates')
def generateTemplates = tasks.register('generateTemplates', Copy) {
    inputs.properties([
        environment: providers.provider {
            if (project.hasProperty('release')) {
                return 'production'
            }
            if (project.hasProperty('argghh')) {
                return 'Argghh!'
            }
            return 'development'
        },
        commit: providers.provider {
            String commitId = null
            Exception failure = null
            try {
                Process process = new ProcessBuilder('git', '-C', rootProject.projectDir.absolutePath, 'rev-parse', 'HEAD')
                        .redirectErrorStream(true)
                        .start()
                String output = new String(process.inputStream.readAllBytes(), StandardCharsets.UTF_8).trim()
                int exitCode = process.waitFor()
                if (exitCode == 0) {
                    commitId = output
                } else {
                    failure = new GradleException("git rev-parse exited with code ${exitCode}: ${output}")
                }
            } catch (Exception ex) {
                failure = ex
            }

            if (commitId != null && commitId.length() == 40) {
                return commitId
            }

            logger.error('Git commit hash not found', failure)
            return 'unknown'
        },
        minecraftVersion: providers.gradleProperty('minecraftVersion'),
    ])

    from(templateSource)
    into(templateDest)
    rename { String fileName -> "art/arcane/iris/${fileName}" }
    expand(inputs.properties)
}

tasks.named('compileJava', JavaCompile).configure {
    /**
     * We need parameter meta for the decree command system
     */
    options.compilerArgs.add('-parameters')
    options.compilerArgs.addAll(['--add-modules', 'jdk.incubator.vector'])
    options.encoding = 'UTF-8'
    options.debugOptions.debugLevel = 'none'
    // lombok.config decides how equals/hashCode/toString are generated (fields, never getters), so editing it
    // changes this module's bytecode. Gradle does not know that on its own and would serve a stale up-to-date
    // build until something else in the module changed.
    inputs.file(rootProject.file('lombok.config'))
        .withPropertyName('lombokConfig')
        .withPathSensitivity(PathSensitivity.NONE)
}

tasks.named('test', Test).configure {
    jvmArgs('--add-modules', 'jdk.incubator.vector')
    classpath = files('src/main/resources') + classpath
}

configurations.matching { it.name.startsWith('slim') }.all { }

List<String> requestedTasks = gradle.startParameter.taskNames
boolean runningOnlyTestTasks = !requestedTasks.isEmpty()
    && requestedTasks.every { String taskName -> taskName.toLowerCase().contains('test') }
if (runningOnlyTestTasks) {
    TaskProvider<Task> processResourcesTask = tasks.named('processResources')
    tasks.named('classes').configure { Task classesTask ->
        Set<Object> dependencies = new LinkedHashSet<Object>(classesTask.getDependsOn())
        dependencies.removeIf { Object dependency ->
            if (dependency instanceof TaskProvider) {
                return ((TaskProvider<?>) dependency).name == processResourcesTask.name
            }
            if (dependency instanceof Task) {
                return ((Task) dependency).name == processResourcesTask.name
            }
            String dependencyName = String.valueOf(dependency)
            return dependencyName == 'processResources' || dependencyName.endsWith(':processResources')
        }
        classesTask.setDependsOn(dependencies)
    }
    processResourcesTask.configure { Task task ->
        task.enabled = false
    }
}

// Iris's own packages and classes the Bukkit jar leaves out: nothing shipped in the jar reaches them (the list's
// package-granularity reasoning is in the header of volmlib-left-out-of-bukkit-jar.txt). verifyBukkitArtifact re-derives
// the reference graph over the shipped jar and fails on any dangling reference, so an exclude that stops being dead is a
// build failure rather than a runtime crash.
List<String> irisPackagesLeftOut = [
    'art/arcane/iris/core/report/**',
    'art/arcane/iris/util/common/inventorygui/**',
    'art/arcane/iris/util/common/board/**'
]

List<String> irisClassesLeftOut = [
    'art/arcane/iris/core/pack/IrisPack',
    'art/arcane/iris/core/pack/IrisPackRepository',
    'art/arcane/iris/core/jobs/DownloadJob',
    'art/arcane/iris/core/jobs/JobCollection',
    'art/arcane/iris/core/jobs/ParallelQueueJob',
    'art/arcane/iris/core/jobs/QueueJob',
    'art/arcane/iris/engine/framework/placer/WorldObjectPlacer',
    'art/arcane/iris/engine/object/placement/IPostBlockAccess',
    'art/arcane/iris/engine/object/entity/IrisPotionEffect',
    'art/arcane/iris/engine/platform/DummyChunkGenerator',
    'art/arcane/iris/util/common/math/VectorMath',
    'art/arcane/iris/util/common/parallel/GridLock',
    'art/arcane/iris/util/common/reflect/W',
    'art/arcane/iris/util/slimjar/BuildConstants',
    'art/arcane/iris/util/slimjar/relocation/meta/AttributeMetaMediator',
    'art/arcane/iris/util/slimjar/relocation/meta/AttributeMetaMediatorFactory'
]

// The VolmLib classes the jar leaves out are listed in a file the built-in modules jar check reads too (IrisModule), so a
// module cannot use a VolmLib class that is stripped from here. Format: see the file's header.
File volmLibLeftOutFile = file('volmlib-left-out-of-bukkit-jar.txt')
List<String> volmLibLeftOutEntries = volmLibLeftOutFile.readLines()
    .collect { String line -> line.contains('#') ? line.substring(0, line.indexOf('#')).trim() : line.trim() }
    .findAll { String line -> !line.isEmpty() }
    .collectMany { String entry ->
        entry.endsWith('.class') || entry.contains('*') ? [entry] : [entry + '.class', entry + '$*.class']
    }
List<String> irisClassesLeftOutEntries = irisClassesLeftOut.collectMany { String classPath ->
    [classPath + '.class', classPath + '$*.class']
}

// Annotation-only artifacts pulled in transitively by Gson and Caffeine. Their types appear solely
// in annotation attributes, which the JVM skips silently when the type is absent, so nothing loads
// or links against them at runtime.
List<String> annotationOnlyArtifacts = [
    'com/google/errorprone/**',
    'org/jspecify/**'
]

// Publisher metadata for the shaded dependencies. Nothing reads these at runtime.
List<String> dependencyBuildMetadata = [
    'META-INF/maven/**',
    'META-INF/proguard/**',
    'META-INF/versions/*/OSGI-INF/**'
]

// The built-in modules as a pack module jar, iris-builtins.jar, packaged from these compiled classes so it always fits this
// build of Iris, checked as a pack load would check it, and bundled into the plugin (IrisModuleHost loads it with every pack).
// What goes in is listed in IrisModule/builtin-modules.txt: "module <class>" (an entry point) or "include <ant pattern>".
String builtinModulesJarName = 'iris-builtins.jar'
String builtinModuleEntryFile = 'com.volmit.IrisModule'
File builtinModulesFile = rootProject.file('../IrisModule/builtin-modules.txt')
// The packages pack modules may use besides the IrisApi; IrisModuleHost.EXPOSED_PACKAGES lists the same.
List<String> builtinExposedPackages = ['art.arcane.iris.builtin', 'art.arcane.volmlib', 'com.google.gson']
List<String> builtinModuleClasses = []
List<String> builtinClassPatterns = []
builtinModulesFile.readLines()
    .collect { String line -> line.contains('#') ? line.substring(0, line.indexOf('#')).trim() : line.trim() }
    .findAll { String line -> !line.isEmpty() }
    .each { String line ->
        List<String> parts = line.split(/\s+/, 2) as List<String>
        if (parts.size() < 2 || parts[1].isBlank()) {
            throw new GradleException("${builtinModulesFile.name}: '${line}' needs a value after '${parts[0]}'")
        }
        if (parts[0] == 'module') {
            builtinModuleClasses.add(parts[1].trim())
        } else if (parts[0] == 'include') {
            builtinClassPatterns.add(parts[1].trim())
        } else {
            throw new GradleException("${builtinModulesFile.name}: unknown line '${line}'; start it with 'module' or 'include'")
        }
    }
List<String> builtinPackagedPatterns = builtinModuleClasses.collectMany { String moduleClass ->
    String path = moduleClass.replace('.', '/')
    [path + '.class', path + '$*.class']
} + builtinClassPatterns
Provider<Directory> builtinModulesBuild = layout.buildDirectory.dir('builtin-modules')

configurations {
    // What the jar check sees besides Iris's classes: the IrisApi and the libraries Iris shares with pack modules.
    builtinModulesCheckClasspath {
        canBeConsumed = false
        transitive = false
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
        }
    }
}

dependencies {
    builtinModulesCheckClasspath('com.volmit:IrisApi')
    builtinModulesCheckClasspath(volmLibCoordinate)
    builtinModulesCheckClasspath(libs.gson)
}

def writeBuiltinModuleEntries = tasks.register('writeBuiltinModuleEntries') {
    description = "Writes the built-ins jar's META-INF/services/${builtinModuleEntryFile}, one module class per line."
    Provider<RegularFile> entries = builtinModulesBuild.map { it.file("services/${builtinModuleEntryFile}") }
    inputs.file(builtinModulesFile)
    outputs.file(entries)
    doLast {
        File entriesFile = entries.get().asFile
        entriesFile.parentFile.mkdirs()
        entriesFile.text = builtinModuleClasses.join('\n') + '\n'
    }
}

def packageBuiltinModules = tasks.register('packageBuiltinModules', Jar) {
    description = 'Packages the listed built-in modules and classes before they are checked.'
    archiveFileName.set(builtinModulesJarName)
    destinationDirectory.set(builtinModulesBuild.map { it.dir('unchecked') })
    inputs.file(builtinModulesFile)
    from(sourceSets.main.java.classesDirectory) {
        include(builtinPackagedPatterns)
    }
    from(writeBuiltinModuleEntries) {
        into('META-INF/services')
    }
}

def builtinModulesJar = tasks.register('builtinModulesJar', JavaExec) {
    group = 'build'
    description = "Builds build/builtin-modules/${builtinModulesJarName}, the built-in modules as a pack module jar, checked with" +
        " IrisApi's pack class and reference checks as a pack load would."
    dependsOn(packageBuiltinModules)
    Provider<RegularFile> unchecked = packageBuiltinModules.flatMap { it.archiveFile }
    Provider<RegularFile> checked = builtinModulesBuild.map { it.file(builtinModulesJarName) }
    classpath = configurations.builtinModulesCheckClasspath + files(sourceSets.main.java.classesDirectory)
    mainClass.set('com.volmit.host.ModuleJarCheck')
    inputs.file(unchecked)
    inputs.file(volmLibLeftOutFile)
    outputs.file(checked)
    argumentProviders.add({
        [unchecked.get().asFile.absolutePath, "--left-out=${volmLibLeftOutFile.absolutePath}".toString()] + builtinExposedPackages
    } as CommandLineArgumentProvider)
    ignoreExitValue = true
    ByteArrayOutputStream problems = new ByteArrayOutputStream()
    errorOutput = problems
    doFirst {
        // A jar from an earlier run that passed must not survive a run that fails.
        checked.get().asFile.delete()
    }
    doLast {
        if (executionResult.get().exitValue != 0) {
            throw new GradleException("The built-in modules jar breaks the rules of a pack module jar:\n" + problems.toString().trim() +
                "\nFix the classes listed in ${builtinModulesFile.name}, or move what they use into the jar or into art.arcane.iris.builtin.")
        }
        java.nio.file.Files.copy(unchecked.get().asFile.toPath(), checked.get().asFile.toPath())
    }
}

// The jar's classes load from the bundled jar only, in each pack's class loader, so the plugin's own classes leave them out.
tasks.named('jar', Jar).configure {
    exclude(builtinPackagedPatterns)
    from(builtinModulesJar)
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).configure {
    dependsOn(embeddedAgentJar)
    exclude(builtinPackagedPatterns)
    from(builtinModulesJar)
    mergeServiceFiles()
    // minimize() stays off. Caffeine reaches its 520 generated cache and node classes through
    // MethodHandles.Lookup.findClass on a computed name, and the VolmLib command, GUI and hotload
    // surfaces are only referenced from :adapters:bukkit:plugin, which is merged into the artifact
    // after this task runs. Both would be stripped as unreachable. Excluding them from minimization
    // leaves it reaching ~25KB of Gson internals, which is not worth a mode that fails silently.
    relocate('com.dfsek.paralithic', "${lib}.paralithic")
    relocate('io.github.slimjar', "${lib}.slimjar")
    exclude('modules/loader-agent.isolated-jar')
    exclude(irisPackagesLeftOut)
    exclude(irisClassesLeftOutEntries)
    exclude(volmLibLeftOutEntries)
    exclude(annotationOnlyArtifacts)
    exclude(dependencyBuildMetadata)
    from(embeddedAgentJar.map { it.archiveFile }) {
        rename { String ignored -> 'agent.jar' }
    }
}

