    .get()

/**
 * Dependencies.
 *
 * Provided or classpath dependencies are not shaded and are available on the runtime classpath
 *
 * Shaded dependencies are not available at runtime, nor are they available on mvn central so they
 * need to be shaded into the jar (increasing binary size)
 *
 * Dynamically loaded dependencies are defined in the plugin.yml (updating these must be updated in the
 * plugin.yml also, otherwise they wont be available). These do not increase binary size). Only declare
 * these dependencies if they are available on mvn central.
 */
dependencies {
    api(project(':spi'))

    // IrisApi, from the sibling checkout (gradle/irisapi-resolution.settings.gradle). Shaded without
    // relocation: pack modules compile against com.volmit and the pack loader exposes that package,
    // except the host side (com.volmit.host), which loads and runs them.
    implementation('com.volmit:iris-api')
    implementation('com.volmit:iris-host')

    // The built-in modules (IrisModule, a build of its own against the Iris API). Core and the adapters still name their
    // classes; the ones in the built-ins jar are left out of the plugin and load from the jar it bundles.
    api('art.arcane:iris-module')

    // Provided or Classpath
    compileOnly(libs.lombok)
    annotationProcessor(libs.lombok)
    compileOnly(libs.paper.api)
    compileOnly(libs.log4j.api)
    compileOnly(libs.log4j.core)
    compileOnly(libs.guava)

    // Third Party Integrations
    compileOnly(libs.nexo)
    compileOnly(libs.itemsadder)
    compileOnly(libs.score)
    compileOnly(libs.mmoitems)
    compileOnly(libs.mythiclib)
    compileOnly(libs.eco)
    compileOnly(libs.mythic)
    compileOnly(libs.mythicCrucible)
    compileOnly(libs.kgenerators) {
        transitive = false
    }
    compileOnly(libs.multiverseCore)
    compileOnly(libs.craftengine.core)
    compileOnly(libs.craftengine.bukkit)

    // Shaded
    implementation('de.crazydev22.slimjar.helper:spigot:2.1.9')
    implementation(volmLibCoordinate) {
        transitive = false
    }
    // Dynamically Loaded
    slim(libs.gson)
    slim(libs.lru)
    slim(libs.caffeine)
    slim(libs.paralithic)
    slim(libs.paperlib)
    slim(libs.adventure.api)
    slim(libs.adventure.minimessage)
    slim(libs.adventure.serializer.legacy)
    slim(libs.adventure.serializer.plain)
    slim(libs.bstats)
    slim(libs.commons.io)
    slim(libs.commons.lang3)
    slim(libs.oshi)
    slim(libs.lz4)
    slim(libs.fastutil)
    slim(libs.zip) {
        exclude(group: 'org.slf4j', module: 'slf4j-api')
    }
    slim(libs.asm)
    slim(libs.byteBuddy.core)
    slim(libs.byteBuddy.agent)
    slim(libs.dom4j)
    slim(libs.jaxen)

    testImplementation('com.volmit:iris-api')
    testImplementation('com.volmit:iris-host')
    testImplementation('junit:junit:4.13.2')
    testImplementation('org.mockito:mockito-core:5.23.0')
    testImplementation(libs.paper.api)
    testRuntimeOnly(libs.paper.api)
    testImplementation(libs.multiverseCore)
}

