#   {template}  Beim Erstellen eines Projekts gewählte Vorlage.
#   {tenSecond}  Vorgenerierte Chunks pro Sekunde im 10-Sekunden-Zeitfenster.
#   {thirtySecond}  Vorgenerierte Chunks pro Sekunde im 30-Sekunden-Zeitfenster.
#   {threads}  Anzahl der Arbeitsthreads für die Generierungsprüfung per Hash.
#   {tileNote}  Optionaler Hinweis zu gespeicherten oder platzierten Blockentitätsdaten.
#   {title}  Titel der Operation, deren Ergebnis angezeigt wird.
#   {to}  Neue Debug-Einstellung: true für aktiviert, false für deaktiviert.
#   {token}  Reichweitenargument, das nicht gelesen werden konnte.
#   {total}  Gesamtzahl der in der Nachricht genannten Arbeitseinheiten, Chunks, Dimensionen oder Einträge.
#   {totalObjects}  Anzahl der in Object Studio geöffneten Objekte.
#   {transferred}  Formatierte Menge der bisher übertragenen Daten.
#   {type}  Erwarteter Parametertyp, Ressourcentyp oder Objektkategorie aus der Nachricht.
#   {typeKey}  Registrierte Minecraft-Dimensionstyp-Kennung oder inline.
#   {unreachableBiomes}  Anzahl nativer Strukturen, die durch die Biomauswahl des Packs ausgeschlossen sind.
#   {unsupported}  Anzahl nativer Strukturen, die diese Plattform als nicht unterstützt meldet.
#   {updates}  Blockaktualisierungen pro Sekunde in der Entwickleranzeige.
#   {url}  Webadresse zum Öffnen oder Kopieren.
#   {usage}  Befehlssyntax oder Text zur Speichernutzung in der Speicheranzeige.
#   {used}  Formatierte Menge des belegten Speichers in der Speicheranzeige.
#   {value}  Nachrichtenspezifischer Wert, etwa Standardwert, Name, Koordinate, Anzahl oder Fehler. Beachte den umgebenden Text.
#   {value2}  Zweiter nachrichtenspezifischer Wert, etwa Gesamtchunkzahl, Ziel-Y, Packname oder Fehler. Beachte den umgebenden Text.
#   {value3}  Dritter nachrichtenspezifischer Wert, etwa Prozentsatz, Ziel-Z, Minecraft-Version oder verstrichene Zeit.
#   {value4}  Vierter nachrichtenspezifischer Wert, etwa Blockschreibvorgänge, Z-Koordinate einer Auswahl oder optionaler Statuszusatz.
#   {value5}  Fünfter nachrichtenspezifischer Wert: geschriebene Nicht-Luft-Blöcke bei Objektplatzierung oder Chunk-Z in der Positionsvorlage.
#   {variables}  Liste der Platzhalter für die gerade bearbeitete Nachricht.
#   {velocity}  Aktuelle Bewegungsgeschwindigkeit der untersuchten Entität.
#   {version}  Plugin- oder Minecraft-Version aus der umgebenden Nachricht.
#   {volume}  Anzahl der Blöcke in der Objektauswahl.
#   {w}  Objektbreite in Blöcken.
#   {wantVariants}  Gewünschte Varianten pro importiertem Vanilla-Baum- oder Objekt-Feature.
#   {warnings}  Anzahl nicht blockierender Validierungswarnungen.
#   {width}  Breite des angezeigten Weltgebiets in Blöcken.
#   {wood}  Anzahl der bei der Baumreparatur hinzugefügten Holzblöcke.
#   {world}  Name der Zielwelt des Befehls oder der Fortschrittsanzeige.
#   {written}  Anzahl erfolgreich geschriebener importierter Varianten oder Objektdateien.
#   {x}  X-Koordinate im in der Nachricht genannten Block-, Chunk-, Regions- oder Vorschaukontext.
#   {y}  Vertikale Welt- oder Blockkoordinate.
#   {z}  Z-Koordinate im in der Nachricht genannten Block-, Chunk-, Regions- oder Vorschaukontext.
#   {zoom}  Aktuelle Zoomstufe der Vorschau.
