#   {source}  Pack, Downloadquelle oder Eingabe der Fortschrittsanzeige.
#   {speed}  Formatierte Vorgenerierungs- oder Verarbeitungsrate pro Sekunde.
#   {stage}  Name der aktuellen Fortschrittsphase.
#   {state}  Aktueller Zustand oder Eigenschaftswert aus der Nachricht.
#   {status}  Aktueller Statustext der Vorschau.
#   {structure}  Name oder Kennung der gesuchten Struktur.
#   {structureKey}  Registrierungs- oder Packkennung der angeforderten Struktur.
#   {summary}  Formatierte Ergebnisse der abgeschlossenen Operation.
#   {suppressed}  Anzahl nativer Strukturen, die durch Iris-Platzierungen ersetzt werden.
