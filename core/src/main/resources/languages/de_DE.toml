# === Iris language guide ===
# Iris - de_DE
#
# === Datei bearbeiten ===
# languages/de_DE.toml
# Diese Datei kann direkt bearbeitet werden. Lokale Änderungen bleiben erhalten; fehlende oder ungültige Einträge verwenden das eingebaute Englisch.
# /iris language server edit de_DE
#

# === Präfix und Beispiel ===
# Iris hat kein globales Sprachpräfix. Ein wörtliches Präfix in einer Nachricht wirkt nur auf diese Nachricht.
# Der Plugin-Tag der Konsole sowie Menü- und Hilfethemen werden separat festgelegt.
# Beispiel: Bearbeite set_debug im vorhandenen Abschnitt [iris.bukkit.commandiris]:
# [iris.bukkit.commandiris]
# set_debug = "&6[Welten]&r &aDebug gesetzt auf: {to}"
# Dadurch erhält nur diese Debug-Nachricht das Präfix [Welten]. {to} wird durch true (aktiviert) oder false (deaktiviert) ersetzt.
#
# === Farben und Formatierung ===
# Klassische Farben: &0 Schwarz, &1 Dunkelblau, &2 Dunkelgrün, &3 Dunkeltürkis,
# &4 Dunkelrot, &5 Dunkelviolett, &6 Gold, &7 Grau, &8 Dunkelgrau,
# &9 Blau, &a Grün, &b Türkis, &c Rot, &d Hellviolett, &e Gelb, &f Weiß.
# Stile: &k Verschleierung, &l Fett, &m Durchgestrichen, &n Unterstrichen, &o Kursiv, &r Zurücksetzen.
# Die Sprachverarbeitung akzeptiert RGB in den Formen &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B und [RRGGBB].
# Nachgelagerte Bukkit-Themen können RGB-Farben verändern. Modded- und Klartextanzeigen verwenden ihre eigenen Stile.
# In TOML-Zeichenketten mit doppelten Anführungszeichen steht \n für einen Zeilenumbruch, \" für ein Anführungszeichen und \\ für einen wörtlichen Rückwärtsschrägstrich.
#
# === Variablen ===
# Verwende nur die Platzhalter, die bereits in der jeweiligen Nachricht vorkommen. Ändere ihre Namen nicht.
# PC, SC und TC sind keine Iris-Themenvariablen. Dieses Verzeichnis erlaubt keine zusätzlichen Platzhalter in anderen Nachrichten.
#   {MAXAUTOSELECTVOLUME}  Maximale Blockzahl eines automatisch ausgewählten Objekts.
#   {MAXSAVEVOLUME}  Maximale Blockzahl einer gespeicherten Objektauswahl.
#   {MAXSPAN}  Maximale Breite, Höhe oder Tiefe einer Struktur bei der Erfassung, in Blöcken.
#   {NATIVESTRUCTURELOCATERADIUS}  Maximaler Suchradius für native Strukturen, in Chunks.
#   {ROOTPERMISSION}  Grundberechtigung für den Befehl.
#   {WORKSPACENAME}  Name des gesuchten Studio-Arbeitsordners.
#   {WORLDPACKNAME}  Name des erzeugten Welt-Datenpakets.
#   {active}  Anzahl der derzeit laufenden Arbeitsprozesse.
#   {activeLocale}  Sprache, die aktiv bleibt, wenn die gewünschte Sprache nicht gewählt werden kann.
#   {activeMax}  Obere Grenze des Höhenbereichs des geladenen Dimensionstyps.
#   {activeMin}  Untere Grenze des Höhenbereichs des geladenen Dimensionstyps.
#   {actualReverts}  Anzahl der tatsächlich rückgängig gemachten Objekteinfügungen.
#   {afb}  Formatierter Teil einer Engine-Zeitmessungsbezeichnung nach dem Klammerteil.
#   {after}  Wert nach der Änderung oder nach der Reparatur weiterhin unerreichbare Baumblöcke.
#   {amount}  Menge zum benannten Eintrag im Bericht.
#   {applied}  Anzahl der Chunks, deren Verarbeitungsergebnis angewendet wurde.
#   {argument}  Befehlsargument, das nicht akzeptiert werden konnte.
#   {available}  Anzahl nativer Strukturen, die erzeugt werden dürfen.
#   {bar}  Bereits formatierter Text des Fortschrittsbalkens.
#   {befb}  Formatierter Teil einer Engine-Zeitmessungsbezeichnung vor dem Klammerteil.
#   {before}  Wert vor der Änderung oder unerreichbare Baumblöcke vor der Reparatur.
#   {biome}  Name oder Kennung des angezeigten Bioms.
#   {block}  Typ oder Beschreibung des untersuchten Blocks.
#   {blockX}  X-Koordinate des Blocks oder Teleportationsziels.
#   {blockY}  Y-Koordinate des Blocks oder Teleportationsziels.
#   {blockZ}  Z-Koordinate des Blocks oder Teleportationsziels.
#   {blocking}  Anzahl der Validierungsfehler, die das Laden des Packs verhindern.
#   {blocks}  Anzahl der Blockvarianten in der importierten Gruppe.
#   {bpp}  Anzahl der Weltblöcke, die ein Pixel in Vision darstellt.
#   {branches}  Anzahl der bei der Reparatur von Baumobjekten hinzugefügten Äste.
#   {broken}  Anzahl der Packs, deren Validierung fehlgeschlagen ist.
#   {brokenTotal}  Gesamtzahl der Packs, deren Validierung fehlgeschlagen ist.
#   {cave}  Höhlenbiom oder Höhlenbeschreibung an der untersuchten Position.
#   {centerX}  X-Koordinate des Gebietsmittelpunkts; die Einheit ergibt sich aus der Nachricht.
#   {centerZ}  Z-Koordinate des Gebietsmittelpunkts; die Einheit ergibt sich aus der Nachricht.
#   {changed}  Anzahl der verarbeiteten Objekte, die verändert wurden.
#   {chunk}  Koordinaten oder Bezeichnung des gemeldeten Chunks.
#   {chunkX}  X-Koordinate in Chunks, nicht in Blöcken.
#   {chunkZ}  Z-Koordinate in Chunks, nicht in Blöcken.
#   {chunks}  Anzahl der an der Operation beteiligten Chunks.
#   {clampedY}  Y-Koordinate des Teleportationsziels nach Anpassung an den zulässigen Höhenbereich.
#   {command}  Befehlsname oder vollständiger auszuführender Befehl.
#   {converted}  Anzahl der bei der Baumreparatur in Holz umgewandelten Laubblöcke.
#   {count}  Anzahl der im umgebenden Text genannten Einträge, Nachrichten oder Spieler.
#   {current}  Aktueller Fortschrittszähler oder Chunkzahl des aktuellen Vergleichs.
#   {currentStage}  Name der aktuellen Studio-Ladephase.
#   {d}  Objekttiefe in Blöcken.
#   {depth}  Anzahl der Blöcke unter der Geländeoberfläche.
#   {derivative}  Ableitung oder Variante des Oberflächenbioms.
#   {detail}  Zusätzliche Beschreibung des untersuchten Objekts oder der aktuellen Fortschrittsphase.
#   {diffs}  Anzahl der Unterschiede zwischen den erzeugten Ergebnissen.
#   {dimKey}  Kennung der Dimension, die verpackt wird.
#   {dimension}  Name oder Kennung der in der Nachricht genannten Dimension.
#   {dimensionId}  Registrierte Kennung der geladenen oder angeforderten Dimension.
#   {dimensionId2}  Im vorgeschlagenen Löschbefehl wiederholte Dimensionskennung.
#   {dimm}  Studio-Dimensionskennung oder deren Packname im Validierungsbefehl.
#   {disabled}  Anzahl nativer Strukturen, deren Erzeugung deaktiviert ist.
#   {distances}  Anzahl der bei der Baumreparatur geänderten Laubabstände.
#   {done}  Anzahl der bisher abgeschlossenen Arbeitseinheiten.
#   {downloadSource}  Quelle oder ausgewählte Referenz für den Packdownload.
#   {downloadable}  Pack oder herunterladbares Projekt, das importiert wird.
#   {dumpPath}  Speicherort der Bereinigungs- oder Wiederherstellungsdaten.
#   {duration}  Formatierte Dauer der Operation.
#   {e}  Ausnahmetext einer fehlgeschlagenen Suche nach Strukturvorlagen.
#   {elapsed}  Formatierte Zeit seit Beginn der Operation.
#   {engines}  Anzahl aktiver Iris-Generierungsengines oder Dimensionen.
#   {entity}  Entitätstyp, den der untersuchte Spawner ausgewählt hat.
#   {error}  Einzelheiten des aufgetretenen Fehlers.
#   {errorMessage}  Optionaler Fehlerzusatz am Ende der Hauptfehlermeldung.
#   {eta}  Formatierte geschätzte Restzeit; manche Nachrichten liefern die Bezeichnung mit.
#   {failed}  Anzahl fehlgeschlagener Elemente oder vorbereiteter Fehlerzusatz in Fortschrittstiteln.
#   {failure}  Grund für das Fehlschlagen der Suche oder Operation.
#   {failures}  Anzahl fehlgeschlagener Arbeitseinheiten oder optionale formatierte Fehlerübersicht.
#   {file}  Name oder Pfad der an der Operation beteiligten Datei.
#   {filter}  Text zum Filtern der Liste der Iris-Dimensionen.
#   {fps}  Aktuelle Bildrate der Vorschau, in Bildern pro Sekunde.
#   {g}  Seit dem letzten Fortschrittsbericht beim Verpacken geschriebene Objektdateien.
#   {generated}  Anzahl der bisher erzeugten Chunks.
#   {generator}  Name des im Explorer angezeigten Rauschgenerators.
#   {generatorKey}  Angeforderte Kennung des Rauschgenerators.
#   {get}  Anzahl erfolgreich konvertierter Schematic-Dateien.
#   {golden}  Chunkzahl im gespeicherten Referenzvergleich.
#   {goldenDimension}  In der Referenzaufnahme gespeicherte Dimensionskennung.
#   {goldenSeed}  In der Referenzaufnahme gespeicherter Welt-Seed.
#   {goldenVersion}  Minecraft-Version, mit der die Referenzaufnahme erstellt wurde.
#   {group}  Nachrichtengruppe im Spracheditor oder Kategorie eines importierten Objekts.
#   {guiNote}  Optionaler Hinweis zum Fortschrittsfenster der Vorgenerierung.
#   {h}  Objekthöhe in Blöcken.
#   {hash}  Gemeinsame Prüfsumme der verglichenen erzeugten Chunks.
#   {health}  Aktuelle Gesundheit der untersuchten Entität.
#   {height}  Geländehöhe, Gesamthöhe oder Höhe des angezeigten Gebiets, je nach Nachricht.
#   {hours}  Stundenanteil der formatierten Dauer.
#   {i}  Anzeigename der Engine oder Eintrag in der Befehlslistenvorlage.
#   {id}  Registrierungs-ID des untersuchten Bioms.
#   {imported}  Anzahl erfolgreich importierter Strukturen oder Objekte.
#   {includeNonJigsaw}  Ob der Import auch Strukturen ohne Jigsaw-Teile einschließt.
#   {iris}  Anzahl geladener Dimensionen mit Iris-Generierung.
#   {irisLevels}  Anzahl geladener Iris-Dimensionen, deren Höhen mit dem Pack verglichen wurden.
#   {irisPlaced}  Anzahl der durch Iris statt durch native Generierung platzierten Strukturen.
#   {job}  Name der abgeschlossenen Hintergrundoperation.
#   {k}  Ladeschlüssel der Region im Bericht zur Regionsverteilung.
#   {key}  Kennung des im umgebenden Text genannten Parameters, der Nachricht oder Ressource.
#   {key2}  Im vorgeschlagenen Suchbefehl wiederholte Strukturkennung.
#   {keyString}  Kennung der importierten oder als ungültig gemeldeten Struktur oder Ressource.
#   {label}  Anzeigename des gefundenen Ziels.
#   {line}  Zeilennummer im Spracheditor.
#   {locale}  Sprachkennung, etwa en_US oder de_DE.
#   {logicalWorldName}  Logischer Name der Zielwelt des Befehls.
#   {loot}  Kennung der untersuchten Beutetabelle.
#   {m}  Zusätzliche Evakuierungsnachricht oder Text ignorierter Parameter in der jeweiligen Befehlsvorlage.
#   {mantleStatus}  Ergebnis des Zurücksetzens von Generierungsdaten vor einem Wiederholungsvergleich.
#   {marker}  Name der gesuchten Markierung.
#   {material}  Minecraft-Material des untersuchten Blocks.
#   {maxScale}  Größter zulässiger Objektmaßstab nach Begrenzung des gewünschten Maßstabs.
#   {maxX}  Obere X-Grenze des angezeigten Chunkbereichs.
#   {maxY}  Obere Grenze des Höhenbereichs der Welt.
#   {maxZ}  Obere Z-Grenze des angezeigten Chunkbereichs.
#   {maximum}  Maximale Eingabelänge oder maximale Entitätsgesundheit, je nach Nachricht.
#   {mcmeta}  Pfad der Datei pack.mcmeta des erzeugten Datenpakets.
#   {message}  Ausführlicher Status- oder Fehlertext der Operation.
#   {method}  Ausgewählte Vorgenerierungsmethode.
#   {minX}  Untere X-Grenze des angezeigten Chunkbereichs.
#   {minY}  Untere Grenze des Höhenbereichs der Welt.
#   {minZ}  Untere Z-Grenze des angezeigten Chunkbereichs.
#   {minutes}  Minutenanteil der formatierten Dauer.
#   {mismatches}  Anzahl der von der gespeicherten Referenz abweichenden Chunks.
#   {mode}  Ausgewählter Import-, Generierungs- oder Vorschaumodus.
#   {modeNote}  Optionale Erklärung des gewählten Vorgenerierungsmodus.
#   {name}  Name der in der Nachricht genannten Welt, des Objekts, Projekts oder Eintrags.
#   {nameRaw}  Name genau wie eingegeben, vor Normalisierung oder Validierung.
#   {normalized}  Normalisierter Name des nicht gefundenen Hilfeabschnitts.
#   {num}  Formatierter Klammerteil einer Engine-Zeitmessungsbezeichnung; nicht zwingend eine Zahl.
#   {object}  Name oder Kennung des bearbeiteten oder untersuchten Iris-Objekts.
#   {objects}  Objektliste oder Objektzahl des untersuchten Chunks.
#   {offset}  Vertikaler Abstand zur Geländeoberfläche, in Blöcken.
#   {output}  Pfad der Ausgabedatei, die nicht geschrieben werden konnte.
#   {overall}  Durchschnittliche Vorgenerierungsrate in Chunks pro Sekunde über die gesamte Operation.
#   {ownerName}  Name des Spielers, dem die Studio-Sitzung gehört.
#   {pack}  Name oder Kennung des an der Operation beteiligten Iris-Packs.
#   {pack2}  In einem vorgeschlagenen Befehl oder einer Downloadquelle wiederholte Packkennung.
#   {packDimension}  Aus dem Pack ausgewählte Dimensionsdefinition.
#   {packLogical}  Von der Dimensionsdefinition des Packs angeforderte logische Höhe.
#   {packMax}  Vom Pack angeforderte obere Höhengrenze.
#   {packMin}  Vom Pack angeforderte untere Höhengrenze.
#   {packName}  Anzeigename des Packs, das validiert wird.
#   {parameter}  Fehlender oder nicht lesbarer Befehlsparameter.
#   {parent}  Anzeigename des übergeordneten Menüs oder Befehlspfads.
#   {path}  Pfad der gespeicherten, geöffneten oder gemeldeten Datei.
#   {percent}  Fortschritt in Prozent; das Prozentzeichen der Nachricht bleibt außerhalb der Variable.
#   {permission}  Berechtigungsknoten für die gewünschte Aktion.
#   {personal}  Gespeicherte persönliche Sprachkennung des Spielers.
#   {phase}  Name der aktuellen Lade- oder Downloadphase.
#   {pinned}  Anzahl der bei der Reparatur eines Baumobjekts fixierten Laubblöcke.
#   {player}  Name des verfolgten oder ausgewählten Spielers.
#   {plugin}  Anzeigename des Plugins; bei Iris-Nachrichten für Sprache und Diagnose ist dies Iris.
#   {position}  Nummer der Auswahlecke, die gesetzt wird.
#   {preset}  Registrierte Weltgenerierungsvorlage der Hauptwelt.
#   {primary}  Kennung der konfigurierten Hauptwelt.
#   {processed}  Anzahl verarbeiteter Elemente einschließlich erfolgreicher, übersprungener und fehlgeschlagener.
#   {properties}  Formatierte Eigenschaftsliste des untersuchten Blocks.
#   {quarantinePath}  Ordner mit den bei der Bereinigung isolierten Dateien.
#   {queued}  Anzahl der wartenden Arbeitsprozesse oder Arbeitseinheiten.
#   {radius}  Im vorgeschlagenen Startbefehl wiederholter Vorgenerierungsradius.
#   {rarity}  Konfigurierter Seltenheitswert der genannten Region oder Platzierung.
#   {rate}  Formatierte Übertragungs- oder Vorgenerierungsrate; die Nachricht ergänzt den Zusatz pro Sekunde.
#   {reach}  Konfigurierte Reichweite der Astsuche bei der Baumreparatur.
#   {ready}  Anzahl derzeit verfügbarer exakter Atlas-Seiten.
#   {reason}  Erklärung, warum die gewünschte Aktion nicht abgeschlossen werden konnte.
#   {region}  Name oder Kennung der untersuchten Region.
#   {remaining}  Anzahl zusätzlicher, in der angezeigten Liste ausgelassener Blockzustände.
#   {repository}  Repository oder heruntergeladenes Archiv, das entpackt wird.
#   {reverted}  Anzahl rückgängig gemachter Objekteinfügungen.
#   {rotation}  Auf das platzierte Objekt angewendete Drehung.
#   {rx}  X-Koordinate des Chunks, dessen Hash berechnet wird.
#   {rz}  Z-Koordinate des Chunks, dessen Hash berechnet wird.
#   {s}  Name des neuen Studio-Projekts.
#   {safeName}  Bereinigter Dateiname des importierten Objekts.
#   {scale}  Anzahl der Weltblöcke, die ein Vorschaupixel darstellt.
#   {scope}  In Object Studio geöffnetes Objekt oder geöffnete Objektgruppe.
#   {searchRadius}  Suchradius der Strukturüberprüfung, in Chunks.
#   {seconds}  Sekundenanteil einer Dauer oder Zeit seit der letzten Aktualisierung.
#   {section}  Vom Nutzer angeforderter Hilfeabschnitt.
