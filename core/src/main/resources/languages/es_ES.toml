# === Iris language guide ===
# Iris - es_ES
#
# === Editar el archivo ===
# languages/es_ES.toml
# Puede editar este archivo directamente. Los cambios locales se conservan; las entradas ausentes o no válidas usan el inglés incorporado.
# /iris language server edit es_ES
#

# === Prefijo y ejemplo ===
# Iris no tiene un prefijo global de idioma. Un prefijo escrito en un mensaje solo afecta a ese mensaje.
# La etiqueta del plugin en la consola y los temas de los menús y la ayuda se configuran por separado.
# Ejemplo: edita set_debug en la sección existente [iris.bukkit.commandiris]:
# [iris.bukkit.commandiris]
# set_debug = "&6[Mundos]&r &aDepuración ajustada a: {to}"
# Solo este mensaje de depuración recibe el prefijo [Mundos]. {to} se sustituye por true (activado) o false (desactivado).
#
# === Colores y formato ===
# Colores clásicos: &0 negro, &1 azul oscuro, &2 verde oscuro, &3 turquesa oscuro,
# &4 rojo oscuro, &5 morado oscuro, &6 dorado, &7 gris, &8 gris oscuro,
# &9 azul, &a verde, &b turquesa, &c rojo, &d morado claro, &e amarillo, &f blanco.
# Estilos: &k ofuscado, &l negrita, &m tachado, &n subrayado, &o cursiva, &r restablecer.
# El procesamiento del idioma acepta RGB en las formas &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B y [RRGGBB].
# Los temas de Bukkit aplicados después pueden alterar los colores RGB. Las vistas modded y de texto sin formato usan sus propios estilos.
# En cadenas TOML entre comillas dobles, \n representa un salto de línea, \" unas comillas y \\ una barra inversa literal.
#
# === Variables ===
# Usa solo los marcadores que ya aparecen en cada mensaje y conserva sus nombres.
# PC, SC y TC no son variables de tema de Iris. Este glosario no permite añadir marcadores a otros mensajes.
#   {MAXAUTOSELECTVOLUME}  Número máximo de bloques de un objeto seleccionado automáticamente.
#   {MAXSAVEVOLUME}  Número máximo de bloques de una selección de objeto guardada.
#   {MAXSPAN}  Anchura, altura o profundidad máxima de una estructura al capturarla, en bloques.
#   {NATIVESTRUCTURELOCATERADIUS}  Radio máximo de búsqueda de estructuras nativas, en chunks.
#   {ROOTPERMISSION}  Permiso raíz necesario para usar el comando.
#   {WORKSPACENAME}  Nombre de la carpeta de trabajo de Studio que se busca.
#   {WORLDPACKNAME}  Nombre del datapack generado para el mundo.
#   {active}  Número de tareas de trabajo en ejecución.
#   {activeLocale}  Idioma que permanece activo si no se puede seleccionar el solicitado.
#   {activeMax}  Límite superior del intervalo de alturas del tipo de dimensión cargado.
#   {activeMin}  Límite inferior del intervalo de alturas del tipo de dimensión cargado.
#   {actualReverts}  Número de pegados de objetos que se han deshecho realmente.
#   {afb}  Parte con formato de una etiqueta de tiempos del motor situada después del fragmento entre corchetes.
#   {after}  Valor tras el cambio o bloques del árbol que siguen siendo inaccesibles tras la reparación.
#   {amount}  Cantidad correspondiente a la entrada indicada en el informe.
#   {applied}  Número de chunks cuyo trabajo ya se ha aplicado.
#   {argument}  Argumento del comando que no se ha podido aceptar.
#   {available}  Número de estructuras nativas aptas para generarse.
#   {bar}  Texto de la barra de progreso ya formateado.
#   {befb}  Parte con formato de una etiqueta de tiempos del motor situada antes del fragmento entre corchetes.
#   {before}  Valor anterior al cambio o bloques del árbol inaccesibles antes de repararlo.
#   {biome}  Nombre o identificador del bioma mostrado.
#   {block}  Tipo o descripción del bloque inspeccionado.
#   {blockX}  Coordenada X del bloque o del destino de teletransporte.
#   {blockY}  Coordenada Y del bloque o del destino de teletransporte.
#   {blockZ}  Coordenada Z del bloque o del destino de teletransporte.
#   {blocking}  Número de errores de validación que impiden cargar el pack.
#   {blocks}  Número de variantes de bloque del grupo importado.
#   {bpp}  Bloques del mundo representados por un píxel en Vision.
#   {branches}  Número de ramas añadidas al reparar objetos de árbol.
#   {broken}  Número de packs que no han superado la validación.
#   {brokenTotal}  Número total de packs que no han superado la validación.
#   {cave}  Bioma o descripción de la cueva en la posición inspeccionada.
#   {centerX}  Coordenada X del centro del área; la unidad depende del mensaje de la operación.
#   {centerZ}  Coordenada Z del centro del área; la unidad depende del mensaje de la operación.
#   {changed}  Número de objetos procesados que se han modificado.
#   {chunk}  Coordenadas o etiqueta identificativa del chunk indicado.
#   {chunkX}  Coordenada X medida en chunks, no en bloques.
#   {chunkZ}  Coordenada Z medida en chunks, no en bloques.
#   {chunks}  Número de chunks incluidos en la operación.
#   {clampedY}  Coordenada Y de destino tras ajustarla al intervalo de alturas permitido.
#   {command}  Nombre del comando o comando completo que se debe ejecutar.
#   {converted}  Número de bloques de hojas convertidos en madera al reparar árboles.
#   {count}  Número de entradas, mensajes o jugadores indicados por el texto que lo rodea.
#   {current}  Progreso actual o número de chunks de la comparación actual.
#   {currentStage}  Nombre de la fase actual de carga de Studio.
#   {d}  Profundidad del objeto en bloques.
#   {depth}  Número de bloques por debajo de la superficie del terreno.
#   {derivative}  Derivación o variante asociada al bioma de superficie.
#   {detail}  Descripción adicional del objeto inspeccionado o de la fase actual.
#   {diffs}  Número de diferencias detectadas entre los resultados generados.
#   {dimKey}  Identificador de la dimensión que se está empaquetando.
#   {dimension}  Nombre o identificador de la dimensión a la que se refiere el mensaje.
#   {dimensionId}  Identificador registrado de la dimensión cargada o solicitada.
#   {dimensionId2}  Identificador de dimensión repetido en el comando de borrado sugerido.
#   {dimm}  Identificador de la dimensión de Studio o nombre de su pack en el comando de validación.
#   {disabled}  Número de estructuras nativas cuya generación está desactivada.
#   {distances}  Número de valores de distancia de hojas modificados al reparar árboles.
#   {done}  Número de elementos de trabajo completados hasta ahora.
#   {downloadSource}  Fuente o referencia seleccionada para descargar el pack.
#   {downloadable}  Pack o proyecto descargable que se está importando.
#   {dumpPath}  Ubicación de los datos guardados de limpieza o restauración.
#   {duration}  Duración de la operación con formato.
#   {e}  Texto de la excepción de una búsqueda fallida de plantillas de estructuras.
#   {elapsed}  Tiempo transcurrido desde el inicio de la operación, con formato.
#   {engines}  Número de motores de generación o dimensiones de Iris activos.
#   {entity}  Tipo de entidad seleccionado por el generador de entidades inspeccionado.
#   {error}  Detalles del error ocurrido.
#   {errorMessage}  Sufijo opcional con detalles del error añadido al mensaje principal de fallo.
#   {eta}  Tiempo restante estimado con formato; algunos mensajes incluyen también su etiqueta.
#   {failed}  Número de elementos fallidos o sufijo de fallo preparado para los títulos de progreso.
#   {failure}  Motivo del fallo de la búsqueda u operación.
#   {failures}  Número de trabajos fallidos o resumen opcional de fallos con formato.
#   {file}  Nombre o ruta del archivo implicado en la operación.
#   {filter}  Texto usado para filtrar la lista de dimensiones de Iris.
#   {fps}  Velocidad actual de renderizado de la vista previa, en fotogramas por segundo.
#   {g}  Archivos de objetos escritos desde el informe de progreso anterior del empaquetado.
#   {generated}  Número de chunks generados hasta ahora.
#   {generator}  Nombre del generador de ruido mostrado en el explorador.
#   {generatorKey}  Identificador solicitado del generador de ruido.
#   {get}  Número de archivos de esquemas convertidos correctamente.
#   {golden}  Número de chunks de la comparación de referencia guardada.
#   {goldenDimension}  Identificador de dimensión guardado en la captura de referencia.
#   {goldenSeed}  Semilla del mundo guardada en la captura de referencia.
#   {goldenVersion}  Versión de Minecraft usada para crear la captura de referencia.
#   {group}  Grupo de mensajes del editor de idiomas o categoría de un objeto importado.
#   {guiNote}  Nota opcional sobre la ventana de progreso de la pregeneración.
#   {h}  Altura del objeto en bloques.
#   {hash}  Suma de comprobación combinada de los chunks generados que se comparan.
#   {health}  Salud actual de la entidad inspeccionada.
#   {height}  Altura del terreno, altura total o altura del área mostrada, según el mensaje.
#   {hours}  Componente de horas de la duración formateada.
#   {i}  Nombre visible del motor o entrada de la plantilla de lista de comandos.
#   {id}  ID de registro del bioma inspeccionado.
#   {imported}  Número de estructuras u objetos importados correctamente.
#   {includeNonJigsaw}  Indica si la importación incluye estructuras que no usan piezas jigsaw.
#   {iris}  Número de dimensiones cargadas que usan la generación de Iris.
#   {irisLevels}  Número de dimensiones de Iris cargadas cuyas alturas se han contrastado con el pack.
#   {irisPlaced}  Número de estructuras colocadas por Iris en lugar de la generación nativa.
#   {job}  Nombre de la operación en segundo plano que ha finalizado.
#   {k}  Clave de carga de la región en el informe de distribución de regiones.
#   {key}  Identificador del parámetro, mensaje o recurso indicado por el texto que lo rodea.
#   {key2}  Identificador de estructura repetido en el comando de localización sugerido.
#   {keyString}  Identificador de la estructura o recurso importado o marcado como no válido.
#   {label}  Nombre visible del objetivo localizado.
#   {line}  Número de línea en el editor de idiomas.
#   {locale}  Identificador de idioma, como en_US o de_DE.
#   {logicalWorldName}  Nombre lógico del mundo al que se dirige el comando.
#   {loot}  Identificador de la tabla de botín inspeccionada.
#   {m}  Mensaje adicional de evacuación o texto de parámetros ignorados en esa plantilla de comando.
#   {mantleStatus}  Resultado de restablecer los datos de generación antes de comparar una generación repetida.
#   {marker}  Nombre del marcador que se busca.
#   {material}  Material de Minecraft del bloque inspeccionado.
#   {maxScale}  Escala máxima permitida del objeto tras limitar la escala solicitada.
#   {maxX}  Límite superior X del intervalo de chunks mostrado.
#   {maxY}  Límite superior del intervalo de alturas del mundo.
#   {maxZ}  Límite superior Z del intervalo de chunks mostrado.
#   {maximum}  Longitud máxima de entrada o salud máxima de la entidad, según el mensaje.
#   {mcmeta}  Ruta del archivo pack.mcmeta del datapack generado.
#   {message}  Texto detallado de estado o error proporcionado por la operación.
#   {method}  Método de pregeneración seleccionado.
#   {minX}  Límite inferior X del intervalo de chunks mostrado.
#   {minY}  Límite inferior del intervalo de alturas del mundo.
#   {minZ}  Límite inferior Z del intervalo de chunks mostrado.
#   {minutes}  Componente de minutos de la duración formateada.
#   {mismatches}  Número de chunks que difieren de la referencia guardada.
#   {mode}  Modo seleccionado de importación, generación o vista previa.
#   {modeNote}  Explicación opcional del modo de pregeneración seleccionado.
#   {name}  Nombre del mundo, objeto, proyecto o entrada indicado en el mensaje.
#   {nameRaw}  Nombre tal como se introdujo, antes de normalizarlo o validarlo.
#   {normalized}  Nombre normalizado de la sección de ayuda que no se ha encontrado.
#   {num}  Fragmento entre corchetes con formato de una etiqueta de tiempos del motor; no tiene por qué ser un número.
#   {object}  Nombre o identificador del objeto de Iris que se edita o inspecciona.
#   {objects}  Lista o número de objetos del chunk inspeccionado.
#   {offset}  Distancia vertical respecto a la superficie del terreno, en bloques.
#   {output}  Ruta del archivo de salida que no se ha podido escribir.
#   {overall}  Media de chunks pregenerados por segundo durante toda la operación.
#   {ownerName}  Nombre del jugador propietario de la sesión de Studio.
#   {pack}  Nombre o identificador del pack de Iris implicado en la operación.
#   {pack2}  Identificador de pack repetido en un comando sugerido o una fuente de descarga.
#   {packDimension}  Definición de dimensión seleccionada del pack.
#   {packLogical}  Altura lógica solicitada por la definición de dimensión del pack.
#   {packMax}  Límite superior de altura solicitado por el pack.
#   {packMin}  Límite inferior de altura solicitado por el pack.
#   {packName}  Nombre visible del pack que se está validando.
#   {parameter}  Parámetro del comando que falta o no se puede interpretar.
#   {parent}  Nombre visible del menú o ruta de comandos superior.
#   {path}  Ruta del archivo que se guarda, abre o indica.
#   {percent}  Porcentaje de progreso; mantén el signo de porcentaje del mensaje fuera de la variable.
#   {permission}  Nodo de permiso necesario para la acción solicitada.
#   {personal}  Identificador de idioma personal guardado para el jugador.
#   {phase}  Nombre de la fase actual de carga o descarga.
#   {pinned}  Número de bloques de hojas fijados al reparar un objeto de árbol.
#   {player}  Nombre del jugador seguido o seleccionado como objetivo.
#   {plugin}  Nombre visible del plugin; es Iris en sus mensajes compartidos de idioma y diagnóstico.
#   {position}  Número de la esquina de selección que se establece.
#   {preset}  Preajuste registrado de generación usado para el mundo principal.
#   {primary}  Identificador del mundo principal configurado.
#   {processed}  Número de elementos procesados, incluidos los completados, omitidos y fallidos.
#   {properties}  Lista formateada de propiedades del bloque inspeccionado.
#   {quarantinePath}  Carpeta que contiene los archivos de limpieza puestos en cuarentena.
#   {queued}  Número de tareas o elementos de trabajo que esperan ejecutarse.
#   {radius}  Radio de pregeneración repetido en el comando de inicio sugerido.
#   {rarity}  Valor de rareza configurado de la región o colocación indicada.
#   {rate}  Tasa formateada de transferencia o pregeneración; el mensaje añade el sufijo por segundo.
#   {reach}  Alcance configurado de búsqueda de ramas al reparar objetos de árbol.
#   {ready}  Número de páginas exactas del Atlas disponibles actualmente.
#   {reason}  Explicación de por qué no se ha podido completar la acción solicitada.
#   {region}  Nombre o identificador de la región inspeccionada.
#   {remaining}  Número de estados de bloque adicionales omitidos de la lista mostrada.
#   {repository}  Repositorio o archivo descargado que se está descomprimiendo.
#   {reverted}  Número de pegados de objetos deshechos.
#   {rotation}  Rotación aplicada al objeto colocado.
#   {rx}  Coordenada X del chunk del que se calcula el hash.
#   {rz}  Coordenada Z del chunk del que se calcula el hash.
#   {s}  Nombre del nuevo proyecto de Studio.
#   {safeName}  Nombre de archivo saneado usado para el objeto importado.
#   {scale}  Bloques del mundo representados por un píxel de vista previa.
#   {scope}  Objeto o grupo de objetos abierto en Object Studio.
#   {searchRadius}  Radio de búsqueda para verificar estructuras, en chunks.
#   {seconds}  Componente de segundos de una duración o tiempo desde la última actualización.
#   {section}  Nombre de la sección de ayuda solicitada por el usuario.
#   {seed}  Semilla usada para el mundo, sesión de Studio, generador o comparación de referencia.
#   {seedRaw}  Semilla tal como se introdujo, antes de validarla.
#   {sixtySecond}  Chunks pregenerados por segundo en el intervalo de 60 segundos.
#   {size}  Número de archivos, advertencias, entradas o elementos indicados en el mensaje.
#   {skipped}  Número de elementos omitidos por la operación.
#   {slope}  Pendiente del terreno en la posición inspeccionada.
#   {solidBlocks}  Número de bloques sólidos contados al calcular el hash de la generación.
#   {source}  Pack, fuente de descarga o entrada asociada a la indicación de progreso.
#   {speed}  Velocidad formateada de pregeneración o procesamiento por segundo.
#   {stage}  Nombre de la fase actual de progreso.
#   {state}  Estado actual o valor de propiedad indicado en el mensaje.
#   {status}  Texto de estado actual de la vista previa.
#   {structure}  Nombre o identificador de la estructura que se busca.
#   {structureKey}  Identificador de registro o del pack de la estructura solicitada.
#   {summary}  Resultados formateados de la operación completada.
#   {suppressed}  Número de estructuras nativas sustituidas por colocaciones de Iris.
#   {surface}  Coordenada Y de la superficie usada en el comando de teletransporte sugerido.
#   {surfaceY}  Coordenada Y de la superficie del terreno en la posición inspeccionada.
#   {tag}  Etiqueta formateada del estado de validación situada antes del nombre del pack.
#   {target}  Destinatario del idioma u objetivo de selección de objetos indicado en el mensaje.
#   {targetX}  Coordenada X del destino localizado o solicitado.
#   {targetZ}  Coordenada Z del destino localizado o solicitado.
#   {template}  Plantilla seleccionada al crear un proyecto.
#   {tenSecond}  Chunks pregenerados por segundo en el intervalo de 10 segundos.
#   {thirtySecond}  Chunks pregenerados por segundo en el intervalo de 30 segundos.
#   {threads}  Número de hilos de trabajo usados para calcular el hash de la generación.
#   {tileNote}  Nota opcional sobre datos de entidades de bloque guardados o colocados.
#   {title}  Título de la operación cuyo resultado se muestra.
#   {to}  Nuevo ajuste de depuración: true para activado, false para desactivado.
#   {token}  Argumento de alcance que no se ha podido interpretar.
#   {total}  Número total de elementos de trabajo, chunks, dimensiones o entradas indicados en el mensaje.
#   {totalObjects}  Número de objetos abiertos en Object Studio.
#   {transferred}  Cantidad formateada de datos transferidos hasta ahora.
#   {type}  Tipo de parámetro esperado, tipo de recurso o categoría de objeto indicado en el mensaje.
#   {typeKey}  Identificador registrado del tipo de dimensión de Minecraft, o inline.
#   {unreachableBiomes}  Número de estructuras nativas excluidas por los biomas elegidos en el pack.
#   {unsupported}  Número de estructuras nativas que esta plataforma indica como no compatibles.
#   {updates}  Actualizaciones de bloques por segundo en la vista de desarrollo.
#   {url}  Dirección web para abrir o copiar.
#   {usage}  Sintaxis del comando o texto de uso de memoria en la vista de memoria.
#   {used}  Cantidad formateada de memoria usada en la vista de memoria.
#   {value}  Valor específico del mensaje, como un ajuste predeterminado, nombre, coordenada, cantidad o error. Consulta el texto que lo rodea.
#   {value2}  Segundo valor específico del mensaje, como el total de chunks, la Y de destino, un nombre de pack o un error. Consulta el texto que lo rodea.
#   {value3}  Tercer valor específico del mensaje, como un porcentaje, la Z de destino, la versión de Minecraft o el tiempo transcurrido.
#   {value4}  Cuarto valor específico del mensaje, como escrituras de bloques, coordenada Z de una selección o un sufijo de estado opcional.
#   {value5}  Quinto valor específico del mensaje: escrituras de bloques que no son aire al colocar objetos, o Z del chunk en la plantilla de posición.
#   {variables}  Lista de marcadores disponibles para el mensaje que se edita.
#   {velocity}  Velocidad de movimiento actual de la entidad inspeccionada.
#   {version}  Versión del plugin o de Minecraft indicada por el mensaje.
#   {volume}  Número de bloques contenidos en la selección del objeto.
#   {w}  Anchura del objeto en bloques.
#   {wantVariants}  Variantes solicitadas por cada característica de árbol u objeto de vanilla importada.
#   {warnings}  Número de advertencias de validación que no bloquean la carga.
#   {width}  Anchura del área del mundo mostrada, en bloques.
#   {wood}  Número de bloques de madera añadidos al reparar un objeto de árbol.
#   {world}  Nombre del mundo al que se refiere el comando o la indicación de progreso.
#   {written}  Número de variantes importadas o archivos de objetos escritos correctamente.
#   {x}  Coordenada X en el contexto de bloques, chunks, regiones o vista previa indicado por el mensaje.
#   {y}  Coordenada vertical del mundo o del bloque.
#   {z}  Coordenada Z en el contexto de bloques, chunks, regiones o vista previa indicado por el mensaje.
#   {zoom}  Nivel de zoom actual de la vista previa.
# === End Iris language guide ===

