# === Iris language guide ===
# Iris - fi_FI
#
# === Tiedoston muokkaus ===
# languages/fi_FI.toml
# Muokkaa tätä tiedostoa suoraan. Paikalliset viestimuutokset säilyvät; puuttuvat tai virheelliset arvot käyttävät sisäänrakennettua englantia.
# /iris language server edit fi_FI
#
# === Etuliitteet ===
# Kaikille viesteille yhteistä etuliiteasetusta ei ole. Viestin alkuun kirjoitettu etuliite muuttaa vain kyseistä viestiä.
# Lokien etuliitteet ja valikoiden teemat määritetään erikseen.
# Esimerkki: etsi osio [iris.bukkit.commandiris] ja muuta sen nykyinen set_debug-arvo:
# set_debug = "&6[Maailmat]&r &aDebug-asetuksen arvo: {to}"
# {to} saa arvon true (käytössä) tai false (pois käytöstä); älä muuta muuttujan nimeä.
#
# === Värit ja tyylit ===
# &0 musta; &1 tummansininen; &2 tummanvihreä; &3 tumma turkoosi
# &4 tummanpunainen; &5 tummanvioletti; &6 kulta; &7 harmaa
# &8 tummanharmaa; &9 sininen; &a vihreä; &b turkoosi
# &c punainen; &d vaaleanvioletti; &e keltainen; &f valkoinen
# &k sekoitetut merkit; &l lihavointi; &m yliviivaus; &n alleviivaus; &o kursiivi; &r värin ja tyylien nollaus
# Esimerkit: &aValmis&r, &cVirhe&r, &6&lVaroitus&r, &nAlleviivattu&r.
# Kielikerros tunnistaa RGB-muodot: &#55FF55, &x55FF55, &x&5&5&F&F&5&5 ja [55FF55].
# RGB-esimerkki: &#55FF55Vihreä teksti&r. Bukkitin myöhempi käsittely ja teemat voivat muuttaa RGB-värejä.
# Modattujen palvelinten komennot, ohjeet ja asiakasnäkymät käyttävät tavallista käännettyä tekstiä ja omia natiivityylejään.
# Tavallinen tekstinäyttö poistaa muotoilun; kielitiedoston värien ei pidä olettaa määräävän käyttöliittymän omaa tyyliä.
#
# === TOML-tekstiarvot ===
# Kaksoislainausmerkkien sisällä \n tekee rivinvaihdon, \" lisää lainausmerkin ja \\ lisää yhden kenoviivan.
# Esimerkki: "Rivi 1\nRivi 2: \"lainaus\"; polku C:\\Iris".
#
# === Muuttujat ===
# Käytä vain kyseisen viestin nykyisiä muuttujia. Säilytä niiden nimet ja kirjainkoko; PC, SC ja TC eivät ole tuettuja paikkamerkkejä.
# Alla kuvataan jokainen paikkamerkki. Ympäröivä viesti määrää yleiskäyttöisten arvojen merkityksen.
