#   {MAXSPAN}  Rakenteen suurin sallittu leveys, korkeus tai syvyys lohkoina tallennuksessa.
#   {NATIVESTRUCTURELOCATERADIUS}  Natiivirakenteiden suurin hakusäde chunkeissa.
