# === Iris language guide ===
# Iris - fr_FR
#
# === Modifier le fichier ===
# languages/fr_FR.toml
# Ce fichier peut être modifié directement. Les modifications locales sont conservées ; les entrées manquantes ou invalides utilisent l’anglais intégré.
# /iris language server edit fr_FR
#

# === Préfixe et exemple ===
# Iris n’a pas de préfixe global pour les langues. Un préfixe écrit dans un message ne s’applique qu’à ce message.
# L’étiquette du plugin dans la console et les thèmes des menus et de l’aide sont définis séparément.
# Exemple : modifier set_debug dans la section existante [iris.bukkit.commandiris] :
# [iris.bukkit.commandiris]
# set_debug = "&6[Mondes]&r &aDébogage réglé sur : {to}"
# Seul ce message de débogage reçoit le préfixe [Mondes]. {to} est remplacé par true (activé) ou false (désactivé).
#
# === Couleurs et mise en forme ===
# Couleurs classiques : &0 noir, &1 bleu foncé, &2 vert foncé, &3 turquoise foncé,
# &4 rouge foncé, &5 violet foncé, &6 or, &7 gris, &8 gris foncé,
# &9 bleu, &a vert, &b turquoise, &c rouge, &d violet clair, &e jaune, &f blanc.
# Styles : &k obfusqué, &l gras, &m barré, &n souligné, &o italique, &r réinitialisation.
# Le traitement des langues accepte les couleurs RGB sous les formes &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B et [RRGGBB].
# Les thèmes Bukkit appliqués ensuite peuvent modifier les couleurs RGB. Les affichages moddés ou en texte brut utilisent leurs propres styles.
# Dans les chaînes TOML entre guillemets doubles, \n représente un saut de ligne, \" un guillemet et \\ une barre oblique inverse littérale.
#
# === Variables ===
# Utiliser uniquement les variables déjà présentes dans chaque message, sans modifier leurs noms.
# PC, SC et TC ne sont pas des variables de thème Iris. Ce glossaire n’autorise pas l’ajout de variables dans d’autres messages.
#   {MAXAUTOSELECTVOLUME}  Nombre maximal de blocs d’un objet sélectionné automatiquement.
#   {MAXSAVEVOLUME}  Nombre maximal de blocs d’une sélection d’objet enregistrée.
#   {MAXSPAN}  Largeur, hauteur ou profondeur maximale d’une structure lors de la capture, en blocs.
#   {NATIVESTRUCTURELOCATERADIUS}  Rayon maximal de recherche des structures natives, en chunks.
#   {ROOTPERMISSION}  Permission racine nécessaire pour utiliser la commande.
#   {WORKSPACENAME}  Nom du dossier de travail Studio recherché.
#   {WORLDPACKNAME}  Nom du datapack généré pour le monde.
#   {active}  Nombre de tâches de traitement en cours.
#   {activeLocale}  Langue qui reste active lorsque la langue demandée ne peut pas être sélectionnée.
#   {activeMax}  Limite supérieure de la plage de hauteur du type de dimension chargé.
#   {activeMin}  Limite inférieure de la plage de hauteur du type de dimension chargé.
#   {actualReverts}  Nombre de collages d’objets effectivement annulés.
#   {afb}  Partie mise en forme d’un libellé de mesure du moteur, après le passage entre crochets.
#   {after}  Valeur après modification ou blocs d’arbre restant inaccessibles après réparation.
#   {amount}  Quantité associée à l’entrée indiquée dans le rapport.
#   {applied}  Nombre de chunks dont le résultat du traitement a été appliqué.
#   {argument}  Argument de commande qui n’a pas pu être accepté.
#   {available}  Nombre de structures natives pouvant être générées.
#   {bar}  Texte déjà mis en forme de la barre de progression.
#   {befb}  Partie mise en forme d’un libellé de mesure du moteur, avant le passage entre crochets.
#   {before}  Valeur avant modification ou blocs d’arbre inaccessibles avant réparation.
#   {biome}  Nom ou identifiant du biome affiché.
#   {block}  Type ou description du bloc inspecté.
#   {blockX}  Coordonnée X du bloc ou de la destination de téléportation.
#   {blockY}  Coordonnée Y du bloc ou de la destination de téléportation.
#   {blockZ}  Coordonnée Z du bloc ou de la destination de téléportation.
#   {blocking}  Nombre d’erreurs de validation empêchant le chargement du pack.
#   {blocks}  Nombre de variantes de blocs dans le groupe importé.
#   {bpp}  Nombre de blocs du monde représentés par un pixel dans Vision.
#   {branches}  Nombre de branches ajoutées pendant la réparation d’objets d’arbre.
#   {broken}  Nombre de packs ayant échoué à la validation.
#   {brokenTotal}  Nombre total de packs ayant échoué à la validation.
#   {cave}  Biome ou description de la grotte à la position inspectée.
#   {centerX}  Coordonnée X du centre de la zone ; l’unité dépend du message de l’opération.
#   {centerZ}  Coordonnée Z du centre de la zone ; l’unité dépend du message de l’opération.
#   {changed}  Nombre d’objets traités qui ont été modifiés.
#   {chunk}  Coordonnées ou libellé identifiant le chunk signalé.
#   {chunkX}  Coordonnée X exprimée en chunks, et non en blocs.
#   {chunkZ}  Coordonnée Z exprimée en chunks, et non en blocs.
#   {chunks}  Nombre de chunks inclus dans l’opération.
#   {clampedY}  Coordonnée Y de destination après ajustement à la plage de hauteur autorisée.
#   {command}  Nom de la commande ou commande complète à exécuter.
#   {converted}  Nombre de blocs de feuilles convertis en bois pendant la réparation des arbres.
#   {count}  Nombre d’entrées, de messages ou de joueurs désignés par le texte environnant.
#   {current}  Progression actuelle ou nombre de chunks de la comparaison en cours.
#   {currentStage}  Nom de l’étape actuelle de chargement de Studio.
#   {d}  Profondeur de l’objet en blocs.
#   {depth}  Nombre de blocs sous la surface du terrain.
#   {derivative}  Biome dérivé ou variante associée au biome de surface.
#   {detail}  Description complémentaire de l’objet inspecté ou de l’étape en cours.
#   {diffs}  Nombre de différences détectées entre les résultats générés.
#   {dimKey}  Identifiant de la dimension en cours d’exportation en pack.
#   {dimension}  Nom ou identifiant de la dimension concernée par le message.
#   {dimensionId}  Identifiant enregistré de la dimension chargée ou demandée.
#   {dimensionId2}  Identifiant de dimension répété dans la commande de suppression proposée.
#   {dimm}  Identifiant de la dimension Studio, ou nom de son pack dans la commande de validation.
#   {disabled}  Nombre de structures natives dont la génération est désactivée.
#   {distances}  Nombre de valeurs de distance des feuilles modifiées pendant la réparation des arbres.
#   {done}  Nombre d’éléments de travail terminés jusqu’ici.
#   {downloadSource}  Source ou référence sélectionnée pour télécharger le pack.
#   {downloadable}  Pack ou projet téléchargeable en cours d’importation.
#   {dumpPath}  Emplacement des données enregistrées de nettoyage ou de restauration.
#   {duration}  Durée mise en forme de l’opération.
#   {e}  Texte de l’exception lors d’une recherche de modèles de structures ayant échoué.
#   {elapsed}  Temps écoulé depuis le début de l’opération, mis en forme.
#   {engines}  Nombre de moteurs de génération ou de dimensions Iris actifs.
#   {entity}  Type d’entité sélectionné par le générateur d’entités inspecté.
#   {error}  Détails de l’erreur survenue.
#   {errorMessage}  Complément facultatif sur l’erreur ajouté au message d’échec principal.
#   {eta}  Temps restant estimé mis en forme ; certains messages fournissent aussi son libellé.
#   {failed}  Nombre d’éléments en échec ou complément d’échec préparé pour les titres de progression.
#   {failure}  Raison de l’échec de la recherche ou de l’opération.
#   {failures}  Nombre de tâches en échec ou résumé facultatif et mis en forme des échecs.
#   {file}  Nom ou chemin du fichier concerné par l’opération.
#   {filter}  Texte utilisé pour filtrer la liste des dimensions Iris.
#   {fps}  Fréquence actuelle de rendu de l’aperçu, en images par seconde.
#   {g}  Fichiers d’objets écrits depuis le précédent rapport de progression de l’exportation du pack.
#   {generated}  Nombre de chunks générés jusqu’ici.
#   {generator}  Nom du générateur de bruit affiché dans l’explorateur.
#   {generatorKey}  Identifiant du générateur de bruit demandé.
#   {get}  Nombre de fichiers de schémas convertis avec succès.
#   {golden}  Nombre de chunks de la comparaison de référence enregistrée.
#   {goldenDimension}  Identifiant de dimension stocké dans la capture de référence.
#   {goldenSeed}  Graine du monde stockée dans la capture de référence.
#   {goldenVersion}  Version de Minecraft utilisée pour créer la capture de référence.
#   {group}  Groupe de messages dans l’éditeur de langue ou catégorie d’un objet importé.
#   {guiNote}  Note facultative sur la fenêtre de progression de la prégénération.
#   {h}  Hauteur de l’objet en blocs.
#   {hash}  Somme de contrôle combinée des chunks générés comparés.
#   {health}  Santé actuelle de l’entité inspectée.
#   {height}  Hauteur du terrain, hauteur totale ou hauteur de la zone affichée, selon le message.
#   {hours}  Composante en heures de la durée mise en forme.
#   {i}  Nom affiché du moteur ou entrée du modèle de liste des commandes.
#   {id}  ID de registre du biome inspecté.
#   {imported}  Nombre de structures ou d’objets importés avec succès.
#   {includeNonJigsaw}  Indique si l’importation inclut les structures sans pièces jigsaw.
#   {iris}  Nombre de dimensions chargées utilisant la génération Iris.
#   {irisLevels}  Nombre de dimensions Iris chargées dont les hauteurs sont comparées à celles du pack.
#   {irisPlaced}  Nombre de structures placées par Iris à la place de la génération native.
#   {job}  Nom de l’opération en arrière-plan terminée.
#   {k}  Clé de chargement de la région dans le rapport de répartition des régions.
#   {key}  Identifiant du paramètre, du message ou de la ressource indiqué par le texte environnant.
#   {key2}  Identifiant de structure répété dans la commande de localisation proposée.
#   {keyString}  Identifiant de la structure ou de la ressource importée ou signalée comme invalide.
#   {label}  Nom affiché de la cible localisée.
#   {line}  Numéro de ligne dans l’éditeur de langue.
#   {locale}  Identifiant de langue, par exemple en_US ou de_DE.
#   {logicalWorldName}  Nom logique du monde visé par la commande.
#   {loot}  Identifiant de la table de butin inspectée.
#   {m}  Message d’évacuation supplémentaire ou texte des paramètres ignorés dans le modèle de commande.
#   {mantleStatus}  Résultat de la réinitialisation des données de génération avant une comparaison après régénération.
#   {marker}  Nom du marqueur recherché.
#   {material}  Matériau Minecraft du bloc inspecté.
#   {maxScale}  Échelle maximale autorisée de l’objet après limitation de l’échelle demandée.
#   {maxX}  Limite supérieure X de la plage de chunks affichée.
#   {maxY}  Limite supérieure de la plage de hauteur du monde.
#   {maxZ}  Limite supérieure Z de la plage de chunks affichée.
#   {maximum}  Longueur maximale de saisie ou santé maximale de l’entité, selon le message.
#   {mcmeta}  Chemin du fichier pack.mcmeta du datapack généré.
#   {message}  Texte détaillé d’état ou d’erreur fourni par l’opération.
#   {method}  Méthode de prégénération sélectionnée.
#   {minX}  Limite inférieure X de la plage de chunks affichée.
#   {minY}  Limite inférieure de la plage de hauteur du monde.
#   {minZ}  Limite inférieure Z de la plage de chunks affichée.
#   {minutes}  Composante en minutes de la durée mise en forme.
#   {mismatches}  Nombre de chunks différents de la référence enregistrée.
#   {mode}  Mode sélectionné d’importation, de génération ou d’aperçu.
#   {modeNote}  Explication facultative du mode de prégénération sélectionné.
#   {name}  Nom du monde, de l’objet, du projet ou de l’entrée indiqué dans le message.
#   {nameRaw}  Nom tel qu’il a été saisi, avant normalisation ou validation.
#   {normalized}  Nom normalisé de la section d’aide introuvable.
#   {num}  Passage entre crochets mis en forme d’un libellé de mesure du moteur ; ce n’est pas forcément un nombre.
#   {object}  Nom ou identifiant de l’objet Iris modifié ou inspecté.
#   {objects}  Liste ou nombre d’objets du chunk inspecté.
#   {offset}  Distance verticale par rapport à la surface du terrain, en blocs.
#   {output}  Chemin du fichier de sortie qui n’a pas pu être écrit.
#   {overall}  Nombre moyen de chunks prégénérés par seconde sur l’ensemble de l’opération.
#   {ownerName}  Nom du joueur propriétaire de la session Studio.
#   {pack}  Nom ou identifiant du pack Iris concerné par l’opération.
#   {pack2}  Identifiant de pack répété dans une commande proposée ou une source de téléchargement.
#   {packDimension}  Définition de dimension sélectionnée dans le pack.
#   {packLogical}  Hauteur logique demandée par la définition de dimension du pack.
#   {packMax}  Limite supérieure de hauteur demandée par le pack.
#   {packMin}  Limite inférieure de hauteur demandée par le pack.
#   {packName}  Nom affiché du pack en cours de validation.
#   {parameter}  Paramètre de commande manquant ou impossible à interpréter.
#   {parent}  Nom affiché du menu ou du chemin de commande parent.
#   {path}  Chemin du fichier enregistré, ouvert ou signalé.
#   {percent}  Pourcentage de progression ; conserver le signe de pourcentage du message hors de la variable.
#   {permission}  Nœud de permission requis pour l’action demandée.
#   {personal}  Identifiant de langue personnel enregistré pour le joueur.
#   {phase}  Nom de la phase actuelle de chargement ou de téléchargement.
#   {pinned}  Nombre de blocs de feuilles fixés pendant la réparation d’un objet d’arbre.
#   {player}  Nom du joueur suivi ou ciblé.
#   {plugin}  Nom affiché du plugin ; Iris dans ses messages partagés de langue et de diagnostic.
#   {position}  Numéro du coin de sélection défini.
#   {preset}  Préréglage enregistré de génération utilisé pour le monde principal.
#   {primary}  Identifiant du monde principal configuré.
#   {processed}  Nombre d’éléments traités, y compris les réussites, les éléments ignorés et les échecs.
#   {properties}  Liste mise en forme des propriétés du bloc inspecté.
#   {quarantinePath}  Dossier contenant les fichiers de nettoyage mis en quarantaine.
#   {queued}  Nombre de tâches ou d’éléments de travail en attente d’exécution.
#   {radius}  Rayon de prégénération répété dans la commande de démarrage proposée.
#   {rarity}  Valeur de rareté configurée de la région ou du placement indiqué.
#   {rate}  Débit de transfert ou de prégénération mis en forme ; le message ajoute le suffixe par seconde.
#   {reach}  Portée configurée de recherche des branches pendant la réparation d’objets d’arbre.
#   {ready}  Nombre de pages exactes de l’Atlas actuellement disponibles.
#   {reason}  Explication de l’impossibilité de terminer l’action demandée.
#   {region}  Nom ou identifiant de la région inspectée.
#   {remaining}  Nombre d’états de blocs supplémentaires omis dans la liste affichée.
#   {repository}  Dépôt ou archive téléchargée en cours de décompression.
#   {reverted}  Nombre de collages d’objets annulés.
#   {rotation}  Rotation appliquée à l’objet placé.
#   {rx}  Coordonnée X du chunk dont l’empreinte est calculée.
#   {rz}  Coordonnée Z du chunk dont l’empreinte est calculée.
#   {s}  Nom du nouveau projet Studio.
#   {safeName}  Nom de fichier assaini utilisé pour l’objet importé.
#   {scale}  Nombre de blocs du monde représentés par un pixel d’aperçu.
#   {scope}  Objet ou groupe d’objets ouvert dans Object Studio.
#   {searchRadius}  Rayon de recherche pour la vérification des structures, en chunks.
#   {seconds}  Composante en secondes d’une durée ou temps depuis la dernière mise à jour.
#   {section}  Nom de la section d’aide demandée par l’utilisateur.
#   {seed}  Graine utilisée pour le monde, la session Studio, le générateur ou la comparaison de référence.
#   {seedRaw}  Graine telle qu’elle a été saisie, avant validation.
#   {sixtySecond}  Chunks prégénérés par seconde sur la fenêtre de 60 secondes.
#   {size}  Nombre de fichiers, d’avertissements, d’entrées ou d’éléments indiqués dans le message.
#   {skipped}  Nombre d’éléments ignorés par l’opération.
#   {slope}  Pente du terrain à la position inspectée.
#   {solidBlocks}  Nombre de blocs solides comptés lors du calcul de l’empreinte de génération.
#   {source}  Pack, source de téléchargement ou entrée associé à l’affichage de progression.
#   {speed}  Vitesse de prégénération ou de traitement par seconde, mise en forme.
#   {stage}  Nom de l’étape de progression en cours.
#   {state}  État actuel ou valeur de propriété indiqué par le message.
#   {status}  Texte d’état actuel de l’aperçu.
#   {structure}  Nom ou identifiant de la structure recherchée.
#   {structureKey}  Identifiant de registre ou de pack de la structure demandée.
#   {summary}  Résultats mis en forme de l’opération terminée.
#   {suppressed}  Nombre de structures natives remplacées par des placements Iris.
#   {surface}  Coordonnée Y de la surface utilisée dans la commande de téléportation proposée.
#   {surfaceY}  Coordonnée Y de la surface du terrain à la position inspectée.
#   {tag}  Libellé mis en forme de l’état de validation placé avant le nom du pack.
#   {target}  Destinataire de la langue ou cible de sélection d’objets indiqué dans le message.
#   {targetX}  Coordonnée X de la destination localisée ou demandée.
#   {targetZ}  Coordonnée Z de la destination localisée ou demandée.
#   {template}  Modèle sélectionné lors de la création d’un projet.
#   {tenSecond}  Chunks prégénérés par seconde sur la fenêtre de 10 secondes.
#   {thirtySecond}  Chunks prégénérés par seconde sur la fenêtre de 30 secondes.
#   {threads}  Nombre de threads de traitement utilisés pour calculer l’empreinte de génération.
#   {tileNote}  Note facultative sur les données d’entités de blocs enregistrées ou placées.
#   {title}  Titre de l’opération dont le résultat est affiché.
#   {to}  Nouveau réglage de débogage : true pour activé, false pour désactivé.
#   {token}  Argument de portée qui n’a pas pu être interprété.
#   {total}  Nombre total d’éléments de travail, de chunks, de dimensions ou d’entrées indiqués dans le message.
#   {totalObjects}  Nombre d’objets ouverts dans Object Studio.
#   {transferred}  Quantité mise en forme des données transférées jusqu’ici.
#   {type}  Type de paramètre attendu, type de ressource ou catégorie d’objet indiqué dans le message.
#   {typeKey}  Identifiant enregistré du type de dimension Minecraft, ou inline.
#   {unreachableBiomes}  Nombre de structures natives exclues par les choix de biomes du pack.
#   {unsupported}  Nombre de structures natives signalées comme non prises en charge par cette plateforme.
#   {updates}  Mises à jour de blocs par seconde dans l’affichage de développement.
#   {url}  Adresse web à ouvrir ou à copier.
#   {usage}  Syntaxe de commande ou texte d’utilisation mémoire dans l’affichage mémoire.
#   {used}  Quantité mise en forme de mémoire utilisée dans l’affichage mémoire.
#   {value}  Valeur propre au message : réglage par défaut, nom, coordonnée, quantité ou erreur, par exemple. Lire le texte environnant.
#   {value2}  Deuxième valeur propre au message : total de chunks, Y de destination, nom de pack ou erreur, par exemple. Lire le texte environnant.
#   {value3}  Troisième valeur propre au message : pourcentage, Z de destination, version de Minecraft ou temps écoulé, par exemple.
#   {value4}  Quatrième valeur propre au message : écritures de blocs, coordonnée Z d’une sélection ou complément d’état facultatif, par exemple.
#   {value5}  Cinquième valeur propre au message : écritures de blocs autres que l’air lors d’un placement d’objet, ou Z du chunk dans le modèle de position.
#   {variables}  Liste des variables disponibles pour le message en cours de modification.
#   {velocity}  Vitesse de déplacement actuelle de l’entité inspectée.
#   {version}  Version du plugin ou de Minecraft indiquée par le message environnant.
#   {volume}  Nombre de blocs contenus dans la sélection d’objet.
#   {w}  Largeur de l’objet en blocs.
#   {wantVariants}  Variantes demandées par fonctionnalité d’arbre ou d’objet vanilla importée.
#   {warnings}  Nombre d’avertissements de validation non bloquants.
#   {width}  Largeur de la zone du monde affichée, en blocs.
#   {wood}  Nombre de blocs de bois ajoutés pendant la réparation d’un objet d’arbre.
#   {world}  Nom du monde visé par la commande ou l’affichage de progression.
#   {written}  Nombre de variantes importées ou de fichiers d’objets écrits avec succès.
#   {x}  Coordonnée X dans le contexte de blocs, chunks, régions ou aperçu indiqué par le message.
#   {y}  Coordonnée verticale du monde ou du bloc.
#   {z}  Coordonnée Z dans le contexte de blocs, chunks, régions ou aperçu indiqué par le message.
#   {zoom}  Niveau de zoom actuel de l’aperçu.
# === End Iris language guide ===

