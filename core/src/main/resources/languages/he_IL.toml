"director.import_every_structure_vanilla_ingested_datapacks_into_this_pack_as_editable_iris" = "ייבוא של כל מבנה - vanilla וגם חבילות נתונים שנקלטו - לחבילה הזו כמשאבי Iris הניתנים לעריכה, תוך דריסה תמידית. בונה מחדש מבני jigsaw (כפרים, מאחזים, jigsaw של חבילות נתונים) כגרפי pool/piece הניתנים לעריכה, מייבא כל תבנית מבנה NBT כאובייקט, ומרכיב את המבנים מרובי התבניות (ספינות טרופות, פורטלים הרוסים, חורבות אוקיינוס, מאובני Nether). יש להריץ לאחר קליטת חבילת נתונים והפעלה מחדש. יש ליצור מחדש צ'אנקים או להשתמש בעולם חדש כדי שהעותקים המיובאים יוצבו."
"param.dimension_whose_pack_import_into" = "הממד שאל החבילה שלו יש לייבא"
"director.capture_code_generated_structures_that_have_no_nbt_template_swamp_huts_igloos" = "לכידת מבנים שנוצרים בקוד ואין להם תבנית NBT (בקתות ביצה, איגלו וכו') לאובייקטי Iris הניתנים לעריכה, על ידי יצירת כל אחד מהם בעולם זמני וקריאת הבלוקים שלו. מדלג על מבנים שכבר מיובאים כמבנה, על מבנים רחבים או גבוהים ממגבלת הלכידה (מבצרים, אחוזות ומונומנטים נשארים vanilla), ועל כל מה שלא נוצר ב-overworld שטוח. כל מבנה שנלכד הופך למבנה Iris בן חלק אחד שאפשר להציב מרשימת 'structures' של ביום/אזור/ממד. רץ אוטומטית כמעבר האחרון של /iris structure import."
