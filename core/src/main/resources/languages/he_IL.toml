# === Iris language guide ===
# Iris - he_IL
#
# === עריכת הקובץ ===
# languages/he_IL.toml
# אפשר לערוך קובץ זה ישירות. שינויים מקומיים בהודעות נשמרים; ערכים חסרים או לא תקינים משתמשים באנגלית המובנית.
# /iris language server edit he_IL
#
# === קידומות ===
# אין הגדרת קידומת כללית לכל ההודעות. קידומת שנכתבת בתחילת הודעה משנה רק אותה.
# קידומות היומן וערכות העיצוב של התפריטים מוגדרות בנפרד.
# דוגמה: מצאו את הסעיף [iris.bukkit.commandiris] ושנו בו את הערך הקיים של set_debug:
# set_debug = "&6[עולמות]&r &aמצב האבחון נקבע ל: {to}"
# {to} מקבל true להפעלה או false להשבתה; אין לשנות את שם המשתנה.
#
# === צבעים וסגנונות ===
# &0 שחור; &1 כחול כהה; &2 ירוק כהה; &3 טורקיז כהה
# &4 אדום כהה; &5 סגול כהה; &6 זהב; &7 אפור
# &8 אפור כהה; &9 כחול; &a ירוק; &b טורקיז
# &c אדום; &d סגול בהיר; &e צהוב; &f לבן
# &k תווים משובשים; &l מודגש; &m קו חוצה; &n קו תחתון; &o נטוי; &r איפוס הצבע והסגנונות
# דוגמאות: &aמוכן&r, &cשגיאה&r, &6&lאזהרה&r, &nקו תחתון&r.
# שכבת השפה מזהה את צורות RGB הבאות: &#55FF55, &x55FF55, &x&5&5&F&F&5&5 וגם [55FF55].
# דוגמת RGB: &#55FF55טקסט ירוק&r. עיבוד מאוחר יותר וערכות עיצוב של Bukkit עשויים לשנות צבעי RGB.
# פקודות, עזרה ומסכי לקוח בסביבה עם מודים משתמשים בטקסט מתורגם רגיל ובסגנונות המובנים שלהם.
# תצוגת טקסט רגיל מסירה עיצוב; צבעי קובץ השפה אינם בהכרח שולטים בסגנון הממשק.
#
# === ערכי טקסט ב-TOML ===
# בתוך מירכאות כפולות, \n יוצר שורה חדשה, \" מוסיף מירכאות ו-\\ מוסיף לוכסן הפוך אחד.
# דוגמה: "שורה 1\nשורה 2: \"ציטוט\"; נתיב C:\\Iris".
#
# === משתנים ===
# יש להשתמש רק במשתנים שכבר שייכים להודעה. שמרו על השמות ועל אותיות גדולות וקטנות; PC, SC ו-TC אינם נתמכים כמשתנים.
# בהמשך מוסברת משמעות כל משתנה. הטקסט הסמוך קובע את המשמעות של ערכים כלליים.
#   {MAXAUTOSELECTVOLUME}  מספר הבלוקים המרבי באובייקט שנבחר אוטומטית.
#   {MAXSAVEVOLUME}  מספר הבלוקים המרבי בבחירת אובייקט לשמירה.
#   {MAXSPAN}  הרוחב, הגובה או העומק המרביים של מבנה בעת לכידה, בבלוקים.
#   {NATIVESTRUCTURELOCATERADIUS}  רדיוס החיפוש המרבי למבנים מובנים, בצ'אנקים.
#   {ROOTPERMISSION}  הרשאת הבסיס הנדרשת להפעלת הפקודה.
#   {WORKSPACENAME}  שם תיקיית סביבת העבודה של Studio שבה מחפשים.
#   {WORLDPACKNAME}  שם ה-datapack של העולם שנוצר.
#   {active}  מספר העובדים הפעילים כעת.
#   {activeLocale}  השפה שנשארת פעילה אם אי אפשר לבחור בשפה המבוקשת.
#   {activeMax}  הגבול העליון של טווח הגובה בסוג הממד הטעון.
#   {activeMin}  הגבול התחתון של טווח הגובה בסוג הממד הטעון.
#   {actualReverts}  מספר הדבקות האובייקטים שבוטלו בפועל.
#   {afb}  החלק המעוצב בתווית זמני המנוע שאחרי הסוגריים המרובעים.
#   {after}  הערך לאחר השינוי, או בלוקי העץ הבלתי נגישים שנותרו אחרי תיקון.
#   {amount}  הכמות המשויכת לפריט הנקוב בדוח.
#   {applied}  מספר הצ'אנקים שהעבודה עליהם הוחלה.
#   {argument}  ארגומנט הפקודה שלא התקבל.
#   {available}  מספר המבנים המובנים הזמינים ליצירה.
#   {bar}  טקסט פס ההתקדמות, שכבר עוצב.
#   {befb}  החלק המעוצב בתווית זמני המנוע שלפני הסוגריים המרובעים.
#   {before}  הערך לפני השינוי, או בלוקי העץ הבלתי נגישים לפני תיקון.
#   {biome}  שם הביומה או המזהה שלה.
#   {block}  סוג הבלוק הנבדק או תיאורו.
#   {blockX}  קואורדינטת X של הבלוק או יעד השיגור.
#   {blockY}  קואורדינטת Y של הבלוק או יעד השיגור.
#   {blockZ}  קואורדינטת Z של הבלוק או יעד השיגור.
#   {blocking}  מספר שגיאות האימות שמונעות טעינת pack.
#   {blocks}  מספר גרסאות הבלוקים בקבוצה שיובאה.
#   {bpp}  מספר בלוקי העולם שמייצג פיקסל אחד ב-Vision.
#   {branches}  מספר הענפים שנוספו בתיקון אובייקטי עצים.
#   {broken}  מספר ה-packs שנכשלו באימות.
#   {brokenTotal}  המספר הכולל של packs שנכשלו באימות.
#   {cave}  ביומת המערה או תיאורה במיקום הנבדק.
#   {centerX}  קואורדינטת X של מרכז האזור; היחידות לפי הודעת הפעולה.
#   {centerZ}  קואורדינטת Z של מרכז האזור; היחידות לפי הודעת הפעולה.
#   {changed}  מספר האובייקטים שעובדו ושונו.
#   {chunk}  הקואורדינטות או התווית המזהה של הצ'אנק המדווח.
#   {chunkX}  קואורדינטת X בצ'אנקים, ולא בבלוקים.
#   {chunkZ}  קואורדינטת Z בצ'אנקים, ולא בבלוקים.
#   {chunks}  מספר הצ'אנקים הכלולים בפעולה.
#   {clampedY}  גובה Y של יעד השיגור לאחר התאמה לטווח המותר.
#   {command}  שם הפקודה או הפקודה המלאה להפעלה.
#   {converted}  מספר בלוקי העלים שהומרו לעץ בתיקון עצים.
#   {count}  מספר הפריטים, ההודעות או השחקנים שצוינו בטקסט הסמוך.
#   {current}  מונה ההתקדמות הנוכחי, או מספר הצ'אנקים בהשוואה הנוכחית.
#   {currentStage}  שם שלב הטעינה הנוכחי של Studio.
#   {d}  עומק האובייקט בבלוקים.
#   {depth}  מספר הבלוקים מתחת לפני השטח.
#   {derivative}  ביומה נגזרת או גרסה הקשורה לביומת פני השטח.
#   {detail}  תיאור נוסף לאובייקט הנבדק או לשלב ההתקדמות.
#   {diffs}  מספר ההבדלים שנמצאו בין תוצאות היצירה.
#   {dimKey}  מזהה הממד שנארז.
#   {dimension}  שם הממד או המזהה שלו בהודעה.
#   {dimensionId}  המזהה הרשום של הממד הטעון או המבוקש.
#   {dimensionId2}  מזהה הממד החוזר בפקודת המחיקה המוצעת.
#   {dimm}  מזהה ממד Studio, או שם ה-pack שלו בפקודת האימות.
#   {disabled}  מספר המבנים המובנים שיצירתם מושבתת.
#   {distances}  מספר ערכי מרחק העלים ששונו בתיקון עצים.
#   {done}  מספר יחידות העבודה שהושלמו עד כה.
#   {downloadSource}  מקור ההורדה או ההפניה שנבחרה להורדת ה-pack.
#   {downloadable}  ה-pack או הפרויקט להורדה שמיובא.
#   {dumpPath}  מיקום נתוני הניקוי או השחזור שנשמרו.
#   {duration}  משך הפעולה בתבנית תצוגה.
#   {e}  טקסט החריגה מסריקת תבניות מבנים שנכשלה.
#   {elapsed}  הזמן שחלף מתחילת הפעולה, בתבנית תצוגה.
#   {engines}  מספר מנועי יצירת Iris או הממדים הפעילים.
#   {entity}  סוג הישות שבחר ה-spawner הנבדק.
#   {error}  פרטי השגיאה שהתרחשה.
#   {errorMessage}  סיומת אופציונלית עם פרטי שגיאה להודעת הכשל הראשית.
#   {eta}  הזמן המשוער שנותר; בחלק מההודעות הוא כולל תווית.
#   {failed}  מספר פריטים שנכשלו, או סיומת כשל מוכנה בכותרת התקדמות.
#   {failure}  הסיבה לכישלון החיפוש או הפעולה.
#   {failures}  מספר משימות שנכשלו או סיכום כשלים מעוצב ואופציונלי.
#   {file}  שם הקובץ או הנתיב המעורב בפעולה.
#   {filter}  הטקסט לסינון רשימת ממדי Iris.
#   {fps}  קצב הצגת התצוגה המקדימה בפריימים לשנייה.
#   {g}  קובצי אובייקטים שנכתבו מאז דוח התקדמות האריזה הקודם.
#   {generated}  מספר הצ'אנקים שנוצרו עד כה.
#   {generator}  שם מחולל הרעש המוצג בסייר.
#   {generatorKey}  מזהה מחולל הרעש המבוקש.
#   {get}  מספר קובצי schematic שהומרו בהצלחה.
#   {golden}  מספר הצ'אנקים בהשוואת הייחוס השמורה.
#   {goldenDimension}  מזהה הממד שנשמר בלכידת הייחוס.
#   {goldenSeed}  זרע העולם שנשמר בלכידת הייחוס.
#   {goldenVersion}  גרסת Minecraft ששימשה ליצירת לכידת הייחוס.
#   {group}  קבוצת הודעות בעורך השפה, או קטגוריית אובייקט מיובא.
#   {guiNote}  הערה אופציונלית על חלון התקדמות היצירה מראש.
#   {h}  גובה האובייקט בבלוקים.
#   {hash}  סכום הביקורת המשולב של הצ'אנקים שנוצרו להשוואה.
#   {health}  הבריאות הנוכחית של הישות הנבדקת.
#   {height}  גובה פני השטח, הגובה הכולל או גובה האזור המוצג, לפי ההודעה.
#   {hours}  רכיב השעות במשך הזמן המוצג.
#   {i}  שם התצוגה של המנוע, או פריט בתבנית רשימת הפקודות.
#   {id}  מזהה הרישום של הביומה הנבדקת.
#   {imported}  מספר המבנים או האובייקטים שיובאו בהצלחה.
#   {includeNonJigsaw}  האם לייבא גם מבנים שאינם משתמשים בחלקי jigsaw.
#   {iris}  מספר הממדים הטעונים המשתמשים ביצירת Iris.
#   {irisLevels}  מספר ממדי Iris הטעונים שנבדקו מול גובה ה-pack.
#   {irisPlaced}  מספר המבנים שהציב Iris במקום היצירה המובנית.
#   {job}  שם פעולת הרקע שהושלמה.
#   {k}  מפתח טעינת האזור בדוח התפלגות האזורים.
#   {key}  מזהה הפרמטר, ההודעה או המשאב הנקוב בטקסט הסמוך.
#   {key2}  מזהה המבנה החוזר בפקודת האיתור המוצעת.
#   {keyString}  מזהה המבנה או המשאב שמיובא או מדווח כלא תקין.
#   {label}  שם התצוגה של היעד שאותר.
#   {line}  מספר השורה בעורך השפה.
#   {locale}  מזהה השפה, כגון en_US או de_DE.
#   {logicalWorldName}  השם הלוגי של עולם היעד של הפקודה.
#   {loot}  מזהה טבלת השלל הנבדקת.
#   {m}  הודעת פינוי נוספת, או טקסט הפרמטרים שהתעלמו מהם בתבנית הפקודה.
#   {mantleStatus}  תוצאת איפוס נתוני היצירה לפני השוואת יצירה חוזרת.
#   {marker}  שם הסמן שמחפשים.
#   {material}  חומר Minecraft של הבלוק הנבדק.
#   {maxScale}  קנה המידה המרבי של אובייקט לאחר הגבלת הערך המבוקש.
#   {maxX}  גבול X העליון של טווח הצ'אנקים המוצג.
#   {maxY}  הגבול העליון של טווח גובה העולם.
#   {maxZ}  גבול Z העליון של טווח הצ'אנקים המוצג.
#   {maximum}  אורך הקלט המרבי או בריאות הישות המרבית, לפי ההודעה.
#   {mcmeta}  נתיב קובץ pack.mcmeta של ה-datapack שנוצר.
#   {message}  טקסט מצב או שגיאה מפורט שמספקת הפעולה.
#   {method}  שיטת היצירה מראש שנבחרה.
#   {minX}  גבול X התחתון של טווח הצ'אנקים המוצג.
#   {minY}  הגבול התחתון של טווח גובה העולם.
#   {minZ}  גבול Z התחתון של טווח הצ'אנקים המוצג.
#   {minutes}  רכיב הדקות במשך הזמן המוצג.
#   {mismatches}  מספר הצ'אנקים השונים מהייחוס השמור.
#   {mode}  מצב הייבוא, היצירה או התצוגה המקדימה שנבחר.
#   {modeNote}  הסבר אופציונלי על מצב היצירה מראש שנבחר.
#   {name}  שם העולם, האובייקט, הפרויקט או הפריט המצוין בהודעה.
#   {nameRaw}  השם כפי שהוזן, לפני נרמול או אימות.
#   {normalized}  שם מדור העזרה המנורמל שלא נמצא.
#   {num}  הקטע המעוצב בסוגריים בתווית זמני המנוע; לא בהכרח מספר.
#   {object}  שם אובייקט Iris שנערך או נבדק, או המזהה שלו.
#   {objects}  רשימת האובייקטים או מספרם בצ'אנק הנבדק.
#   {offset}  מרחק אנכי מפני השטח בבלוקים.
#   {output}  נתיב קובץ הפלט שלא ניתן היה לכתוב.
#   {overall}  ממוצע צ'אנקים לשנייה בכל פעולת היצירה מראש.
#   {ownerName}  שם השחקן שבבעלותו הפעלת Studio.
#   {pack}  שם ה-pack של Iris המעורב בפעולה, או המזהה שלו.
#   {pack2}  מזהה pack החוזר בפקודה מוצעת או במקור הורדה.
#   {packDimension}  הגדרת הממד שנבחרה מתוך ה-pack.
#   {packLogical}  הגובה הלוגי שביקשה הגדרת הממד של ה-pack.
#   {packMax}  גבול הגובה העליון שביקש ה-pack.
#   {packMin}  גבול הגובה התחתון שביקש ה-pack.
#   {packName}  שם התצוגה של ה-pack הנבדק.
#   {parameter}  פרמטר פקודה שחסר או שלא ניתן לפענח.
#   {parent}  שם התצוגה של תפריט האב או נתיב הפקודה שמעל.
#   {path}  נתיב הקובץ שנשמר, נפתח או מדווח.
#   {percent}  אחוז ההתקדמות; יש להשאיר את סימן האחוז מחוץ למשתנה.
#   {permission}  ההרשאה הנדרשת לפעולה המבוקשת.
#   {personal}  מזהה השפה האישית השמורה של השחקן.
#   {phase}  שם שלב הטעינה או ההורדה הנוכחי.
#   {pinned}  מספר העלים שקובעו בתיקון אובייקט עץ.
#   {player}  שם השחקן שעוקבים אחריו או שאליו מכוונים.
#   {plugin}  שם התוסף לתצוגה; Iris בהודעות השפה והאבחון המשותפות של Iris.
#   {position}  מספר פינת הבחירה שמגדירים.
#   {preset}  הגדרת יצירת העולם הרשומה המשמשת לעולם הראשי.
#   {primary}  מזהה העולם הראשי שהוגדר.
#   {processed}  מספר הפריטים שעובדו, כולל הצלחות, דילוגים וכשלים.
#   {properties}  רשימה מעוצבת של תכונות הבלוק הנבדק.
#   {quarantinePath}  תיקייה של קובצי ניקוי שהועברו להסגר.
#   {queued}  מספר העובדים או המשימות שממתינים להפעלה.
#   {radius}  רדיוס היצירה מראש החוזר בפקודת ההתחלה המוצעת.
#   {rarity}  ערך הנדירות שהוגדר לאזור או להצבה הנקובים.
#   {rate}  קצב העברה או יצירה מראש, בתבנית תצוגה; ההודעה מוסיפה את היחידה לשנייה.
#   {reach}  טווח חיפוש הענפים שהוגדר לתיקון אובייקטי עצים.
#   {ready}  מספר עמודי Atlas המדויקים הזמינים כעת.
#   {reason}  הסבר מדוע הפעולה המבוקשת לא הושלמה.
#   {region}  שם האזור הנבדק או המזהה שלו.
#   {remaining}  מספר מצבי הבלוק הנוספים שהושמטו מהרשימה המוצגת.
#   {repository}  המאגר או הארכיון שהורד ונפרק.
#   {reverted}  מספר הדבקות האובייקטים שבוטלו.
#   {rotation}  הסיבוב שהוחל על האובייקט שהוצב.
#   {rx}  קואורדינטת X של הצ'אנק שעבורו מחושב גיבוב.
#   {rz}  קואורדינטת Z של הצ'אנק שעבורו מחושב גיבוב.
#   {s}  שם פרויקט Studio החדש.
#   {safeName}  שם הקובץ המנוקה עבור האובייקט המיובא.
#   {scale}  מספר בלוקי העולם שמייצג פיקסל בתצוגה המקדימה.
#   {scope}  האובייקט או קבוצת האובייקטים שנפתחו ב-Object Studio.
#   {searchRadius}  רדיוס חיפוש אימות המבנים בצ'אנקים.
#   {seconds}  רכיב השניות במשך הזמן, או הזמן מאז העדכון האחרון.
#   {section}  שם מדור העזרה שביקש המשתמש.
#   {seed}  הזרע המשמש לעולם, ל-Studio, למחולל או להשוואת הייחוס.
#   {seedRaw}  הזרע בדיוק כפי שהוזן לפני האימות.
#   {sixtySecond}  צ'אנקים לשנייה ביצירה מראש בחלון של 60 שניות.
#   {size}  מספר הקבצים, האזהרות, הרשומות או הפריטים שצוינו בהודעה.
#   {skipped}  מספר הפריטים שעליהם דילגה הפעולה.
#   {slope}  שיפוע השטח במיקום הנבדק.
#   {solidBlocks}  מספר הבלוקים המוצקים שנספרו בחישוב גיבוב היצירה.
#   {source}  ה-pack, מקור ההורדה או הקלט הקשור לתצוגת ההתקדמות.
#   {speed}  קצב יצירה מראש או עיבוד לשנייה, בתבנית תצוגה.
#   {stage}  שם שלב ההתקדמות הנוכחי.
#   {state}  המצב הנוכחי או ערך התכונה שצוינו בהודעה.
#   {status}  טקסט המצב הנוכחי של התצוגה המקדימה.
#   {structure}  שם המבנה שמאתרים או המזהה שלו.
#   {structureKey}  מזהה המבנה המבוקש ברישום או ב-pack.
#   {summary}  תוצאות הפעולה שהושלמה, בתבנית תצוגה.
#   {suppressed}  מספר המבנים המובנים שהוחלפו בהצבות של Iris.
#   {surface}  קואורדינטת Y של פני השטח בפקודת השיגור המוצעת.
#   {surfaceY}  קואורדינטת Y של פני השטח במיקום הנבדק.
#   {tag}  תווית מצב אימות מעוצבת לפני שם ה-pack.
#   {target}  נמען השפה או יעד בחירת האובייקט שצוינו בהודעה.
#   {targetX}  קואורדינטת X של היעד שאותר או התבקש.
#   {targetZ}  קואורדינטת Z של היעד שאותר או התבקש.
#   {template}  התבנית שנבחרה בעת יצירת פרויקט.
#   {tenSecond}  צ'אנקים לשנייה ביצירה מראש בחלון של 10 שניות.
#   {thirtySecond}  צ'אנקים לשנייה ביצירה מראש בחלון של 30 שניות.
#   {threads}  מספר תהליכוני העבודה לחישוב גיבוב היצירה.
#   {tileNote}  הערה אופציונלית על נתוני ישות בלוק שנשמרו או הוצבו.
#   {title}  כותרת הפעולה שתוצאתה מוצגת.
#   {to}  הגדרת האבחון החדשה: true להפעלה, false להשבתה.
#   {token}  ארגומנט טווח החיפוש שלא ניתן לפענח.
#   {total}  מספר כולל של משימות, צ'אנקים, ממדים או רשומות שצוינו בהודעה.
#   {totalObjects}  מספר האובייקטים שנפתחו ב-Object Studio.
#   {transferred}  כמות הנתונים שהועברה עד כה, בתבנית תצוגה.
#   {type}  סוג הפרמטר הצפוי, סוג המשאב או קטגוריית האובייקט שצוינו בהודעה.
#   {typeKey}  מזהה רשום של סוג ממד Minecraft, או inline.
#   {unreachableBiomes}  מספר המבנים המובנים שנשללו עקב בחירת הביומות ב-pack.
#   {unsupported}  מספר המבנים המובנים שהפלטפורמה מדווחת שאינם נתמכים.
#   {updates}  עדכוני בלוקים לשנייה בתצוגת המפתחים.
#   {url}  כתובת אינטרנט לפתיחה או להעתקה.
#   {usage}  תחביר הפקודה, או טקסט שימוש בזיכרון בתצוגת הזיכרון.
#   {used}  כמות הזיכרון שבשימוש, בתבנית תצוגה.
#   {value}  ערך התלוי בהודעה: הגדרת ברירת מחדל, שם, קואורדינטה, כמות או שגיאה; לפי הטקסט הסמוך.
#   {value2}  הערך השני בהודעה: למשל סך הצ'אנקים, Y של היעד, שם pack או שגיאה.
#   {value3}  הערך השלישי בהודעה: למשל אחוז, Z של היעד, גרסת Minecraft או הזמן שחלף.
#   {value4}  הערך הרביעי בהודעה: למשל כתיבות בלוקים, Z של הבחירה או סיומת מצב אופציונלית.
#   {value5}  הערך החמישי: כתיבות בלוקים שאינם אוויר בהצבה, או Z של הצ'אנק בתבנית המיקום.
#   {variables}  רשימת המשתנים הזמינים להודעה שנערכת.
#   {velocity}  מהירות התנועה הנוכחית של הישות הנבדקת.
#   {version}  גרסת התוסף או Minecraft שצוינה בהודעה הסמוכה.
#   {volume}  מספר הבלוקים בבחירת האובייקט.
#   {w}  רוחב האובייקט בבלוקים.
#   {wantVariants}  מספר הגרסאות המבוקש לכל עץ vanilla או מאפיין אובייקט מיובא.
#   {warnings}  מספר אזהרות האימות שאינן חוסמות טעינה.
#   {width}  רוחב אזור העולם המוצג בבלוקים.
#   {wood}  מספר בלוקי העץ שנוספו בתיקון אובייקט עץ.
#   {world}  שם העולם שאליו מכוונת הפקודה או תצוגת ההתקדמות.
#   {written}  מספר הגרסאות המיובאות או קובצי האובייקטים שנכתבו בהצלחה.
#   {x}  קואורדינטת X בהקשר הבלוק, הצ'אנק, האזור או התצוגה המקדימה שצוינו בהודעה.
#   {y}  קואורדינטה אנכית של העולם או הבלוק.
#   {z}  קואורדינטת Z בהקשר הבלוק, הצ'אנק, האזור או התצוגה המקדימה שצוינו בהודעה.
#   {zoom}  רמת ההגדלה הנוכחית של התצוגה המקדימה.
# === End Iris language guide ===

