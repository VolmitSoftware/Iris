# === Iris language guide ===
# Iris - it_IT
#
# === Modifica del file ===
# languages/it_IT.toml
# Puoi modificare direttamente questo file. Le modifiche locali vengono conservate; le voci mancanti o non valide usano l’inglese incorporato.
# /iris language server edit it_IT
#

# === Prefisso ed esempio ===
# Iris non ha un prefisso globale per le lingue. Un prefisso scritto in un messaggio riguarda soltanto quel messaggio.
# L’etichetta del plugin nella console e i temi dei menu e dell’aiuto sono impostati separatamente.
# Esempio: modifica set_debug nella sezione esistente [iris.bukkit.commandiris]:
# [iris.bukkit.commandiris]
# set_debug = "&6[Mondi]&r &aDebug impostato su: {to}"
# Soltanto questo messaggio di debug riceve il prefisso [Mondi]. {to} viene sostituito con true (attivo) o false (disattivo).
#
# === Colori e formattazione ===
# Colori classici: &0 nero, &1 blu scuro, &2 verde scuro, &3 turchese scuro,
# &4 rosso scuro, &5 viola scuro, &6 oro, &7 grigio, &8 grigio scuro,
# &9 blu, &a verde, &b turchese, &c rosso, &d viola chiaro, &e giallo, &f bianco.
# Stili: &k offuscato, &l grassetto, &m barrato, &n sottolineato, &o corsivo, &r ripristino.
# Il sistema delle lingue accetta RGB nei formati &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B e [RRGGBB].
# I temi Bukkit applicati successivamente possono modificare i colori RGB. Le visualizzazioni modded e in testo semplice usano i propri stili.
# Nelle stringhe TOML tra virgolette doppie, \n indica un’interruzione di riga, \" una virgoletta e \\ una barra inversa letterale.
#
# === Variabili ===
# Usa soltanto i segnaposto già presenti in ciascun messaggio e mantieni invariati i loro nomi.
# PC, SC e TC non sono variabili dei temi Iris. Questo glossario non consente di aggiungere segnaposto ad altri messaggi.
#   {MAXAUTOSELECTVOLUME}  Numero massimo di blocchi di un oggetto selezionato automaticamente.
#   {MAXSAVEVOLUME}  Numero massimo di blocchi di una selezione di oggetto salvata.
#   {MAXSPAN}  Larghezza, altezza o profondità massima di una struttura durante l’acquisizione, in blocchi.
#   {NATIVESTRUCTURELOCATERADIUS}  Raggio massimo di ricerca delle strutture native, in chunk.
#   {ROOTPERMISSION}  Permesso principale necessario per usare il comando.
#   {WORKSPACENAME}  Nome della cartella di lavoro di Studio cercata.
#   {WORLDPACKNAME}  Nome del datapack generato per il mondo.
#   {active}  Numero di attività di elaborazione in corso.
#   {activeLocale}  Lingua che rimane attiva quando quella richiesta non può essere selezionata.
#   {activeMax}  Limite superiore dell’intervallo di altezza del tipo di dimensione caricato.
#   {activeMin}  Limite inferiore dell’intervallo di altezza del tipo di dimensione caricato.
#   {actualReverts}  Numero di incollaggi di oggetti effettivamente annullati.
#   {afb}  Parte formattata di un’etichetta dei tempi del motore dopo la porzione tra parentesi quadre.
#   {after}  Valore dopo la modifica o blocchi dell’albero ancora irraggiungibili dopo la riparazione.
#   {amount}  Quantità associata alla voce indicata nel rapporto.
#   {applied}  Numero di chunk a cui è stato applicato il risultato dell’elaborazione.
#   {argument}  Argomento del comando che non è stato accettato.
#   {available}  Numero di strutture native che possono essere generate.
#   {bar}  Testo della barra di avanzamento già formattato.
#   {befb}  Parte formattata di un’etichetta dei tempi del motore prima della porzione tra parentesi quadre.
#   {before}  Valore prima della modifica o blocchi dell’albero irraggiungibili prima della riparazione.
#   {biome}  Nome o identificatore del bioma visualizzato.
#   {block}  Tipo o descrizione del blocco esaminato.
#   {blockX}  Coordinata X del blocco o della destinazione del teletrasporto.
#   {blockY}  Coordinata Y del blocco o della destinazione del teletrasporto.
#   {blockZ}  Coordinata Z del blocco o della destinazione del teletrasporto.
#   {blocking}  Numero di errori di convalida che impediscono il caricamento del pacchetto.
#   {blocks}  Numero di varianti di blocco nel gruppo importato.
#   {bpp}  Blocchi del mondo rappresentati da un pixel in Vision.
#   {branches}  Numero di rami aggiunti durante la riparazione degli oggetti albero.
#   {broken}  Numero di pacchetti che non hanno superato la convalida.
#   {brokenTotal}  Numero totale di pacchetti che non hanno superato la convalida.
#   {cave}  Bioma o descrizione della grotta nella posizione esaminata.
#   {centerX}  Coordinata X del centro dell’area; l’unità dipende dal messaggio dell’operazione.
#   {centerZ}  Coordinata Z del centro dell’area; l’unità dipende dal messaggio dell’operazione.
#   {changed}  Numero di oggetti elaborati che sono stati modificati.
#   {chunk}  Coordinate o etichetta identificativa del chunk segnalato.
#   {chunkX}  Coordinata X espressa in chunk, non in blocchi.
#   {chunkZ}  Coordinata Z espressa in chunk, non in blocchi.
#   {chunks}  Numero di chunk inclusi nell’operazione.
#   {clampedY}  Coordinata Y di destinazione dopo l’adattamento all’intervallo di altezza consentito.
#   {command}  Nome del comando o comando completo da eseguire.
#   {converted}  Numero di blocchi di foglie convertiti in legno durante la riparazione degli alberi.
#   {count}  Numero di voci, messaggi o giocatori indicati dal testo circostante.
#   {current}  Avanzamento attuale o numero di chunk nel confronto corrente.
#   {currentStage}  Nome della fase attuale di caricamento di Studio.
#   {d}  Profondità dell’oggetto in blocchi.
#   {depth}  Numero di blocchi sotto la superficie del terreno.
#   {derivative}  Derivazione o variante associata al bioma di superficie.
#   {detail}  Descrizione aggiuntiva dell’oggetto esaminato o della fase corrente.
#   {diffs}  Numero di differenze rilevate tra i risultati generati.
#   {dimKey}  Identificatore della dimensione in corso di impacchettamento.
#   {dimension}  Nome o identificatore della dimensione indicata nel messaggio.
#   {dimensionId}  Identificatore registrato della dimensione caricata o richiesta.
#   {dimensionId2}  Identificatore della dimensione ripetuto nel comando di eliminazione suggerito.
#   {dimm}  Identificatore della dimensione di Studio o nome del relativo pacchetto nel comando di convalida.
#   {disabled}  Numero di strutture native la cui generazione è disattivata.
#   {distances}  Numero di valori di distanza delle foglie modificati durante la riparazione degli alberi.
#   {done}  Numero di elementi di lavoro completati finora.
#   {downloadSource}  Origine o riferimento selezionato per scaricare il pacchetto.
#   {downloadable}  Pacchetto o progetto scaricabile in corso di importazione.
#   {dumpPath}  Posizione dei dati salvati di pulizia o ripristino.
#   {duration}  Durata formattata dell’operazione.
#   {e}  Testo dell’eccezione di una ricerca non riuscita di modelli di strutture.
#   {elapsed}  Tempo trascorso dall’inizio dell’operazione, formattato.
#   {engines}  Numero di motori di generazione o dimensioni Iris attivi.
#   {entity}  Tipo di entità selezionato dal generatore di entità esaminato.
#   {error}  Dettagli dell’errore verificatosi.
#   {errorMessage}  Suffisso facoltativo con dettagli dell’errore aggiunto al messaggio principale.
#   {eta}  Tempo rimanente stimato e formattato; alcuni messaggi includono anche l’etichetta.
#   {failed}  Numero di elementi non riusciti o suffisso di errore preparato per i titoli di avanzamento.
#   {failure}  Motivo del fallimento della ricerca o dell’operazione.
#   {failures}  Numero di attività non riuscite o riepilogo facoltativo e formattato degli errori.
#   {file}  Nome o percorso del file coinvolto nell’operazione.
#   {filter}  Testo usato per filtrare l’elenco delle dimensioni Iris.
#   {fps}  Velocità attuale di rendering dell’anteprima, in fotogrammi al secondo.
#   {g}  File di oggetti scritti dall’ultimo rapporto di avanzamento dell’impacchettamento.
#   {generated}  Numero di chunk generati finora.
#   {generator}  Nome del generatore di rumore mostrato nell’esploratore.
#   {generatorKey}  Identificatore del generatore di rumore richiesto.
#   {get}  Numero di file schematic convertiti correttamente.
#   {golden}  Numero di chunk nel confronto di riferimento salvato.
#   {goldenDimension}  Identificatore della dimensione memorizzato nell’acquisizione di riferimento.
#   {goldenSeed}  Seme del mondo memorizzato nell’acquisizione di riferimento.
#   {goldenVersion}  Versione di Minecraft usata per creare l’acquisizione di riferimento.
#   {group}  Gruppo di messaggi nell’editor delle lingue o categoria di un oggetto importato.
#   {guiNote}  Nota facoltativa sulla finestra di avanzamento della pregenerazione.
#   {h}  Altezza dell’oggetto in blocchi.
#   {hash}  Somma di controllo combinata dei chunk generati confrontati.
#   {health}  Salute attuale dell’entità esaminata.
#   {height}  Altezza del terreno, totale o dell’area visualizzata, secondo il messaggio.
#   {hours}  Componente in ore della durata formattata.
#   {i}  Nome visualizzato del motore o voce del modello di elenco dei comandi.
#   {id}  ID di registro del bioma esaminato.
#   {imported}  Numero di strutture o oggetti importati correttamente.
#   {includeNonJigsaw}  Indica se l’importazione include strutture che non usano pezzi jigsaw.
#   {iris}  Numero di dimensioni caricate che usano la generazione Iris.
#   {irisLevels}  Numero di dimensioni Iris caricate confrontate con le altezze del pacchetto.
#   {irisPlaced}  Numero di strutture posizionate da Iris al posto della generazione nativa.
#   {job}  Nome dell’operazione in background completata.
#   {k}  Chiave di caricamento della regione nel rapporto di distribuzione delle regioni.
#   {key}  Identificatore del parametro, messaggio o risorsa indicato dal testo circostante.
#   {key2}  Identificatore della struttura ripetuto nel comando di localizzazione suggerito.
#   {keyString}  Identificatore della struttura o risorsa importata o segnalata come non valida.
#   {label}  Nome visualizzato della destinazione trovata.
#   {line}  Numero di riga nell’editor delle lingue.
#   {locale}  Identificatore della lingua, come en_US o de_DE.
#   {logicalWorldName}  Nome logico del mondo a cui è rivolto il comando.
#   {loot}  Identificatore della tabella del bottino esaminata.
#   {m}  Messaggio aggiuntivo di evacuazione o testo dei parametri ignorati nel relativo modello di comando.
#   {mantleStatus}  Esito dell’azzeramento dei dati di generazione prima di un confronto con una generazione ripetuta.
#   {marker}  Nome del marcatore cercato.
#   {material}  Materiale Minecraft del blocco esaminato.
#   {maxScale}  Scala massima consentita dell’oggetto dopo il contenimento della scala richiesta nei limiti.
#   {maxX}  Limite superiore X dell’intervallo di chunk visualizzato.
#   {maxY}  Limite superiore dell’intervallo di altezza del mondo.
#   {maxZ}  Limite superiore Z dell’intervallo di chunk visualizzato.
#   {maximum}  Lunghezza massima dell’input o salute massima dell’entità, secondo il messaggio.
#   {mcmeta}  Percorso del file pack.mcmeta del datapack generato.
#   {message}  Testo dettagliato di stato o errore fornito dall’operazione.
#   {method}  Metodo di pregenerazione selezionato.
#   {minX}  Limite inferiore X dell’intervallo di chunk visualizzato.
#   {minY}  Limite inferiore dell’intervallo di altezza del mondo.
#   {minZ}  Limite inferiore Z dell’intervallo di chunk visualizzato.
#   {minutes}  Componente in minuti della durata formattata.
#   {mismatches}  Numero di chunk diversi dal riferimento salvato.
#   {mode}  Modalità selezionata di importazione, generazione o anteprima.
#   {modeNote}  Spiegazione facoltativa della modalità di pregenerazione selezionata.
#   {name}  Nome del mondo, oggetto, progetto o voce indicato nel messaggio.
#   {nameRaw}  Nome esattamente come inserito, prima della normalizzazione o convalida.
#   {normalized}  Nome normalizzato della sezione di aiuto non trovata.
#   {num}  Porzione formattata tra parentesi quadre di un’etichetta dei tempi del motore; non è necessariamente un numero.
#   {object}  Nome o identificatore dell’oggetto Iris modificato o esaminato.
#   {objects}  Elenco o numero di oggetti del chunk esaminato.
#   {offset}  Distanza verticale dalla superficie del terreno, in blocchi.
#   {output}  Percorso del file di output che non è stato possibile scrivere.
#   {overall}  Media dei chunk pregenerati al secondo durante l’intera operazione.
#   {ownerName}  Nome del giocatore proprietario della sessione di Studio.
#   {pack}  Nome o identificatore del pacchetto Iris coinvolto nell’operazione.
#   {pack2}  Identificatore del pacchetto ripetuto in un comando suggerito o in un’origine di download.
#   {packDimension}  Definizione di dimensione selezionata dal pacchetto.
#   {packLogical}  Altezza logica richiesta dalla definizione di dimensione del pacchetto.
#   {packMax}  Limite superiore di altezza richiesto dal pacchetto.
#   {packMin}  Limite inferiore di altezza richiesto dal pacchetto.
#   {packName}  Nome visualizzato del pacchetto in corso di convalida.
#   {parameter}  Parametro del comando mancante o non interpretabile.
#   {parent}  Nome visualizzato del menu o percorso di comando superiore.
#   {path}  Percorso del file salvato, aperto o segnalato.
#   {percent}  Percentuale di avanzamento; mantenere il simbolo di percentuale del messaggio fuori dalla variabile.
#   {permission}  Nodo di permesso richiesto per l’azione richiesta.
#   {personal}  Identificatore della lingua personale salvato per il giocatore.
#   {phase}  Nome della fase attuale di caricamento o download.
#   {pinned}  Numero di blocchi di foglie fissati durante la riparazione di un oggetto albero.
#   {player}  Nome del giocatore seguito o selezionato.
#   {plugin}  Nome visualizzato del plugin; Iris nei suoi messaggi condivisi di lingua e diagnostica.
#   {position}  Numero dell’angolo della selezione che viene impostato.
#   {preset}  Preimpostazione registrata di generazione usata per il mondo principale.
#   {primary}  Identificatore del mondo principale configurato.
#   {processed}  Numero di elementi elaborati, inclusi quelli riusciti, saltati e non riusciti.
#   {properties}  Elenco formattato delle proprietà del blocco esaminato.
#   {quarantinePath}  Cartella contenente i file di pulizia messi in quarantena.
#   {queued}  Numero di attività o elementi di lavoro in attesa di esecuzione.
#   {radius}  Raggio di pregenerazione ripetuto nel comando di avvio suggerito.
#   {rarity}  Valore di rarità configurato della regione o del posizionamento indicato.
#   {rate}  Velocità formattata di trasferimento o pregenerazione; il messaggio aggiunge il suffisso al secondo.
#   {reach}  Portata configurata della ricerca dei rami durante la riparazione degli oggetti albero.
#   {ready}  Numero di pagine esatte dell’Atlas attualmente disponibili.
#   {reason}  Spiegazione del motivo per cui l’azione richiesta non è stata completata.
#   {region}  Nome o identificatore della regione esaminata.
#   {remaining}  Numero di stati di blocco aggiuntivi omessi dall’elenco visualizzato.
#   {repository}  Repository o archivio scaricato in corso di estrazione.
#   {reverted}  Numero di incollaggi di oggetti annullati.
#   {rotation}  Rotazione applicata all’oggetto posizionato.
#   {rx}  Coordinata X del chunk di cui viene calcolato l’hash.
#   {rz}  Coordinata Z del chunk di cui viene calcolato l’hash.
#   {s}  Nome del nuovo progetto di Studio.
#   {safeName}  Nome di file ripulito usato per l’oggetto importato.
#   {scale}  Blocchi del mondo rappresentati da un pixel dell’anteprima.
#   {scope}  Oggetto o gruppo di oggetti aperto in Object Studio.
#   {searchRadius}  Raggio di ricerca per la verifica delle strutture, in chunk.
#   {seconds}  Componente in secondi di una durata o tempo dall’ultimo aggiornamento.
#   {section}  Nome della sezione di aiuto richiesta dall’utente.
#   {seed}  Seme usato per il mondo, la sessione di Studio, il generatore o il confronto di riferimento.
#   {seedRaw}  Seme esattamente come inserito, prima della convalida.
#   {sixtySecond}  Chunk pregenerati al secondo nella finestra di 60 secondi.
#   {size}  Numero di file, avvisi, voci o elementi indicati nel messaggio.
#   {skipped}  Numero di elementi saltati dall’operazione.
#   {slope}  Pendenza del terreno nella posizione esaminata.
#   {solidBlocks}  Numero di blocchi solidi contati durante il calcolo dell’hash della generazione.
#   {source}  Pacchetto, origine di download o input associato alla visualizzazione dell’avanzamento.
#   {speed}  Velocità formattata di pregenerazione o elaborazione al secondo.
#   {stage}  Nome della fase attuale di avanzamento.
#   {state}  Stato attuale o valore di proprietà indicato nel messaggio.
#   {status}  Testo dello stato attuale dell’anteprima.
#   {structure}  Nome o identificatore della struttura cercata.
#   {structureKey}  Identificatore di registro o del pacchetto della struttura richiesta.
#   {summary}  Risultati formattati dell’operazione completata.
#   {suppressed}  Numero di strutture native sostituite da posizionamenti Iris.
#   {surface}  Coordinata Y della superficie usata nel comando di teletrasporto suggerito.
#   {surfaceY}  Coordinata Y della superficie del terreno nella posizione esaminata.
#   {tag}  Etichetta formattata dello stato di convalida prima del nome del pacchetto.
#   {target}  Destinatario della lingua o destinazione della selezione di oggetti indicato nel messaggio.
#   {targetX}  Coordinata X della destinazione trovata o richiesta.
#   {targetZ}  Coordinata Z della destinazione trovata o richiesta.
#   {template}  Modello selezionato durante la creazione di un progetto.
#   {tenSecond}  Chunk pregenerati al secondo nella finestra di 10 secondi.
#   {thirtySecond}  Chunk pregenerati al secondo nella finestra di 30 secondi.
#   {threads}  Numero di thread di lavoro usati per calcolare l’hash della generazione.
#   {tileNote}  Nota facoltativa sui dati delle entità di blocco salvati o posizionati.
#   {title}  Titolo dell’operazione di cui viene mostrato il risultato.
#   {to}  Nuova impostazione di debug: true per attivo, false per disattivo.
#   {token}  Argomento di portata che non è stato possibile interpretare.
#   {total}  Numero totale di elementi di lavoro, chunk, dimensioni o voci indicati nel messaggio.
#   {totalObjects}  Numero di oggetti aperti in Object Studio.
#   {transferred}  Quantità formattata dei dati trasferiti finora.
#   {type}  Tipo di parametro previsto, tipo di risorsa o categoria di oggetto indicato nel messaggio.
#   {typeKey}  Identificatore registrato del tipo di dimensione Minecraft, oppure inline.
#   {unreachableBiomes}  Numero di strutture native escluse dai biomi scelti dal pacchetto.
#   {unsupported}  Numero di strutture native segnalate come non supportate da questa piattaforma.
#   {updates}  Aggiornamenti dei blocchi al secondo nella visualizzazione per sviluppatori.
#   {url}  Indirizzo web da aprire o copiare.
#   {usage}  Sintassi del comando o testo sull’uso della memoria nella relativa visualizzazione.
#   {used}  Quantità formattata di memoria usata nella relativa visualizzazione.
#   {value}  Valore specifico del messaggio, ad esempio impostazione predefinita, nome, coordinata, quantità o errore. Leggere il testo circostante.
#   {value2}  Secondo valore specifico del messaggio, ad esempio totale dei chunk, Y di destinazione, nome del pacchetto o errore. Leggere il testo circostante.
#   {value3}  Terzo valore specifico del messaggio, ad esempio percentuale, Z di destinazione, versione di Minecraft o tempo trascorso.
#   {value4}  Quarto valore specifico del messaggio, ad esempio scritture di blocchi, coordinata Z di una selezione o suffisso di stato facoltativo.
#   {value5}  Quinto valore specifico del messaggio: scritture di blocchi non d’aria nel posizionamento di oggetti, oppure Z del chunk nel modello di posizione.
#   {variables}  Elenco dei segnaposto disponibili per il messaggio in modifica.
#   {velocity}  Velocità di movimento attuale dell’entità esaminata.
#   {version}  Versione del plugin o di Minecraft indicata dal messaggio circostante.
#   {volume}  Numero di blocchi contenuti nella selezione dell’oggetto.
#   {w}  Larghezza dell’oggetto in blocchi.
#   {wantVariants}  Varianti richieste per ogni elemento di albero o oggetto vanilla importato.
#   {warnings}  Numero di avvisi di convalida non bloccanti.
#   {width}  Larghezza dell’area del mondo visualizzata, in blocchi.
#   {wood}  Numero di blocchi di legno aggiunti durante la riparazione di un oggetto albero.
#   {world}  Nome del mondo a cui si riferisce il comando o la visualizzazione dell’avanzamento.
#   {written}  Numero di varianti importate o file di oggetti scritti correttamente.
#   {x}  Coordinata X nel contesto di blocchi, chunk, regioni o anteprima indicato dal messaggio.
#   {y}  Coordinata verticale del mondo o del blocco.
#   {z}  Coordinata Z nel contesto di blocchi, chunk, regioni o anteprima indicato dal messaggio.
#   {zoom}  Livello di zoom attuale dell’anteprima.
# === End Iris language guide ===

