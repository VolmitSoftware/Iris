# === Iris language guide ===
# Iris - ja-JP
#
# === ファイルの編集 ===
# languages/ja-JP.toml
# このファイルを直接編集できます。ローカルの変更は保持され、不足または無効な項目には内蔵の英語を使用します。
# /iris language server edit ja-JP
#
# === 接頭辞とメッセージの例 ===
# Iris の言語ファイルには全メッセージ共通の接頭辞設定はありません。接頭辞を付けたいメッセージの本文を編集してください。
# コンソールのプラグイン接頭辞とメニューのテーマは表示側で別に設定され、この編集では変わりません。
# 例: [iris.bukkit.commandiris] セクションの set_debug を次のように編集します。
# set_debug = "&6[ワールド]&r &aデバッグを {to} に設定しました"
# /iris debug の返信にだけ [ワールド] が付きます。{to} は true（有効）または false（無効）です。
# {PC}、{SC}、{TC} は Iris で使用できるテーマ変数ではありません。
#
# === 色と書式 ===
# 基本色: &0 黒、&1 濃い青、&2 濃い緑、&3 濃い水色、&4 濃い赤、&5 濃い紫、&6 金色、&7 灰色。
# 基本色: &8 濃い灰色、&9 青、&a 緑、&b 水色、&c 赤、&d 明るい紫、&e 黄色、&f 白。
# 装飾: &k ランダム文字、&l 太字、&m 取り消し線、&n 下線、&o 斜体、&r 色と装飾をリセット。
# 例: "&6重要: &l太字&r 通常の文"。Bukkit のカスタム色効果によって見える色が変わる場合があります。
# 言語処理は &#33CC99、&x33CC99、&x&3&3&C&C&9&9、[33CC99] の RGB 指定を受け付けます。
# ただし Bukkit の標準の色加工では、その RGB 値が保持されない場合があります。すべての出力で同じ色になるとは限りません。
# Mod 版のコマンド、ヘルプ、クライアント画面などは書式を除いた翻訳文を使い、画面側の色や装飾を維持します。
#
# === TOML のエスケープ ===
# 二重引用符で囲む TOML 文字列では、\" は引用符、\\ はバックスラッシュ、\n は改行を表します。
# 言語処理で & や [ をエスケープしても、後段の Bukkit 処理が &a などを再び色として扱う場合があります。
# バックスラッシュだけで、すべての表示先の色処理を無効化できるわけではありません。
#
# === 変数 ===
# 変数名は変更せず、各メッセージに元からある変数だけを使ってください。以下は値の意味です。
#   {MAXAUTOSELECTVOLUME}  オブジェクトの自動選択で許可される最大ブロック数。
#   {MAXSAVEVOLUME}  保存するオブジェクト選択範囲の最大ブロック数。
#   {MAXSPAN}  構造物の取り込み時に許可される幅・高さ・奥行きの上限（ブロック）。
#   {NATIVESTRUCTURELOCATERADIUS}  ネイティブ構造物の最大検索半径（チャンク）。
#   {ROOTPERMISSION}  コマンドの使用に必要なルート権限。
#   {WORKSPACENAME}  検索対象の Studio ワークスペースフォルダー名。
#   {WORLDPACKNAME}  生成されたワールドデータパックの名前。
#   {active}  現在実行中のワーカー数。
#   {activeLocale}  要求した言語を選択できない場合に維持される言語。
#   {activeMax}  読み込まれたディメンションタイプの高さ範囲の上限。
#   {activeMin}  読み込まれたディメンションタイプの高さ範囲の下限。
#   {actualReverts}  実際に取り消されたオブジェクト貼り付け回数。
#   {afb}  エンジン処理時間ラベルの括弧部分より後にある書式付きテキスト。
#   {after}  変更後の値、または修復後も接続されていない木のブロック数。
#   {amount}  レポートの指定項目に対応する数量。
#   {applied}  処理結果が適用されたチャンク数。
#   {argument}  受け付けられなかったコマンド引数。
#   {available}  生成可能なネイティブ構造物の数。
#   {bar}  書式設定済みの進捗バーのテキスト。
#   {befb}  エンジン処理時間ラベルの括弧部分より前にある書式付きテキスト。
#   {before}  変更前の値、または修復前に接続されていなかった木のブロック数。
#   {biome}  表示中のバイオームの名前または識別子。
#   {block}  調べているブロックの種類または説明。
#   {blockX}  ブロックまたはテレポート先の X 座標。
#   {blockY}  ブロックまたはテレポート先の Y 座標。
#   {blockZ}  ブロックまたはテレポート先の Z 座標。
#   {blocking}  パックの読み込みを妨げる検証エラーの数。
#   {blocks}  インポートされたグループに含まれるブロックのバリエーション数。
#   {bpp}  Vision の 1 ピクセルが表すワールドのブロック数。
#   {branches}  木のオブジェクト修復時に追加された枝の数。
#   {broken}  検証に失敗したパックの数。
#   {brokenTotal}  検証に失敗したパックの総数。
#   {cave}  調べている位置の洞窟バイオームまたは洞窟の説明。
#   {centerX}  領域の中心 X 座標。単位はその操作のメッセージに従います。
#   {centerZ}  領域の中心 Z 座標。単位はその操作のメッセージに従います。
#   {changed}  処理対象のうち変更されたオブジェクト数。
#   {chunk}  報告対象チャンクの座標または識別ラベル。
#   {chunkX}  ブロック単位ではなくチャンク単位の X 座標。
#   {chunkZ}  ブロック単位ではなくチャンク単位の Z 座標。
#   {chunks}  操作に含まれるチャンクの数。
#   {clampedY}  許可された高さ範囲に調整した後のテレポート先 Y 座標。
#   {command}  コマンド名または実行するコマンド全文。
#   {converted}  木の修復時に木材へ変換された葉ブロックの数。
#   {count}  前後の文が示す項目、メッセージ、またはプレイヤーの数。
#   {current}  現在の進捗数、または今回の比較に含まれるチャンク数。
#   {currentStage}  Studio の現在の読み込み段階の名前。
#   {d}  オブジェクトの奥行き（ブロック）。
#   {depth}  地表より下のブロック数。
#   {derivative}  地表バイオームに関連する派生バイオームまたは変種。
#   {detail}  調査対象または現在の進捗段階についての追加説明。
#   {diffs}  生成結果の間で検出された差異の数。
#   {dimKey}  パッケージ化するディメンションの識別子。
#   {dimension}  メッセージが対象とするディメンションの名前または識別子。
#   {dimensionId}  読み込まれた、または要求されたディメンションの登録識別子。
#   {dimensionId2}  削除コマンドの提案で再び使われるディメンション識別子。
#   {dimm}  Studio のディメンション識別子、または検証コマンドで使うパック名。
#   {disabled}  生成が無効になっているネイティブ構造物の数。
#   {distances}  木の修復時に変更された葉の距離値の数。
#   {done}  これまでに完了した作業項目の数。
#   {downloadSource}  パックのダウンロード元または選択されたリファレンス。
#   {downloadable}  インポートするパックまたはダウンロード可能なプロジェクト。
#   {dumpPath}  保存されたクリーンアップまたは復元データの場所。
#   {duration}  書式設定済みの操作の所要時間。
#   {e}  構造物テンプレートのスキャン失敗時の例外テキスト。
#   {elapsed}  操作開始からの経過時間（書式設定済み）。
#   {engines}  稼働中の Iris 生成エンジンまたはディメンションの数。
#   {entity}  調べているスポナーで選択されているエンティティの種類。
#   {error}  発生したエラーの詳細。
#   {errorMessage}  失敗メッセージの末尾に付加される任意のエラー詳細。
#   {eta}  残り時間の見積もり（書式設定済み）。ラベルを含む場合もあります。
#   {failed}  失敗した項目数、または進捗タイトルに付ける失敗表示。
#   {failure}  検索または操作が失敗した理由。
#   {failures}  失敗した作業数、または任意の書式付き失敗概要。
#   {file}  操作対象ファイルの名前またはパス。
#   {filter}  Iris ディメンション一覧の絞り込みに使う文字列。
#   {fps}  プレビューの現在の描画速度（フレーム毎秒）。
#   {g}  前回のパッケージ進捗報告以降に書き込んだオブジェクトファイル数。
#   {generated}  これまでに生成されたチャンク数。
#   {generator}  エクスプローラーに表示するノイズ生成器の名前。
#   {generatorKey}  要求されたノイズ生成器の識別子。
#   {get}  変換に成功したスキーマティックの数。
#   {golden}  保存された比較用の参照データに含まれるチャンク数。
#   {goldenDimension}  参照データに保存されているディメンション識別子。
#   {goldenSeed}  参照データに保存されているワールドのシード。
#   {goldenVersion}  参照データの作成に使用した Minecraft のバージョン。
#   {group}  言語エディターのメッセージグループ、またはインポートしたオブジェクトの分類。
#   {guiNote}  事前生成の進捗ウィンドウに関する任意の補足。
#   {h}  オブジェクトの高さ（ブロック）。
#   {hash}  比較対象の生成チャンクをまとめたチェックサム。
#   {health}  調べているエンティティの現在の体力。
#   {height}  地形の高さ、総高度、または表示領域の高さ。意味は文中に示されます。
#   {hours}  書式付き時間の「時間」部分。
#   {i}  エンジンの表示名、またはコマンド一覧テンプレートの項目。
#   {id}  調べているバイオームのレジストリ ID。
#   {imported}  インポートに成功した構造物またはオブジェクトの数。
#   {includeNonJigsaw}  ジグソーパーツを使わない構造物もインポートするかどうか。
#   {iris}  Iris 生成を使用している読み込み済みディメンション数。
#   {irisLevels}  パックの高さと照合した読み込み済み Iris ディメンション数。
#   {irisPlaced}  ネイティブ生成の代わりに Iris が配置した構造物の数。
#   {job}  完了したバックグラウンド処理の名前。
#   {k}  リージョン分布レポートに使うリージョンの読み込みキー。
#   {key}  前後の文が示すパラメーター、メッセージ、またはリソースの識別子。
#   {key2}  検索コマンドの提案で再び使われる構造物識別子。
#   {keyString}  インポートする、または無効と報告された構造物・リソースの識別子。
#   {label}  見つかった対象の表示名。
#   {line}  言語エディターの行番号。
#   {locale}  en_US や de_DE などの言語識別子。
#   {logicalWorldName}  コマンドの対象ワールドの論理名。
#   {loot}  調べているルートテーブルの識別子。
#   {m}  退避処理の追加メッセージ、またはコマンドの無視されたパラメーターの文。
#   {mantleStatus}  再生成比較の前に生成データをリセットした結果。
#   {marker}  検索するマーカーの名前。
#   {material}  調べているブロックの Minecraft マテリアル。
#   {maxScale}  要求された倍率を制限した後のオブジェクト倍率の上限。
#   {maxX}  表示中のチャンク範囲の X 座標上限。
#   {maxY}  ワールドの高さ範囲の上限。
#   {maxZ}  表示中のチャンク範囲の Z 座標上限。
#   {maximum}  入力の最大文字数またはエンティティの最大体力。意味は文中に示されます。
#   {mcmeta}  生成されたデータパックの pack.mcmeta ファイルのパス。
#   {message}  操作が返す詳しい状態またはエラーのテキスト。
#   {method}  選択された事前生成方式。
#   {minX}  表示中のチャンク範囲の X 座標下限。
#   {minY}  ワールドの高さ範囲の下限。
#   {minZ}  表示中のチャンク範囲の Z 座標下限。
#   {minutes}  書式付き時間の「分」部分。
#   {mismatches}  保存された参照データと異なるチャンク数。
#   {mode}  選択されたインポート、生成、またはプレビューモード。
#   {modeNote}  選択された事前生成モードについての任意の説明。
#   {name}  メッセージが示すワールド、オブジェクト、プロジェクト、または項目の名前。
#   {nameRaw}  正規化や検証前の、入力されたままの名前。
#   {normalized}  見つからなかった、正規化済みのヘルプセクション名。
#   {num}  エンジン処理時間ラベルの書式付き括弧部分。数値とは限りません。
#   {object}  編集または調査対象の Iris オブジェクトの名前・識別子。
#   {objects}  調べているチャンクのオブジェクト一覧または個数。
#   {offset}  地表からの垂直距離（ブロック）。
#   {output}  書き込みに失敗した出力ファイルのパス。
#   {overall}  事前生成の開始から現在までの平均チャンク毎秒。
#   {ownerName}  Studio セッションを所有するプレイヤーの名前。
#   {pack}  操作対象の Iris パックの名前または識別子。
#   {pack2}  コマンドの提案またはダウンロード元で再び使われるパック識別子。
#   {packDimension}  パックから選択されたディメンション定義。
#   {packLogical}  パックのディメンション定義が要求する論理的な高さ。
#   {packMax}  パックが要求する高さの上限。
#   {packMin}  パックが要求する高さの下限。
#   {packName}  検証対象のパックの表示名。
#   {parameter}  不足している、または解析できないコマンドパラメーター。
#   {parent}  親メニューまたは親コマンド経路の表示名。
#   {path}  保存、開く、または報告するファイルのパス。
#   {percent}  進捗率。メッセージ中の % 記号は変数の外に置いてください。
#   {permission}  要求された操作に必要な権限ノード。
#   {personal}  プレイヤーに保存されている個人用の言語識別子。
#   {phase}  現在の読み込みまたはダウンロード段階の名前。
#   {pinned}  木のオブジェクト修復時に固定された葉の数。
#   {player}  追跡または操作対象のプレイヤーの名前。
#   {plugin}  プラグインの表示名。Iris の共通言語・診断メッセージでは Iris。
#   {position}  設定する選択範囲の角の番号。
#   {preset}  メインワールドで使用する登録済みワールド生成プリセット。
#   {primary}  設定されたプライマリワールドの識別子。
#   {processed}  成功、スキップ、失敗を含む処理済み項目数。
#   {properties}  調べているブロックのプロパティ一覧（書式付き）。
#   {quarantinePath}  クリーンアップで隔離したファイルの保存フォルダー。
#   {queued}  実行待ちのワーカーまたは作業項目の数。
#   {radius}  開始コマンドの提案で再び使われる事前生成半径。
#   {rarity}  指定されたリージョンまたは配置に設定された希少度。
#   {rate}  書式付きの転送速度または事前生成速度。毎秒の接尾辞は文側で付けます。
#   {reach}  木のオブジェクト修復時に使う設定済みの枝検索距離。
#   {ready}  現在利用できる精密 Atlas ページ数。
#   {reason}  要求された操作を完了できなかった理由。
#   {region}  調べているリージョンの名前または識別子。
#   {remaining}  表示一覧から省略された追加のブロック状態数。
#   {repository}  展開中のリポジトリまたはダウンロードしたアーカイブ。
#   {reverted}  取り消したオブジェクト貼り付けの回数。
#   {rotation}  配置したオブジェクトに適用された回転。
#   {rx}  ハッシュを計算するチャンクの X 座標。
#   {rz}  ハッシュを計算するチャンクの Z 座標。
#   {s}  新しい Studio プロジェクトの名前。
#   {safeName}  インポートするオブジェクトに使う安全化済みのファイル名。
#   {scale}  プレビューの 1 ピクセルが表すワールドのブロック数。
#   {scope}  Object Studio で開いたオブジェクトまたはそのグループ。
#   {searchRadius}  構造物の検証で使う検索半径（チャンク）。
#   {seconds}  時間の「秒」部分、または前回更新からの秒数。
#   {section}  ユーザーが指定したヘルプセクションの名前。
#   {seed}  ワールド、Studio、生成器、または参照比較に使用するシード。
#   {seedRaw}  検証前の、入力されたままのシード。
#   {sixtySecond}  直近 60 秒間の事前生成速度（チャンク毎秒）。
#   {size}  文中に示されたファイル、警告、項目などの数。
#   {skipped}  操作でスキップされた項目数。
#   {slope}  調べている位置の地形の傾斜。
#   {solidBlocks}  生成ハッシュ処理で数えた固体ブロック数。
#   {source}  進捗表示に対応するパック、ダウンロード元、または入力。
#   {speed}  書式設定済みの事前生成または処理の毎秒速度。
#   {stage}  現在の進捗段階の名前。
#   {state}  文中で指定された現在の状態またはプロパティ値。
#   {status}  現在のプレビュー状態のテキスト。
#   {structure}  検索中の構造物の名前または識別子。
#   {structureKey}  要求された構造物のレジストリまたはパック内の識別子。
#   {summary}  完了した操作の書式付き結果概要。
#   {suppressed}  Iris の配置で置き換えられたネイティブ構造物の数。
#   {surface}  テレポートコマンドの提案で使う地表の Y 座標。
#   {surfaceY}  調べている位置の地表 Y 座標。
#   {tag}  パック名の前に置く書式付きの検証状態ラベル。
#   {target}  文中に示された言語設定の対象者、またはオブジェクト選択対象。
#   {targetX}  見つかった、または指定された目的地の X 座標。
#   {targetZ}  見つかった、または指定された目的地の Z 座標。
#   {template}  プロジェクト作成時に選択したテンプレート。
#   {tenSecond}  直近 10 秒間の事前生成速度（チャンク毎秒）。
#   {thirtySecond}  直近 30 秒間の事前生成速度（チャンク毎秒）。
#   {threads}  生成ハッシュ処理に使用するワーカースレッド数。
#   {tileNote}  保存または配置したブロックエンティティデータについての任意の補足。
#   {title}  結果を表示している操作のタイトル。
#   {to}  新しいデバッグ設定。true は有効、false は無効。
#   {token}  解析できなかった reach 引数。
#   {total}  文中に示された作業項目、チャンク、ディメンションなどの総数。
#   {totalObjects}  Object Studio で開いたオブジェクトの数。
#   {transferred}  これまでに転送したデータ量（書式付き）。
#   {type}  文中に示された想定パラメーター型、リソース種別、またはオブジェクト分類。
#   {typeKey}  登録された Minecraft ディメンションタイプ識別子、または inline。
#   {unreachableBiomes}  パックのバイオーム選択によって除外されたネイティブ構造物の数。
#   {unsupported}  このプラットフォームで未対応と判定されたネイティブ構造物の数。
#   {updates}  開発者向け表示のブロック更新数（毎秒）。
#   {url}  開く、またはコピーする Web アドレス。
#   {usage}  コマンド構文、またはメモリー表示の使用状況テキスト。
#   {used}  メモリー表示の使用済み容量（書式付き）。
#   {value}  文ごとに異なる値。既定設定、名前、座標、個数、エラーなど。前後の文を確認してください。
#   {value2}  文ごとに異なる 2 番目の値。総チャンク数、目的地 Y、パック名、エラーなど。
#   {value3}  文ごとに異なる 3 番目の値。百分率、目的地 Z、Minecraft バージョン、経過時間など。
#   {value4}  文ごとに異なる 4 番目の値。ブロック書き込み数、選択範囲 Z、任意の状態接尾辞など。
#   {value5}  文ごとに異なる 5 番目の値。配置時の空気以外のブロック書き込み数、または位置表示のチャンク Z。
#   {variables}  編集中のメッセージで利用できる変数の一覧。
#   {velocity}  調べているエンティティの現在の移動速度。
#   {version}  前後の文が示すプラグインまたは Minecraft のバージョン。
#   {volume}  オブジェクト選択範囲に含まれるブロック数。
#   {w}  オブジェクトの幅（ブロック）。
#   {wantVariants}  インポートするバニラの木またはオブジェクト機能ごとに要求したバリエーション数。
#   {warnings}  処理を妨げない検証警告の数。
#   {width}  表示中のワールド領域の幅（ブロック）。
#   {wood}  木のオブジェクト修復時に追加された木材ブロック数。
#   {world}  コマンドまたは進捗表示の対象ワールドの名前。
#   {written}  書き込みに成功したインポート済みバリエーションまたはオブジェクトファイル数。
#   {x}  文中に示されたブロック、チャンク、リージョン、またはプレビューの X 座標。
#   {y}  ワールドまたはブロックの垂直座標。
#   {z}  文中に示されたブロック、チャンク、リージョン、またはプレビューの Z 座標。
#   {zoom}  プレビューの現在のズーム倍率。
# === End Iris language guide ===

