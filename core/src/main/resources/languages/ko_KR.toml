"language.editor.title" = "{plugin} › {section}"
# === Iris language guide ===
# Iris - ko_KR
#
# === 파일 편집 ===
# languages/ko_KR.toml
# 이 파일을 직접 편집할 수 있습니다. 로컬 변경은 유지되며, 누락되거나 잘못된 항목에는 내장 영어를 사용합니다.
# /iris language server edit ko_KR
#
# === 접두사와 메시지 예시 ===
# Iris 언어 파일에는 모든 메시지에 공통으로 쓰는 접두사 설정이 없습니다. 접두사를 붙일 메시지의 본문을 직접 수정하세요.
# 콘솔의 플러그인 접두사와 메뉴 테마는 표시 쪽에서 따로 제공하므로 이 수정으로 바뀌지 않습니다.
# 예: [iris.bukkit.commandiris] 구역의 set_debug를 다음과 같이 수정합니다.
# set_debug = "&6[월드]&r &a디버그를 {to}(으)로 설정했습니다"
# /iris debug 응답에만 [월드]가 붙습니다. {to}는 true(켜짐) 또는 false(꺼짐)입니다.
# {PC}, {SC}, {TC}는 Iris에서 지원하는 테마 변수가 아닙니다.
#
# === 색상과 서식 ===
# 기본 색상: &0 검정, &1 진한 파랑, &2 진한 초록, &3 진한 청록, &4 진한 빨강, &5 진한 보라, &6 금색, &7 회색.
# 기본 색상: &8 진한 회색, &9 파랑, &a 초록, &b 밝은 청록, &c 빨강, &d 연한 보라, &e 노랑, &f 흰색.
# 서식: &k 난독화, &l 굵게, &m 취소선, &n 밑줄, &o 기울임, &r 색상과 서식 초기화.
# 예: "&6중요: &l굵은 글씨&r 일반 글씨". Bukkit의 사용자 지정 색상 효과가 표시 색상을 바꿀 수 있습니다.
# 언어 처리기는 &#33CC99, &x33CC99, &x&3&3&C&C&9&9, [33CC99] 형식의 RGB 색상을 인식합니다.
# 하지만 Bukkit의 기본 색상 처리에서 원래 RGB 값이 유지되지 않을 수 있으므로 모든 출력의 정확한 색상을 보장하지 않습니다.
# 모드 명령어, 도움말, 클라이언트 화면 등은 서식을 제거한 번역을 사용하고 화면 자체의 색상과 서식을 유지합니다.
#
# === TOML 이스케이프 ===
# 큰따옴표로 감싼 TOML 문자열에서 \"는 따옴표, \\는 백슬래시, \n은 줄바꿈입니다.
# 언어 처리 단계에서 & 또는 [를 이스케이프해도 이후 Bukkit 처리가 &a 등을 다시 색상으로 해석할 수 있습니다.
# 백슬래시만으로 모든 출력 위치의 색상 처리를 끌 수 있는 것은 아닙니다.
#
# === 변수 ===
# 변수 이름을 바꾸지 말고 각 메시지에 원래 있는 변수만 사용하세요. 아래는 각 값의 의미입니다.
#   {MAXAUTOSELECTVOLUME}  오브젝트 자동 선택에 허용되는 최대 블록 수.
#   {MAXSAVEVOLUME}  저장할 오브젝트 선택 영역의 최대 블록 수.
#   {MAXSPAN}  구조물 캡처 시 허용되는 너비·높이·깊이의 상한(블록).
#   {NATIVESTRUCTURELOCATERADIUS}  네이티브 구조물의 최대 검색 반경(청크).
#   {ROOTPERMISSION}  명령어 사용에 필요한 최상위 권한.
#   {WORKSPACENAME}  검색할 Studio 작업 공간 폴더 이름.
#   {WORLDPACKNAME}  생성된 월드 데이터 팩 이름.
#   {active}  현재 실행 중인 작업자 수.
#   {activeLocale}  요청한 언어를 선택할 수 없을 때 유지되는 언어.
#   {activeMax}  불러온 차원 유형의 높이 범위 상한.
#   {activeMin}  불러온 차원 유형의 높이 범위 하한.
#   {actualReverts}  실제로 되돌린 오브젝트 붙여넣기 횟수.
#   {afb}  엔진 처리 시간 라벨에서 괄호 뒤에 오는 서식 지정 텍스트.
#   {after}  변경 후 값 또는 수리 후에도 연결되지 않은 나무 블록 수.
#   {amount}  보고서에서 지정한 항목의 수량.
#   {applied}  작업 결과가 적용된 청크 수.
#   {argument}  허용되지 않은 명령어 인수.
#   {available}  생성할 수 있는 네이티브 구조물 수.
#   {bar}  이미 서식이 적용된 진행률 막대 텍스트.
#   {befb}  엔진 처리 시간 라벨에서 괄호 앞에 오는 서식 지정 텍스트.
#   {before}  변경 전 값 또는 수리 전에 연결되지 않았던 나무 블록 수.
#   {biome}  표시 중인 생물 군계의 이름 또는 식별자.
#   {block}  조사 중인 블록의 종류 또는 설명.
#   {blockX}  블록 또는 순간 이동 목적지의 X 좌표.
#   {blockY}  블록 또는 순간 이동 목적지의 Y 좌표.
#   {blockZ}  블록 또는 순간 이동 목적지의 Z 좌표.
#   {blocking}  팩을 불러오지 못하게 하는 검증 오류 수.
#   {blocks}  가져온 그룹에 포함된 블록 변형 수.
#   {bpp}  Vision에서 한 픽셀이 나타내는 월드 블록 수.
#   {branches}  나무 오브젝트 수리 중 추가된 가지 수.
#   {broken}  검증에 실패한 팩 수.
#   {brokenTotal}  검증에 실패한 팩의 총수.
#   {cave}  조사 위치의 동굴 생물 군계 또는 동굴 설명.
#   {centerX}  영역 중심의 X 좌표. 단위는 해당 작업 메시지를 따릅니다.
#   {centerZ}  영역 중심의 Z 좌표. 단위는 해당 작업 메시지를 따릅니다.
#   {changed}  처리한 오브젝트 중 변경된 수.
#   {chunk}  보고 대상 청크의 좌표 또는 식별 라벨.
#   {chunkX}  블록이 아닌 청크 단위의 X 좌표.
#   {chunkZ}  블록이 아닌 청크 단위의 Z 좌표.
#   {chunks}  작업에 포함된 청크 수.
#   {clampedY}  허용 높이 범위로 조정한 순간 이동 목적지의 Y 좌표.
#   {command}  명령어 이름 또는 실행할 전체 명령어.
#   {converted}  나무 수리 중 나무 블록으로 변환된 잎 블록 수.
#   {count}  주변 문장에서 가리키는 항목·메시지·플레이어 수.
#   {current}  현재 진행 수 또는 이번 비교에 포함된 청크 수.
#   {currentStage}  Studio의 현재 불러오기 단계 이름.
#   {d}  오브젝트 깊이(블록).
#   {depth}  지표면 아래로 내려간 블록 수.
#   {derivative}  지표 생물 군계와 관련된 파생 생물 군계 또는 변형.
#   {detail}  조사 대상 또는 현재 진행 단계의 추가 설명.
#   {diffs}  생성 결과 사이에서 발견한 차이 수.
#   {dimKey}  패키징할 차원의 식별자.
#   {dimension}  메시지에서 다루는 차원의 이름 또는 식별자.
#   {dimensionId}  불러왔거나 요청한 차원의 등록 식별자.
#   {dimensionId2}  제안된 삭제 명령어에 다시 쓰이는 차원 식별자.
#   {dimm}  Studio 차원 식별자 또는 검증 명령어에서 쓰는 팩 이름.
#   {disabled}  생성이 비활성화된 네이티브 구조물 수.
#   {distances}  나무 수리 중 변경된 잎 거리 값 수.
#   {done}  지금까지 완료한 작업 항목 수.
#   {downloadSource}  팩 다운로드 원본 또는 선택한 참조.
#   {downloadable}  가져올 팩 또는 다운로드 가능한 프로젝트.
#   {dumpPath}  저장된 정리 또는 복원 데이터 위치.
#   {duration}  서식이 적용된 작업 소요 시간.
#   {e}  구조물 템플릿 검사 실패 시의 예외 텍스트.
#   {elapsed}  작업 시작 이후의 경과 시간(서식 적용).
#   {engines}  활성 Iris 생성 엔진 또는 차원 수.
#   {entity}  조사 중인 생성기에 설정된 개체 종류.
#   {error}  발생한 오류의 상세 내용.
#   {errorMessage}  실패 메시지 뒤에 붙는 선택적 오류 상세 내용.
#   {eta}  서식이 적용된 예상 남은 시간. 메시지에 따라 라벨도 포함합니다.
#   {failed}  실패한 항목 수 또는 진행 제목에 붙일 실패 문구.
#   {failure}  검색 또는 작업이 실패한 이유.
#   {failures}  실패 작업 수 또는 선택적인 서식 지정 실패 요약.
#   {file}  작업 대상 파일의 이름 또는 경로.
#   {filter}  Iris 차원 목록을 거르는 검색어.
#   {fps}  현재 미리보기 렌더링 속도(초당 프레임).
#   {g}  이전 패키징 진행 보고 이후 기록한 오브젝트 파일 수.
#   {generated}  지금까지 생성한 청크 수.
#   {generator}  탐색기에 표시할 노이즈 생성기 이름.
#   {generatorKey}  요청한 노이즈 생성기 식별자.
#   {get}  변환에 성공한 스키매틱 수.
#   {golden}  저장된 비교 기준 데이터에 포함된 청크 수.
#   {goldenDimension}  기준 데이터에 저장된 차원 식별자.
#   {goldenSeed}  기준 데이터에 저장된 월드 시드.
#   {goldenVersion}  기준 데이터 생성에 사용한 Minecraft 버전.
#   {group}  언어 편집기의 메시지 그룹 또는 가져온 오브젝트의 분류.
#   {guiNote}  사전 생성 진행 창에 관한 선택적 안내.
#   {h}  오브젝트 높이(블록).
#   {hash}  비교 중인 생성 청크들의 통합 체크섬.
#   {health}  조사 중인 개체의 현재 체력.
#   {height}  문장에서 지정한 지형 높이, 전체 높이 또는 표시 영역 높이.
#   {hours}  서식 지정 시간의 시간 단위 부분.
#   {i}  엔진 표시 이름 또는 명령어 목록 템플릿의 항목.
#   {id}  조사 중인 생물 군계의 레지스트리 ID.
#   {imported}  가져오기에 성공한 구조물 또는 오브젝트 수.
#   {includeNonJigsaw}  직소 조각을 쓰지 않는 구조물도 가져올지 여부.
#   {iris}  Iris 생성을 사용하는 불러온 차원 수.
#   {irisLevels}  팩 높이와 대조한 불러온 Iris 차원 수.
#   {irisPlaced}  네이티브 생성 대신 Iris가 배치한 구조물 수.
#   {job}  완료된 백그라운드 작업 이름.
#   {k}  지역 분포 보고서의 지역 로드 키.
#   {key}  주변 문장이 가리키는 매개변수·메시지·리소스 식별자.
#   {key2}  제안된 위치 찾기 명령어에 다시 쓰이는 구조물 식별자.
#   {keyString}  가져올 구조물·리소스의 식별자 또는 잘못되었다고 보고된 식별자.
#   {label}  찾은 대상의 표시 이름.
#   {line}  언어 편집기의 줄 번호.
#   {locale}  en_US 또는 de_DE 같은 언어 식별자.
#   {logicalWorldName}  명령어 대상 월드의 논리적 이름.
#   {loot}  조사 중인 전리품 표의 식별자.
#   {m}  대피 작업의 추가 메시지 또는 명령어의 무시된 매개변수 문구.
#   {mantleStatus}  재생성 비교 전 생성 데이터를 초기화한 결과.
#   {marker}  검색할 마커 이름.
#   {material}  조사 중인 블록의 Minecraft 재질.
#   {maxScale}  요청 배율을 제한한 뒤의 오브젝트 최대 배율.
#   {maxX}  표시 중인 청크 범위의 X 상한.
#   {maxY}  월드 높이 범위의 상한.
#   {maxZ}  표시 중인 청크 범위의 Z 상한.
#   {maximum}  문장에서 지정한 최대 입력 길이 또는 개체의 최대 체력.
#   {mcmeta}  생성된 데이터 팩의 pack.mcmeta 파일 경로.
#   {message}  작업이 제공하는 자세한 상태 또는 오류 텍스트.
#   {method}  선택한 사전 생성 방식.
#   {minX}  표시 중인 청크 범위의 X 하한.
#   {minY}  월드 높이 범위의 하한.
#   {minZ}  표시 중인 청크 범위의 Z 하한.
#   {minutes}  서식 지정 시간의 분 단위 부분.
#   {mismatches}  저장된 기준 데이터와 다른 청크 수.
#   {mode}  선택한 가져오기·생성·미리보기 모드.
#   {modeNote}  선택한 사전 생성 모드의 선택적 설명.
#   {name}  메시지가 가리키는 월드·오브젝트·프로젝트·항목의 이름.
#   {nameRaw}  정규화·검증 전의 입력한 그대로의 이름.
#   {normalized}  찾을 수 없었던 정규화된 도움말 섹션 이름.
#   {num}  엔진 처리 시간 라벨의 서식 지정 괄호 부분. 숫자일 필요는 없습니다.
#   {object}  편집하거나 조사할 Iris 오브젝트의 이름·식별자.
#   {objects}  조사 중인 청크의 오브젝트 목록 또는 개수.
#   {offset}  지표면에서의 수직 거리(블록).
#   {output}  기록하지 못한 출력 파일 경로.
#   {overall}  전체 사전 생성 작업의 평균 초당 청크 수.
#   {ownerName}  Studio 세션 소유 플레이어 이름.
#   {pack}  작업 대상 Iris 팩의 이름 또는 식별자.
#   {pack2}  제안 명령어나 다운로드 원본에 다시 쓰이는 팩 식별자.
#   {packDimension}  팩에서 선택한 차원 정의.
#   {packLogical}  팩의 차원 정의가 요구하는 논리적 높이.
#   {packMax}  팩이 요구하는 높이 상한.
#   {packMin}  팩이 요구하는 높이 하한.
#   {packName}  검증 중인 팩의 표시 이름.
#   {parameter}  누락되었거나 해석할 수 없는 명령어 매개변수.
#   {parent}  상위 메뉴 또는 명령어 경로의 표시 이름.
#   {path}  저장·열기·보고 대상 파일의 경로.
#   {percent}  진행률. 메시지의 % 기호는 변수 밖에 두세요.
#   {permission}  요청한 작업에 필요한 권한 노드.
#   {personal}  플레이어에게 저장된 개인 언어 식별자.
#   {phase}  현재 불러오기 또는 다운로드 단계 이름.
#   {pinned}  나무 오브젝트 수리 중 고정된 잎 수.
#   {player}  따라가거나 대상으로 지정한 플레이어 이름.
#   {plugin}  플러그인 표시 이름. Iris의 공통 언어·진단 메시지에서는 Iris.
#   {position}  설정할 선택 영역 모서리 번호.
#   {preset}  주 월드에 사용하는 등록된 월드 생성 프리셋.
#   {primary}  설정된 주 월드의 식별자.
#   {processed}  성공·건너뜀·실패를 포함한 처리 항목 수.
#   {properties}  조사 중인 블록의 서식 지정 속성 목록.
#   {quarantinePath}  정리 중 격리한 파일을 담은 폴더.
#   {queued}  실행 대기 중인 작업자 또는 작업 항목 수.
#   {radius}  제안된 시작 명령어에 다시 쓰이는 사전 생성 반경.
#   {rarity}  지정한 지역 또는 배치에 설정된 희귀도.
#   {rate}  서식 지정 전송 속도 또는 사전 생성 속도. 초당 단위는 주변 문장이 붙입니다.
#   {reach}  나무 오브젝트 수리에 쓰는 설정된 가지 검색 거리.
#   {ready}  현재 사용할 수 있는 정밀 Atlas 페이지 수.
#   {reason}  요청한 작업을 끝내지 못한 이유.
#   {region}  조사 중인 지역의 이름 또는 식별자.
#   {remaining}  표시 목록에서 생략한 추가 블록 상태 수.
#   {repository}  압축을 푸는 저장소 또는 다운로드한 압축 파일.
#   {reverted}  되돌린 오브젝트 붙여넣기 횟수.
#   {rotation}  배치한 오브젝트에 적용한 회전.
#   {rx}  해시를 계산할 청크의 X 좌표.
#   {rz}  해시를 계산할 청크의 Z 좌표.
#   {s}  새 Studio 프로젝트 이름.
#   {safeName}  가져올 오브젝트에 사용하는 정제된 파일 이름.
#   {scale}  미리보기 한 픽셀이 나타내는 월드 블록 수.
#   {scope}  Object Studio에서 연 오브젝트 또는 오브젝트 그룹.
#   {searchRadius}  구조물 검증의 검색 반경(청크).
#   {seconds}  시간의 초 단위 부분 또는 마지막 갱신 이후의 초.
#   {section}  사용자가 요청한 도움말 섹션 이름.
#   {seed}  월드·Studio·생성기·기준 비교에 사용하는 시드.
#   {seedRaw}  검증 전 입력한 그대로의 시드.
#   {sixtySecond}  최근 60초 구간의 사전 생성 속도(초당 청크).
#   {size}  문장에서 지정한 파일·경고·항목 등의 수.
#   {skipped}  작업에서 건너뛴 항목 수.
#   {slope}  조사 위치의 지형 경사.
#   {solidBlocks}  생성 해시 계산에서 센 고체 블록 수.
#   {source}  진행 표시에 해당하는 팩·다운로드 원본·입력.
#   {speed}  서식 지정 사전 생성 또는 처리 속도(초당).
#   {stage}  현재 진행 단계 이름.
#   {state}  문장에서 지정한 현재 상태 또는 속성 값.
#   {status}  현재 미리보기 상태 텍스트.
#   {structure}  위치를 찾는 구조물의 이름 또는 식별자.
#   {structureKey}  요청한 구조물의 레지스트리 또는 팩 식별자.
#   {summary}  완료한 작업의 서식 지정 결과 요약.
#   {suppressed}  Iris 배치로 대체된 네이티브 구조물 수.
#   {surface}  제안된 순간 이동 명령어에 쓰이는 지표 Y 좌표.
#   {surfaceY}  조사 위치의 지표 Y 좌표.
#   {tag}  팩 이름 앞에 붙이는 서식 지정 검증 상태 라벨.
#   {target}  문장에서 지정한 언어 설정 대상 또는 오브젝트 선택 대상.
#   {targetX}  찾았거나 요청한 목적지의 X 좌표.
#   {targetZ}  찾았거나 요청한 목적지의 Z 좌표.
#   {template}  프로젝트 생성 시 선택한 템플릿.
#   {tenSecond}  최근 10초 구간의 사전 생성 속도(초당 청크).
#   {thirtySecond}  최근 30초 구간의 사전 생성 속도(초당 청크).
#   {threads}  생성 해시 계산에 사용하는 작업 스레드 수.
#   {tileNote}  저장하거나 배치한 블록 개체 데이터의 선택적 설명.
#   {title}  결과를 표시할 작업의 제목.
#   {to}  새 디버그 설정. true는 켜짐, false는 꺼짐.
#   {token}  해석할 수 없었던 reach 인수.
#   {total}  문장에서 지정한 작업 항목·청크·차원 등의 총수.
#   {totalObjects}  Object Studio에서 연 오브젝트 수.
#   {transferred}  지금까지 전송한 데이터 양(서식 적용).
#   {type}  문장에서 지정한 예상 매개변수 형식·리소스 종류·오브젝트 분류.
#   {typeKey}  등록된 Minecraft 차원 유형 식별자 또는 inline.
#   {unreachableBiomes}  팩의 생물 군계 선택으로 제외된 네이티브 구조물 수.
#   {unsupported}  이 플랫폼에서 미지원으로 보고된 네이티브 구조물 수.
#   {updates}  개발자 화면의 초당 블록 갱신 수.
#   {url}  열거나 복사할 웹 주소.
#   {usage}  명령어 구문 또는 메모리 화면의 사용량 텍스트.
#   {used}  메모리 화면의 사용 중인 용량(서식 적용).
#   {value}  메시지별 값. 기본 설정·이름·좌표·개수·오류 등이며 주변 문장을 확인하세요.
#   {value2}  메시지별 두 번째 값. 전체 청크 수·목적지 Y·팩 이름·오류 등입니다.
#   {value3}  메시지별 세 번째 값. 백분율·목적지 Z·Minecraft 버전·경과 시간 등입니다.
#   {value4}  메시지별 네 번째 값. 블록 기록 수·선택 영역 Z·선택적 상태 접미사 등입니다.
#   {value5}  메시지별 다섯 번째 값. 배치 시 공기가 아닌 블록 기록 수 또는 위치 표시의 청크 Z입니다.
#   {variables}  편집 중인 메시지에서 쓸 수 있는 자리표시자 목록.
#   {velocity}  조사 중인 개체의 현재 이동 속도.
#   {version}  주변 문장이 가리키는 플러그인 또는 Minecraft 버전.
#   {volume}  오브젝트 선택 영역에 포함된 블록 수.
#   {w}  오브젝트 너비(블록).
#   {wantVariants}  가져올 바닐라 나무 또는 오브젝트 기능마다 요청한 변형 수.
#   {warnings}  작업을 막지 않는 검증 경고 수.
#   {width}  표시 중인 월드 영역 너비(블록).
#   {wood}  나무 오브젝트 수리 중 추가된 나무 블록 수.
#   {world}  명령어 또는 진행 표시 대상 월드 이름.
#   {written}  기록에 성공한 가져온 변형 또는 오브젝트 파일 수.
#   {x}  문장에서 지정한 블록·청크·지역·미리보기의 X 좌표.
#   {y}  월드 또는 블록의 수직 좌표.
#   {z}  문장에서 지정한 블록·청크·지역·미리보기의 Z 좌표.
#   {zoom}  현재 미리보기 확대/축소 수준.
# === End Iris language guide ===

