# === Iris language guide ===
# Iris - lt_LT
#
# === Failo redagavimas ===
# languages/lt_LT.toml
# Redaguokite šį failą tiesiogiai. Vietiniai pranešimų pakeitimai išsaugomi; trūkstamos arba netinkamos reikšmės naudoja integruotą anglų tekstą.
# /iris language server edit lt_LT
#
# === Priešdėliai ===
# Bendros visų pranešimų priešdėlio nuostatos nėra. Pranešimo pradžioje įrašytas priešdėlis keičia tik tą pranešimą.
# Žurnalų priešdėliai ir meniu temos nustatomi atskirai.
# Pavyzdys: raskite skyrių [iris.bukkit.commandiris] ir pakeiskite esamą set_debug reikšmę:
# set_debug = "&6[Pasauliai]&r &aDiagnostikos reikšmė: {to}"
# {to} gauna true (įjungta) arba false (išjungta); kintamojo pavadinimo nekeiskite.
#
# === Spalvos ir stiliai ===
# &0 juoda; &1 tamsiai mėlyna; &2 tamsiai žalia; &3 tamsiai žydra
# &4 tamsiai raudona; &5 tamsiai violetinė; &6 auksinė; &7 pilka
# &8 tamsiai pilka; &9 mėlyna; &a žalia; &b žydra
# &c raudona; &d šviesiai violetinė; &e geltona; &f balta
# &k atsitiktiniai simboliai; &l paryškinimas; &m perbraukimas; &n pabraukimas; &o kursyvas; &r spalvos ir stilių atkūrimas
# Pavyzdžiai: &aParuošta&r, &cKlaida&r, &6&lĮspėjimas&r, &nPabraukta&r.
# Kalbos sluoksnis atpažįsta RGB formas: &#55FF55, &x55FF55, &x&5&5&F&F&5&5 ir [55FF55].
# RGB pavyzdys: &#55FF55Žalias tekstas&r. Vėlesnis Bukkit apdorojimas ir temos gali pakeisti RGB spalvas.
# Modifikuotų serverių komandos, pagalba ir kliento ekranai naudoja paprastą išverstą tekstą bei savo vietinius stilius.
# Paprasto teksto rodinys pašalina formatavimą; kalbos failo spalvos nebūtinai valdo sąsajos stilių.
#
# === TOML teksto reikšmės ===
# Dvigubose kabutėse \n reiškia naują eilutę, \" įterpia kabutę, o \\ įterpia vieną atvirkštinį brūkšnį.
# Pavyzdys: "1 eilutė\n2 eilutė: \"citata\"; kelias C:\\Iris".
#
# === Kintamieji ===
