#   {value}  Nuo pranešimo priklausanti reikšmė: numatytoji nuostata, vardas, koordinatė, kiekis arba klaida; žiūrėkite gretimą tekstą.
#   {value2}  Antroji pranešimo reikšmė, pavyzdžiui, bendras chunk skaičius, tikslo Y, pack vardas arba klaida.
#   {value3}  Trečioji pranešimo reikšmė, pavyzdžiui, procentas, tikslo Z, Minecraft versija arba praėjęs laikas.
#   {value4}  Ketvirtoji reikšmė: blokų įrašymai, atrankos Z koordinatė arba neprivaloma būsenos priesaga.
#   {value5}  Penktoji reikšmė: ne oro blokų įrašymai dedant objektą arba chunk Z vietos šablone.
#   {variables}  Redaguojamam pranešimui prieinamų kintamųjų sąrašas.
#   {velocity}  Tikrinamos esybės dabartinis judėjimo greitis.
#   {version}  Aplinkiniame pranešime nurodyta papildinio arba Minecraft versija.
#   {volume}  Objekto atrankoje esančių blokų skaičius.
#   {w}  Objekto plotis blokais.
#   {wantVariants}  Prašomi variantai kiekvienam importuotam vanilla medžiui arba objekto ypatybei.
#   {warnings}  Įkėlimo neblokuojančių patikros įspėjimų skaičius.
#   {width}  Rodomos pasaulio srities plotis blokais.
#   {wood}  Taisant medžio objektą pridėtų medienos blokų skaičius.
#   {world}  Komandos arba eigos rodinio tikslinio pasaulio pavadinimas.
#   {written}  Sėkmingai įrašytų importuotų variantų arba objektų failų skaičius.
#   {x}  Pranešime nurodyto bloko, chunk, regiono arba peržiūros X koordinatė.
#   {y}  Vertikali pasaulio arba bloko koordinatė.
#   {z}  Pranešime nurodyto bloko, chunk, regiono arba peržiūros Z koordinatė.
#   {zoom}  Dabartinis peržiūros mastelio lygis.
# === End Iris language guide ===

