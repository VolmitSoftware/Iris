"director.import_every_structure_vanilla_ingested_datapacks_into_this_pack_as_editable_iris" = "Importeer ELKE structuur - vanilla EN verwerkte datapacks - in dit pakket als bewerkbare Iris-resources, altijd met overschrijven. Bouwt jigsaw-structuren (dorpen, buitenposten, datapack-jigsaws) opnieuw op als bewerkbare pool/stuk-grafen, importeert elk NBT-structuursjabloon als object en stelt de structuren met meerdere sjablonen samen (scheepswrakken, verwoeste portalen, oceaanruïnes, Nether-fossielen). Voer dit uit nadat je een datapack hebt verwerkt en de server hebt herstart. Regenereer chunks of gebruik een nieuwe wereld zodat de geïmporteerde kopieën geplaatst worden."
