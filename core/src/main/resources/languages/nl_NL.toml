# === Iris language guide ===
# Iris - nl_NL
#
# === Bestand bewerken ===
# languages/nl_NL.toml
# Je kunt dit bestand rechtstreeks bewerken. Lokale wijzigingen blijven behouden; ontbrekende of ongeldige vermeldingen gebruiken het ingebouwde Engels.
# /iris language server edit nl_NL
#

# === Voorvoegsel en voorbeeld ===
# Iris heeft geen algemeen taalvoorvoegsel. Een letterlijk voorvoegsel in één bericht geldt alleen voor dat bericht.
# De plugintag in de console en de thema’s voor menu’s en hulp worden apart ingesteld.
# Voorbeeld: wijzig set_debug in de bestaande sectie [iris.bukkit.commandiris]:
# [iris.bukkit.commandiris]
# set_debug = "&6[Werelden]&r &aDebug ingesteld op: {to}"
# Alleen dit debugbericht krijgt het voorvoegsel [Werelden]. {to} wordt vervangen door true (ingeschakeld) of false (uitgeschakeld).
#
# === Kleuren en opmaak ===
# Klassieke kleuren: &0 zwart, &1 donkerblauw, &2 donkergroen, &3 donkerturkoois,
# &4 donkerrood, &5 donkerpaars, &6 goud, &7 grijs, &8 donkergrijs,
# &9 blauw, &a groen, &b turkoois, &c rood, &d lichtpaars, &e geel, &f wit.
# Stijlen: &k onleesbaar, &l vet, &m doorgestreept, &n onderstreept, &o cursief, &r herstellen.
# De taalverwerking accepteert RGB in de vormen &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B en [RRGGBB].
# Bukkit-thema’s die daarna worden toegepast, kunnen RGB-kleuren veranderen. Modded- en plattetekstweergaven gebruiken hun eigen stijlen.
# In TOML-teksten tussen dubbele aanhalingstekens staat \n voor een nieuwe regel, \" voor een aanhalingsteken en \\ voor een letterlijke backslash.
#
# === Variabelen ===
# Gebruik alleen de variabelen die al in het betreffende bericht staan en laat hun namen ongewijzigd.
# PC, SC en TC zijn geen Iris-themavariabelen. Deze woordenlijst staat niet toe om extra variabelen aan andere berichten toe te voegen.
#   {MAXAUTOSELECTVOLUME}  Maximaal aantal blokken in een automatisch geselecteerd object.
#   {MAXSAVEVOLUME}  Maximaal aantal blokken in een opgeslagen objectselectie.
#   {MAXSPAN}  Maximale breedte, hoogte of diepte van een structuur bij het vastleggen, in blokken.
#   {NATIVESTRUCTURELOCATERADIUS}  Maximale zoekstraal voor native structuren, in chunks.
#   {ROOTPERMISSION}  Hoofdmachtiging die nodig is om het commando te gebruiken.
#   {WORKSPACENAME}  Naam van de Studio-werkmap waarnaar wordt gezocht.
#   {WORLDPACKNAME}  Naam van het gegenereerde werelddatapack.
#   {active}  Aantal actieve werktaken.
#   {activeLocale}  Taal die actief blijft als de aangevraagde taal niet kan worden gekozen.
#   {activeMax}  Bovengrens van het hoogtebereik van het geladen dimensietype.
#   {activeMin}  Ondergrens van het hoogtebereik van het geladen dimensietype.
#   {actualReverts}  Aantal daadwerkelijk ongedaan gemaakte objectplaatsingen.
#   {afb}  Opgemaakt deel van een motortijdmetingslabel na het gedeelte tussen vierkante haken.
#   {after}  Waarde na de wijziging, of boomblokken die na reparatie nog onbereikbaar zijn.
#   {amount}  Hoeveelheid bij de genoemde vermelding in het rapport.
#   {applied}  Aantal chunks waarvan het verwerkingsresultaat is toegepast.
#   {argument}  Commandoargument dat niet kon worden geaccepteerd.
#   {available}  Aantal native structuren dat kan worden gegenereerd.
#   {bar}  Reeds opgemaakte tekst van de voortgangsbalk.
#   {befb}  Opgemaakt deel van een motortijdmetingslabel vóór het gedeelte tussen vierkante haken.
#   {before}  Waarde vóór de wijziging, of onbereikbare boomblokken vóór reparatie.
#   {biome}  Naam of identificatie van het getoonde bioom.
#   {block}  Type of beschrijving van het onderzochte blok.
#   {blockX}  X-coördinaat van het blok of de teleportbestemming.
#   {blockY}  Y-coördinaat van het blok of de teleportbestemming.
#   {blockZ}  Z-coördinaat van het blok of de teleportbestemming.
#   {blocking}  Aantal validatiefouten dat het laden van het pakket verhindert.
#   {blocks}  Aantal blokvarianten in de geïmporteerde groep.
#   {bpp}  Aantal wereldblokken dat één pixel in Vision weergeeft.
#   {branches}  Aantal takken dat bij het repareren van boomobjecten is toegevoegd.
#   {broken}  Aantal pakketten waarvoor de validatie is mislukt.
#   {brokenTotal}  Totaal aantal pakketten waarvoor de validatie is mislukt.
#   {cave}  Grotbioom of grotbeschrijving op de onderzochte positie.
#   {centerX}  X-coördinaat van het midden van het gebied; de eenheid volgt uit het bericht.
#   {centerZ}  Z-coördinaat van het midden van het gebied; de eenheid volgt uit het bericht.
#   {changed}  Aantal verwerkte objecten dat is gewijzigd.
#   {chunk}  Coördinaten of identificerend label van de gemelde chunk.
#   {chunkX}  X-coördinaat uitgedrukt in chunks, niet in blokken.
#   {chunkZ}  Z-coördinaat uitgedrukt in chunks, niet in blokken.
#   {chunks}  Aantal chunks dat bij de bewerking betrokken is.
#   {clampedY}  Y-coördinaat van de teleportbestemming na aanpassing aan het toegestane hoogtebereik.
#   {command}  Commandonaam of volledig uit te voeren commando.
#   {converted}  Aantal bladblokken dat bij boomreparatie in hout is omgezet.
#   {count}  Aantal vermeldingen, berichten of spelers dat in de omringende tekst wordt genoemd.
#   {current}  Huidige voortgangsteller of aantal chunks in de huidige vergelijking.
#   {currentStage}  Naam van de huidige laadfase van Studio.
#   {d}  Diepte van het object in blokken.
#   {depth}  Aantal blokken onder het terreinoppervlak.
#   {derivative}  Afgeleid bioom of variant van het oppervlaktebioom.
#   {detail}  Aanvullende beschrijving van het onderzochte object of de huidige voortgangsfase.
#   {diffs}  Aantal gevonden verschillen tussen de gegenereerde resultaten.
#   {dimKey}  Identificatie van de dimensie die wordt verpakt.
#   {dimension}  Naam of identificatie van de dimensie waarover het bericht gaat.
#   {dimensionId}  Geregistreerde identificatie van de geladen of aangevraagde dimensie.
#   {dimensionId2}  Dimensie-identificatie die in het voorgestelde verwijdercommando wordt herhaald.
#   {dimm}  Identificatie van de Studio-dimensie, of de pakketnaam in het validatiecommando.
#   {disabled}  Aantal native structuren waarvan generatie is uitgeschakeld.
#   {distances}  Aantal gewijzigde bladafstandwaarden bij boomreparatie.
#   {done}  Aantal tot nu toe voltooide werkeenheden.
#   {downloadSource}  Bron of geselecteerde referentie voor het downloaden van het pakket.
#   {downloadable}  Pakket of downloadbaar project dat wordt geïmporteerd.
#   {dumpPath}  Locatie van opgeslagen opruim- of herstelgegevens.
#   {duration}  Opgemaakte duur van de bewerking.
#   {e}  Exceptietekst van een mislukte zoekactie naar structuursjablonen.
#   {elapsed}  Opgemaakte verstreken tijd sinds het begin van de bewerking.
#   {engines}  Aantal actieve Iris-generatiemotoren of dimensies.
#   {entity}  Entiteittype dat de onderzochte spawner heeft geselecteerd.
#   {error}  Details van de opgetreden fout.
#   {errorMessage}  Optionele foutdetails achter het belangrijkste foutbericht.
#   {eta}  Opgemaakte geschatte resterende tijd; sommige berichten leveren ook het label mee.
#   {failed}  Aantal mislukte onderdelen of vooraf opgemaakte fouttekst in voortgangstitels.
#   {failure}  Reden waarom de zoekactie of bewerking is mislukt.
#   {failures}  Aantal mislukte werkeenheden of een optioneel opgemaakt foutoverzicht.
#   {file}  Naam of pad van het bestand bij de bewerking.
#   {filter}  Tekst waarmee de lijst met Iris-dimensies wordt gefilterd.
#   {fps}  Huidige beeldsnelheid van de voorvertoning, in beelden per seconde.
#   {g}  Objectbestanden die sinds het vorige verpakkingsvoortgangsbericht zijn geschreven.
#   {generated}  Aantal tot nu toe gegenereerde chunks.
#   {generator}  Naam van de ruisgenerator in de verkenner.
#   {generatorKey}  Aangevraagde identificatie van de ruisgenerator.
#   {get}  Aantal succesvol geconverteerde schemabestanden.
#   {golden}  Aantal chunks in de opgeslagen referentievergelijking.
#   {goldenDimension}  Dimensie-identificatie die in de referentieopname is opgeslagen.
#   {goldenSeed}  Wereldseed die in de referentieopname is opgeslagen.
#   {goldenVersion}  Minecraft-versie waarmee de referentieopname is gemaakt.
#   {group}  Berichtgroep in de taaleditor of categorie van een geïmporteerd object.
#   {guiNote}  Optionele opmerking over het voortgangsvenster van voorgeneratie.
#   {h}  Hoogte van het object in blokken.
#   {hash}  Gecombineerde controlesom van de vergeleken gegenereerde chunks.
#   {health}  Huidige gezondheid van de onderzochte entiteit.
#   {height}  Terreinhoogte, totale hoogte of hoogte van het getoonde gebied, zoals genoemd in het bericht.
#   {hours}  Urenonderdeel van de opgemaakte duur.
#   {i}  Weergavenaam van de motor of een vermelding in het commandolijstsjabloon.
#   {id}  Register-ID van het onderzochte bioom.
#   {imported}  Aantal succesvol geïmporteerde structuren of objecten.
#   {includeNonJigsaw}  Of de import ook structuren zonder jigsaw-onderdelen bevat.
#   {iris}  Aantal geladen dimensies dat Iris-generatie gebruikt.
#   {irisLevels}  Aantal geladen Iris-dimensies waarvan de hoogten met het pakket worden vergeleken.
#   {irisPlaced}  Aantal structuren dat door Iris in plaats van native generatie is geplaatst.
#   {job}  Naam van de voltooide achtergrondbewerking.
#   {k}  Laadsleutel van de regio in het regioverdelingsrapport.
#   {key}  Identificatie van de parameter, het bericht of de bron in de omringende tekst.
#   {key2}  Structuuridentificatie die in het voorgestelde zoekcommando wordt herhaald.
#   {keyString}  Identificatie van de geïmporteerde of ongeldig gemelde structuur of bron.
#   {label}  Weergavenaam van het gevonden doel.
#   {line}  Regelnummer in de taaleditor.
#   {locale}  Taalidentificatie, zoals en_US of de_DE.
#   {logicalWorldName}  Logische naam van de wereld waarop het commando betrekking heeft.
#   {loot}  Identificatie van de onderzochte buittabel.
#   {m}  Extra evacuatiebericht of tekst van genegeerde parameters in dat commandosjabloon.
#   {mantleStatus}  Resultaat van het resetten van generatiegegevens vóór een vergelijking met herhaalde generatie.
#   {marker}  Naam van de gezochte markering.
#   {material}  Minecraft-materiaal van het onderzochte blok.
#   {maxScale}  Grootste toegestane objectschaal na begrenzing van de aangevraagde schaal.
#   {maxX}  Bovengrens voor X van het getoonde chunkbereik.
#   {maxY}  Bovengrens van het hoogtebereik van de wereld.
#   {maxZ}  Bovengrens voor Z van het getoonde chunkbereik.
#   {maximum}  Maximale invoerlengte of maximale entiteitsgezondheid, zoals genoemd in het bericht.
#   {mcmeta}  Pad van het pack.mcmeta-bestand van het gegenereerde datapack.
#   {message}  Gedetailleerde status- of fouttekst van de bewerking.
#   {method}  Geselecteerde voorgeneratiemethode.
#   {minX}  Ondergrens voor X van het getoonde chunkbereik.
#   {minY}  Ondergrens van het hoogtebereik van de wereld.
#   {minZ}  Ondergrens voor Z van het getoonde chunkbereik.
#   {minutes}  Minutenonderdeel van de opgemaakte duur.
#   {mismatches}  Aantal chunks dat van de opgeslagen referentie afwijkt.
#   {mode}  Geselecteerde import-, generatie- of voorvertoningsmodus.
#   {modeNote}  Optionele uitleg van de geselecteerde voorgeneratiemodus.
#   {name}  Naam van de wereld, het object, het project of de vermelding in het bericht.
#   {nameRaw}  Naam precies zoals ingevoerd, vóór normalisatie of validatie.
#   {normalized}  Genormaliseerde naam van de niet gevonden helpsectie.
#   {num}  Opgemaakt gedeelte tussen vierkante haken van een motortijdmetingslabel; niet noodzakelijk een getal.
#   {object}  Naam of identificatie van het bewerkte of onderzochte Iris-object.
#   {objects}  Objectlijst of aantal objecten in de onderzochte chunk.
#   {offset}  Verticale afstand tot het terreinoppervlak, in blokken.
#   {output}  Pad van het uitvoerbestand dat niet kon worden geschreven.
#   {overall}  Gemiddeld aantal voorgeneratiechunks per seconde over de hele bewerking.
#   {ownerName}  Naam van de speler die eigenaar is van de Studio-sessie.
#   {pack}  Naam of identificatie van het Iris-pakket bij de bewerking.
#   {pack2}  Pakketidentificatie die wordt herhaald in een voorgesteld commando of een downloadbron.
#   {packDimension}  Dimensiedefinitie die uit het pakket is gekozen.
#   {packLogical}  Logische hoogte die de dimensiedefinitie van het pakket vraagt.
#   {packMax}  Bovengrens van de hoogte die het pakket vraagt.
#   {packMin}  Ondergrens van de hoogte die het pakket vraagt.
#   {packName}  Weergavenaam van het pakket dat wordt gevalideerd.
#   {parameter}  Ontbrekende of niet te verwerken commandoparameter.
#   {parent}  Weergavenaam van het bovenliggende menu of commandopad.
#   {path}  Pad van het bestand dat wordt opgeslagen, geopend of gemeld.
#   {percent}  Voortgangspercentage; laat het procentteken van het bericht buiten de variabele staan.
#   {permission}  Machtigingssleutel die voor de aangevraagde actie nodig is.
#   {personal}  Opgeslagen persoonlijke taalidentificatie van de speler.
#   {phase}  Naam van de huidige laad- of downloadfase.
#   {pinned}  Aantal vastgezette bladblokken bij het repareren van een boomobject.
#   {player}  Naam van de gevolgde of geselecteerde speler.
#   {plugin}  Weergavenaam van de plugin; Iris in de gedeelde taal- en diagnoseberichten van Iris.
#   {position}  Nummer van de selectiehoek die wordt ingesteld.
#   {preset}  Geregistreerde wereldgeneratievoorinstelling voor de hoofdwereld.
#   {primary}  Identificatie van de ingestelde hoofdwereld.
#   {processed}  Aantal verwerkte onderdelen, inclusief geslaagde, overgeslagen en mislukte onderdelen.
#   {properties}  Opgemaakte eigenschappenlijst van het onderzochte blok.
#   {quarantinePath}  Map met de bij het opruimen in quarantaine geplaatste bestanden.
#   {queued}  Aantal werktaken of werkeenheden dat op uitvoering wacht.
#   {radius}  Voorgeneratiestraal die in het voorgestelde startcommando wordt herhaald.
#   {rarity}  Ingestelde zeldzaamheidswaarde van de genoemde regio of plaatsing.
#   {rate}  Opgemaakte overdrachts- of voorgeneratiesnelheid; het bericht voegt de aanduiding per seconde toe.
#   {reach}  Ingesteld zoekbereik voor takken bij het repareren van boomobjecten.
#   {ready}  Aantal exacte Atlas-pagina’s dat momenteel beschikbaar is.
#   {reason}  Uitleg waarom de aangevraagde actie niet kon worden voltooid.
#   {region}  Naam of identificatie van de onderzochte regio.
#   {remaining}  Aantal extra bloktoestanden dat niet in de getoonde lijst staat.
#   {repository}  Repository of gedownload archief dat wordt uitgepakt.
#   {reverted}  Aantal ongedaan gemaakte objectplaatsingen.
#   {rotation}  Rotatie die op het geplaatste object is toegepast.
#   {rx}  X-coördinaat van de chunk waarvan de hash wordt berekend.
#   {rz}  Z-coördinaat van de chunk waarvan de hash wordt berekend.
#   {s}  Naam van het nieuwe Studio-project.
#   {safeName}  Opgeschoonde bestandsnaam van het geïmporteerde object.
#   {scale}  Aantal wereldblokken dat één voorvertoningspixel weergeeft.
#   {scope}  Object of objectgroep die in Object Studio is geopend.
#   {searchRadius}  Zoekstraal voor structuurcontrole, in chunks.
#   {seconds}  Secondenonderdeel van een duur of tijd sinds de laatste update.
#   {section}  Naam van de helpsectie die de gebruiker heeft aangevraagd.
#   {seed}  Seed voor de wereld, Studio-sessie, generator of referentievergelijking.
#   {seedRaw}  Seed precies zoals ingevoerd, vóór validatie.
#   {sixtySecond}  Voorgeneratiechunks per seconde over het venster van 60 seconden.
#   {size}  Aantal bestanden, waarschuwingen, vermeldingen of onderdelen in het bericht.
#   {skipped}  Aantal onderdelen dat door de bewerking is overgeslagen.
#   {slope}  Terreinhelling op de onderzochte positie.
#   {solidBlocks}  Aantal vaste blokken dat bij het berekenen van de generatiehash is geteld.
#   {source}  Pakket, downloadbron of invoer bij de voortgangsweergave.
#   {speed}  Opgemaakte voorgeneratie- of verwerkingssnelheid per seconde.
#   {stage}  Naam van de huidige voortgangsfase.
#   {state}  Huidige toestand of eigenschapswaarde die in het bericht wordt genoemd.
#   {status}  Huidige statustekst van de voorvertoning.
#   {structure}  Naam of identificatie van de gezochte structuur.
#   {structureKey}  Register- of pakketidentificatie van de aangevraagde structuur.
#   {summary}  Opgemaakte resultaten van de voltooide bewerking.
#   {suppressed}  Aantal native structuren dat door Iris-plaatsingen is vervangen.
#   {surface}  Y-coördinaat van het oppervlak in het voorgestelde teleportcommando.
#   {surfaceY}  Y-coördinaat van het terreinoppervlak op de onderzochte positie.
#   {tag}  Opgemaakt validatiestatuslabel vóór de pakketnaam.
#   {target}  Taalontvanger of objectselectiedoel dat in het bericht wordt genoemd.
#   {targetX}  X-coördinaat van de gevonden of aangevraagde bestemming.
#   {targetZ}  Z-coördinaat van de gevonden of aangevraagde bestemming.
#   {template}  Sjabloon dat bij het maken van een project is gekozen.
#   {tenSecond}  Voorgeneratiechunks per seconde over het venster van 10 seconden.
#   {thirtySecond}  Voorgeneratiechunks per seconde over het venster van 30 seconden.
#   {threads}  Aantal werkthreads voor het berekenen van de generatiehash.
#   {tileNote}  Optionele opmerking over opgeslagen of geplaatste blokentiteitsgegevens.
#   {title}  Titel van de bewerking waarvan het resultaat wordt getoond.
#   {to}  Nieuwe debuginstelling: true voor ingeschakeld, false voor uitgeschakeld.
#   {token}  Bereikargument dat niet kon worden verwerkt.
#   {total}  Totaal aantal werkeenheden, chunks, dimensies of vermeldingen in het bericht.
#   {totalObjects}  Aantal objecten dat in Object Studio is geopend.
#   {transferred}  Opgemaakte hoeveelheid tot nu toe overgedragen gegevens.
#   {type}  Verwacht parametertype, brontype of objectcategorie die in het bericht wordt genoemd.
#   {typeKey}  Geregistreerde Minecraft-dimensietype-identificatie, of inline.
#   {unreachableBiomes}  Aantal native structuren dat door de bioomkeuze van het pakket is uitgesloten.
#   {unsupported}  Aantal native structuren dat dit platform als niet ondersteund meldt.
#   {updates}  Blokupdates per seconde in de ontwikkelaarsweergave.
#   {url}  Webadres om te openen of te kopiëren.
#   {usage}  Commandosyntaxis of geheugengebruikstekst in de geheugenweergave.
#   {used}  Opgemaakte hoeveelheid gebruikt geheugen in de geheugenweergave.
#   {value}  Berichtspecifieke waarde, zoals een standaardinstelling, naam, coördinaat, aantal of fout. Lees de omringende tekst.
#   {value2}  Tweede berichtspecifieke waarde, zoals het totaal aantal chunks, doel-Y, pakketnaam of fout. Lees de omringende tekst.
#   {value3}  Derde berichtspecifieke waarde, zoals een percentage, doel-Z, Minecraft-versie of verstreken tijd.
#   {value4}  Vierde berichtspecifieke waarde, zoals blokschrijfacties, Z-coördinaat van een selectie of optionele statustekst.
#   {value5}  Vijfde berichtspecifieke waarde: geschreven blokken die geen lucht zijn bij objectplaatsing, of chunk-Z in het positiesjabloon.
#   {variables}  Lijst met beschikbare variabelen voor het bericht dat wordt bewerkt.
#   {velocity}  Huidige bewegingssnelheid van de onderzochte entiteit.
#   {version}  Plugin- of Minecraft-versie die in het omringende bericht wordt genoemd.
#   {volume}  Aantal blokken in de objectselectie.
#   {w}  Breedte van het object in blokken.
#   {wantVariants}  Aangevraagde varianten per geïmporteerd vanilla-boom- of objectonderdeel.
#   {warnings}  Aantal niet-blokkerende validatiewaarschuwingen.
#   {width}  Breedte van het getoonde wereldgebied in blokken.
#   {wood}  Aantal houtblokken dat bij het repareren van een boomobject is toegevoegd.
#   {world}  Naam van de wereld waarop het commando of de voortgangsweergave betrekking heeft.
#   {written}  Aantal succesvol geschreven geïmporteerde varianten of objectbestanden.
#   {x}  X-coördinaat in de blok-, chunk-, regio- of voorvertoningscontext van het bericht.
#   {y}  Verticale wereld- of blokcoördinaat.
#   {z}  Z-coördinaat in de blok-, chunk-, regio- of voorvertoningscontext van het bericht.
#   {zoom}  Huidig zoomniveau van de voorvertoning.
# === End Iris language guide ===

