"director.capture_code_generated_structures_that_have_no_nbt_template_swamp_huts_igloos" = "Leg door code gegenereerde structuren zonder NBT-sjabloon (moerashutten, iglo's, enz.) vast als bewerkbare Iris-objecten door elke structuur in een tijdelijke wegwerpwereld te genereren en de blokken terug te lezen. Slaat structuren over die al als structuur worden geïmporteerd, structuren die breder/hoger zijn dan de vastleglimiet (vestingen, landhuizen en monumenten blijven vanilla) en alles wat niet in een vlakke overworld genereert. Elke vastgelegde structuur wordt een Iris-structuur uit één stuk die je kunt plaatsen vanuit een 'structures'-lijst van een biome/regio/dimensie. Wordt automatisch uitgevoerd als laatste ronde van /iris structure import."
