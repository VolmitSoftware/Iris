# === Iris language guide ===
# Iris - pl_PL
#
# === Edycja pliku ===
# languages/pl_PL.toml
# Edytuj ten plik bezpośrednio. Lokalne zmiany wiadomości są zachowywane; brakujące lub nieprawidłowe wartości korzystają z wbudowanego angielskiego tekstu.
# /iris language server edit pl_PL
#
# === Prefiksy ===
# Nie ma globalnego ustawienia prefiksu dla wszystkich wiadomości. Prefiks wpisany na początku konkretnej wiadomości zmienia tylko ją.
# Prefiksy logów i motywy menu są ustawiane osobno.
# Przykład: znajdź sekcję [iris.bukkit.commandiris] i zmień istniejącą wartość set_debug:
# set_debug = "&6[Światy]&r &aUstawiono diagnostykę na: {to}"
# {to} przyjmuje true (włączone) lub false (wyłączone); nie zmieniaj nazwy zmiennej.
#
# === Kolory i style ===
# &0 czarny; &1 ciemnoniebieski; &2 ciemnozielony; &3 ciemnoturkusowy
# &4 ciemnoczerwony; &5 ciemnofioletowy; &6 złoty; &7 szary
# &8 ciemnoszary; &9 niebieski; &a zielony; &b turkusowy
# &c czerwony; &d jasnofioletowy; &e żółty; &f biały
# &k losowe znaki; &l pogrubienie; &m przekreślenie; &n podkreślenie; &o kursywa; &r reset koloru i stylów
# Przykłady: &aGotowe&r, &cBłąd&r, &6&lOstrzeżenie&r, &nPodkreślone&r.
# Warstwa języka rozpoznaje formy RGB: &#55FF55, &x55FF55, &x&5&5&F&F&5&5 oraz [55FF55].
# Przykład RGB: &#55FF55Zielony tekst&r. Dalsze przetwarzanie i motywy Bukkit mogą zmienić kolory RGB.
# Komendy, pomoc i ekrany klienta na platformach modowanych używają zwykłego przetłumaczonego tekstu i własnych natywnych stylów.
# Widok zwykłego tekstu usuwa formatowanie; kolory pliku języka nie muszą sterować stylem interfejsu.
#
# === Tekst w TOML ===
# W podwójnych cudzysłowach \n oznacza nowy wiersz, \" wstawia cudzysłów, a \\ wstawia jeden odwrotny ukośnik.
# Przykład: "Wiersz 1\nWiersz 2: \"cytat\"; ścieżka C:\\Iris".
#
# === Zmienne ===
# Używaj tylko zmiennych należących już do danej wiadomości. Zachowaj nazwy i wielkość liter; PC, SC i TC nie są obsługiwanymi zmiennymi.
# Poniżej opisano znaczenie każdej zmiennej. Znaczenie wartości ogólnych wynika z otaczającego tekstu.
#   {MAXAUTOSELECTVOLUME}  Maksymalna liczba bloków w automatycznie wybranym obiekcie.
#   {MAXSAVEVOLUME}  Maksymalna liczba bloków w zapisywanym zaznaczeniu obiektu.
#   {MAXSPAN}  Maksymalna szerokość, wysokość lub głębokość przechwytywanej struktury w blokach.
#   {NATIVESTRUCTURELOCATERADIUS}  Maksymalny promień wyszukiwania struktur natywnych w chunkach.
#   {ROOTPERMISSION}  Główne uprawnienie wymagane do użycia komendy.
#   {WORKSPACENAME}  Nazwa przeszukiwanego katalogu przestrzeni roboczej Studio.
#   {WORLDPACKNAME}  Nazwa wygenerowanego datapacka świata.
#   {active}  Liczba aktualnie działających pracowników.
#   {activeLocale}  Język pozostający aktywny, gdy nie można wybrać żądanego języka.
#   {activeMax}  Górna granica zakresu wysokości wczytanego typu wymiaru.
#   {activeMin}  Dolna granica zakresu wysokości wczytanego typu wymiaru.
#   {actualReverts}  Liczba faktycznie cofniętych wklejeń obiektów.
#   {added}  Wiadomości dodane przez aktualizację języka.
#   {afb}  Sformatowana część etykiety czasu silnika po fragmencie w nawiasach kwadratowych.
#   {after}  Wartość po zmianie albo niedostępne bloki drzewa pozostałe po naprawie.
#   {amount}  Ilość przypisana do wskazanego wpisu raportu.
#   {applied}  Liczba chunków, dla których zastosowano wyniki pracy.
#   {argument}  Argument komendy, którego nie zaakceptowano.
#   {available}  Liczba struktur natywnych dopuszczonych do generowania.
#   {bar}  Gotowy, sformatowany tekst paska postępu.
#   {befb}  Sformatowana część etykiety czasu silnika przed fragmentem w nawiasach kwadratowych.
#   {before}  Wartość przed zmianą albo niedostępne bloki drzewa przed naprawą.
#   {biome}  Nazwa lub identyfikator wyświetlanego biomu.
#   {block}  Typ lub opis sprawdzanego bloku.
#   {blockX}  Współrzędna X bloku lub celu teleportacji.
#   {blockY}  Współrzędna Y bloku lub celu teleportacji.
#   {blockZ}  Współrzędna Z bloku lub celu teleportacji.
#   {blocking}  Liczba błędów walidacji uniemożliwiających wczytanie packa.
#   {blocks}  Liczba wariantów bloków w importowanej grupie.
#   {bpp}  Liczba bloków świata przypadających na piksel w Vision.
#   {branches}  Liczba gałęzi dodanych podczas naprawy obiektów drzew.
#   {broken}  Liczba packów, które nie przeszły walidacji.
#   {brokenTotal}  Łączna liczba packów, które nie przeszły walidacji.
#   {cave}  Biom jaskini lub jej opis w sprawdzanym miejscu.
#   {centerX}  Współrzędna X środka obszaru; jednostki wynikają z komunikatu operacji.
#   {centerZ}  Współrzędna Z środka obszaru; jednostki wynikają z komunikatu operacji.
#   {changed}  Liczba przetworzonych obiektów, które zostały zmienione.
#   {chunk}  Współrzędne lub etykieta identyfikująca raportowany chunk.
#   {chunkX}  Współrzędna X w chunkach, nie w blokach.
#   {chunkZ}  Współrzędna Z w chunkach, nie w blokach.
#   {chunks}  Liczba chunków objętych operacją.
#   {clampedY}  Współrzędna Y celu teleportacji po ograniczeniu do dozwolonego zakresu wysokości.
#   {command}  Nazwa komendy lub pełna komenda do wykonania.
#   {converted}  Liczba bloków liści zamienionych w drewno podczas naprawy drzewa.
#   {count}  Liczba wpisów, wiadomości lub graczy wskazanych w otaczającym tekście.
#   {current}  Bieżący licznik postępu lub liczba chunków w aktualnym porównaniu.
#   {currentStage}  Nazwa bieżącego etapu ładowania Studio.
#   {d}  Głębokość obiektu w blokach.
#   {depth}  Liczba bloków poniżej powierzchni terenu.
#   {derivative}  Biom pochodny lub wariant związany z biomem powierzchniowym.
#   {detail}  Dodatkowy opis badanego obiektu lub aktualnego etapu postępu.
#   {diffs}  Liczba wykrytych różnic między wynikami generowania.
#   {dimKey}  Identyfikator pakowanego wymiaru.
#   {dimension}  Nazwa lub identyfikator wymiaru wymienionego w wiadomości.
#   {dimensionId}  Zarejestrowany identyfikator wczytanego lub żądanego wymiaru.
#   {dimensionId2}  Identyfikator wymiaru powtórzony w proponowanej komendzie usunięcia.
#   {dimm}  Identyfikator wymiaru Studio albo nazwa jego packa w komendzie walidacji.
#   {disabled}  Liczba struktur natywnych z wyłączonym generowaniem.
#   {distances}  Liczba wartości odległości liści zmienionych podczas naprawy drzewa.
#   {done}  Liczba dotąd ukończonych jednostek pracy.
#   {downloadSource}  Źródło lub wybrane odwołanie użyte do pobrania packa.
#   {downloadable}  Importowany pack lub projekt do pobrania.
#   {dumpPath}  Lokalizacja zapisanych danych czyszczenia lub przywracania.
#   {duration}  Sformatowany czas trwania operacji.
#   {e}  Tekst wyjątku z nieudanego skanowania szablonów struktur.
#   {elapsed}  Sformatowany czas od rozpoczęcia operacji.
#   {engines}  Liczba aktywnych silników generowania Iris lub wymiarów.
#   {entity}  Typ encji wybrany przez sprawdzany spawner.
#   {error}  Szczegóły występującego błędu.
#   {errorMessage}  Opcjonalny dopisek ze szczegółami błędu do głównego komunikatu.
#   {eta}  Sformatowany szacowany pozostały czas; niektóre wiadomości dodają też jego etykietę.
#   {failed}  Liczba nieudanych elementów lub gotowy dopisek o błędzie w tytule postępu.
#   {failure}  Przyczyna niepowodzenia wyszukiwania lub operacji.
#   {failures}  Liczba nieudanych prac lub opcjonalne, sformatowane podsumowanie błędów.
#   {file}  Nazwa lub ścieżka pliku związanego z operacją.
#   {filter}  Tekst filtrujący listę wymiarów Iris.
#   {fps}  Aktualna liczba klatek podglądu na sekundę.
#   {g}  Pliki obiektów zapisane od poprzedniego raportu postępu pakowania.
#   {generated}  Liczba chunków wygenerowanych do tej pory.
#   {generator}  Nazwa generatora szumu wyświetlanego w eksploratorze.
#   {generatorKey}  Identyfikator żądanego generatora szumu.
#   {get}  Liczba pomyślnie przekonwertowanych plików schematic.
#   {golden}  Liczba chunków w zapisanym porównaniu wzorcowym.
#   {goldenDimension}  Identyfikator wymiaru zapisany w próbce wzorcowej.
#   {goldenSeed}  Ziarno świata zapisane w próbce wzorcowej.
#   {goldenVersion}  Wersja Minecraft użyta do utworzenia próbki wzorcowej.
#   {group}  Grupa wiadomości w edytorze języka albo kategoria importowanego obiektu.
#   {guiNote}  Opcjonalna uwaga o oknie postępu pregeneracji.
#   {h}  Wysokość obiektu w blokach.
#   {hash}  Łączna suma kontrolna porównywanych, wygenerowanych chunków.
#   {health}  Aktualne zdrowie badanej encji.
#   {height}  Wysokość terenu, wysokość całkowita lub wysokość wyświetlanego obszaru, zgodnie z wiadomością.
#   {hours}  Część godzinowa sformatowanego czasu trwania.
#   {i}  Nazwa wyświetlana silnika albo pozycja w szablonie listy komend.
#   {id}  Identyfikator rejestru badanego biomu.
#   {imported}  Liczba pomyślnie zaimportowanych struktur lub obiektów.
#   {includeNonJigsaw}  Czy import obejmuje także struktury niekorzystające z części jigsaw.
#   {iris}  Liczba wczytanych wymiarów korzystających z generowania Iris.
#   {irisLevels}  Liczba wczytanych wymiarów Iris sprawdzonych względem wysokości packów.
#   {irisPlaced}  Liczba struktur umieszczonych przez Iris zamiast generowania natywnego.
#   {job}  Nazwa zakończonej operacji w tle.
#   {k}  Klucz ładowania regionu w raporcie rozkładu regionów.
#   {kept}  Lokalne edycje zachowane przez aktualizację języka.
#   {key}  Identyfikator parametru, wiadomości lub zasobu wskazany przez otaczający tekst.
#   {key2}  Identyfikator struktury powtórzony w proponowanej komendzie lokalizacji.
#   {keyString}  Identyfikator struktury lub zasobu importowanego albo zgłaszanego jako nieprawidłowy.
#   {label}  Nazwa wyświetlana znalezionego celu.
#   {line}  Numer wiersza w edytorze języka.
#   {locale}  Identyfikator języka, na przykład en_US lub de_DE.
#   {logicalWorldName}  Logiczna nazwa świata będącego celem komendy.
#   {loot}  Identyfikator sprawdzanej tabeli łupów.
#   {m}  Dodatkowa wiadomość ewakuacji albo tekst ignorowanych parametrów w szablonie komendy.
#   {mantleStatus}  Wynik resetowania danych generowania przed porównaniem ponownej generacji.
#   {marker}  Nazwa wyszukiwanego znacznika.
#   {material}  Materiał Minecraft badanego bloku.
#   {maxScale}  Największa dozwolona skala obiektu po ograniczeniu żądanej wartości.
#   {maxX}  Górna granica X wyświetlanego zakresu chunków.
#   {maxY}  Górna granica zakresu wysokości świata.
#   {maxZ}  Górna granica Z wyświetlanego zakresu chunków.
#   {maximum}  Maksymalna długość danych wejściowych lub zdrowie encji, zgodnie z wiadomością.
#   {mcmeta}  Ścieżka pliku pack.mcmeta wygenerowanego datapacka.
#   {message}  Szczegółowy tekst stanu lub błędu dostarczony przez operację.
#   {method}  Wybrana metoda pregeneracji.
#   {minX}  Dolna granica X wyświetlanego zakresu chunków.
#   {minY}  Dolna granica zakresu wysokości świata.
#   {minZ}  Dolna granica Z wyświetlanego zakresu chunków.
#   {minutes}  Część minutowa sformatowanego czasu trwania.
#   {mismatches}  Liczba chunków różniących się od zapisanego wzorca.
#   {mode}  Wybrany tryb importu, generowania lub podglądu.
#   {modeNote}  Opcjonalne wyjaśnienie wybranego trybu pregeneracji.
#   {name}  Nazwa świata, obiektu, projektu lub wpisu wskazanego w wiadomości.
#   {nameRaw}  Nazwa dokładnie tak, jak wpisano, przed normalizacją lub walidacją.
#   {normalized}  Znormalizowana nazwa działu pomocy, którego nie znaleziono.
#   {num}  Sformatowany fragment etykiety czasu silnika w nawiasach; nie musi być liczbą.
#   {object}  Nazwa lub identyfikator edytowanego albo badanego obiektu Iris.
#   {objects}  Lista lub liczba obiektów w badanym chunku.
#   {offset}  Odległość pionowa od powierzchni terenu w blokach.
#   {output}  Ścieżka pliku wyjściowego, którego nie udało się zapisać.
#   {overall}  Średnia liczba pregenerowanych chunków na sekundę z całej operacji.
#   {ownerName}  Nazwa gracza będącego właścicielem sesji Studio.
#   {pack}  Nazwa lub identyfikator packa Iris związanego z operacją.
#   {pack2}  Identyfikator packa powtórzony w sugerowanej komendzie lub źródle pobierania.
#   {packDimension}  Definicja wymiaru wybrana z packa.
#   {packLogical}  Wysokość logiczna żądana przez definicję wymiaru w packu.
#   {packMax}  Górna granica wysokości żądana przez pack.
#   {packMin}  Dolna granica wysokości żądana przez pack.
#   {packName}  Nazwa wyświetlana walidowanego packa.
#   {parameter}  Brakujący lub niemożliwy do odczytania parametr komendy.
#   {parent}  Nazwa wyświetlana nadrzędnego menu lub ścieżki komendy.
#   {path}  Ścieżka zapisywanego, otwieranego lub raportowanego pliku.
#   {percent}  Procent postępu; znak procenta w wiadomości pozostaw poza zmienną.
#   {permission}  Węzeł uprawnienia wymagany do żądanej czynności.
#   {personal}  Identyfikator zapisanego osobistego języka gracza.
#   {phase}  Nazwa bieżącej fazy ładowania lub pobierania.
#   {pinned}  Liczba liści przypiętych podczas naprawy obiektu drzewa.
#   {player}  Nazwa śledzonego lub wskazanego gracza.
#   {plugin}  Nazwa wyświetlana pluginu; Iris we wspólnych wiadomościach języka i diagnostyki Iris.
#   {position}  Numer ustawianego narożnika zaznaczenia.
#   {preset}  Zarejestrowany preset generowania głównego świata.
#   {primary}  Identyfikator skonfigurowanego głównego świata.
#   {processed}  Liczba przetworzonych elementów, również udanych, pominiętych i nieudanych.
#   {properties}  Sformatowana lista właściwości badanego bloku.
#   {quarantinePath}  Katalog plików czyszczenia przeniesionych do kwarantanny.
#   {queued}  Liczba pracowników lub zadań oczekujących na uruchomienie.
#   {radius}  Promień pregeneracji powtórzony w sugerowanej komendzie startowej.
#   {rarity}  Skonfigurowana rzadkość wskazanego regionu lub rozmieszczenia.
#   {rate}  Sformatowana szybkość przesyłania lub pregeneracji; wiadomość dodaje jednostkę na sekundę.
#   {reach}  Skonfigurowany zasięg szukania gałęzi podczas naprawy drzew.
#   {ready}  Liczba aktualnie dostępnych dokładnych stron Atlas.
#   {reason}  Wyjaśnienie, dlaczego nie można było zakończyć żądanej czynności.
#   {region}  Nazwa lub identyfikator badanego regionu.
#   {remaining}  Liczba dodatkowych stanów bloków pominiętych w wyświetlanej liście; pozostały czas do następnego sprawdzenia języków.
#   {repository}  Repozytorium lub pobrane archiwum, które jest rozpakowywane.
#   {reverted}  Liczba cofniętych wklejeń obiektów.
#   {rotation}  Obrót zastosowany do umieszczonego obiektu.
#   {rx}  Współrzędna X chunka, dla którego obliczany jest hash.
#   {rz}  Współrzędna Z chunka, dla którego obliczany jest hash.
#   {s}  Nazwa nowego projektu Studio.
#   {safeName}  Oczyszczona nazwa pliku importowanego obiektu.
#   {scale}  Liczba bloków świata reprezentowanych przez piksel podglądu.
#   {scope}  Obiekt lub grupa obiektów otwartych w Object Studio.
#   {searchRadius}  Promień wyszukiwania przy weryfikacji struktur w chunkach.
#   {seconds}  Część sekundowa czasu trwania albo czas od ostatniej aktualizacji.
#   {section}  Nazwa działu pomocy żądanego przez użytkownika.
#   {seed}  Ziarno świata, sesji Studio, generatora lub porównania wzorcowego.
#   {seedRaw}  Ziarno dokładnie tak, jak wpisano przed walidacją.
#   {sixtySecond}  Pregenerowane chunki na sekundę w oknie 60 sekund.
#   {size}  Liczba plików, ostrzeżeń, wpisów lub elementów wskazanych w wiadomości.
#   {skipped}  Liczba elementów pominiętych przez operację.
#   {slope}  Nachylenie terenu w badanej pozycji.
#   {solidBlocks}  Liczba stałych bloków zliczonych przy obliczaniu hasha generacji.
#   {source}  Pack, źródło pobierania lub dane wejściowe związane z widokiem postępu.
#   {speed}  Sformatowana szybkość pregeneracji lub przetwarzania na sekundę.
#   {stage}  Nazwa aktualnego etapu postępu.
#   {state}  Bieżący stan lub wartość właściwości wskazana w wiadomości.
#   {status}  Tekst aktualnego stanu podglądu.
#   {structure}  Nazwa lub identyfikator wyszukiwanej struktury.
#   {structureKey}  Identyfikator rejestru lub packa żądanej struktury.
#   {summary}  Sformatowane wyniki zakończonej operacji.
#   {suppressed}  Liczba struktur natywnych zastąpionych rozmieszczeniami Iris.
#   {surface}  Współrzędna Y powierzchni w sugerowanej komendzie teleportacji.
#   {surfaceY}  Współrzędna Y powierzchni terenu w badanym miejscu.
#   {tag}  Sformatowana etykieta stanu walidacji przed nazwą packa.
#   {target}  Odbiorca języka lub cel zaznaczenia obiektu wskazany w wiadomości.
#   {targetX}  Współrzędna X znalezionego lub żądanego celu.
#   {targetZ}  Współrzędna Z znalezionego lub żądanego celu.
#   {template}  Szablon wybrany przy tworzeniu projektu.
#   {tenSecond}  Pregenerowane chunki na sekundę w oknie 10 sekund.
#   {thirtySecond}  Pregenerowane chunki na sekundę w oknie 30 sekund.
#   {threads}  Liczba wątków roboczych do obliczania hasha generacji.
#   {tileNote}  Opcjonalna uwaga o zapisanych lub umieszczonych danych encji bloków.
#   {title}  Tytuł operacji, której wynik jest wyświetlany.
#   {to}  Nowe ustawienie diagnostyki: true oznacza włączone, false wyłączone.
#   {token}  Argument zasięgu, którego nie udało się odczytać.
#   {total}  Łączna liczba zadań, chunków, wymiarów lub wpisów wskazanych w wiadomości.
#   {totalObjects}  Liczba obiektów otwartych w Object Studio.
#   {transferred}  Sformatowana ilość danych przesłanych do tej pory.
#   {type}  Oczekiwany typ parametru, typ zasobu lub kategoria obiektu wskazana w wiadomości.
#   {typeKey}  Zarejestrowany identyfikator typu wymiaru Minecraft albo inline.
#   {unreachableBiomes}  Liczba struktur natywnych wykluczonych przez dobór biomów w packu.
#   {unsupported}  Liczba struktur natywnych zgłoszonych jako nieobsługiwane przez platformę.
#   {updated}  Wiadomości zmienione przez aktualizację języka.
#   {updates}  Aktualizacje bloków na sekundę w widoku deweloperskim.
#   {url}  Adres internetowy do otwarcia lub skopiowania.
#   {usage}  Składnia komendy albo opis użycia pamięci w widoku pamięci.
#   {used}  Sformatowana ilość użytej pamięci w widoku pamięci.
#   {value}  Wartość zależna od wiadomości: ustawienie domyślne, nazwa, współrzędna, liczba lub błąd; sprawdź otaczający tekst.
#   {value2}  Druga wartość wiadomości, np. łączna liczba chunków, Y celu, nazwa packa lub błąd.
#   {value3}  Trzecia wartość wiadomości, np. procent, Z celu, wersja Minecraft lub czas, który upłynął.
#   {value4}  Czwarta wartość, np. zapisy bloków, Z zaznaczenia lub opcjonalny dopisek stanu.
#   {value5}  Piąta wartość: zapisy bloków innych niż powietrze przy wklejaniu albo Z chunka w szablonie pozycji.
#   {variables}  Lista zmiennych dostępnych dla edytowanej wiadomości.
#   {velocity}  Aktualna prędkość ruchu badanej encji.
#   {version}  Wersja pluginu lub Minecraft wskazana w otaczającej wiadomości.
#   {volume}  Liczba bloków w zaznaczeniu obiektu.
#   {w}  Szerokość obiektu w blokach.
#   {wantVariants}  Żądana liczba wariantów na importowane drzewo vanilla lub element obiektu.
#   {warnings}  Liczba nieblokujących ostrzeżeń walidacji.
#   {width}  Szerokość wyświetlanego obszaru świata w blokach.
#   {wood}  Liczba bloków drewna dodanych przy naprawie obiektu drzewa.
#   {world}  Nazwa świata wskazanego przez komendę lub widok postępu.
#   {written}  Liczba pomyślnie zapisanych importowanych wariantów lub plików obiektów.
#   {x}  Współrzędna X w kontekście bloku, chunka, regionu lub podglądu wskazanego w wiadomości.
#   {y}  Pionowa współrzędna świata lub bloku.
#   {z}  Współrzędna Z w kontekście bloku, chunka, regionu lub podglądu wskazanego w wiadomości.
#   {zoom}  Aktualny poziom powiększenia podglądu.
# === End Iris language guide ===

