"language.editor.title" = "{plugin} › {section}"
# === Iris language guide ===
# Iris - pt_PT
#
# === Editar o ficheiro ===
# languages/pt_PT.toml
# Pode editar este ficheiro diretamente. As alterações locais são preservadas; as entradas em falta ou inválidas usam o inglês incorporado.
# /iris language server edit pt_PT
#

# === Prefixo e exemplo ===
# O Iris não tem um prefixo global de idioma. Um prefixo escrito numa mensagem afeta apenas essa mensagem.
# A etiqueta do plugin na consola e os temas dos menus e da ajuda são definidos separadamente.
# Exemplo: edita set_debug na secção existente [iris.bukkit.commandiris]:
# [iris.bukkit.commandiris]
# set_debug = "&6[Mundos]&r &aDepuração definida como: {to}"
# Apenas esta mensagem de depuração recebe o prefixo [Mundos]. {to} é substituído por true (ativada) ou false (desativada).
#
# === Cores e formatação ===
# Cores clássicas: &0 preto, &1 azul-escuro, &2 verde-escuro, &3 turquesa-escuro,
# &4 vermelho-escuro, &5 roxo-escuro, &6 dourado, &7 cinzento, &8 cinzento-escuro,
# &9 azul, &a verde, &b turquesa, &c vermelho, &d roxo-claro, &e amarelo, &f branco.
# Estilos: &k ofuscado, &l negrito, &m rasurado, &n sublinhado, &o itálico, &r repor.
# O processamento do idioma aceita RGB nos formatos &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B e [RRGGBB].
# Os temas Bukkit aplicados posteriormente podem alterar as cores RGB. As vistas modded e de texto simples usam os seus próprios estilos.
# Nas cadeias TOML entre aspas duplas, \n representa uma mudança de linha, \" uma aspa e \\ uma barra invertida literal.
#
# === Variáveis ===
# Usa apenas as variáveis já presentes em cada mensagem e mantém os nomes inalterados.
# PC, SC e TC não são variáveis de tema do Iris. Este glossário não permite acrescentar variáveis a outras mensagens.
#   {MAXAUTOSELECTVOLUME}  Número máximo de blocos de um objeto selecionado automaticamente.
#   {MAXSAVEVOLUME}  Número máximo de blocos de uma seleção de objeto guardada.
#   {MAXSPAN}  Largura, altura ou profundidade máxima de uma estrutura durante a captura, em blocos.
#   {NATIVESTRUCTURELOCATERADIUS}  Raio máximo de pesquisa de estruturas nativas, em chunks.
#   {ROOTPERMISSION}  Permissão principal necessária para usar o comando.
#   {WORKSPACENAME}  Nome da pasta de trabalho do Studio que está a ser procurada.
#   {WORLDPACKNAME}  Nome do datapack gerado para o mundo.
#   {active}  Número de tarefas de processamento em execução.
#   {activeLocale}  Idioma que permanece ativo se não for possível selecionar o solicitado.
#   {activeMax}  Limite superior do intervalo de alturas do tipo de dimensão carregado.
#   {activeMin}  Limite inferior do intervalo de alturas do tipo de dimensão carregado.
#   {actualReverts}  Número de colagens de objetos efetivamente anuladas.
#   {afb}  Parte formatada de uma etiqueta de tempos do motor após o trecho entre parênteses retos.
#   {after}  Valor após a alteração ou blocos de árvore que continuam inacessíveis após a reparação.
#   {amount}  Quantidade associada à entrada indicada no relatório.
#   {applied}  Número de chunks cujo resultado de processamento foi aplicado.
#   {argument}  Argumento do comando que não foi aceite.
#   {available}  Número de estruturas nativas elegíveis para geração.
#   {bar}  Texto da barra de progresso já formatado.
#   {befb}  Parte formatada de uma etiqueta de tempos do motor antes do trecho entre parênteses retos.
#   {before}  Valor anterior à alteração ou blocos de árvore inacessíveis antes da reparação.
#   {biome}  Nome ou identificador do bioma apresentado.
#   {block}  Tipo ou descrição do bloco inspecionado.
#   {blockX}  Coordenada X do bloco ou do destino de teletransporte.
#   {blockY}  Coordenada Y do bloco ou do destino de teletransporte.
#   {blockZ}  Coordenada Z do bloco ou do destino de teletransporte.
#   {blocking}  Número de erros de validação que impedem o carregamento do pacote.
#   {blocks}  Número de variantes de blocos no grupo importado.
#   {bpp}  Blocos do mundo representados por um píxel no Vision.
#   {branches}  Número de ramos adicionados durante a reparação de objetos de árvore.
#   {broken}  Número de pacotes que falharam a validação.
#   {brokenTotal}  Número total de pacotes que falharam a validação.
#   {cave}  Bioma ou descrição da caverna na posição inspecionada.
#   {centerX}  Coordenada X do centro da área; a unidade depende da mensagem da operação.
#   {centerZ}  Coordenada Z do centro da área; a unidade depende da mensagem da operação.
#   {changed}  Número de objetos processados que foram alterados.
#   {chunk}  Coordenadas ou etiqueta de identificação do chunk indicado.
#   {chunkX}  Coordenada X medida em chunks, não em blocos.
#   {chunkZ}  Coordenada Z medida em chunks, não em blocos.
#   {chunks}  Número de chunks incluídos na operação.
#   {clampedY}  Coordenada Y de destino após ajuste ao intervalo de alturas permitido.
#   {command}  Nome do comando ou comando completo a executar.
#   {converted}  Número de blocos de folhas convertidos em madeira durante a reparação de árvores.
#   {count}  Número de entradas, mensagens ou jogadores identificados pelo texto envolvente.
#   {current}  Progresso atual ou número de chunks da comparação atual.
#   {currentStage}  Nome da fase atual de carregamento do Studio.
#   {d}  Profundidade do objeto em blocos.
#   {depth}  Número de blocos abaixo da superfície do terreno.
#   {derivative}  Derivação ou variante associada ao bioma de superfície.
#   {detail}  Descrição adicional do objeto inspecionado ou da fase atual.
#   {diffs}  Número de diferenças detetadas entre os resultados gerados.
#   {dimKey}  Identificador da dimensão que está a ser empacotada.
#   {dimension}  Nome ou identificador da dimensão referida na mensagem.
#   {dimensionId}  Identificador registado da dimensão carregada ou solicitada.
#   {dimensionId2}  Identificador de dimensão repetido no comando de eliminação sugerido.
#   {dimm}  Identificador da dimensão do Studio ou nome do respetivo pacote no comando de validação.
#   {disabled}  Número de estruturas nativas cuja geração está desativada.
#   {distances}  Número de valores de distância das folhas alterados durante a reparação de árvores.
#   {done}  Número de elementos de trabalho concluídos até ao momento.
#   {downloadSource}  Origem ou referência selecionada para descarregar o pacote.
#   {downloadable}  Pacote ou projeto descarregável que está a ser importado.
#   {dumpPath}  Localização dos dados guardados de limpeza ou restauro.
#   {duration}  Duração formatada da operação.
#   {e}  Texto da exceção de uma pesquisa falhada de modelos de estruturas.
#   {elapsed}  Tempo decorrido desde o início da operação, formatado.
#   {engines}  Número de motores de geração ou dimensões Iris ativos.
#   {entity}  Tipo de entidade selecionado pelo gerador de entidades inspecionado.
#   {error}  Detalhes do erro ocorrido.
#   {errorMessage}  Sufixo opcional com detalhes do erro acrescentado à mensagem principal de falha.
#   {eta}  Tempo restante estimado e formatado; algumas mensagens incluem também a etiqueta.
#   {failed}  Número de elementos que falharam ou sufixo de falha preparado para títulos de progresso.
#   {failure}  Motivo da falha da pesquisa ou operação.
#   {failures}  Número de tarefas que falharam ou resumo opcional e formatado das falhas.
#   {file}  Nome ou caminho do ficheiro envolvido na operação.
#   {filter}  Texto usado para filtrar a lista de dimensões Iris.
#   {fps}  Velocidade atual de renderização da pré-visualização, em fotogramas por segundo.
#   {g}  Ficheiros de objetos escritos desde o relatório de progresso anterior do empacotamento.
#   {generated}  Número de chunks gerados até ao momento.
#   {generator}  Nome do gerador de ruído apresentado no explorador.
#   {generatorKey}  Identificador solicitado do gerador de ruído.
#   {get}  Número de ficheiros de esquemas convertidos com sucesso.
#   {golden}  Número de chunks da comparação de referência guardada.
#   {goldenDimension}  Identificador de dimensão guardado na captura de referência.
#   {goldenSeed}  Semente do mundo guardada na captura de referência.
#   {goldenVersion}  Versão do Minecraft usada para criar a captura de referência.
#   {group}  Grupo de mensagens no editor de idiomas ou categoria de um objeto importado.
#   {guiNote}  Nota opcional sobre a janela de progresso da pré-geração.
#   {h}  Altura do objeto em blocos.
#   {hash}  Soma de verificação combinada dos chunks gerados que são comparados.
#   {health}  Vida atual da entidade inspecionada.
#   {height}  Altura do terreno, altura total ou altura da área apresentada, conforme a mensagem.
#   {hours}  Componente de horas da duração formatada.
#   {i}  Nome apresentado do motor ou entrada do modelo de lista de comandos.
#   {id}  ID de registo do bioma inspecionado.
#   {imported}  Número de estruturas ou objetos importados com sucesso.
#   {includeNonJigsaw}  Indica se a importação inclui estruturas que não usam peças jigsaw.
#   {iris}  Número de dimensões carregadas que usam a geração Iris.
#   {irisLevels}  Número de dimensões Iris carregadas cujas alturas são comparadas com as do pacote.
#   {irisPlaced}  Número de estruturas colocadas pelo Iris em vez da geração nativa.
#   {job}  Nome da operação em segundo plano concluída.
#   {k}  Chave de carregamento da região no relatório de distribuição de regiões.
#   {key}  Identificador do parâmetro, mensagem ou recurso indicado pelo texto envolvente.
#   {key2}  Identificador de estrutura repetido no comando de localização sugerido.
#   {keyString}  Identificador da estrutura ou recurso importado ou indicado como inválido.
#   {label}  Nome apresentado do alvo localizado.
#   {line}  Número da linha no editor de idiomas.
#   {locale}  Identificador de idioma, como en_US ou de_DE.
#   {logicalWorldName}  Nome lógico do mundo visado pelo comando.
#   {loot}  Identificador da tabela de saque inspecionada.
#   {m}  Mensagem adicional de evacuação ou texto de parâmetros ignorados nesse modelo de comando.
#   {mantleStatus}  Resultado da reposição dos dados de geração antes de uma comparação com geração repetida.
#   {marker}  Nome do marcador procurado.
#   {material}  Material Minecraft do bloco inspecionado.
#   {maxScale}  Escala máxima permitida do objeto após limitar a escala solicitada.
#   {maxX}  Limite superior X do intervalo de chunks apresentado.
#   {maxY}  Limite superior do intervalo de alturas do mundo.
#   {maxZ}  Limite superior Z do intervalo de chunks apresentado.
#   {maximum}  Comprimento máximo da entrada ou vida máxima da entidade, conforme a mensagem.
#   {mcmeta}  Caminho do ficheiro pack.mcmeta do datapack gerado.
#   {message}  Texto detalhado de estado ou erro fornecido pela operação.
#   {method}  Método de pré-geração selecionado.
#   {minX}  Limite inferior X do intervalo de chunks apresentado.
#   {minY}  Limite inferior do intervalo de alturas do mundo.
#   {minZ}  Limite inferior Z do intervalo de chunks apresentado.
#   {minutes}  Componente de minutos da duração formatada.
#   {mismatches}  Número de chunks que diferem da referência guardada.
#   {mode}  Modo selecionado de importação, geração ou pré-visualização.
#   {modeNote}  Explicação opcional do modo de pré-geração selecionado.
#   {name}  Nome do mundo, objeto, projeto ou entrada indicado na mensagem.
#   {nameRaw}  Nome exatamente como introduzido, antes da normalização ou validação.
#   {normalized}  Nome normalizado da secção de ajuda que não foi encontrada.
#   {num}  Trecho formatado entre parênteses retos de uma etiqueta de tempos do motor; não é necessariamente um número.
#   {object}  Nome ou identificador do objeto Iris que é editado ou inspecionado.
#   {objects}  Lista ou número de objetos do chunk inspecionado.
#   {offset}  Distância vertical à superfície do terreno, em blocos.
#   {output}  Caminho do ficheiro de saída que não foi possível escrever.
#   {overall}  Média de chunks pré-gerados por segundo durante toda a operação.
#   {ownerName}  Nome do jogador proprietário da sessão do Studio.
#   {pack}  Nome ou identificador do pacote Iris envolvido na operação.
#   {pack2}  Identificador de pacote repetido num comando sugerido ou numa origem de descarga.
#   {packDimension}  Definição de dimensão selecionada do pacote.
#   {packLogical}  Altura lógica pedida pela definição de dimensão do pacote.
#   {packMax}  Limite superior de altura pedido pelo pacote.
#   {packMin}  Limite inferior de altura pedido pelo pacote.
#   {packName}  Nome apresentado do pacote que está a ser validado.
#   {parameter}  Parâmetro do comando em falta ou que não pode ser interpretado.
#   {parent}  Nome apresentado do menu ou caminho de comando superior.
#   {path}  Caminho do ficheiro guardado, aberto ou indicado.
#   {percent}  Percentagem de progresso; mantém o sinal de percentagem da mensagem fora da variável.
#   {permission}  Nó de permissão necessário para a ação solicitada.
#   {personal}  Identificador de idioma pessoal guardado para o jogador.
#   {phase}  Nome da fase atual de carregamento ou descarga.
#   {pinned}  Número de blocos de folhas fixados durante a reparação de um objeto de árvore.
#   {player}  Nome do jogador seguido ou selecionado como alvo.
#   {plugin}  Nome apresentado do plugin; Iris nas suas mensagens partilhadas de idioma e diagnóstico.
#   {position}  Número do canto da seleção que está a ser definido.
#   {preset}  Predefinição registada de geração usada para o mundo principal.
#   {primary}  Identificador do mundo principal configurado.
#   {processed}  Número de elementos processados, incluindo os concluídos, ignorados e falhados.
#   {properties}  Lista formatada das propriedades do bloco inspecionado.
#   {quarantinePath}  Pasta que contém os ficheiros de limpeza colocados em quarentena.
#   {queued}  Número de tarefas ou elementos de trabalho à espera de execução.
#   {radius}  Raio de pré-geração repetido no comando de início sugerido.
#   {rarity}  Valor de raridade configurado da região ou colocação indicada.
#   {rate}  Velocidade formatada de transferência ou pré-geração; a mensagem acrescenta o sufixo por segundo.
#   {reach}  Alcance configurado da pesquisa de ramos durante a reparação de objetos de árvore.
#   {ready}  Número de páginas exatas do Atlas atualmente disponíveis.
#   {reason}  Explicação do motivo pelo qual a ação solicitada não foi concluída.
#   {region}  Nome ou identificador da região inspecionada.
#   {remaining}  Número de estados de bloco adicionais omitidos da lista apresentada.
#   {repository}  Repositório ou arquivo descarregado que está a ser descomprimido.
#   {reverted}  Número de colagens de objetos anuladas.
#   {rotation}  Rotação aplicada ao objeto colocado.
#   {rx}  Coordenada X do chunk cujo hash está a ser calculado.
#   {rz}  Coordenada Z do chunk cujo hash está a ser calculado.
#   {s}  Nome do novo projeto do Studio.
#   {safeName}  Nome de ficheiro normalizado usado para o objeto importado.
#   {scale}  Blocos do mundo representados por um píxel de pré-visualização.
#   {scope}  Objeto ou grupo de objetos aberto no Object Studio.
#   {searchRadius}  Raio de pesquisa para verificação de estruturas, em chunks.
#   {seconds}  Componente de segundos de uma duração ou tempo desde a última atualização.
#   {section}  Nome da secção de ajuda pedida pelo utilizador.
#   {seed}  Semente usada para o mundo, sessão do Studio, gerador ou comparação de referência.
#   {seedRaw}  Semente exatamente como introduzida, antes da validação.
#   {sixtySecond}  Chunks pré-gerados por segundo no intervalo de 60 segundos.
#   {size}  Número de ficheiros, avisos, entradas ou elementos indicados na mensagem.
#   {skipped}  Número de elementos ignorados pela operação.
#   {slope}  Inclinação do terreno na posição inspecionada.
#   {solidBlocks}  Número de blocos sólidos contados durante o cálculo do hash da geração.
#   {source}  Pacote, origem de descarga ou entrada associada à indicação de progresso.
#   {speed}  Velocidade formatada de pré-geração ou processamento por segundo.
#   {stage}  Nome da fase atual de progresso.
#   {state}  Estado atual ou valor de propriedade indicado na mensagem.
#   {status}  Texto do estado atual da pré-visualização.
#   {structure}  Nome ou identificador da estrutura procurada.
#   {structureKey}  Identificador de registo ou do pacote da estrutura solicitada.
#   {summary}  Resultados formatados da operação concluída.
#   {suppressed}  Número de estruturas nativas substituídas por colocações do Iris.
#   {surface}  Coordenada Y da superfície usada no comando de teletransporte sugerido.
#   {surfaceY}  Coordenada Y da superfície do terreno na posição inspecionada.
#   {tag}  Etiqueta formatada do estado de validação colocada antes do nome do pacote.
#   {target}  Destinatário do idioma ou alvo de seleção de objetos indicado na mensagem.
#   {targetX}  Coordenada X do destino localizado ou solicitado.
#   {targetZ}  Coordenada Z do destino localizado ou solicitado.
#   {template}  Modelo selecionado ao criar um projeto.
#   {tenSecond}  Chunks pré-gerados por segundo no intervalo de 10 segundos.
#   {thirtySecond}  Chunks pré-gerados por segundo no intervalo de 30 segundos.
#   {threads}  Número de threads de trabalho usados para calcular o hash da geração.
#   {tileNote}  Nota opcional sobre dados de entidades de bloco guardados ou colocados.
#   {title}  Título da operação cujo resultado é apresentado.
#   {to}  Nova definição de depuração: true para ativada, false para desativada.
#   {token}  Argumento de alcance que não foi possível interpretar.
#   {total}  Número total de elementos de trabalho, chunks, dimensões ou entradas indicados na mensagem.
#   {totalObjects}  Número de objetos abertos no Object Studio.
#   {transferred}  Quantidade formatada de dados transferidos até ao momento.
#   {type}  Tipo de parâmetro esperado, tipo de recurso ou categoria de objeto indicado na mensagem.
#   {typeKey}  Identificador registado do tipo de dimensão Minecraft, ou inline.
#   {unreachableBiomes}  Número de estruturas nativas excluídas pelos biomas escolhidos no pacote.
#   {unsupported}  Número de estruturas nativas indicadas como não suportadas por esta plataforma.
#   {updates}  Atualizações de blocos por segundo na vista de desenvolvimento.
#   {url}  Endereço web a abrir ou copiar.
#   {usage}  Sintaxe do comando ou texto de utilização de memória na respetiva vista.
#   {used}  Quantidade formatada de memória utilizada na respetiva vista.
#   {value}  Valor específico da mensagem, como uma predefinição, nome, coordenada, quantidade ou erro. Consulta o texto envolvente.
#   {value2}  Segundo valor específico da mensagem, como o total de chunks, Y de destino, nome de pacote ou erro. Consulta o texto envolvente.
#   {value3}  Terceiro valor específico da mensagem, como percentagem, Z de destino, versão do Minecraft ou tempo decorrido.
#   {value4}  Quarto valor específico da mensagem, como escritas de blocos, coordenada Z de uma seleção ou sufixo de estado opcional.
#   {value5}  Quinto valor específico da mensagem: escritas de blocos que não são ar na colocação de objetos, ou Z do chunk no modelo de posição.
#   {variables}  Lista de variáveis disponíveis para a mensagem que está a ser editada.
#   {velocity}  Velocidade de movimento atual da entidade inspecionada.
#   {version}  Versão do plugin ou do Minecraft indicada pela mensagem envolvente.
#   {volume}  Número de blocos contidos na seleção do objeto.
#   {w}  Largura do objeto em blocos.
#   {wantVariants}  Variantes pedidas por cada elemento de árvore ou objeto vanilla importado.
#   {warnings}  Número de avisos de validação que não impedem o carregamento.
#   {width}  Largura da área do mundo apresentada, em blocos.
#   {wood}  Número de blocos de madeira adicionados durante a reparação de um objeto de árvore.
#   {world}  Nome do mundo visado pelo comando ou pela indicação de progresso.
#   {written}  Número de variantes importadas ou ficheiros de objetos escritos com sucesso.
#   {x}  Coordenada X no contexto de blocos, chunks, regiões ou pré-visualização indicado pela mensagem.
#   {y}  Coordenada vertical do mundo ou do bloco.
#   {z}  Coordenada Z no contexto de blocos, chunks, regiões ou pré-visualização indicado pela mensagem.
#   {zoom}  Nível de zoom atual da pré-visualização.
# === End Iris language guide ===

