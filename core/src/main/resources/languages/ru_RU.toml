# === Iris language guide ===
# Iris - ru_RU
#
# === Редактирование файла ===
# languages/ru_RU.toml
# Редактируйте этот файл напрямую. Локальные изменения сообщений сохраняются; отсутствующие или некорректные значения используют встроенный английский текст.
# /iris language server edit ru_RU
#
# === Префиксы ===
# Общей настройки префикса для всех сообщений нет. Префикс, вписанный в начало отдельного сообщения, изменяет только его.
# Префиксы журналов и темы меню задаются отдельно.
# Пример: найдите раздел [iris.bukkit.commandiris] и измените существующее значение set_debug:
# set_debug = "&6[Миры]&r &aУстановлена отладка: {to}"
# {to} принимает true (включено) или false (выключено); имя переменной менять нельзя.
#
# === Цвета и стили ===
# &0 чёрный; &1 тёмно-синий; &2 тёмно-зелёный; &3 тёмно-бирюзовый
# &4 тёмно-красный; &5 тёмно-фиолетовый; &6 золотой; &7 серый
# &8 тёмно-серый; &9 синий; &a зелёный; &b бирюзовый
# &c красный; &d светло-фиолетовый; &e жёлтый; &f белый
# &k случайные символы; &l жирный; &m зачёркивание; &n подчёркивание; &o курсив; &r сброс цвета и стилей
# Примеры: &aГотово&r, &cОшибка&r, &6&lПредупреждение&r, &nПодчёркнуто&r.
# Языковой слой распознаёт формы RGB: &#55FF55, &x55FF55, &x&5&5&F&F&5&5 и [55FF55].
# Пример RGB: &#55FF55Зелёный текст&r. Последующая обработка и темы Bukkit могут изменять цвета RGB.
# Команды, справка и клиентские экраны модифицированных платформ используют обычный переведённый текст и собственные нативные стили.
# Обычное текстовое представление убирает оформление; цвета языкового файла не обязательно управляют стилем интерфейса.
#
# === Текстовые значения TOML ===
# В двойных кавычках \n означает новую строку, \" вставляет кавычку, а \\ вставляет один обратный слеш.
# Пример: "Строка 1\nСтрока 2: \"цитата\"; путь C:\\Iris".
#
# === Переменные ===
# Используйте только переменные, уже принадлежащие сообщению. Сохраняйте их имена и регистр; PC, SC и TC не поддерживаются как переменные.
# Ниже описано значение каждой переменной. Значение универсальных подстановок определяется окружающим текстом.
#   {MAXAUTOSELECTVOLUME}  Максимальное число блоков в автоматически выбранном объекте.
#   {MAXSAVEVOLUME}  Максимальное число блоков в сохраняемом выделении объекта.
#   {MAXSPAN}  Максимальная ширина, высота или глубина захватываемой структуры в блоках.
#   {NATIVESTRUCTURELOCATERADIUS}  Максимальный радиус поиска нативных структур в чанках.
#   {ROOTPERMISSION}  Корневое разрешение, необходимое для команды.
#   {WORKSPACENAME}  Имя папки рабочей области Studio, в которой выполняется поиск.
#   {WORLDPACKNAME}  Имя созданного датапака мира.
#   {active}  Число работников, выполняющих работу сейчас.
#   {activeLocale}  Язык, остающийся активным, если запрошенный язык выбрать не удалось.
#   {activeMax}  Верхняя граница диапазона высоты загруженного типа измерения.
#   {activeMin}  Нижняя граница диапазона высоты загруженного типа измерения.
#   {actualReverts}  Число фактически отменённых вставок объектов.
#   {afb}  Оформленная часть метки времени движка после фрагмента в квадратных скобках.
#   {after}  Значение после изменения либо недоступные блоки дерева, оставшиеся после исправления.
#   {amount}  Количество, связанное с указанной записью отчёта.
#   {applied}  Число чанков, к которым уже применены результаты работы.
#   {argument}  Аргумент команды, который не удалось принять.
#   {available}  Число нативных структур, доступных для генерации.
#   {bar}  Уже оформленный текст полосы прогресса.
#   {befb}  Оформленная часть метки времени движка перед фрагментом в квадратных скобках.
#   {before}  Значение до изменения либо недоступные блоки дерева до исправления.
#   {biome}  Имя или идентификатор отображаемого биома.
#   {block}  Тип или описание проверяемого блока.
#   {blockX}  Координата X блока или точки телепортации.
#   {blockY}  Координата Y блока или точки телепортации.
#   {blockZ}  Координата Z блока или точки телепортации.
#   {blocking}  Число ошибок проверки, препятствующих загрузке пака.
#   {blocks}  Число вариантов блоков в импортированной группе.
#   {bpp}  Число блоков мира, представленных одним пикселем Vision.
#   {branches}  Число ветвей, добавленных при исправлении объектов деревьев.
#   {broken}  Число паков, не прошедших проверку.
#   {brokenTotal}  Общее число паков, не прошедших проверку.
#   {cave}  Биом пещеры или её описание в проверяемой точке.
#   {centerX}  Координата X центра области; единицы указаны в сообщении операции.
#   {centerZ}  Координата Z центра области; единицы указаны в сообщении операции.
#   {changed}  Число обработанных объектов, которые были изменены.
#   {chunk}  Координаты или опознавательная метка чанка в отчёте.
#   {chunkX}  Координата X в чанках, а не в блоках.
#   {chunkZ}  Координата Z в чанках, а не в блоках.
#   {chunks}  Число чанков, участвующих в операции.
#   {clampedY}  Координата Y телепортации после ограничения допустимым диапазоном высоты.
#   {command}  Имя команды или полная команда для выполнения.
#   {converted}  Число блоков листвы, заменённых древесиной при исправлении дерева.
#   {count}  Число записей, сообщений или игроков, указанных в окружающем тексте.
#   {current}  Текущий счётчик прогресса или число чанков в текущем сравнении.
#   {currentStage}  Название текущего этапа загрузки Studio.
#   {d}  Глубина объекта в блоках.
#   {depth}  Расстояние ниже поверхности земли в блоках.
#   {derivative}  Производный биом или вариант, связанный с биомом поверхности.
#   {detail}  Дополнительное описание проверяемого объекта или текущего этапа.
#   {diffs}  Число найденных различий между результатами генерации.
#   {dimKey}  Идентификатор упаковываемого измерения.
#   {dimension}  Имя или идентификатор измерения, указанного в сообщении.
#   {dimensionId}  Зарегистрированный идентификатор загруженного или запрошенного измерения.
#   {dimensionId2}  Идентификатор измерения, повторённый в предложенной команде удаления.
#   {dimm}  Идентификатор измерения Studio либо имя его пака в команде проверки.
#   {disabled}  Число нативных структур с отключённой генерацией.
#   {distances}  Число значений расстояния листвы, изменённых при исправлении дерева.
#   {done}  Число завершённых к текущему моменту единиц работы.
#   {downloadSource}  Источник или выбранная ссылка, использованные для скачивания пака.
#   {downloadable}  Импортируемый пак или скачиваемый проект.
#   {dumpPath}  Расположение сохранённых данных очистки или восстановления.
#   {duration}  Длительность операции в готовом для отображения виде.
#   {e}  Текст исключения при неудачном поиске шаблонов структур.
#   {elapsed}  Время с начала операции в готовом для отображения виде.
#   {engines}  Число активных движков генерации Iris или измерений.
#   {entity}  Тип сущности, выбранный проверяемым спавнером.
#   {error}  Подробности возникшей ошибки.
#   {errorMessage}  Необязательное дополнение с подробностями к основному сообщению об ошибке.
#   {eta}  Оформленная оценка оставшегося времени; иногда уже содержит подпись.
#   {failed}  Число неудачных элементов или готовое дополнение об ошибке в заголовке прогресса.
#   {failure}  Причина неудачи поиска или операции.
#   {failures}  Число неудачных работ или необязательная оформленная сводка ошибок.
#   {file}  Имя или путь файла, участвующего в операции.
#   {filter}  Текст для фильтрации списка измерений Iris.
#   {fps}  Текущая частота кадров предварительного просмотра в секунду.
#   {g}  Файлы объектов, записанные после предыдущего отчёта об упаковке.
#   {generated}  Число чанков, сгенерированных к текущему моменту.
#   {generator}  Название генератора шума, показанного в обозревателе.
#   {generatorKey}  Идентификатор запрошенного генератора шума.
#   {get}  Число успешно преобразованных schematic-файлов.
#   {golden}  Число чанков в сохранённом эталонном сравнении.
#   {goldenDimension}  Идентификатор измерения, сохранённый в эталонном снимке.
#   {goldenSeed}  Сид мира, сохранённый в эталонном снимке.
#   {goldenVersion}  Версия Minecraft, использованная для эталонного снимка.
#   {group}  Группа сообщений в языковом редакторе либо категория импортированного объекта.
#   {guiNote}  Необязательная заметка об окне прогресса предварительной генерации.
#   {h}  Высота объекта в блоках.
#   {hash}  Общая контрольная сумма сравниваемых сгенерированных чанков.
#   {health}  Текущее здоровье проверяемой сущности.
#   {height}  Указанная в сообщении высота рельефа, общая высота или высота отображаемой области.
#   {hours}  Часовая часть отображаемой длительности.
#   {i}  Отображаемое имя движка либо запись в шаблоне списка команд.
#   {id}  Идентификатор реестра проверяемого биома.
#   {imported}  Число успешно импортированных структур или объектов.
#   {includeNonJigsaw}  Включает ли импорт структуры, не использующие элементы jigsaw.
#   {iris}  Число загруженных измерений с генерацией Iris.
#   {irisLevels}  Число загруженных измерений Iris, проверенных по высотам пака.
#   {irisPlaced}  Число структур, размещённых Iris вместо нативной генерации.
#   {job}  Название завершённой фоновой операции.
#   {k}  Ключ загрузки региона в отчёте о распределении регионов.
#   {key}  Идентификатор параметра, сообщения или ресурса, указанный окружающим текстом.
#   {key2}  Идентификатор структуры, повторённый в предложенной команде поиска.
#   {keyString}  Идентификатор импортируемой или некорректной структуры либо ресурса.
#   {label}  Отображаемое имя найденной цели.
#   {line}  Номер строки в языковом редакторе.
#   {locale}  Идентификатор языка, например en_US или de_DE.
#   {logicalWorldName}  Логическое имя мира, на который направлена команда.
#   {loot}  Идентификатор проверяемой таблицы добычи.
#   {m}  Дополнительное сообщение эвакуации либо текст игнорируемых параметров в шаблоне команды.
#   {mantleStatus}  Результат сброса данных генерации перед сравнением повторной генерации.
#   {marker}  Название искомого маркера.
#   {material}  Материал Minecraft проверяемого блока.
#   {maxScale}  Наибольший допустимый масштаб объекта после ограничения запрошенного значения.
#   {maxX}  Верхняя граница X отображаемого диапазона чанков.
#   {maxY}  Верхняя граница диапазона высоты мира.
#   {maxZ}  Верхняя граница Z отображаемого диапазона чанков.
#   {maximum}  Указанная в сообщении максимальная длина ввода либо максимальное здоровье сущности.
#   {mcmeta}  Путь к файлу pack.mcmeta созданного датапака.
#   {message}  Подробный текст состояния или ошибки от операции.
#   {method}  Выбранный метод предварительной генерации.
#   {minX}  Нижняя граница X отображаемого диапазона чанков.
#   {minY}  Нижняя граница диапазона высоты мира.
#   {minZ}  Нижняя граница Z отображаемого диапазона чанков.
#   {minutes}  Минутная часть отображаемой длительности.
#   {mismatches}  Число чанков, отличающихся от сохранённого эталона.
#   {mode}  Выбранный режим импорта, генерации или просмотра.
#   {modeNote}  Необязательное пояснение выбранного режима предварительной генерации.
#   {name}  Имя мира, объекта, проекта или записи, указанной в сообщении.
#   {nameRaw}  Имя точно в введённом виде, до нормализации и проверки.
#   {normalized}  Нормализованное название раздела справки, который не найден.
#   {num}  Оформленный фрагмент метки времени движка в скобках; не обязательно число.
#   {object}  Имя или идентификатор редактируемого либо проверяемого объекта Iris.
#   {objects}  Список или число объектов в проверяемом чанке.
#   {offset}  Вертикальное расстояние от поверхности рельефа в блоках.
#   {output}  Путь к выходному файлу, который не удалось записать.
#   {overall}  Среднее число предварительно сгенерированных чанков в секунду за всю операцию.
#   {ownerName}  Имя игрока, которому принадлежит сеанс Studio.
#   {pack}  Имя или идентификатор пака Iris, участвующего в операции.
#   {pack2}  Идентификатор пака, повторённый в предложенной команде или источнике скачивания.
#   {packDimension}  Определение измерения, выбранное из пака.
#   {packLogical}  Логическая высота, запрошенная определением измерения в паке.
#   {packMax}  Верхняя граница высоты, запрошенная паком.
#   {packMin}  Нижняя граница высоты, запрошенная паком.
#   {packName}  Отображаемое имя проверяемого пака.
#   {parameter}  Отсутствующий или неразбираемый параметр команды.
#   {parent}  Отображаемое имя родительского меню или пути команды.
#   {path}  Путь сохраняемого, открываемого или указанного в отчёте файла.
#   {percent}  Процент прогресса; оставьте знак процента сообщения за пределами переменной.
#   {permission}  Разрешение, необходимое для запрошенного действия.
#   {personal}  Сохранённый идентификатор личного языка игрока.
#   {phase}  Название текущей фазы загрузки или скачивания.
#   {pinned}  Число закреплённых листьев при исправлении объекта дерева.
#   {player}  Имя отслеживаемого или выбранного игрока.
#   {plugin}  Отображаемое имя плагина; Iris в общих языковых и диагностических сообщениях Iris.
#   {position}  Номер устанавливаемого угла выделения.
#   {preset}  Зарегистрированный пресет генерации, используемый основным миром.
#   {primary}  Идентификатор настроенного основного мира.
#   {processed}  Число обработанных элементов, включая успешные, пропущенные и неудачные.
#   {properties}  Оформленный список свойств проверяемого блока.
#   {quarantinePath}  Папка с файлами очистки, помещёнными в карантин.
#   {queued}  Число работников или заданий, ожидающих запуска.
#   {radius}  Радиус предварительной генерации, повторённый в предложенной команде запуска.
#   {rarity}  Настроенное значение редкости указанного региона или размещения.
#   {rate}  Оформленная скорость передачи или предварительной генерации; сообщение добавляет единицу в секунду.
#   {reach}  Настроенная дальность поиска ветвей при исправлении деревьев.
#   {ready}  Число точных страниц Atlas, доступных сейчас.
#   {reason}  Пояснение, почему запрошенное действие не удалось завершить.
#   {region}  Имя или идентификатор проверяемого региона.
#   {remaining}  Число дополнительных состояний блоков, не показанных в списке.
#   {repository}  Репозиторий или скачанный архив, который распаковывается.
#   {reverted}  Число отменённых вставок объектов.
#   {rotation}  Поворот, применённый к размещённому объекту.
#   {rx}  Координата X чанка, для которого вычисляется хеш.
#   {rz}  Координата Z чанка, для которого вычисляется хеш.
#   {s}  Имя нового проекта Studio.
#   {safeName}  Очищенное имя файла импортированного объекта.
#   {scale}  Число блоков мира, представленных пикселем предварительного просмотра.
#   {scope}  Объект или группа объектов, открытых в Object Studio.
#   {searchRadius}  Радиус поиска при проверке структур в чанках.
#   {seconds}  Секундная часть длительности или время с последнего обновления.
#   {section}  Название раздела справки, запрошенного пользователем.
#   {seed}  Сид мира, сеанса Studio, генератора или эталонного сравнения.
#   {seedRaw}  Сид точно в введённом виде до проверки.
#   {sixtySecond}  Чанки предварительной генерации в секунду за окно 60 секунд.
#   {size}  Число файлов, предупреждений, записей или элементов, названных в сообщении.
#   {skipped}  Число элементов, пропущенных операцией.
#   {slope}  Уклон рельефа в проверяемой точке.
#   {solidBlocks}  Число твёрдых блоков, подсчитанных при хешировании генерации.
#   {source}  Пак, источник скачивания или входные данные, связанные с индикатором прогресса.
#   {speed}  Оформленная скорость предварительной генерации или обработки в секунду.
#   {stage}  Название текущего этапа прогресса.
#   {state}  Текущее состояние или значение свойства, указанное в сообщении.
#   {status}  Текущий текст состояния предварительного просмотра.
#   {structure}  Имя или идентификатор искомой структуры.
#   {structureKey}  Идентификатор реестра или пака запрошенной структуры.
#   {summary}  Оформленные результаты завершённой операции.
#   {suppressed}  Число нативных структур, заменённых размещениями Iris.
#   {surface}  Координата Y поверхности в предложенной команде телепортации.
#   {surfaceY}  Координата Y поверхности рельефа в проверяемой точке.
#   {tag}  Оформленная метка результата проверки перед именем пака.
#   {target}  Получатель языка или цель выделения объекта, указанная в сообщении.
#   {targetX}  Координата X найденной или запрошенной точки назначения.
#   {targetZ}  Координата Z найденной или запрошенной точки назначения.
#   {template}  Шаблон, выбранный при создании проекта.
#   {tenSecond}  Чанки предварительной генерации в секунду за окно 10 секунд.
#   {thirtySecond}  Чанки предварительной генерации в секунду за окно 30 секунд.
#   {threads}  Число рабочих потоков для хеширования генерации.
#   {tileNote}  Необязательная заметка о сохранённых или размещённых данных блочных сущностей.
#   {title}  Заголовок операции, результат которой отображается.
#   {to}  Новая настройка отладки: true включает, false выключает.
#   {token}  Аргумент дальности, который не удалось разобрать.
#   {total}  Общее число работ, чанков, измерений или записей, указанных в сообщении.
#   {totalObjects}  Число объектов, открытых в Object Studio.
#   {transferred}  Оформленный объём данных, переданных к текущему моменту.
#   {type}  Указанный в сообщении ожидаемый тип параметра, тип ресурса или категория объекта.
#   {typeKey}  Зарегистрированный идентификатор типа измерения Minecraft либо inline.
#   {unreachableBiomes}  Число нативных структур, исключённых выбором биомов в паке.
#   {unsupported}  Число нативных структур, не поддерживаемых этой платформой.
#   {updates}  Обновления блоков в секунду в представлении разработчика.
#   {url}  Веб-адрес для открытия или копирования.
#   {usage}  Синтаксис команды либо текст использования памяти в индикаторе памяти.
#   {used}  Оформленный объём используемой памяти в индикаторе памяти.
#   {value}  Значение по контексту сообщения: настройка по умолчанию, имя, координата, количество или ошибка; смотрите окружающий текст.
#   {value2}  Второе значение сообщения: например, всего чанков, Y цели, имя пака или ошибка.
#   {value3}  Третье значение: например, процент, Z цели, версия Minecraft или прошедшее время.
#   {value4}  Четвёртое значение: например, записи блоков, Z выделения или необязательная приписка состояния.
#   {value5}  Пятое значение: записи блоков не-воздуха при размещении объекта либо Z чанка в шаблоне позиции.
#   {variables}  Список переменных, доступных в редактируемом сообщении.
#   {velocity}  Текущая скорость движения проверяемой сущности.
#   {version}  Версия плагина или Minecraft, указанная в окружающем сообщении.
#   {volume}  Число блоков в выделении объекта.
#   {w}  Ширина объекта в блоках.
#   {wantVariants}  Запрошенное число вариантов для импортируемого дерева vanilla или элемента объекта.
#   {warnings}  Число предупреждений проверки, не блокирующих загрузку.
#   {width}  Ширина отображаемой области мира в блоках.
#   {wood}  Число блоков древесины, добавленных при исправлении объекта дерева.
#   {world}  Имя мира, на который направлена команда или индикатор прогресса.
#   {written}  Число успешно записанных импортированных вариантов или файлов объектов.
#   {x}  Координата X в контексте блока, чанка, региона или просмотра, указанном в сообщении.
#   {y}  Вертикальная координата мира или блока.
#   {z}  Координата Z в контексте блока, чанка, региона или просмотра, указанном в сообщении.
#   {zoom}  Текущий уровень масштаба предварительного просмотра.
# === End Iris language guide ===

