"director.capture_code_generated_structures_that_have_no_nbt_template_swamp_huts_igloos" = "Захват кодовых структур, которые не имеют NBT шаблон (болотные хижины, иглу и т.д.) в редактируемом виде Iris объекты, генерируя каждый из них в выброшенном мире царапин и считывая его блоки.  Пропуски структур, которые уже импортируются как структура, структуры шире / тише, чем захватная шапка (опорные пункты, особняки, памятники остаются vanillaными), и все, что не будет генерировать в плоском мире.  Каждая захваченная структура становится единым целым Iris Структуру можно поместить из списка «структур» биома / региона / измерения.  Проходит автоматически как последний проход /iris structure import."
