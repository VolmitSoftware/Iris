"director.capture_code_generated_structures_that_have_no_nbt_template_swamp_huts_igloos" = "Захватывает генерируемые кодом структуры без шаблона NBT (болотные хижины, иглу и т. д.) в редактируемые объекты Iris: каждая генерируется во временном мире, после чего считываются её блоки. Пропускает структуры, которые уже импортируются как структуры, структуры шире/выше лимита захвата (крепости, особняки, монументы остаются vanilla) и всё, что не генерируется в плоском верхнем мире. Каждая захваченная структура становится одночастной структурой Iris, которую можно разместить из списка 'structures' биома/региона/измерения. Выполняется автоматически как последний проход /iris structure import."
