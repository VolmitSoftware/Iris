"director.import_every_structure_vanilla_ingested_datapacks_into_this_pack_as_editable_iris" = "импорт каждый Структура - vanilla и Проглоченные пакеты данных - в этот пакет как редактируемый Iris Ресурсы, всегда перезапись.  Восстановление пилообразных структур (деревни, аванпосты, головоломки пакета данных) в качестве редактируемых графиков пула / части, импортирует каждый шаблон структуры NBT как объект, так и собирает многошаблонные структуры (корабли-затонувшие, разрушенные порталы, руины океана, голые окаменелости).  Бегите после приема пакета данных и перезапуска.  Восстанавливайте куски или используйте свежий мир для импортных копий."
