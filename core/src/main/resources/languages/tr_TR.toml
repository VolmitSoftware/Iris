# === Iris language guide ===
# Iris - tr_TR
#
# === Dosyayı düzenleme ===
# languages/tr_TR.toml
# Bu dosyayı doğrudan düzenleyin. Yerel mesaj değişiklikleri korunur; eksik veya geçersiz değerler yerleşik İngilizce metni kullanır.
# /iris language server edit tr_TR
#
# === Önekler ===
# Tüm mesajlar için genel bir önek ayarı yoktur. Belirli bir mesajın başına yazılan önek yalnızca o mesajı değiştirir.
# Günlük önekleri ve menü temaları ayrı ayarlanır.
# Örnek: [iris.bukkit.commandiris] bölümünü bulun ve mevcut set_debug değerini değiştirin:
# set_debug = "&6[Dünyalar]&r &aHata ayıklama ayarı: {to}"
# {to}, açık için true veya kapalı için false değerini alır; değişken adını değiştirmeyin.
#
# === Renkler ve stiller ===
# &0 siyah; &1 koyu mavi; &2 koyu yeşil; &3 koyu turkuaz
# &4 koyu kırmızı; &5 koyu mor; &6 altın; &7 gri
# &8 koyu gri; &9 mavi; &a yeşil; &b turkuaz
# &c kırmızı; &d açık mor; &e sarı; &f beyaz
# &k rastgele karakterler; &l kalın; &m üstü çizili; &n altı çizili; &o italik; &r renk ve stilleri sıfırlama
# Örnekler: &aHazır&r, &cHata&r, &6&lUyarı&r, &nAltı çizili&r.
# Dil katmanı şu RGB biçimlerini tanır: &#55FF55, &x55FF55, &x&5&5&F&F&5&5 ve [55FF55].
# RGB örneği: &#55FF55Yeşil metin&r. Sonraki Bukkit işlemleri ve temalar RGB renklerini değiştirebilir.
# Modlu platformlardaki komutlar, yardım ve istemci ekranları düz çevrilmiş metin ve kendi yerel stillerini kullanır.
# Düz metin görünümü biçimlendirmeyi kaldırır; dil dosyasındaki renklerin arayüz stilini belirlediğini varsaymayın.
#
# === TOML metin değerleri ===
# Çift tırnak içinde \n yeni satır oluşturur, \" tırnak ekler ve \\ bir ters eğik çizgi ekler.
# Örnek: "Satır 1\nSatır 2: \"alıntı\"; yol C:\\Iris".
#
# === Değişkenler ===
# Yalnızca mesajın mevcut değişkenlerini kullanın. Adlarını ve büyük/küçük harflerini koruyun; PC, SC ve TC desteklenen yer tutucular değildir.
# Aşağıda her yer tutucunun anlamı açıklanır. Genel değerlerin anlamını çevreleyen mesaj belirler.
#   {MAXAUTOSELECTVOLUME}  Otomatik seçilen bir nesnede izin verilen en fazla blok sayısı.
#   {MAXSAVEVOLUME}  Kaydedilen nesne seçiminde izin verilen en fazla blok sayısı.
#   {MAXSPAN}  Yakalama sırasında yapının blok cinsinden en büyük genişliği, yüksekliği veya derinliği.
#   {NATIVESTRUCTURELOCATERADIUS}  Yerel yapı aramasının chunk cinsinden en büyük yarıçapı.
#   {ROOTPERMISSION}  Komutu kullanmak için gereken kök izin.
#   {WORKSPACENAME}  Aranan Studio çalışma alanı klasörünün adı.
#   {WORLDPACKNAME}  Oluşturulan dünya datapack dosya grubunun adı.
#   {active}  Şu anda çalışan işçilerin sayısı.
#   {activeLocale}  İstenen dil seçilemediğinde etkin kalacak dil.
#   {activeMax}  Yüklenen boyut türünün yükseklik aralığının üst sınırı.
#   {activeMin}  Yüklenen boyut türünün yükseklik aralığının alt sınırı.
#   {actualReverts}  Gerçekte geri alınan nesne yapıştırmalarının sayısı.
#   {afb}  Motor zamanlama etiketinin köşeli parantezli bölümünden sonraki biçimlendirilmiş kısmı.
#   {after}  Değişiklikten sonraki değer veya onarım sonrası erişilemeyen ağaç blokları.
#   {amount}  Raporda adı verilen girdiye ait miktar.
#   {applied}  Çalışma sonuçları uygulanmış chunk sayısı.
#   {argument}  Kabul edilemeyen komut argümanı.
#   {available}  Üretime uygun yerel yapıların sayısı.
#   {bar}  Önceden biçimlendirilmiş ilerleme çubuğu metni.
#   {befb}  Motor zamanlama etiketinin köşeli parantezli bölümünden önceki biçimlendirilmiş kısmı.
#   {before}  Değişiklikten önceki değer veya onarım öncesi erişilemeyen ağaç blokları.
#   {biome}  Gösterilen biyomun adı veya kimliği.
#   {block}  İncelenen bloğun türü veya açıklaması.
#   {blockX}  Bloğun veya ışınlanma hedefinin X koordinatı.
#   {blockY}  Bloğun veya ışınlanma hedefinin Y koordinatı.
#   {blockZ}  Bloğun veya ışınlanma hedefinin Z koordinatı.
#   {blocking}  Pack yüklenmesini engelleyen doğrulama hatalarının sayısı.
#   {blocks}  İçe aktarılan gruptaki blok varyantlarının sayısı.
#   {bpp}  Vision içinde bir pikselin temsil ettiği dünya bloklarının sayısı.
#   {branches}  Ağaç nesneleri onarılırken eklenen dalların sayısı.
#   {broken}  Doğrulamadan geçemeyen pack sayısı.
#   {brokenTotal}  Doğrulamadan geçemeyen toplam pack sayısı.
#   {cave}  İncelenen konumdaki mağara biyomu veya mağara açıklaması.
#   {centerX}  Alanın merkezinin X koordinatı; birim işlem mesajında belirtilir.
#   {centerZ}  Alanın merkezinin Z koordinatı; birim işlem mesajında belirtilir.
#   {changed}  İşlenip değiştirilen nesnelerin sayısı.
#   {chunk}  Raporlanan chunk koordinatları veya tanımlayıcı etiketi.
#   {chunkX}  Blok değil, chunk cinsinden X koordinatı.
#   {chunkZ}  Blok değil, chunk cinsinden Z koordinatı.
#   {chunks}  İşleme dahil olan chunk sayısı.
#   {clampedY}  İzin verilen yüksekliğe sınırlandıktan sonraki ışınlanma hedefi Y koordinatı.
#   {command}  Komut adı veya çalıştırılacak tam komut.
#   {converted}  Ağaç onarımında oduna dönüştürülen yaprak bloklarının sayısı.
#   {count}  Çevreleyen metinde belirtilen girdi, mesaj veya oyuncu sayısı.
#   {current}  Geçerli ilerleme sayısı veya mevcut karşılaştırmadaki chunk sayısı.
#   {currentStage}  Studio yüklemesinin geçerli aşamasının adı.
#   {d}  Nesnenin blok cinsinden derinliği.
#   {depth}  Arazi yüzeyinin altındaki blok sayısı.
#   {derivative}  Yüzey biyomuyla ilişkili türetilmiş biyom veya varyant.
#   {detail}  İncelenen nesne veya geçerli ilerleme aşaması hakkında ek açıklama.
#   {diffs}  Üretim sonuçları arasında bulunan farkların sayısı.
#   {dimKey}  Paketlenen boyutun kimliği.
#   {dimension}  Mesajda belirtilen boyutun adı veya kimliği.
#   {dimensionId}  Yüklenen veya istenen boyutun kayıtlı kimliği.
#   {dimensionId2}  Önerilen silme komutunda tekrarlanan boyut kimliği.
#   {dimm}  Studio boyut kimliği veya doğrulama komutundaki pack adı.
#   {disabled}  Üretimi kapatılmış yerel yapıların sayısı.
#   {distances}  Ağaç onarımında değiştirilen yaprak uzaklığı değerlerinin sayısı.
#   {done}  Şimdiye kadar tamamlanan iş öğelerinin sayısı.
#   {downloadSource}  Pack indirmesinde kullanılan kaynak veya seçilen kaynak referansı.
#   {downloadable}  İçe aktarılan pack veya indirilebilir proje.
#   {dumpPath}  Kaydedilen temizleme veya geri yükleme verilerinin konumu.
#   {duration}  İşlemin biçimlendirilmiş süresi.
#   {e}  Başarısız yapı şablonu taramasındaki istisna metni.
#   {elapsed}  İşlem başlangıcından beri geçen biçimlendirilmiş süre.
#   {engines}  Etkin Iris üretim motorlarının veya boyutlarının sayısı.
#   {entity}  İncelenen spawner tarafından seçilen varlık türü.
#   {error}  Oluşan hatanın ayrıntıları.
#   {errorMessage}  Ana hata mesajına eklenen isteğe bağlı hata ayrıntısı eki.
#   {eta}  Biçimlendirilmiş tahmini kalan süre; bazı mesajlarda etiketi de dahildir.
#   {failed}  Başarısız öğe sayısı veya ilerleme başlığındaki hazır hata eki.
#   {failure}  Aramanın veya işlemin başarısız olma nedeni.
#   {failures}  Başarısız iş sayısı veya isteğe bağlı biçimlendirilmiş hata özeti.
#   {file}  İşlemle ilgili dosyanın adı veya yolu.
#   {filter}  Iris boyutları listesini süzmek için kullanılan metin.
#   {fps}  Önizlemenin saniyedeki geçerli kare sayısı.
#   {g}  Önceki paketleme ilerleme raporundan beri yazılan nesne dosyaları.
#   {generated}  Şimdiye kadar üretilmiş chunk sayısı.
#   {generator}  Gezginde gösterilen gürültü üretecinin adı.
#   {generatorKey}  İstenen gürültü üretecinin kimliği.
#   {get}  Başarıyla dönüştürülen schematic dosyalarının sayısı.
#   {golden}  Kaydedilmiş referans karşılaştırmasındaki chunk sayısı.
#   {goldenDimension}  Referans kaydında saklanan boyut kimliği.
#   {goldenSeed}  Referans kaydında saklanan dünya tohumu.
#   {goldenVersion}  Referans kaydını oluşturmak için kullanılan Minecraft sürümü.
#   {group}  Dil düzenleyicisindeki mesaj grubu veya içe aktarılan nesnenin kategorisi.
#   {guiNote}  Ön üretim ilerleme penceresi hakkında isteğe bağlı not.
#   {h}  Nesnenin blok cinsinden yüksekliği.
#   {hash}  Karşılaştırılan üretilmiş chunk verilerinin birleşik sağlama toplamı.
#   {health}  İncelenen varlığın geçerli sağlığı.
#   {height}  Mesajda belirtilen arazi yüksekliği, toplam yükseklik veya görüntülenen alanın yüksekliği.
#   {hours}  Biçimlendirilmiş sürenin saat bileşeni.
#   {i}  Motorun görünen adı veya komut listesi şablonundaki bir girdi.
#   {id}  İncelenen biyomun kayıt kimliği.
#   {imported}  Başarıyla içe aktarılan yapı veya nesne sayısı.
#   {includeNonJigsaw}  İçe aktarmaya jigsaw parçaları kullanmayan yapıların dahil edilip edilmediği.
#   {iris}  Iris üretimini kullanan yüklü boyutların sayısı.
#   {irisLevels}  Pack yükseklikleriyle karşılaştırılan yüklü Iris boyutlarının sayısı.
#   {irisPlaced}  Yerel üretim yerine Iris tarafından yerleştirilen yapı sayısı.
#   {job}  Tamamlanan arka plan işleminin adı.
#   {k}  Bölge dağılımı raporundaki bölge yükleme anahtarı.
#   {key}  Çevreleyen metinde belirtilen parametre, mesaj veya kaynak kimliği.
#   {key2}  Önerilen konum bulma komutunda tekrarlanan yapı kimliği.
#   {keyString}  İçe aktarılan veya geçersiz olarak bildirilen yapı ya da kaynak kimliği.
#   {label}  Bulunan hedefin görünen adı.
#   {line}  Dil düzenleyicisindeki satır numarası.
#   {locale}  en_US veya de_DE gibi dil kimliği.
#   {logicalWorldName}  Komutun hedeflediği dünyanın mantıksal adı.
#   {loot}  İncelenen ganimet tablosunun kimliği.
#   {m}  Ek tahliye mesajı veya komut şablonundaki yok sayılan parametre metni.
#   {mantleStatus}  Tekrar üretim karşılaştırmasından önce üretim verilerini sıfırlamanın sonucu.
#   {marker}  Aranan işaretçinin adı.
#   {material}  İncelenen bloğun Minecraft malzemesi.
#   {maxScale}  İstenen ölçek sınırlandıktan sonra izin verilen en büyük nesne ölçeği.
#   {maxX}  Gösterilen chunk aralığının üst X sınırı.
#   {maxY}  Dünyanın yükseklik aralığının üst sınırı.
#   {maxZ}  Gösterilen chunk aralığının üst Z sınırı.
#   {maximum}  Mesajda belirtilen en fazla giriş uzunluğu veya varlığın en yüksek sağlığı.
#   {mcmeta}  Oluşturulan datapack içindeki pack.mcmeta dosyasının yolu.
#   {message}  İşlemin sağladığı ayrıntılı durum veya hata metni.
#   {method}  Seçilen ön üretim yöntemi.
#   {minX}  Gösterilen chunk aralığının alt X sınırı.
#   {minY}  Dünyanın yükseklik aralığının alt sınırı.
#   {minZ}  Gösterilen chunk aralığının alt Z sınırı.
#   {minutes}  Biçimlendirilmiş sürenin dakika bileşeni.
#   {mismatches}  Kaydedilmiş referanstan farklı olan chunk sayısı.
#   {mode}  Seçilen içe aktarma, üretim veya önizleme modu.
#   {modeNote}  Seçilen ön üretim modu hakkında isteğe bağlı açıklama.
#   {name}  Mesajda belirtilen dünya, nesne, proje veya girdinin adı.
#   {nameRaw}  Normalleştirme veya doğrulama öncesinde tam olarak girilen ad.
#   {normalized}  Bulunamayan normalleştirilmiş yardım bölümü adı.
#   {num}  Motor zamanlama etiketinin biçimlendirilmiş parantezli kısmı; sayı olması gerekmez.
#   {object}  Düzenlenen veya incelenen Iris nesnesinin adı ya da kimliği.
#   {objects}  İncelenen chunktaki nesnelerin listesi veya sayısı.
#   {offset}  Arazi yüzeyinden blok cinsinden dikey uzaklık.
#   {output}  Yazılamayan çıktı dosyasının yolu.
#   {overall}  Tüm işlem boyunca saniyede önceden üretilen ortalama chunk sayısı.
#   {ownerName}  Studio oturumunun sahibi olan oyuncunun adı.
#   {pack}  İşlemde kullanılan Iris pack adının veya kimliğinin değeri.
#   {pack2}  Önerilen komutta veya indirme kaynağında tekrarlanan pack kimliği.
#   {packDimension}  Pack içinden seçilen boyut tanımı.
#   {packLogical}  Pack boyut tanımının istediği mantıksal yükseklik.
#   {packMax}  Pack tarafından istenen üst yükseklik sınırı.
#   {packMin}  Pack tarafından istenen alt yükseklik sınırı.
#   {packName}  Doğrulanan pack görünen adı.
#   {parameter}  Eksik veya ayrıştırılamayan komut parametresi.
#   {parent}  Üst menünün veya komut yolunun görünen adı.
#   {path}  Kaydedilen, açılan veya raporlanan dosyanın yolu.
#   {percent}  İlerleme yüzdesi; mesajın yüzde işaretini değişkenin dışında bırakın.
#   {permission}  İstenen işlem için gereken izin düğümü.
#   {personal}  Oyuncunun kaydedilmiş kişisel dil kimliği.
#   {phase}  Geçerli yükleme veya indirme aşamasının adı.
#   {pinned}  Ağaç nesnesi onarılırken sabitlenen yaprakların sayısı.
#   {player}  İzlenen veya hedeflenen oyuncunun adı.
#   {plugin}  Eklentinin görünen adı; Iris ortak dil ve hata ayıklama mesajlarında Iris.
#   {position}  Ayarlanan seçim köşesinin numarası.
#   {preset}  Ana dünya için kullanılan kayıtlı dünya üretim ön ayarı.
#   {primary}  Yapılandırılmış birincil dünyanın kimliği.
#   {processed}  Başarılı, atlanan ve başarısız olanlar dahil işlenen öğelerin sayısı.
#   {properties}  İncelenen blok özelliklerinin biçimlendirilmiş listesi.
#   {quarantinePath}  Karantinaya alınan temizleme dosyalarının klasörü.
#   {queued}  Çalışmayı bekleyen işçi veya iş öğelerinin sayısı.
#   {radius}  Önerilen başlatma komutunda tekrarlanan ön üretim yarıçapı.
#   {rarity}  Adı verilen bölgenin veya yerleştirmenin yapılandırılmış nadirlik değeri.
#   {rate}  Biçimlendirilmiş aktarım veya ön üretim hızı; saniye başına birimini mesaj ekler.
#   {reach}  Ağaç nesneleri onarılırken kullanılan yapılandırılmış dal arama menzili.
#   {ready}  Şu anda kullanılabilir kesin Atlas sayfalarının sayısı.
#   {reason}  İstenen işlemin neden tamamlanamadığının açıklaması.
#   {region}  İncelenen bölgenin adı veya kimliği.
#   {remaining}  Gösterilen listede yer almayan ek blok durumlarının sayısı.
#   {repository}  Ayıklanan depo veya indirilmiş arşiv.
#   {reverted}  Geri alınan nesne yapıştırmalarının sayısı.
#   {rotation}  Yerleştirilen nesneye uygulanan döndürme.
#   {rx}  Hash değeri hesaplanan chunk X koordinatı.
#   {rz}  Hash değeri hesaplanan chunk Z koordinatı.
#   {s}  Yeni Studio projesinin adı.
#   {safeName}  İçe aktarılan nesne için temizlenmiş dosya adı.
#   {scale}  Bir önizleme pikselinin temsil ettiği dünya bloklarının sayısı.
#   {scope}  Object Studio içinde açılan nesne veya nesne grubu.
#   {searchRadius}  Yapı doğrulama aramasının chunk cinsinden yarıçapı.
#   {seconds}  Sürenin saniye bileşeni veya son güncellemeden beri geçen süre.
#   {section}  Kullanıcının istediği yardım bölümünün adı.
#   {seed}  Dünya, Studio oturumu, üreteç veya referans karşılaştırması için kullanılan tohum.
#   {seedRaw}  Doğrulama öncesinde tam olarak girilen tohum.
#   {sixtySecond}  60 saniyelik aralıkta saniye başına önceden üretilen chunk sayısı.
#   {size}  Mesajda adı geçen dosya, uyarı, girdi veya öğelerin sayısı.
#   {skipped}  İşlem tarafından atlanan öğelerin sayısı.
#   {slope}  İncelenen konumdaki arazi eğimi.
#   {solidBlocks}  Üretim hash hesabında sayılan katı blokların sayısı.
#   {source}  İlerleme görünümüyle ilişkili pack, indirme kaynağı veya giriş.
#   {speed}  Saniye başına biçimlendirilmiş ön üretim veya işleme hızı.
#   {stage}  Geçerli ilerleme aşamasının adı.
#   {state}  Mesajda belirtilen geçerli durum veya özellik değeri.
#   {status}  Önizlemenin geçerli durum metni.
#   {structure}  Konumu aranan yapının adı veya kimliği.
#   {structureKey}  İstenen yapının kayıt veya pack kimliği.
#   {summary}  Tamamlanan işlemin biçimlendirilmiş sonuçları.
#   {suppressed}  Iris yerleştirmeleriyle değiştirilen yerel yapıların sayısı.
#   {surface}  Önerilen ışınlanma komutunda kullanılan yüzey Y koordinatı.
#   {surfaceY}  İncelenen konumdaki arazi yüzeyinin Y koordinatı.
#   {tag}  Pack adının önüne eklenen biçimlendirilmiş doğrulama durumu etiketi.
#   {target}  Mesajda belirtilen dil alıcısı veya nesne seçimi hedefi.
#   {targetX}  Bulunan veya istenen hedefin X koordinatı.
#   {targetZ}  Bulunan veya istenen hedefin Z koordinatı.
#   {template}  Proje oluşturulurken seçilen şablon.
#   {tenSecond}  10 saniyelik aralıkta saniye başına önceden üretilen chunk sayısı.
#   {thirtySecond}  30 saniyelik aralıkta saniye başına önceden üretilen chunk sayısı.
#   {threads}  Üretim hash hesabında kullanılan iş parçacıklarının sayısı.
#   {tileNote}  Kaydedilen veya yerleştirilen blok varlığı verileriyle ilgili isteğe bağlı not.
#   {title}  Sonucu gösterilen işlemin başlığı.
#   {to}  Yeni hata ayıklama ayarı: true açık, false kapalı anlamına gelir.
#   {token}  Ayrıştırılamayan menzil argümanı.
#   {total}  Mesajda belirtilen iş öğeleri, chunk, boyut veya girdilerin toplam sayısı.
#   {totalObjects}  Object Studio içinde açılan nesnelerin sayısı.
#   {transferred}  Şimdiye kadar aktarılan verinin biçimlendirilmiş miktarı.
#   {type}  Mesajda belirtilen beklenen parametre türü, kaynak türü veya nesne kategorisi.
#   {typeKey}  Kayıtlı Minecraft boyut türü kimliği veya inline.
#   {unreachableBiomes}  Pack biyom seçimleri nedeniyle hariç tutulan yerel yapıların sayısı.
#   {unsupported}  Bu platformun desteklenmiyor olarak bildirdiği yerel yapıların sayısı.
#   {updates}  Geliştirici görünümündeki saniye başına blok güncellemeleri.
#   {url}  Açılacak veya kopyalanacak web adresi.
#   {usage}  Komut sözdizimi veya bellek görünümündeki kullanım metni.
#   {used}  Bellek görünümündeki kullanılan belleğin biçimlendirilmiş miktarı.
#   {value}  Mesaja özgü değer: varsayılan ayar, ad, koordinat, sayı veya hata gibi; çevreleyen metne bakın.
#   {value2}  Mesaja özgü ikinci değer: toplam chunk, hedef Y, pack adı veya hata gibi.
#   {value3}  Mesaja özgü üçüncü değer: yüzde, hedef Z, Minecraft sürümü veya geçen süre gibi.
#   {value4}  Dördüncü değer: blok yazımları, seçimin Z koordinatı veya isteğe bağlı durum eki gibi.
#   {value5}  Beşinci değer: nesne yerleştirmede hava dışı blok yazımları veya konum şablonundaki chunk Z.
#   {variables}  Düzenlenen mesaj için kullanılabilen yer tutucuların listesi.
#   {velocity}  İncelenen varlığın geçerli hareket hızı.
#   {version}  Çevreleyen mesajda belirtilen eklenti veya Minecraft sürümü.
#   {volume}  Nesne seçimindeki blokların sayısı.
#   {w}  Nesnenin blok cinsinden genişliği.
#   {wantVariants}  İçe aktarılan her vanilla ağaç veya nesne özelliği için istenen varyant sayısı.
#   {warnings}  İşlemi engellemeyen doğrulama uyarılarının sayısı.
#   {width}  Gösterilen dünya alanının blok cinsinden genişliği.
#   {wood}  Ağaç nesnesi onarılırken eklenen odun bloklarının sayısı.
#   {world}  Komutun veya ilerleme görünümünün hedeflediği dünyanın adı.
#   {written}  Başarıyla yazılan içe aktarılmış varyant veya nesne dosyalarının sayısı.
#   {x}  Mesajda belirtilen blok, chunk, bölge veya önizleme bağlamındaki X koordinatı.
#   {y}  Dünyanın veya bloğun dikey koordinatı.
#   {z}  Mesajda belirtilen blok, chunk, bölge veya önizleme bağlamındaki Z koordinatı.
#   {zoom}  Önizlemenin geçerli yakınlaştırma düzeyi.
# === End Iris language guide ===

