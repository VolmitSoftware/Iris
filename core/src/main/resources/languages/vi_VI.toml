"director.import_every_structure_vanilla_ingested_datapacks_into_this_pack_as_editable_iris" = "Nhập mọi cấu trúc - vaniStencils và Dữ liệu đã nuốt vào gói này là có thể sửa Iris Nguồn lực, luôn vượt quá tầm tay.  Xây dựng lại cấu trúc ghép hình (villages, tiền đồn, trò chơi ghép dữ liệu) như đồ thị hồ sơ/ mảnh sửa đổi được, nhập vào mỗi mẫu cấu trúc NBT là một vật thể, và lắp ráp các cấu trúc đa tư (các tàu ngầm, phá hủy cánh cổng, tàn tích đại dương, hóa thạch thấp).  Chạy sau khi nuốt một bộ dữ liệu và khởi động lại.  Những bản sao nhập khẩu được sản xuất lại hoặc sử dụng một thế giới tươi mới."
