"language.editor.title" = "{plugin} › {section}"
# === Iris language guide ===
# Iris - vi_VI
#
# === Chỉnh sửa tệp ===
# languages/vi_VI.toml
# Bạn có thể chỉnh sửa trực tiếp tệp này. Thay đổi cục bộ được giữ lại; mục thiếu hoặc không hợp lệ dùng bản tiếng Anh tích hợp.
# /iris language server edit vi_VI
#
# === Tiền tố và ví dụ thông báo ===
# Tệp ngôn ngữ Iris không có thiết lập tiền tố chung cho mọi thông báo. Hãy thêm tiền tố trực tiếp vào nội dung từng thông báo cần sửa.
# Tiền tố plugin trong console và giao diện màu của menu do nơi hiển thị cung cấp riêng, không đổi theo chỉnh sửa này.
# Ví dụ: trong mục [iris.bukkit.commandiris], sửa set_debug thành:
# set_debug = "&6[Thế giới]&r &aĐã đặt gỡ lỗi thành: {to}"
# Chỉ phản hồi của /iris debug có thêm [Thế giới]. {to} là true (bật) hoặc false (tắt).
# {PC}, {SC} và {TC} không phải biến chủ đề được Iris hỗ trợ.
#
# === Màu và kiểu chữ ===
# Màu cơ bản: &0 đen, &1 xanh dương đậm, &2 xanh lá đậm, &3 xanh lơ đậm, &4 đỏ đậm, &5 tím đậm, &6 vàng kim, &7 xám.
# Màu cơ bản: &8 xám đậm, &9 xanh dương, &a xanh lá, &b xanh lơ, &c đỏ, &d tím nhạt, &e vàng, &f trắng.
# Kiểu chữ: &k ký tự xáo trộn, &l đậm, &m gạch ngang, &n gạch chân, &o nghiêng, &r đặt lại màu và kiểu chữ.
# Ví dụ: "&6Chú ý: &lchữ đậm&r chữ thường". Hiệu ứng màu tùy chỉnh của Bukkit có thể làm màu hiển thị thay đổi.
# Bộ xử lý ngôn ngữ nhận màu RGB dạng &#33CC99, &x33CC99, &x&3&3&C&C&9&9 và [33CC99].
# Tuy nhiên, bước xử lý màu mặc định của Bukkit có thể không giữ nguyên RGB; màu chính xác không được bảo đảm ở mọi nơi hiển thị.
# Lệnh trên bản mod, trợ giúp và màn hình máy khách thường dùng bản dịch đã bỏ định dạng, rồi áp dụng màu và kiểu chữ riêng.
#
# === Ký tự thoát trong TOML ===
# Trong chuỗi TOML đặt trong dấu nháy kép, \" là dấu nháy, \\ là dấu gạch chéo ngược và \n là xuống dòng.
# Dù đã thoát & hoặc [ ở bước xử lý ngôn ngữ, bước Bukkit phía sau vẫn có thể hiểu &a và các mã tương tự là màu.
# Một dấu gạch chéo ngược không tắt được xử lý màu tại mọi nơi hiển thị.
#
# === Biến ===
# Giữ nguyên tên biến và chỉ dùng các biến vốn có trong từng thông báo. Dưới đây là ý nghĩa của từng giá trị.
#   {MAXAUTOSELECTVOLUME}  Số khối tối đa được phép trong vùng tự chọn của đối tượng.
#   {MAXSAVEVOLUME}  Số khối tối đa trong vùng chọn đối tượng được lưu.
#   {MAXSPAN}  Giới hạn chiều rộng, cao hoặc sâu của cấu trúc khi thu thập, tính bằng khối.
#   {NATIVESTRUCTURELOCATERADIUS}  Bán kính tìm cấu trúc gốc tối đa, tính bằng chunk.
#   {ROOTPERMISSION}  Quyền gốc cần có để dùng lệnh.
#   {WORKSPACENAME}  Tên thư mục không gian làm việc Studio đang được tìm kiếm.
#   {WORLDPACKNAME}  Tên datapack thế giới được tạo.
#   {active}  Số luồng xử lý đang hoạt động.
#   {activeLocale}  Ngôn ngữ vẫn được dùng khi không thể chọn ngôn ngữ yêu cầu.
#   {activeMax}  Giới hạn trên của độ cao trong loại chiều không gian đã tải.
#   {activeMin}  Giới hạn dưới của độ cao trong loại chiều không gian đã tải.
#   {actualReverts}  Số lần dán đối tượng thực sự được hoàn tác.
#   {afb}  Phần văn bản đã định dạng sau đoạn trong ngoặc của nhãn thời gian xử lý.
#   {after}  Giá trị sau thay đổi hoặc số khối cây vẫn chưa nối được sau sửa chữa.
#   {amount}  Số lượng gắn với mục được nêu trong báo cáo.
#   {applied}  Số chunk đã áp dụng kết quả xử lý.
#   {argument}  Đối số lệnh không được chấp nhận.
#   {available}  Số cấu trúc gốc đủ điều kiện sinh ra.
#   {bar}  Văn bản thanh tiến độ đã được định dạng.
#   {befb}  Phần văn bản đã định dạng trước đoạn trong ngoặc của nhãn thời gian xử lý.
#   {before}  Giá trị trước thay đổi hoặc số khối cây chưa nối được trước sửa chữa.
#   {biome}  Tên hoặc mã định danh quần xã đang hiển thị.
#   {block}  Loại hoặc mô tả khối đang kiểm tra.
#   {blockX}  Tọa độ X của khối hoặc điểm dịch chuyển.
#   {blockY}  Tọa độ Y của khối hoặc điểm dịch chuyển.
#   {blockZ}  Tọa độ Z của khối hoặc điểm dịch chuyển.
#   {blocking}  Số lỗi kiểm tra khiến gói không thể tải.
#   {blocks}  Số biến thể khối trong nhóm đã nhập.
#   {bpp}  Số khối thế giới tương ứng với một điểm ảnh trong Vision.
#   {branches}  Số cành được thêm khi sửa đối tượng cây.
#   {broken}  Số gói không vượt qua kiểm tra.
#   {brokenTotal}  Tổng số gói không vượt qua kiểm tra.
#   {cave}  Quần xã hang động hoặc mô tả hang ở vị trí đang kiểm tra.
#   {centerX}  Tọa độ X của tâm vùng; đơn vị theo thông báo của thao tác.
#   {centerZ}  Tọa độ Z của tâm vùng; đơn vị theo thông báo của thao tác.
#   {changed}  Số đối tượng đã xử lý có thay đổi.
#   {chunk}  Tọa độ hoặc nhãn nhận diện chunk đang được báo cáo.
#   {chunkX}  Tọa độ X tính bằng chunk, không phải khối.
#   {chunkZ}  Tọa độ Z tính bằng chunk, không phải khối.
#   {chunks}  Số chunk nằm trong thao tác.
#   {clampedY}  Tọa độ Y đích sau khi điều chỉnh vào khoảng độ cao cho phép.
#   {command}  Tên lệnh hoặc toàn bộ lệnh cần chạy.
#   {converted}  Số khối lá được chuyển thành gỗ khi sửa cây.
#   {count}  Số mục, thông báo hoặc người chơi được nêu trong câu.
#   {current}  Số tiến độ hiện tại hoặc số chunk trong lần so sánh này.
#   {currentStage}  Tên giai đoạn tải hiện tại của Studio.
#   {d}  Độ sâu của đối tượng, tính bằng khối.
#   {depth}  Số khối bên dưới mặt đất.
#   {derivative}  Quần xã dẫn xuất hoặc biến thể gắn với quần xã bề mặt.
#   {detail}  Mô tả bổ sung về đối tượng đang kiểm tra hoặc giai đoạn hiện tại.
#   {diffs}  Số khác biệt phát hiện giữa các kết quả sinh.
#   {dimKey}  Mã định danh chiều không gian đang đóng gói.
#   {dimension}  Tên hoặc mã chiều không gian được nêu trong thông báo.
#   {dimensionId}  Mã đã đăng ký của chiều không gian đã tải hoặc được yêu cầu.
#   {dimensionId2}  Mã chiều không gian được lặp lại trong lệnh xóa gợi ý.
#   {dimm}  Mã chiều không gian Studio hoặc tên gói trong lệnh kiểm tra.
#   {disabled}  Số cấu trúc gốc đã tắt sinh.
#   {distances}  Số giá trị khoảng cách lá được đổi khi sửa cây.
#   {done}  Số hạng mục đã hoàn tất đến hiện tại.
#   {downloadSource}  Nguồn hoặc bản tham chiếu được chọn để tải gói.
#   {downloadable}  Gói hoặc dự án có thể tải xuống đang được nhập.
#   {dumpPath}  Vị trí lưu dữ liệu dọn dẹp hoặc khôi phục.
#   {duration}  Thời lượng thao tác đã được định dạng.
#   {e}  Nội dung ngoại lệ khi quét mẫu cấu trúc thất bại.
#   {elapsed}  Thời gian đã trôi qua từ lúc bắt đầu, có định dạng.
#   {engines}  Số bộ máy sinh hoặc chiều không gian Iris đang hoạt động.
#   {entity}  Loại thực thể được chọn trong lồng sinh đang kiểm tra.
#   {error}  Chi tiết lỗi đã xảy ra.
#   {errorMessage}  Phần chi tiết lỗi tùy chọn nối sau thông báo thất bại chính.
#   {eta}  Thời gian còn lại ước tính đã định dạng; đôi khi có cả nhãn.
#   {failed}  Số mục thất bại hoặc phần hậu tố lỗi trong tiêu đề tiến độ.
#   {failure}  Lý do tìm kiếm hoặc thao tác thất bại.
#   {failures}  Số tác vụ thất bại hoặc tóm tắt lỗi có định dạng, nếu có.
#   {file}  Tên hoặc đường dẫn tệp liên quan đến thao tác.
#   {filter}  Văn bản dùng để lọc danh sách chiều không gian Iris.
#   {fps}  Tốc độ dựng hình xem trước hiện tại, tính bằng khung hình/giây.
#   {g}  Số tệp đối tượng đã ghi từ lần báo tiến độ đóng gói trước.
#   {generated}  Số chunk đã sinh đến hiện tại.
#   {generator}  Tên bộ sinh nhiễu hiển thị trong trình khám phá.
#   {generatorKey}  Mã bộ sinh nhiễu được yêu cầu.
#   {get}  Số bản thiết kế schematic đã chuyển đổi thành công.
#   {golden}  Số chunk trong bản tham chiếu đã lưu để so sánh.
#   {goldenDimension}  Mã chiều không gian lưu trong bản tham chiếu.
#   {goldenSeed}  Hạt giống thế giới lưu trong bản tham chiếu.
#   {goldenVersion}  Phiên bản Minecraft dùng để tạo bản tham chiếu.
#   {group}  Nhóm thông báo trong trình sửa ngôn ngữ hoặc loại đối tượng đã nhập.
#   {guiNote}  Ghi chú tùy chọn về cửa sổ tiến độ tạo trước.
#   {h}  Chiều cao đối tượng, tính bằng khối.
#   {hash}  Giá trị kiểm tra tổng hợp của các chunk đã sinh đang được so sánh.
#   {health}  Máu hiện tại của thực thể đang kiểm tra.
#   {height}  Độ cao địa hình, tổng độ cao hoặc chiều cao vùng hiển thị, tùy câu.
#   {hours}  Phần giờ trong thời lượng đã định dạng.
#   {i}  Tên hiển thị bộ máy hoặc một mục trong mẫu danh sách lệnh.
#   {id}  ID đăng ký của quần xã đang kiểm tra.
#   {imported}  Số cấu trúc hoặc đối tượng đã nhập thành công.
#   {includeNonJigsaw}  Có nhập cả cấu trúc không dùng mảnh jigsaw hay không.
#   {iris}  Số chiều không gian đã tải sử dụng sinh thế giới Iris.
#   {irisLevels}  Số chiều không gian Iris đã tải được đối chiếu độ cao với gói.
#   {irisPlaced}  Số cấu trúc do Iris đặt thay vì bộ sinh gốc.
#   {job}  Tên tác vụ nền đã hoàn tất.
#   {k}  Khóa tải vùng trong báo cáo phân bố vùng.
#   {key}  Mã tham số, thông báo hoặc tài nguyên được nêu trong câu.
#   {key2}  Mã cấu trúc lặp lại trong lệnh tìm vị trí gợi ý.
#   {keyString}  Mã cấu trúc hoặc tài nguyên đang nhập hay được báo là không hợp lệ.
#   {label}  Tên hiển thị của mục tiêu đã tìm thấy.
#   {line}  Số dòng trong trình sửa ngôn ngữ.
#   {locale}  Mã ngôn ngữ, chẳng hạn en_US hoặc de_DE.
#   {logicalWorldName}  Tên logic của thế giới mà lệnh nhắm đến.
#   {loot}  Mã bảng chiến lợi phẩm đang kiểm tra.
#   {m}  Thông báo di tản bổ sung hoặc văn bản tham số bị bỏ qua trong mẫu lệnh.
#   {mantleStatus}  Kết quả đặt lại dữ liệu sinh trước khi so sánh lần sinh lại.
#   {marker}  Tên dấu mốc đang tìm.
#   {material}  Vật liệu Minecraft của khối đang kiểm tra.
#   {maxScale}  Tỷ lệ đối tượng tối đa cho phép sau khi giới hạn tỷ lệ yêu cầu.
#   {maxX}  Giới hạn X trên của vùng chunk đang hiển thị.
#   {maxY}  Giới hạn trên của khoảng độ cao thế giới.
#   {maxZ}  Giới hạn Z trên của vùng chunk đang hiển thị.
#   {maximum}  Độ dài nhập tối đa hoặc máu tối đa của thực thể, tùy câu.
#   {mcmeta}  Đường dẫn tệp pack.mcmeta của datapack được tạo.
#   {message}  Văn bản trạng thái hoặc lỗi chi tiết do thao tác cung cấp.
#   {method}  Phương thức tạo trước đã chọn.
#   {minX}  Giới hạn X dưới của vùng chunk đang hiển thị.
#   {minY}  Giới hạn dưới của khoảng độ cao thế giới.
#   {minZ}  Giới hạn Z dưới của vùng chunk đang hiển thị.
#   {minutes}  Phần phút trong thời lượng đã định dạng.
#   {mismatches}  Số chunk khác với bản tham chiếu đã lưu.
#   {mode}  Chế độ nhập, sinh hoặc xem trước đã chọn.
#   {modeNote}  Giải thích tùy chọn về chế độ tạo trước đã chọn.
#   {name}  Tên thế giới, đối tượng, dự án hoặc mục được nêu trong thông báo.
#   {nameRaw}  Tên đúng như đã nhập, trước khi chuẩn hóa hoặc kiểm tra.
#   {normalized}  Tên mục trợ giúp đã chuẩn hóa nhưng không tìm thấy.
#   {num}  Đoạn trong ngoặc đã định dạng của nhãn thời gian xử lý; không nhất thiết là số.
#   {object}  Tên hoặc mã đối tượng Iris đang sửa hay kiểm tra.
#   {objects}  Danh sách hoặc số đối tượng trong chunk đang kiểm tra.
#   {offset}  Khoảng cách thẳng đứng so với mặt đất, tính bằng khối.
#   {output}  Đường dẫn tệp đầu ra không ghi được.
#   {overall}  Số chunk tạo trước trung bình mỗi giây trong toàn bộ thao tác.
#   {ownerName}  Tên người chơi sở hữu phiên Studio.
#   {pack}  Tên hoặc mã gói Iris liên quan đến thao tác.
#   {pack2}  Mã gói lặp lại trong lệnh gợi ý hoặc nguồn tải.
#   {packDimension}  Định nghĩa chiều không gian được chọn từ gói.
#   {packLogical}  Độ cao logic mà định nghĩa chiều không gian của gói yêu cầu.
#   {packMax}  Giới hạn độ cao trên mà gói yêu cầu.
#   {packMin}  Giới hạn độ cao dưới mà gói yêu cầu.
#   {packName}  Tên hiển thị của gói đang kiểm tra.
#   {parameter}  Tham số lệnh bị thiếu hoặc không phân tích được.
#   {parent}  Tên hiển thị của menu hoặc nhánh lệnh cha.
#   {path}  Đường dẫn tệp được lưu, mở hoặc báo cáo.
#   {percent}  Phần trăm tiến độ; giữ dấu % của thông báo bên ngoài biến.
#   {permission}  Nút quyền cần có cho hành động yêu cầu.
#   {personal}  Mã ngôn ngữ cá nhân đã lưu của người chơi.
#   {phase}  Tên giai đoạn tải hoặc tải xuống hiện tại.
#   {pinned}  Số lá được cố định khi sửa đối tượng cây.
#   {player}  Tên người chơi đang theo dõi hoặc nhắm đến.
#   {plugin}  Tên hiển thị plugin; là Iris trong thông báo ngôn ngữ và chẩn đoán dùng chung của Iris.
#   {position}  Số góc vùng chọn đang được đặt.
#   {preset}  Thiết lập sinh thế giới đã đăng ký được dùng cho thế giới chính.
#   {primary}  Mã định danh thế giới chính đã cấu hình.
#   {processed}  Số mục đã xử lý, gồm thành công, bỏ qua và thất bại.
#   {properties}  Danh sách thuộc tính đã định dạng của khối đang kiểm tra.
#   {quarantinePath}  Thư mục chứa các tệp được cách ly khi dọn dẹp.
#   {queued}  Số luồng xử lý hoặc hạng mục đang chờ chạy.
#   {radius}  Bán kính tạo trước lặp lại trong lệnh bắt đầu gợi ý.
#   {rarity}  Độ hiếm đã cấu hình của vùng hoặc vị trí đặt được nêu.
#   {rate}  Tốc độ truyền dữ liệu hoặc tạo trước đã định dạng; câu thêm hậu tố mỗi giây.
#   {reach}  Tầm tìm cành đã cấu hình khi sửa đối tượng cây.
#   {ready}  Số trang Atlas chính xác hiện có.
#   {reason}  Lý do không thể hoàn tất hành động yêu cầu.
#   {region}  Tên hoặc mã vùng đang kiểm tra.
#   {remaining}  Số trạng thái khối bổ sung bị lược khỏi danh sách hiển thị.
#   {repository}  Kho mã hoặc tệp nén đã tải đang được giải nén.
#   {reverted}  Số lần dán đối tượng được hoàn tác.
#   {rotation}  Góc xoay áp dụng cho đối tượng đã đặt.
#   {rx}  Tọa độ X của chunk đang tính mã băm.
#   {rz}  Tọa độ Z của chunk đang tính mã băm.
#   {s}  Tên dự án Studio mới.
#   {safeName}  Tên tệp đã loại ký tự không an toàn cho đối tượng nhập.
#   {scale}  Số khối thế giới tương ứng với một điểm ảnh xem trước.
#   {scope}  Đối tượng hoặc nhóm đối tượng mở trong Object Studio.
#   {searchRadius}  Bán kính tìm kiếm để kiểm chứng cấu trúc, tính bằng chunk.
#   {seconds}  Phần giây của thời lượng hoặc số giây từ lần cập nhật cuối.
#   {section}  Tên mục trợ giúp người dùng yêu cầu.
#   {seed}  Hạt giống dùng cho thế giới, Studio, bộ sinh hoặc so sánh tham chiếu.
#   {seedRaw}  Hạt giống đúng như đã nhập, trước khi kiểm tra.
#   {sixtySecond}  Số chunk tạo trước mỗi giây trong cửa sổ 60 giây.
#   {size}  Số tệp, cảnh báo, mục hoặc vật phẩm được nêu trong câu.
#   {skipped}  Số mục bị bỏ qua trong thao tác.
#   {slope}  Độ dốc địa hình ở vị trí đang kiểm tra.
#   {solidBlocks}  Số khối rắn được đếm khi tính mã băm sinh thế giới.
#   {source}  Gói, nguồn tải hoặc dữ liệu đầu vào gắn với tiến độ hiển thị.
#   {speed}  Tốc độ tạo trước hoặc xử lý mỗi giây, đã định dạng.
#   {stage}  Tên giai đoạn tiến độ hiện tại.
#   {state}  Trạng thái hoặc giá trị thuộc tính hiện tại được nêu trong câu.
#   {status}  Văn bản trạng thái xem trước hiện tại.
#   {structure}  Tên hoặc mã cấu trúc đang tìm vị trí.
#   {structureKey}  Mã đăng ký hoặc mã trong gói của cấu trúc yêu cầu.
#   {summary}  Kết quả đã định dạng của thao tác hoàn tất.
#   {suppressed}  Số cấu trúc gốc được thay bằng cấu trúc do Iris đặt.
#   {surface}  Tọa độ Y mặt đất dùng trong lệnh dịch chuyển gợi ý.
#   {surfaceY}  Tọa độ Y mặt đất tại vị trí đang kiểm tra.
#   {tag}  Nhãn trạng thái kiểm tra đã định dạng, đặt trước tên gói.
#   {target}  Người nhận ngôn ngữ hoặc mục tiêu chọn đối tượng được nêu trong câu.
#   {targetX}  Tọa độ X của điểm đến đã tìm thấy hoặc được yêu cầu.
#   {targetZ}  Tọa độ Z của điểm đến đã tìm thấy hoặc được yêu cầu.
#   {template}  Mẫu được chọn khi tạo dự án.
#   {tenSecond}  Số chunk tạo trước mỗi giây trong cửa sổ 10 giây.
#   {thirtySecond}  Số chunk tạo trước mỗi giây trong cửa sổ 30 giây.
#   {threads}  Số luồng xử lý dùng để tính mã băm sinh thế giới.
#   {tileNote}  Ghi chú tùy chọn về dữ liệu thực thể khối đã lưu hoặc đặt.
#   {title}  Tiêu đề thao tác có kết quả đang hiển thị.
#   {to}  Thiết lập gỡ lỗi mới: true là bật, false là tắt.
#   {token}  Đối số reach không phân tích được.
#   {total}  Tổng số hạng mục, chunk, chiều không gian hoặc mục được nêu trong câu.
#   {totalObjects}  Số đối tượng mở trong Object Studio.
#   {transferred}  Lượng dữ liệu đã truyền đến hiện tại, có định dạng.
#   {type}  Kiểu tham số cần có, loại tài nguyên hoặc loại đối tượng được nêu trong câu.
#   {typeKey}  Mã loại chiều không gian Minecraft đã đăng ký, hoặc inline.
#   {unreachableBiomes}  Số cấu trúc gốc bị loại do lựa chọn quần xã của gói.
#   {unsupported}  Số cấu trúc gốc được báo là không được nền tảng hỗ trợ.
#   {updates}  Số cập nhật khối mỗi giây trong màn hình nhà phát triển.
#   {url}  Địa chỉ web để mở hoặc sao chép.
#   {usage}  Cú pháp lệnh hoặc văn bản mức dùng trong màn hình bộ nhớ.
#   {used}  Dung lượng bộ nhớ đã dùng, có định dạng.
#   {value}  Giá trị tùy thông báo: thiết lập mặc định, tên, tọa độ, số lượng hoặc lỗi. Xem ngữ cảnh.
#   {value2}  Giá trị thứ hai tùy thông báo: tổng chunk, tọa độ Y đích, tên gói hoặc lỗi.
#   {value3}  Giá trị thứ ba tùy thông báo: phần trăm, tọa độ Z đích, phiên bản Minecraft hoặc thời gian đã qua.
#   {value4}  Giá trị thứ tư tùy thông báo: số lần ghi khối, tọa độ Z vùng chọn hoặc hậu tố trạng thái.
#   {value5}  Giá trị thứ năm: số khối không phải không khí đã ghi khi đặt đối tượng, hoặc chunk Z trong mẫu vị trí.
#   {variables}  Danh sách biến dùng được trong thông báo đang sửa.
#   {velocity}  Vận tốc di chuyển hiện tại của thực thể đang kiểm tra.
#   {version}  Phiên bản plugin hoặc Minecraft được nêu trong câu.
#   {volume}  Số khối trong vùng chọn đối tượng.
#   {w}  Chiều rộng đối tượng, tính bằng khối.
#   {wantVariants}  Số biến thể yêu cầu cho mỗi cây hoặc đặc trưng đối tượng vanilla được nhập.
#   {warnings}  Số cảnh báo kiểm tra không chặn hoạt động.
#   {width}  Chiều rộng vùng thế giới hiển thị, tính bằng khối.
#   {wood}  Số khối gỗ được thêm khi sửa đối tượng cây.
#   {world}  Tên thế giới mà lệnh hoặc tiến độ hiển thị nhắm đến.
#   {written}  Số biến thể nhập hoặc tệp đối tượng đã ghi thành công.
#   {x}  Tọa độ X theo ngữ cảnh khối, chunk, vùng hoặc xem trước trong câu.
#   {y}  Tọa độ thẳng đứng của thế giới hoặc khối.
#   {z}  Tọa độ Z theo ngữ cảnh khối, chunk, vùng hoặc xem trước trong câu.
#   {zoom}  Mức thu phóng hiện tại của bản xem trước.
# === End Iris language guide ===

