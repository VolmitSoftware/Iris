# === Iris language guide ===
# Iris - zh_CN
#
# === 编辑文件 ===
# languages/zh_CN.toml
# 可直接编辑此文件。本地修改会保留；缺失或无效条目使用内置英语文本。
# /iris language server edit zh_CN
#
# === 前缀与消息示例 ===
# Iris 语言文件没有适用于所有消息的全局前缀设置。请直接在需要修改的单条消息正文中添加前缀。
# 控制台插件前缀和菜单主题由显示端单独提供，不会随此修改而改变。
# 例如，在 [iris.bukkit.commandiris] 节中修改 set_debug：
# set_debug = "&6[世界]&r &a调试已设为：{to}"
# 只有 /iris debug 的回复会增加 [世界]。{to} 为 true（启用）或 false（禁用）。
# {PC}、{SC} 和 {TC} 不是 Iris 支持的主题变量。
#
# === 颜色与格式 ===
# 基本颜色：&0 黑色、&1 深蓝色、&2 深绿色、&3 深青色、&4 深红色、&5 深紫色、&6 金色、&7 灰色。
# 基本颜色：&8 深灰色、&9 蓝色、&a 绿色、&b 青色、&c 红色、&d 浅紫色、&e 黄色、&f 白色。
# 样式：&k 随机字符、&l 粗体、&m 删除线、&n 下划线、&o 斜体、&r 重置颜色和样式。
# 例如："&6注意：&l粗体文字&r 普通文字"。Bukkit 的自定义颜色效果可能改变显示颜色。
# 语言处理器接受 &#33CC99、&x33CC99、&x&3&3&C&C&9&9 和 [33CC99] 形式的 RGB 颜色。
# 但 Bukkit 的默认颜色处理可能无法保留原始 RGB，因此无法保证所有输出位置都显示精确颜色。
# 模组命令、帮助和客户端界面等使用去除格式的翻译文本，并保留显示端自己的颜色和样式。
#
# === TOML 转义 ===
# 在双引号包围的 TOML 字符串中，\" 表示引号，\\ 表示反斜杠，\n 表示换行。
# 即使语言处理阶段转义了 & 或 [，后续 Bukkit 处理仍可能把 &a 等重新识别为颜色代码。
# 仅添加反斜杠并不能在所有显示位置禁用颜色处理。
#
# === 变量 ===
# 请勿更改变量名称，只使用各消息原有的变量。以下说明每个值的具体含义。
#   {MAXAUTOSELECTVOLUME}  对象自动选择允许的最大方块数。
#   {MAXSAVEVOLUME}  保存对象选区允许的最大方块数。
#   {MAXSPAN}  捕获结构时允许的最大宽度、高度或深度，单位为方块。
#   {NATIVESTRUCTURELOCATERADIUS}  原生结构的最大搜索半径，单位为区块。
#   {ROOTPERMISSION}  使用命令所需的根权限。
#   {WORKSPACENAME}  正在搜索的 Studio 工作区文件夹名称。
#   {WORLDPACKNAME}  生成的世界数据包名称。
#   {active}  当前正在运行的工作线程数。
#   {activeLocale}  无法选择请求的语言时仍在使用的语言。
#   {activeMax}  已加载维度类型的高度范围上限。
#   {activeMin}  已加载维度类型的高度范围下限。
#   {actualReverts}  实际撤销的对象粘贴次数。
#   {added}  语言更新中新增的消息数。
#   {afb}  引擎耗时标签中括号部分之后的已格式化文本。
#   {after}  更改后的值，或修复后仍无法连通的树木方块数。
#   {amount}  报告中所述条目的数量。
#   {applied}  已应用处理结果的区块数。
#   {argument}  无法接受的命令参数。
#   {available}  符合生成条件的原生结构数。
#   {bar}  已格式化的进度条文本。
#   {befb}  引擎耗时标签中括号部分之前的已格式化文本。
#   {before}  更改前的值，或修复前无法连通的树木方块数。
#   {biome}  正在显示的生物群系名称或标识符。
#   {block}  正在检查的方块类型或描述。
#   {blockX}  方块或传送目的地的 X 坐标。
#   {blockY}  方块或传送目的地的 Y 坐标。
#   {blockZ}  方块或传送目的地的 Z 坐标。
#   {blocking}  导致数据包无法加载的验证错误数。
#   {blocks}  导入组中的方块变体数。
#   {bpp}  Vision 中每个像素表示的世界方块数。
#   {branches}  修复树木对象时添加的树枝数。
#   {broken}  验证失败的数据包数。
#   {brokenTotal}  验证失败的数据包总数。
#   {cave}  检查位置的洞穴生物群系或洞穴描述。
#   {centerX}  区域中心的 X 坐标；单位以操作消息为准。
#   {centerZ}  区域中心的 Z 坐标；单位以操作消息为准。
#   {changed}  已处理对象中发生更改的数量。
#   {chunk}  报告所指区块的坐标或标识标签。
#   {chunkX}  以区块为单位的 X 坐标，而非方块坐标。
#   {chunkZ}  以区块为单位的 Z 坐标，而非方块坐标。
#   {chunks}  操作包含的区块数。
#   {clampedY}  调整至允许高度范围后的传送目的地 Y 坐标。
#   {command}  命令名称或要执行的完整命令。
#   {converted}  修复树木时转为木材的树叶方块数。
#   {count}  上下文所指的条目、消息或玩家数量。
#   {current}  当前进度数量，或本次比较的区块数。
#   {currentStage}  Studio 当前加载阶段的名称。
#   {d}  对象深度，单位为方块。
#   {depth}  距地表向下的方块数。
#   {derivative}  与地表生物群系关联的衍生群系或变种。
#   {detail}  检查对象或当前进度阶段的补充说明。
#   {diffs}  生成结果之间检测到的差异数。
#   {dimKey}  正在打包的维度标识符。
#   {dimension}  消息所指的维度名称或标识符。
#   {dimensionId}  已加载或请求的维度的注册标识符。
#   {dimensionId2}  建议的删除命令中重复使用的维度标识符。
#   {dimm}  Studio 维度标识符，或验证命令中的数据包名称。
#   {disabled}  已禁用生成的原生结构数。
#   {distances}  修复树木时更改的树叶距离值数量。
#   {done}  目前已完成的工作项数量。
#   {downloadSource}  用于下载数据包的来源或选定引用。
#   {downloadable}  正在导入的数据包或可下载项目。
#   {dumpPath}  已保存的清理或恢复数据的位置。
#   {duration}  已格式化的操作耗时。
#   {e}  扫描结构模板失败时的异常文本。
#   {elapsed}  已格式化的操作开始后经过时间。
#   {engines}  正在运行的 Iris 生成引擎或维度数。
#   {entity}  正在检查的刷怪笼所选的实体类型。
#   {error}  发生的错误详情。
#   {errorMessage}  附加在主要失败消息后的可选错误详情。
#   {eta}  已格式化的预计剩余时间；部分消息中包含标签。
#   {failed}  失败项数，或进度标题中的预设失败后缀。
#   {failure}  搜索或操作失败的原因。
#   {failures}  失败工作数量，或可选的已格式化失败摘要。
#   {file}  操作所涉及的文件名或路径。
#   {filter}  用于筛选 Iris 维度列表的文本。
#   {fps}  当前预览渲染帧率，单位为帧每秒。
#   {g}  上次打包进度报告后写入的对象文件数。
#   {generated}  目前已生成的区块数。
#   {generator}  浏览器中显示的噪声生成器名称。
#   {generatorKey}  请求的噪声生成器标识符。
#   {get}  成功转换的 schematic 蓝图数。
#   {golden}  已保存的比较基准中的区块数。
#   {goldenDimension}  基准记录中保存的维度标识符。
#   {goldenSeed}  基准记录中保存的世界种子。
#   {goldenVersion}  创建基准记录时使用的 Minecraft 版本。
#   {group}  语言编辑器的消息组，或导入对象的分类。
#   {guiNote}  有关预生成进度窗口的可选说明。
#   {h}  对象高度，单位为方块。
#   {hash}  被比较的生成区块的合并校验和。
#   {health}  正在检查的实体的当前生命值。
#   {height}  消息所指的地形高度、总高度或显示区域高度。
#   {hours}  格式化时长中的小时部分。
#   {i}  引擎显示名称，或命令列表模板中的条目。
#   {id}  正在检查的生物群系的注册 ID。
#   {imported}  成功导入的结构或对象数。
#   {includeNonJigsaw}  是否也导入不使用拼图部件的结构。
#   {iris}  使用 Iris 生成的已加载维度数。
#   {irisLevels}  已与数据包高度进行比较的已加载 Iris 维度数。
#   {irisPlaced}  由 Iris 放置而非原生生成的结构数。
#   {job}  已完成的后台操作名称。
#   {k}  区域分布报告中的区域加载键。
#   {kept}  语言更新中保留的本地修改数。
#   {key}  上下文所指的参数、消息或资源标识符。
#   {key2}  建议的定位命令中重复使用的结构标识符。
#   {keyString}  正在导入或被报告为无效的结构或资源标识符。
#   {label}  已找到目标的显示名称。
#   {line}  语言编辑器中的行号。
#   {locale}  语言标识符，例如 en_US 或 de_DE。
#   {logicalWorldName}  命令所针对世界的逻辑名称。
#   {loot}  正在检查的战利品表标识符。
#   {m}  额外的疏散消息，或命令模板中被忽略参数的文本。
#   {mantleStatus}  重复生成比较前重置生成数据的结果。
#   {marker}  正在搜索的标记名称。
#   {material}  正在检查的方块的 Minecraft 材质。
#   {maxScale}  限制请求缩放比例后的最大允许对象比例。
#   {maxX}  显示的区块范围的 X 上界。
#   {maxY}  世界高度范围的上界。
#   {maxZ}  显示的区块范围的 Z 上界。
#   {maximum}  消息所指的最大输入长度或实体最大生命值。
#   {mcmeta}  生成的数据包的 pack.mcmeta 文件路径。
#   {message}  操作提供的详细状态或错误文本。
#   {method}  所选的预生成方式。
#   {minX}  显示的区块范围的 X 下界。
#   {minY}  世界高度范围的下界。
#   {minZ}  显示的区块范围的 Z 下界。
#   {minutes}  格式化时长中的分钟部分。
#   {mismatches}  与已保存基准不同的区块数。
#   {mode}  所选的导入、生成或预览模式。
#   {modeNote}  所选预生成模式的可选说明。
#   {name}  消息所指的世界、对象、项目或条目名称。
#   {nameRaw}  规范化或验证前的原始输入名称。
#   {normalized}  未找到的已规范化帮助章节名称。
#   {num}  引擎耗时标签中已格式化的括号部分，不一定是数字。
#   {object}  正在编辑或检查的 Iris 对象名称或标识符。
#   {objects}  被检查区块中的对象列表或数量。
#   {offset}  距地表的垂直距离，单位为方块。
#   {output}  无法写入的输出文件路径。
#   {overall}  整个预生成操作的平均每秒区块数。
#   {ownerName}  拥有 Studio 会话的玩家名称。
#   {pack}  操作涉及的 Iris 数据包名称或标识符。
#   {pack2}  建议命令或下载来源中重复使用的数据包标识符。
#   {packDimension}  从数据包中选定的维度定义。
#   {packLogical}  数据包维度定义所要求的逻辑高度。
#   {packMax}  数据包要求的高度上限。
#   {packMin}  数据包要求的高度下限。
#   {packName}  正在验证的数据包显示名称。
#   {parameter}  缺失或无法解析的命令参数。
#   {parent}  上级菜单或命令路径的显示名称。
#   {path}  正在保存、打开或报告的文件路径。
#   {percent}  进度百分比；请将消息中的 % 符号留在变量外。
#   {permission}  执行请求操作所需的权限节点。
#   {personal}  玩家已保存的个人语言标识符。
#   {phase}  当前加载或下载阶段的名称。
#   {pinned}  修复树木对象时固定的树叶数。
#   {player}  正在跟随或作为目标的玩家名称。
#   {plugin}  插件显示名称；Iris 的共享语言和诊断消息中为 Iris。
#   {position}  正在设置的选区角点编号。
#   {preset}  主世界使用的已注册世界生成预设。
#   {primary}  已配置的主要世界标识符。
#   {processed}  已处理项数，包括成功、跳过和失败项。
#   {properties}  正在检查的方块的已格式化属性列表。
#   {quarantinePath}  存放清理隔离文件的文件夹。
#   {queued}  等待执行的工作线程或工作项数量。
#   {radius}  建议的开始命令中重复使用的预生成半径。
#   {rarity}  所述区域或放置项配置的稀有度。
#   {rate}  已格式化的传输或预生成速率；每秒后缀由消息添加。
#   {reach}  修复树木对象时使用的已配置树枝搜索距离。
#   {ready}  当前可用的精确 Atlas 页面数。
#   {reason}  无法完成请求操作的原因。
#   {region}  正在检查的区域名称或标识符。
#   {remaining}  显示列表中省略的额外方块状态数；距下次语言检查的剩余时间。
#   {repository}  正在解包的仓库或已下载归档。
#   {reverted}  已撤销的对象粘贴次数。
#   {rotation}  应用于已放置对象的旋转。
#   {rx}  正在计算哈希的区块 X 坐标。
#   {rz}  正在计算哈希的区块 Z 坐标。
#   {s}  新 Studio 项目名称。
#   {safeName}  导入对象使用的已清理文件名。
#   {scale}  预览中每个像素表示的世界方块数。
#   {scope}  Object Studio 中打开的对象或对象组。
#   {searchRadius}  结构验证的搜索半径，单位为区块。
#   {seconds}  时长中的秒部分，或距上次更新的秒数。
#   {section}  用户请求的帮助章节名称。
#   {seed}  世界、Studio 会话、生成器或基准比较使用的种子。
#   {seedRaw}  验证前的原始输入种子。
#   {sixtySecond}  60 秒窗口内的预生成每秒区块数。
#   {size}  消息所指的文件、警告、条目或物品数量。
#   {skipped}  操作中跳过的项数。
#   {slope}  检查位置的地形坡度。
#   {solidBlocks}  生成哈希统计的固体方块数。
#   {source}  与进度显示关联的数据包、下载来源或输入。
#   {speed}  已格式化的预生成或处理每秒速率。
#   {stage}  当前进度阶段名称。
#   {state}  消息所指的当前状态或属性值。
#   {status}  当前预览状态文本。
#   {structure}  正在定位的结构名称或标识符。
#   {structureKey}  请求结构的注册或数据包标识符。
#   {summary}  已完成操作的格式化结果摘要。
#   {suppressed}  被 Iris 放置替代的原生结构数。
#   {surface}  建议传送命令中使用的地表 Y 坐标。
#   {surfaceY}  检查位置的地表 Y 坐标。
#   {tag}  置于数据包名称前的已格式化验证状态标签。
#   {target}  消息所指的语言接收者或对象选择目标。
#   {targetX}  已找到或请求目的地的 X 坐标。
#   {targetZ}  已找到或请求目的地的 Z 坐标。
#   {template}  创建项目时选择的模板。
#   {tenSecond}  10 秒窗口内的预生成每秒区块数。
#   {thirtySecond}  30 秒窗口内的预生成每秒区块数。
#   {threads}  生成哈希使用的工作线程数。
#   {tileNote}  有关已保存或放置的方块实体数据的可选说明。
#   {title}  正在显示结果的操作标题。
#   {to}  新的调试设置：true 表示启用，false 表示禁用。
#   {token}  无法解析的 reach 参数。
#   {total}  消息所指的工作项、区块、维度或条目总数。
#   {totalObjects}  Object Studio 中打开的对象数。
#   {transferred}  已格式化的目前传输数据量。
#   {type}  消息所指的预期参数类型、资源类型或对象类别。
#   {typeKey}  已注册的 Minecraft 维度类型标识符，或 inline。
#   {unreachableBiomes}  因数据包生物群系选择而被排除的原生结构数。
#   {unsupported}  此平台报告为不支持的原生结构数。
#   {updated}  语言更新中更改的消息数。
#   {updates}  开发者显示中的每秒方块更新数。
#   {url}  要打开或复制的网址。
#   {usage}  命令语法，或内存显示中的使用情况文本。
#   {used}  内存显示中已格式化的已用内存量。
#   {value}  消息专用值，如默认设置、名称、坐标、数量或错误；请参照上下文。
#   {value2}  消息专用的第二个值，如总区块数、目标 Y 坐标、数据包名称或错误。
#   {value3}  消息专用的第三个值，如百分比、目标 Z 坐标、Minecraft 版本或经过时间。
#   {value4}  消息专用的第四个值，如方块写入数、选区 Z 坐标或可选状态后缀。
#   {value5}  消息专用的第五个值：对象放置中非空气方块写入数，或位置模板中的区块 Z 坐标。
#   {variables}  正在编辑的消息可用的占位符列表。
#   {velocity}  正在检查的实体的当前移动速度。
#   {version}  上下文所指的插件或 Minecraft 版本。
#   {volume}  对象选区所含的方块数。
#   {w}  对象宽度，单位为方块。
#   {wantVariants}  每个导入的原版树木或对象特征所请求的变体数。
#   {warnings}  不阻止操作的验证警告数。
#   {width}  显示的世界区域宽度，单位为方块。
#   {wood}  修复树木对象时添加的木材方块数。
#   {world}  命令或进度显示所针对的世界名称。
#   {written}  成功写入的导入变体或对象文件数。
#   {x}  消息所指的方块、区块、区域或预览中的 X 坐标。
#   {y}  世界或方块的垂直坐标。
#   {z}  消息所指的方块、区块、区域或预览中的 Z 坐标。
#   {zoom}  预览的当前缩放级别。
# === End Iris language guide ===

[iris.director.commanddebug]
description = "Iris诊断工具"

