# === Iris language guide ===
# Iris - zh_TW
#
# === 編輯檔案 ===
# languages/zh_TW.toml
# 可直接編輯此檔案。本機修改會保留；缺少或無效的項目使用內建英文文字。
# /iris language server edit zh_TW
#
# === 前綴與訊息範例 ===
# Iris 語言檔案沒有適用於所有訊息的全域前綴設定。請直接在需要修改的單則訊息內文中加入前綴。
# 主控台插件前綴和選單主題由顯示端另外提供，不會隨此修改而改變。
# 例如，在 [iris.bukkit.commandiris] 區段中修改 set_debug：
# set_debug = "&6[世界]&r &a偵錯已設為：{to}"
# 只有 /iris debug 的回覆會增加 [世界]。{to} 為 true（啟用）或 false（停用）。
# {PC}、{SC} 和 {TC} 不是 Iris 支援的主題變數。
#
# === 顏色與格式 ===
# 基本顏色：&0 黑色、&1 深藍色、&2 深綠色、&3 深青色、&4 深紅色、&5 深紫色、&6 金色、&7 灰色。
# 基本顏色：&8 深灰色、&9 藍色、&a 綠色、&b 青色、&c 紅色、&d 淺紫色、&e 黃色、&f 白色。
# 樣式：&k 隨機字元、&l 粗體、&m 刪除線、&n 底線、&o 斜體、&r 重設顏色和樣式。
# 例如："&6注意：&l粗體文字&r 一般文字"。Bukkit 的自訂顏色效果可能改變顯示顏色。
# 語言處理器接受 &#33CC99、&x33CC99、&x&3&3&C&C&9&9 和 [33CC99] 形式的 RGB 顏色。
# 但 Bukkit 的預設顏色處理可能無法保留原始 RGB，因此無法保證所有輸出位置都顯示精確顏色。
# 模組指令、說明和用戶端介面等使用去除格式的翻譯文字，並保留顯示端自己的顏色和樣式。
#
# === TOML 跳脫 ===
# 在雙引號包圍的 TOML 字串中，\" 表示引號，\\ 表示反斜線，\n 表示換行。
# 即使語言處理階段跳脫了 & 或 [，後續 Bukkit 處理仍可能把 &a 等重新辨識為顏色代碼。
# 僅加入反斜線並不能在所有顯示位置停用顏色處理。
#
# === 變數 ===
# 請勿變更變數名稱，只使用各訊息原有的變數。以下說明每個值的具體含義。
#   {MAXAUTOSELECTVOLUME}  物件自動選取允許的最大方塊數。
#   {MAXSAVEVOLUME}  儲存物件選取範圍允許的最大方塊數。
#   {MAXSPAN}  擷取結構時允許的最大寬度、高度或深度，單位為方塊。
#   {NATIVESTRUCTURELOCATERADIUS}  原生結構的最大搜尋半徑，單位為區塊。
#   {ROOTPERMISSION}  使用指令所需的根權限。
#   {WORKSPACENAME}  正在搜尋的 Studio 工作區資料夾名稱。
#   {WORLDPACKNAME}  產生的世界資料包名稱。
#   {active}  目前正在執行的工作執行緒數。
#   {activeLocale}  無法選取要求的語言時仍在使用的語言。
#   {activeMax}  已載入維度類型的高度範圍上限。
#   {activeMin}  已載入維度類型的高度範圍下限。
#   {actualReverts}  實際復原的物件貼上次數。
#   {afb}  引擎耗時標籤中括號部分之後的已格式化文字。
#   {after}  變更後的值，或修復後仍無法連通的樹木方塊數。
#   {amount}  報告中所述項目的數量。
#   {applied}  已套用處理結果的區塊數。
#   {argument}  無法接受的指令引數。
#   {available}  符合生成條件的原生結構數。
#   {bar}  已格式化的進度條文字。
#   {befb}  引擎耗時標籤中括號部分之前的已格式化文字。
#   {before}  變更前的值，或修復前無法連通的樹木方塊數。
#   {biome}  正在顯示的生態域名稱或識別碼。
#   {block}  正在檢查的方塊類型或描述。
#   {blockX}  方塊或傳送目的地的 X 座標。
#   {blockY}  方塊或傳送目的地的 Y 座標。
#   {blockZ}  方塊或傳送目的地的 Z 座標。
#   {blocking}  導致套件無法載入的驗證錯誤數。
#   {blocks}  匯入群組中的方塊變體數。
#   {bpp}  Vision 中每個像素表示的世界方塊數。
#   {branches}  修復樹木物件時新增的樹枝數。
#   {broken}  驗證失敗的套件數。
#   {brokenTotal}  驗證失敗的套件總數。
#   {cave}  檢查位置的洞穴生態域或洞穴描述。
#   {centerX}  區域中心的 X 座標；單位以操作訊息為準。
#   {centerZ}  區域中心的 Z 座標；單位以操作訊息為準。
#   {changed}  已處理物件中發生變更的數量。
#   {chunk}  報告所指區塊的座標或識別標籤。
#   {chunkX}  以區塊為單位的 X 座標，而非方塊座標。
#   {chunkZ}  以區塊為單位的 Z 座標，而非方塊座標。
#   {chunks}  操作包含的區塊數。
#   {clampedY}  調整至允許高度範圍後的傳送目的地 Y 座標。
#   {command}  指令名稱或要執行的完整指令。
#   {converted}  修復樹木時轉為木材的樹葉方塊數。
#   {count}  上下文所指的項目、訊息或玩家數量。
#   {current}  目前進度數量，或本次比較的區塊數。
#   {currentStage}  Studio 目前載入階段的名稱。
#   {d}  物件深度，單位為方塊。
#   {depth}  距地表向下的方塊數。
#   {derivative}  與地表生態域關聯的衍生生態域或變種。
#   {detail}  檢查物件或目前進度階段的補充說明。
#   {diffs}  產生結果之間偵測到的差異數。
#   {dimKey}  正在封裝的維度識別碼。
#   {dimension}  訊息所指的維度名稱或識別碼。
#   {dimensionId}  已載入或要求的維度的註冊識別碼。
#   {dimensionId2}  建議的刪除指令中重複使用的維度識別碼。
#   {dimm}  Studio 維度識別碼，或驗證指令中的套件名稱。
#   {disabled}  已停用生成的原生結構數。
#   {distances}  修復樹木時變更的樹葉距離值數量。
#   {done}  目前已完成的工作項目數量。
#   {downloadSource}  用於下載套件的來源或選定參照。
#   {downloadable}  正在匯入的套件或可下載專案。
#   {dumpPath}  已儲存的清理或還原資料位置。
#   {duration}  已格式化的操作耗時。
#   {e}  掃描結構範本失敗時的例外文字。
#   {elapsed}  已格式化的操作開始後經過時間。
#   {engines}  正在執行的 Iris 生成引擎或維度數。
#   {entity}  正在檢查的生怪磚所選的實體類型。
#   {error}  發生的錯誤詳細資訊。
#   {errorMessage}  附加在主要失敗訊息後的選用錯誤詳細資訊。
#   {eta}  已格式化的預估剩餘時間；部分訊息中包含標籤。
#   {failed}  失敗項目數，或進度標題中的預設失敗後綴。
#   {failure}  搜尋或操作失敗的原因。
#   {failures}  失敗工作數量，或選用的已格式化失敗摘要。
#   {file}  操作所涉及的檔案名稱或路徑。
#   {filter}  用於篩選 Iris 維度清單的文字。
#   {fps}  目前預覽繪製影格率，單位為影格每秒。
#   {g}  上次封裝進度報告後寫入的物件檔案數。
#   {generated}  目前已產生的區塊數。
#   {generator}  瀏覽器中顯示的雜訊產生器名稱。
#   {generatorKey}  要求的雜訊產生器識別碼。
#   {get}  成功轉換的 schematic 藍圖數。
#   {golden}  已儲存的比較基準中的區塊數。
#   {goldenDimension}  基準記錄中儲存的維度識別碼。
#   {goldenSeed}  基準記錄中儲存的世界種子。
#   {goldenVersion}  建立基準記錄時使用的 Minecraft 版本。
#   {group}  語言編輯器的訊息群組，或匯入物件的分類。
#   {guiNote}  有關預生成進度視窗的選用說明。
#   {h}  物件高度，單位為方塊。
#   {hash}  被比較的生成區塊的合併檢查碼。
#   {health}  正在檢查的實體的目前生命值。
#   {height}  訊息所指的地形高度、總高度或顯示區域高度。
#   {hours}  格式化時長中的小時部分。
#   {i}  引擎顯示名稱，或指令清單範本中的項目。
#   {id}  正在檢查的生態域的註冊 ID。
#   {imported}  成功匯入的結構或物件數。
#   {includeNonJigsaw}  是否也匯入不使用拼圖部件的結構。
#   {iris}  使用 Iris 生成的已載入維度數。
#   {irisLevels}  已與套件高度進行比較的已載入 Iris 維度數。
#   {irisPlaced}  由 Iris 放置而非原生生成的結構數。
#   {job}  已完成的背景操作名稱。
#   {k}  區域分布報告中的區域載入鍵。
#   {key}  上下文所指的參數、訊息或資源識別碼。
#   {key2}  建議的定位指令中重複使用的結構識別碼。
#   {keyString}  正在匯入或被回報為無效的結構或資源識別碼。
#   {label}  已找到目標的顯示名稱。
#   {line}  語言編輯器中的行號。
#   {locale}  語言識別碼，例如 en_US 或 de_DE。
#   {logicalWorldName}  指令所針對世界的邏輯名稱。
#   {loot}  正在檢查的戰利品表識別碼。
#   {m}  額外的撤離訊息，或指令範本中被忽略參數的文字。
#   {mantleStatus}  重複生成比較前重設生成資料的結果。
#   {marker}  正在搜尋的標記名稱。
#   {material}  正在檢查的方塊的 Minecraft 材質。
#   {maxScale}  限制要求縮放比例後的最大允許物件比例。
#   {maxX}  顯示的區塊範圍的 X 上界。
#   {maxY}  世界高度範圍的上界。
#   {maxZ}  顯示的區塊範圍的 Z 上界。
#   {maximum}  訊息所指的最大輸入長度或實體最大生命值。
#   {mcmeta}  產生的資料包的 pack.mcmeta 檔案路徑。
#   {message}  操作提供的詳細狀態或錯誤文字。
#   {method}  所選的預生成方式。
#   {minX}  顯示的區塊範圍的 X 下界。
#   {minY}  世界高度範圍的下界。
#   {minZ}  顯示的區塊範圍的 Z 下界。
#   {minutes}  格式化時長中的分鐘部分。
#   {mismatches}  與已儲存基準不同的區塊數。
#   {mode}  所選的匯入、生成或預覽模式。
#   {modeNote}  所選預生成模式的選用說明。
#   {name}  訊息所指的世界、物件、專案或項目名稱。
#   {nameRaw}  正規化或驗證前的原始輸入名稱。
#   {normalized}  未找到的已正規化說明章節名稱。
#   {num}  引擎耗時標籤中已格式化的括號部分，不一定是數字。
#   {object}  正在編輯或檢查的 Iris 物件名稱或識別碼。
#   {objects}  被檢查區塊中的物件清單或數量。
#   {offset}  距地表的垂直距離，單位為方塊。
#   {output}  無法寫入的輸出檔案路徑。
#   {overall}  整個預生成操作的平均每秒區塊數。
#   {ownerName}  擁有 Studio 工作階段的玩家名稱。
#   {pack}  操作涉及的 Iris 套件名稱或識別碼。
#   {pack2}  建議指令或下載來源中重複使用的套件識別碼。
#   {packDimension}  從套件中選定的維度定義。
#   {packLogical}  套件維度定義所要求的邏輯高度。
#   {packMax}  套件要求的高度上限。
#   {packMin}  套件要求的高度下限。
#   {packName}  正在驗證的套件顯示名稱。
#   {parameter}  缺少或無法解析的指令參數。
#   {parent}  上層選單或指令路徑的顯示名稱。
#   {path}  正在儲存、開啟或回報的檔案路徑。
#   {percent}  進度百分比；請將訊息中的 % 符號留在變數外。
#   {permission}  執行要求操作所需的權限節點。
#   {personal}  玩家已儲存的個人語言識別碼。
#   {phase}  目前載入或下載階段的名稱。
#   {pinned}  修復樹木物件時固定的樹葉數。
#   {player}  正在跟隨或作為目標的玩家名稱。
#   {plugin}  插件顯示名稱；Iris 的共用語言和診斷訊息中為 Iris。
#   {position}  正在設定的選取範圍角點編號。
#   {preset}  主要世界使用的已註冊世界生成預設。
#   {primary}  已設定的主要世界識別碼。
#   {processed}  已處理項目數，包括成功、略過和失敗項目。
#   {properties}  正在檢查的方塊的已格式化屬性清單。
#   {quarantinePath}  存放清理隔離檔案的資料夾。
#   {queued}  等待執行的工作執行緒或工作項目數量。
#   {radius}  建議的開始指令中重複使用的預生成半徑。
#   {rarity}  所述區域或放置項目設定的稀有度。
#   {rate}  已格式化的傳輸或預生成速率；每秒後綴由訊息加入。
#   {reach}  修復樹木物件時使用的已設定樹枝搜尋距離。
#   {ready}  目前可用的精確 Atlas 頁面數。
#   {reason}  無法完成要求操作的原因。
#   {region}  正在檢查的區域名稱或識別碼。
#   {remaining}  顯示清單中省略的額外方塊狀態數。
#   {repository}  正在解壓縮的儲存庫或已下載封存檔。
#   {reverted}  已復原的物件貼上次數。
#   {rotation}  套用於已放置物件的旋轉。
#   {rx}  正在計算雜湊的區塊 X 座標。
#   {rz}  正在計算雜湊的區塊 Z 座標。
#   {s}  新 Studio 專案名稱。
#   {safeName}  匯入物件使用的已清理檔案名稱。
#   {scale}  預覽中每個像素表示的世界方塊數。
#   {scope}  Object Studio 中開啟的物件或物件群組。
#   {searchRadius}  結構驗證的搜尋半徑，單位為區塊。
#   {seconds}  時長中的秒部分，或距上次更新的秒數。
#   {section}  使用者要求的說明章節名稱。
#   {seed}  世界、Studio 工作階段、產生器或基準比較使用的種子。
#   {seedRaw}  驗證前的原始輸入種子。
#   {sixtySecond}  60 秒視窗內的預生成每秒區塊數。
#   {size}  訊息所指的檔案、警告、項目或物品數量。
#   {skipped}  操作中略過的項目數。
#   {slope}  檢查位置的地形坡度。
#   {solidBlocks}  生成雜湊統計的固體方塊數。
#   {source}  與進度顯示關聯的套件、下載來源或輸入。
#   {speed}  已格式化的預生成或處理每秒速率。
#   {stage}  目前進度階段名稱。
#   {state}  訊息所指的目前狀態或屬性值。
#   {status}  目前預覽狀態文字。
#   {structure}  正在定位的結構名稱或識別碼。
#   {structureKey}  要求結構的註冊或套件識別碼。
#   {summary}  已完成操作的格式化結果摘要。
#   {suppressed}  被 Iris 放置取代的原生結構數。
#   {surface}  建議傳送指令中使用的地表 Y 座標。
#   {surfaceY}  檢查位置的地表 Y 座標。
#   {tag}  置於套件名稱前的已格式化驗證狀態標籤。
#   {target}  訊息所指的語言接收者或物件選取目標。
#   {targetX}  已找到或要求目的地的 X 座標。
#   {targetZ}  已找到或要求目的地的 Z 座標。
#   {template}  建立專案時選取的範本。
#   {tenSecond}  10 秒視窗內的預生成每秒區塊數。
#   {thirtySecond}  30 秒視窗內的預生成每秒區塊數。
#   {threads}  生成雜湊使用的工作執行緒數。
#   {tileNote}  有關已儲存或放置的方塊實體資料的選用說明。
#   {title}  正在顯示結果的操作標題。
#   {to}  新的偵錯設定：true 表示啟用，false 表示停用。
#   {token}  無法解析的 reach 引數。
#   {total}  訊息所指的工作項目、區塊、維度或項目總數。
#   {totalObjects}  Object Studio 中開啟的物件數。
#   {transferred}  已格式化的目前傳輸資料量。
#   {type}  訊息所指的預期參數類型、資源類型或物件類別。
#   {typeKey}  已註冊的 Minecraft 維度類型識別碼，或 inline。
#   {unreachableBiomes}  因套件生態域選擇而被排除的原生結構數。
#   {unsupported}  此平台回報為不支援的原生結構數。
#   {updates}  開發者顯示中的每秒方塊更新數。
#   {url}  要開啟或複製的網址。
#   {usage}  指令語法，或記憶體顯示中的使用情況文字。
#   {used}  記憶體顯示中已格式化的已用記憶體量。
#   {value}  訊息專用值，如預設設定、名稱、座標、數量或錯誤；請參照上下文。
#   {value2}  訊息專用的第二個值，如總區塊數、目標 Y 座標、套件名稱或錯誤。
#   {value3}  訊息專用的第三個值，如百分比、目標 Z 座標、Minecraft 版本或經過時間。
#   {value4}  訊息專用的第四個值，如方塊寫入數、選取範圍 Z 座標或選用狀態後綴。
#   {value5}  訊息專用的第五個值：物件放置中非空氣方塊寫入數，或位置範本中的區塊 Z 座標。
#   {variables}  正在編輯的訊息可用的預留位置清單。
#   {velocity}  正在檢查的實體的目前移動速度。
#   {version}  上下文所指的插件或 Minecraft 版本。
#   {volume}  物件選取範圍所含的方塊數。
#   {w}  物件寬度，單位為方塊。
#   {wantVariants}  每個匯入的原版樹木或物件特徵所要求的變體數。
#   {warnings}  不阻止操作的驗證警告數。
#   {width}  顯示的世界區域寬度，單位為方塊。
#   {wood}  修復樹木物件時新增的木材方塊數。
#   {world}  指令或進度顯示所針對的世界名稱。
#   {written}  成功寫入的匯入變體或物件檔案數。
#   {x}  訊息所指的方塊、區塊、區域或預覽中的 X 座標。
#   {y}  世界或方塊的垂直座標。
#   {z}  訊息所指的方塊、區塊、區域或預覽中的 Z 座標。
#   {zoom}  預覽的目前縮放層級。
# === End Iris language guide ===

