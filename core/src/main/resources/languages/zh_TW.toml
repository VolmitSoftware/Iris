#   {used}  記憶體顯示中已格式化的已用記憶體量。
#   {value}  訊息專用值，如預設設定、名稱、座標、數量或錯誤；請參照上下文。
#   {value2}  訊息專用的第二個值，如總區塊數、目標 Y 座標、套件名稱或錯誤。
#   {value3}  訊息專用的第三個值，如百分比、目標 Z 座標、Minecraft 版本或經過時間。
#   {value4}  訊息專用的第四個值，如方塊寫入數、選取範圍 Z 座標或選用狀態後綴。
#   {value5}  訊息專用的第五個值：物件放置中非空氣方塊寫入數，或位置範本中的區塊 Z 座標。
#   {variables}  正在編輯的訊息可用的預留位置清單。
#   {velocity}  正在檢查的實體的目前移動速度。
#   {version}  上下文所指的插件或 Minecraft 版本。
#   {volume}  物件選取範圍所含的方塊數。
#   {w}  物件寬度，單位為方塊。
#   {wantVariants}  每個匯入的原版樹木或物件特徵所要求的變體數。
#   {warnings}  不阻止操作的驗證警告數。
#   {width}  顯示的世界區域寬度，單位為方塊。
#   {wood}  修復樹木物件時新增的木材方塊數。
#   {world}  指令或進度顯示所針對的世界名稱。
#   {written}  成功寫入的匯入變體或物件檔案數。
#   {x}  訊息所指的方塊、區塊、區域或預覽中的 X 座標。
#   {y}  世界或方塊的垂直座標。
#   {z}  訊息所指的方塊、區塊、區域或預覽中的 Z 座標。
#   {zoom}  預覽的目前縮放層級。
# === End Iris language guide ===

