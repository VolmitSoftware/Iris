# Version catalog is a central place for you to declare and version dependencies
# https://docs.gradle.org/current/userguide/platforms.html#sub:version-catalog
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
# Plugins
shadow = "9.5.1" # https://plugins.gradle.org/plugin/com.gradleup.shadow
slimjar = "2.1.9" # https://plugins.gradle.org/plugin/de.crazydev22.slimjar

# Core Libraries
lombok = "1.18.46"
spigot = "26.2-R0.1-SNAPSHOT" # https://hub.spigotmc.org/nexus/repository/snapshots/org/spigotmc/spigot-api/maven-metadata.xml
paper-api = "26.1.2.build.74-stable"
log4j = "2.26.1" # https://central.sonatype.com/artifact/org.apache.logging.log4j/log4j-api
adventure-api = "4.26.1" # https://github.com/KyoriPowered/adventure

annotations = "26.1.0" # https://central.sonatype.com/artifact/org.jetbrains/annotations
paralithic = "0.8.1" # https://github.com/PolyhedralDev/Paralithic/
paperlib = "1.0.8" # https://github.com/PaperMC/PaperLib/
bstats = "3.2.1" # https://github.com/Bastian/bstats-metrics/tree/master
commons-io = "2.22.0" # https://central.sonatype.com/artifact/commons-io/commons-io
commons-lang3 = "3.20.0" # https://central.sonatype.com/artifact/org.apache.commons/commons-lang3
oshi = "6.9.0" # Minecraft 26.2 runtime ceiling
fastutil = "8.5.18" # https://central.sonatype.com/artifact/it.unimi.dsi/fastutil
lz4 = "1.8.1" # https://central.sonatype.com/artifact/org.lz4/lz4-java
lru = "1.4.2" # https://central.sonatype.com/artifact/com.googlecode.concurrentlinkedhashmap/concurrentlinkedhashmap-lru
zip = "1.18.2" # https://central.sonatype.com/artifact/org.zeroturnaround/zt-zip
gson = "2.14.0" # https://central.sonatype.com/artifact/com.google.code.gson/gson
guava = "33.6.0-jre" # https://central.sonatype.com/artifact/com.google.guava/guava
asm = "9.10.1" # https://central.sonatype.com/artifact/org.ow2.asm/asm
caffeine = "3.2.4" # https://central.sonatype.com/artifact/com.github.ben-manes.caffeine/caffeine
byte-buddy = "1.18.11" # https://central.sonatype.com/artifact/net.bytebuddy/byte-buddy
dom4j = "2.2.0" # https://central.sonatype.com/artifact/org.dom4j/dom4j
jaxen = "2.0.6" # https://central.sonatype.com/artifact/jaxen/jaxen

# Third Party Integrations
nexo = "1.25.0" # https://repo.nexomc.com/#/releases/com/nexomc/nexo
oraxen = "1.218.0"
itemsadder = "4.0.10" # https://github.com/LoneDev6/API-ItemsAdder
placeholderApi = "2.11.6" # https://repo.extendedclip.com/#/releases/me/clip/placeholderapi
score = "5.25.3.9" # https://github.com/Ssomar-Developement/SCore
mmoitems = "6.10.1-SNAPSHOT" # https://nexus.phoenixdevt.fr/repository/maven-public/net/Indyuce/MMOItems-API/maven-metadata.xml
mythiclib = "1.7.1-SNAPSHOT" # https://nexus.phoenixdevt.fr/repository/maven-public/io/lumine/MythicLib-dist/maven-metadata.xml
eco = "2026.27" # https://repo.auxilor.io/repository/maven-public/com/willfp/eco/maven-metadata.xml
mythic = "5.12.1"
mythic-crucible = "2.2.0"
kgenerators = "7.3" # https://repo.codemc.io/repository/maven-public/me/kryniowesegryderiusz/kgenerators-core/maven-metadata.xml
multiverseCore = "5.8.0"
craftengine = "26.8.2" # https://github.com/Xiao-MoMi/craft-engine/releases

# Fabric API (net.fabricmc.fabric-api) - each module is independently versioned
fabricApi-base = "2.0.4+ece063239e"
fabricApi-registrySync = "7.1.0+c7bd5b8e9e"
fabricApi-resourceLoader = "2.0.13+9edec1269e"
fabricApi-lifecycleEvents = "4.1.3+4575b05f9e"
fabricApi-commandApi = "3.1.0+00cb03469e"
fabricApi-eventsInteraction = "5.2.6+8f57f7ee9e"
fabricApi-networking = "6.3.3+72073ef09e"
fabricApi-rendering = "25.3.1+6988455e9e"
fabricApi-keyMapping = "2.0.5+e2bdee789e"
fabricApi-permission = "1.0.3+b7020ca29e"

[libraries]
# Core Libraries
lombok = { module = "org.projectlombok:lombok", version.ref ="lombok" }
spigot = { module = "org.spigotmc:spigot-api", version.ref = "spigot" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }

# Dynamically Loaded
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure-api" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure-api" }
adventure-serializer-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure-api" }
adventure-serializer-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure-api" }

paralithic = { module = "com.dfsek:paralithic", version.ref = "paralithic" }
paperlib = { module = "io.papermc:paperlib", version.ref = "paperlib" }
bstats = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
oshi = { module = "com.github.oshi:oshi-core", version.ref = "oshi" }
lz4 = { module = "at.yawk.lz4:lz4-java", version.ref = "lz4" }
fastutil = { module = "it.unimi.dsi:fastutil", version.ref = "fastutil" }
lru = { module = "com.googlecode.concurrentlinkedhashmap:concurrentlinkedhashmap-lru", version.ref = "lru" }
zip = { module = "org.zeroturnaround:zt-zip", version.ref = "zip" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
byteBuddy-core = { module = "net.bytebuddy:byte-buddy", version.ref = "byte-buddy" }
byteBuddy-agent = { module = "net.bytebuddy:byte-buddy-agent", version.ref = "byte-buddy" }
dom4j = { module = "org.dom4j:dom4j", version.ref = "dom4j" }
jaxen = { module = "jaxen:jaxen", version.ref = "jaxen" }

# Third Party Integrations
nexo = { module = "com.nexomc:nexo", version.ref = "nexo" }
oraxen = { module = "io.th0rgal:oraxen", version.ref = "oraxen" }
itemsadder = { module = "dev.lone:api-itemsadder", version.ref = "itemsadder" }
placeholderApi = { module = "me.clip:placeholderapi", version.ref = "placeholderApi" }
score = { module = "com.github.Ssomar-Developement:SCore", version.ref = "score" }
mmoitems = { module = "net.Indyuce:MMOItems-API", version.ref = "mmoitems" }
mythiclib = { module = "io.lumine:MythicLib-dist", version.ref = "mythiclib" }
eco = { module = "com.willfp:eco", version.ref = "eco" }
mythic = { module = "io.lumine:Mythic-Dist", version.ref = "mythic" }
mythicCrucible = { module = "io.lumine:MythicCrucible-Dist", version.ref = "mythic-crucible" }
kgenerators = { module = "me.kryniowesegryderiusz:kgenerators-core", version.ref = "kgenerators" }
multiverseCore = { module = "org.mvplugins.multiverse.core:multiverse-core", version.ref = "multiverseCore" }
craftengine-core = { module = "net.momirealms:craft-engine-core", version.ref = "craftengine" }
craftengine-bukkit = { module = "net.momirealms:craft-engine-bukkit", version.ref = "craftengine" }

# Fabric API
fabricApi-base = { module = "net.fabricmc.fabric-api:fabric-api-base", version.ref = "fabricApi-base" }
fabricApi-registrySync = { module = "net.fabricmc.fabric-api:fabric-registry-sync-v0", version.ref = "fabricApi-registrySync" }
fabricApi-resourceLoader = { module = "net.fabricmc.fabric-api:fabric-resource-loader-v1", version.ref = "fabricApi-resourceLoader" }
fabricApi-lifecycleEvents = { module = "net.fabricmc.fabric-api:fabric-lifecycle-events-v1", version.ref = "fabricApi-lifecycleEvents" }
fabricApi-commandApi = { module = "net.fabricmc.fabric-api:fabric-command-api-v2", version.ref = "fabricApi-commandApi" }
fabricApi-eventsInteraction = { module = "net.fabricmc.fabric-api:fabric-events-interaction-v0", version.ref = "fabricApi-eventsInteraction" }
fabricApi-networking = { module = "net.fabricmc.fabric-api:fabric-networking-api-v1", version.ref = "fabricApi-networking" }
fabricApi-rendering = { module = "net.fabricmc.fabric-api:fabric-rendering-v1", version.ref = "fabricApi-rendering" }
fabricApi-keyMapping = { module = "net.fabricmc.fabric-api:fabric-key-mapping-api-v1", version.ref = "fabricApi-keyMapping" }
fabricApi-permission = { module = "net.fabricmc.fabric-api:fabric-permission-api-v1", version.ref = "fabricApi-permission" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
slimjar = { id = "de.crazydev22.slimjar", version.ref = "slimjar" }
