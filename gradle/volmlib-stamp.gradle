// Writes the VolmLib provenance that gradle/volmlib-resolution.settings.gradle resolved. Every shipped jar
// carries it as META-INF/volmit/volmlib.properties.
Map<String, String> volmLibStamp = (Map<String, String>) gradle.extensions.extraProperties.get('volmLibStamp')

tasks.register('generateVolmLibStamp', WriteProperties) {
    destinationFile.set(layout.buildDirectory.file('generated/volmlib-stamp/volmlib.properties'))
    properties(volmLibStamp)
}
