tasks.register('seaInletProbe', JavaExec) {
    group = 'verification'
    description = 'Plans and generates real pack chunks with and without sea inlets and reports containment, seal, roof, sea level, ocean connection and order determinism.'
    mainClass = 'art.arcane.iris.probe.SeaInletProbe'
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs('--add-modules', 'jdk.incubator.vector', '-Djava.awt.headless=true')
    minHeapSize = '2g'
    maxHeapSize = '8g'
    dependsOn(':core:compileJava')
    doFirst {
        Provider<String> packOff = providers.gradleProperty('probePackOff')
        Provider<String> windows = providers.gradleProperty('probeWindows')
        Provider<String> mode = providers.gradleProperty('probeMode').orElse('gate')
        if (!probePack.isPresent() || !packOff.isPresent() || !probeDimension.isPresent() || !windows.isPresent() || !probeOutput.isPresent()) {
            throw new GradleException('seaInletProbe requires probePack, probePackOff, probeDimension, probeWindows=x0..x1,z0..z1 and probeOutput')
        }
        String[] axes = windows.get().split(',')
        String[] xs = axes[0].split('\\.\\.')
        String[] zs = axes[1].split('\\.\\.')
        args(probePack.get(), packOff.get(), probeDimension.get(), probeSeed.orElse('1337').get(), xs[0], xs[1], zs[0], zs[1], mode.get(),
            probeOutput.get(), providers.gradleProperty('probeThreads').orElse('6').get())
    }
}

tasks.register('transitionProbe', JavaExec) {
    group = 'verification'
    description = 'Exercises a bounded two-pack Studio cutover, transition routing, receipts and semantics with a vanilla-biome pack.'
    mainClass = 'art.arcane.iris.probe.TransitionProbe'
    workingDir = rootProject.projectDir
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs('--add-modules', 'jdk.incubator.vector')
    timeout = java.time.Duration.ofMinutes(12)
    doFirst {
        Provider<String> replacement = providers.gradleProperty('probeReplacementPack')
        if (!probePack.isPresent() || !replacement.isPresent() || !probeDimension.isPresent() || !probeOutput.isPresent()) {
            throw new GradleException('transitionProbe requires probePack, probeReplacementPack, probeDimension and probeOutput')
        }
        java.nio.file.Path output = new File(probeOutput.get()).canonicalFile.toPath()
        if (output.startsWith(rootProject.projectDir.canonicalFile.toPath())) {
            throw new GradleException('probeOutput must point outside the repository')
        }
        args(probePack.get(), replacement.get(), probeDimension.get(), probeSeed.getOrElse('1337'),
            providers.gradleProperty('probeTransitionWidth').getOrElse('32'),
            providers.gradleProperty('probeTransitionChunks').getOrElse('2'), output.toString(),
            providers.gradleProperty('probeTransitionReverse').getOrElse('false'))
    }
}

['transitionProbe', 'hydrologyProbe', 'genProbe', 'generationOrderProbe', 'riverTransectProbe', 'terrain3DProbe',
 'hydrologyBlockProbe', 'cavePoolProbe', 'seaInletProbe'].each { String taskName ->
    tasks.named(taskName, JavaExec).configure { JavaExec task ->
        classpath += configurations.studioProbeApi
        doFirst {
            if (probeJfr.isPresent()) {
                String requestedPath = probeJfr.get()
                if (requestedPath.isBlank()) {
                    throw new GradleException('probeJfr must be a nonblank absolute path')
                }
                File recording = new File(requestedPath)
                if (!recording.isAbsolute()) {
                    throw new GradleException('probeJfr must be an absolute path')
                }
                if (recording.isDirectory()) {
                    throw new GradleException('probeJfr must name a recording file, not a directory')
                }
                java.nio.file.Path normalized = recording.canonicalFile.toPath()
                java.nio.file.Path repository = rootProject.projectDir.canonicalFile.toPath()
                if (normalized.startsWith(repository)) {
                    throw new GradleException('probeJfr must point outside the repository')
                }
                File parent = normalized.toFile().parentFile
                if (parent == null || !parent.isDirectory()) {
                    throw new GradleException('probeJfr parent directory must already exist')
                }
                String settings = providers.gradleProperty('probeJfrSettings').orElse('profile').get()
                if (settings.isBlank() || settings.contains(',')) {
                    throw new GradleException('probeJfrSettings must name a JFR configuration or an absolute .jfc path')
                }
                task.jvmArgs(
                        '-XX:FlightRecorderOptions=stackdepth=256',
                        "-XX:StartFlightRecording=filename=${normalized},settings=${settings},dumponexit=true"
                )
            }
        }
    }
}

