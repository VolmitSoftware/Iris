tasks.register('genProbe', JavaExec) {
    group = 'verification'
    description = 'Constructs a real Iris engine over a real pack and verifies generation hashes and optional native backend usage.'
    mainClass = 'art.arcane.iris.probe.GenerationProbe'
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs('--add-modules', 'jdk.incubator.vector')
    minHeapSize = '2g'
    maxHeapSize = '6g'
    if (providers.gradleProperty('probeNativeAccess').orElse('false').get().toBoolean()) {
        jvmArgs('--enable-native-access=ALL-UNNAMED')
    }
    if (providers.gradleProperty('probeNativeBillow').isPresent()) {
        systemProperty('volmlib.noise.nativeBillow', providers.gradleProperty('probeNativeBillow').get())
    }
    systemProperty('volmlib.noise.nativeBillowDiagnostics', providers.gradleProperty('probeNativeDiagnostics').orElse('false').get())
    systemProperty('iris.probe.expectedBackend', providers.gradleProperty('probeExpectedBackend').orElse('').get())
    systemProperty('iris.probe.requireNativeSamples', providers.gradleProperty('probeRequireNativeSamples').orElse('false').get())
    if (providers.gradleProperty('probeNativeLibrary').isPresent()) {
        systemProperty('volmlib.native.library', providers.gradleProperty('probeNativeLibrary').get())
    }
    if (providers.gradleProperty('probeNativePolicy').isPresent()) {
        systemProperty('volmlib.native', providers.gradleProperty('probeNativePolicy').get())
    }
    systemProperty('iris.probe.threads', providers.gradleProperty('probeThreads').orElse('1').get())
    systemProperty('iris.probe.pregenProfile', providers.gradleProperty('probePregenProfile').orElse('false').get())
    systemProperty('iris.probe.hydrologyPreplan', providers.gradleProperty('probeHydrologyPreplan').orElse('false').get())
    systemProperty('iris.probe.historyRouter', providers.gradleProperty('probeHistoryRouter').orElse('false').get())
    systemProperty('iris.probe.historyDigest', providers.gradleProperty('probeHistoryDigest').orElse('false').get())
    systemProperty('iris.probe.productionBuffers', providers.gradleProperty('probeProductionBuffers').orElse('false').get())
    String probeCounters = providers.gradleProperty('probeCounters').orElse('false').get()
    systemProperty('iris.generation.counters', probeCounters)
    systemProperty('volmlib.cache.countContention', probeCounters)
    dependsOn(':core:compileJava')
    doFirst {
        if (!probePack.isPresent() || probePack.get().isBlank()) {
            throw new GradleException('genProbe requires -PprobePack=/absolute/path/to/pack')
        }
        Provider<String> probeDumpFile = providers.gradleProperty('probeDumpFile')
        if (probeDumpFile.isPresent()) {
            File dump = new File(probeDumpFile.get())
            if (!dump.isAbsolute() || dump.isDirectory()) {
                throw new GradleException('probeDumpFile must be an absolute file path')
            }
            java.nio.file.Path normalizedDump = dump.canonicalFile.toPath()
            if (normalizedDump.startsWith(rootProject.projectDir.canonicalFile.toPath())) {
                throw new GradleException('probeDumpFile must point outside the repository')
            }
            if (normalizedDump.parent == null || !normalizedDump.parent.toFile().isDirectory()) {
                throw new GradleException('probeDumpFile parent directory must already exist')
            }
            systemProperty('iris.probe.dumpFile', normalizedDump.toString())
        }
        if (!probeDimension.isPresent() || probeDimension.get().isBlank()) {
            throw new GradleException('genProbe requires -PprobeDimension=<dimension-key>')
        }
        args(
            probePack.get(),
            probeDimension.get(),
            probeWarmupChunks.get(),
            probeMeasuredChunks.get(),
            probeCenterChunkX.get(),
            probeCenterChunkZ.get(),
            probeMulticore.get(),
            probeStudio.get(),
            probeSeed.orElse('1337').get())
    }
}

