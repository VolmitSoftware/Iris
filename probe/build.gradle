plugins {
    id 'application'
}

group = 'art.arcane'
version = rootProject.version

application {
    mainClass = 'art.arcane.iris.probe.ClassloadProbe'
}

String volmLibCoordinate = providers.gradleProperty('volmLibCoordinate')
    .orElse('com.github.VolmitSoftware:VolmLib:master-SNAPSHOT')
    .get()

configurations {
    studioProbeApi
}

dependencies {
    implementation(project(':core'))
    compileOnly(libs.spigot)
    testImplementation('junit:junit:4.13.2')
    testImplementation(testFixtures(project(':core')))
    testImplementation(volmLibCoordinate) {
        transitive = false
    }
    compileOnly(volmLibCoordinate) {
        transitive = false
    }
    runtimeOnly(libs.paralithic)
    runtimeOnly(libs.gson)
    runtimeOnly(libs.lru)
    runtimeOnly(libs.commons.io)
    runtimeOnly(libs.commons.lang3)
    runtimeOnly(libs.fastutil)
    runtimeOnly(libs.caffeine)
    runtimeOnly(libs.lz4)
    runtimeOnly(libs.zip)
    runtimeOnly(libs.guava)
    runtimeOnly(libs.oshi)
    runtimeOnly(libs.byteBuddy.core)
    runtimeOnly(libs.byteBuddy.agent)
    studioProbeApi(libs.spigot) {
        transitive = false
    }
}

tasks.named('run', JavaExec).configure {
    args(project(':core').layout.buildDirectory.dir('classes/java/main').get().asFile.absolutePath)
    jvmArgs('--add-modules', 'jdk.incubator.vector')
    dependsOn(':core:compileJava')
}

tasks.named('test').configure {
    dependsOn(':core:compileJava')
}

tasks.register('hydrologyProbe', JavaExec) {
    group = 'verification'
    description = 'Scans deterministic hydrology seeds and reports accepted feature coordinates plus cold and warm planner timings.'
    mainClass = 'art.arcane.iris.probe.HydrologyPlannerProbe'
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs('--add-modules', 'jdk.incubator.vector')
    dependsOn(':core:compileJava')
}

Provider<String> probePack = providers.gradleProperty('probePack')
Provider<String> probeDimension = providers.gradleProperty('probeDimension')
Provider<String> probeWarmupChunks = providers.gradleProperty('probeWarmupChunks').orElse('256')
Provider<String> probeMeasuredChunks = providers.gradleProperty('probeMeasuredChunks').orElse('1024')
Provider<String> probeCenterChunkX = providers.gradleProperty('probeCenterChunkX').orElse('2048')
Provider<String> probeCenterChunkZ = providers.gradleProperty('probeCenterChunkZ').orElse('2048')
Provider<String> probeMulticore = providers.gradleProperty('probeMulticore').orElse('false')
Provider<String> probeStudio = providers.gradleProperty('probeStudio').orElse('false')
Provider<String> explicitProbeMulticore = providers.gradleProperty('probeMulticore')
Provider<String> explicitProbeStudio = providers.gradleProperty('probeStudio')
Provider<String> probeSeeds = providers.gradleProperty('probeSeeds')
Provider<String> probeMinimumTileX = providers.gradleProperty('probeMinimumTileX')
Provider<String> probeMaximumTileX = providers.gradleProperty('probeMaximumTileX')
Provider<String> probeMinimumTileZ = providers.gradleProperty('probeMinimumTileZ')
Provider<String> probeMaximumTileZ = providers.gradleProperty('probeMaximumTileZ')
Provider<String> probeRequiredCoverage = providers.gradleProperty('probeRequiredCoverage')
Provider<String> probeSeed = providers.gradleProperty('probeSeed')
Provider<String> probeMinimumChunkX = providers.gradleProperty('probeMinimumChunkX')
Provider<String> probeMaximumChunkX = providers.gradleProperty('probeMaximumChunkX')
Provider<String> probeMinimumChunkZ = providers.gradleProperty('probeMinimumChunkZ')
Provider<String> probeMaximumChunkZ = providers.gradleProperty('probeMaximumChunkZ')
Provider<String> probeParallelism = providers.gradleProperty('probeParallelism')
Provider<String> probeShuffleSeed = providers.gradleProperty('probeShuffleSeed')
Provider<String> probeJfr = providers.gradleProperty('probeJfr')
Provider<String> probeTileX = providers.gradleProperty('probeTileX')
Provider<String> probeTileZ = providers.gradleProperty('probeTileZ')
Provider<String> probeOutput = providers.gradleProperty('probeOutput')
Provider<String> probeStrictGeometry = providers.gradleProperty('probeStrictGeometry').orElse('false')

tasks.register('terrain3DProbe', JavaExec) {
    group = 'verification'
    description = 'Generates real pack chunks, verifies volumetric terrain spans and required biome overhang coverage, and exports actual block cross-sections.'
    mainClass = 'art.arcane.iris.probe.Terrain3DProbe'
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs('--add-modules', 'jdk.incubator.vector', '-Djava.awt.headless=true')
    dependsOn(':core:compileJava')
    doFirst {
        Map<String, Provider<String>> required = [
            probePack: probePack,
            probeDimension: probeDimension,
            probeSeed: probeSeed,
            probeMinimumChunkX: probeMinimumChunkX,
            probeMaximumChunkX: probeMaximumChunkX,
            probeMinimumChunkZ: probeMinimumChunkZ,
            probeMaximumChunkZ: probeMaximumChunkZ,
            probeRequiredCoverage: probeRequiredCoverage,
            probeOutput: probeOutput
        ]
        required.each { String name, Provider<String> value ->
            if (!value.isPresent() || value.get().isBlank()) {
                throw new GradleException("terrain3DProbe requires -P${name}=<value>")
            }
        }
        args(probePack.get(), probeDimension.get(), probeSeed.get(), probeMinimumChunkX.get(),
            probeMaximumChunkX.get(), probeMinimumChunkZ.get(), probeMaximumChunkZ.get(),
            probeRequiredCoverage.get(), probeOutput.get(), probeStrictGeometry.get(), probeStudio.get())
    }
}

tasks.register('genProbe', JavaExec) {
    group = 'verification'
    description = 'Constructs a real Iris engine over a real pack and generates chunks into buffers on a Bukkit-free JVM.'
    mainClass = 'art.arcane.iris.probe.GenerationProbe'
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs('--add-modules', 'jdk.incubator.vector')
    dependsOn(':core:compileJava')
    doFirst {
        if (!probePack.isPresent() || probePack.get().isBlank()) {
            throw new GradleException('genProbe requires -PprobePack=/absolute/path/to/pack')
        }
        if (!probeDimension.isPresent() || probeDimension.get().isBlank()) {
            throw new GradleException('genProbe requires -PprobeDimension=<dimension-key>')
        }
        args(
            probePack.get(),
            probeDimension.get(),
            probeWarmupChunks.get(),
            probeMeasuredChunks.get(),
            probeCenterChunkX.get(),
            probeCenterChunkZ.get(),
            probeMulticore.get(),
            probeStudio.get())
    }
}

